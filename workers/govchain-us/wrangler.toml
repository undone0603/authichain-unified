name = "govchain-us"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[[routes]]
pattern = "govchain.us/*"
zone_name = "govchain.us"

[[routes]]
pattern = "www.govchain.us/*"
zone_name = "govchain.us"

[observability]
enabled = true

# Read-only Supabase access for /opportunities and /api/govchain/*.
# The anon key is public by design (it ships in browsers on every Supabase
# project); row-level security on gov_opportunities / gov_proposals is what
# actually restricts these reads, so it must grant `anon` SELECT or the feed
# comes back empty with a 200. Not a secret — deliberately [vars], not a
# wrangler secret.
[vars]
# Origin that renders /onboard (worker-app dynamic intake) and /p (SEO hubs).
APP_ORIGIN = "https://authichain.com"
SUPABASE_URL = "https://nhdnkzhtadfkkluiulhs.supabase.co"
