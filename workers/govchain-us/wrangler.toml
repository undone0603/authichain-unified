name = "govchain-us"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
# PR Workers Builds uses `npx wrangler versions upload` (dashboard deploy
# command). That updates the latest version; govchain.us/* keeps serving the
# last `wrangler deploy` from .github/workflows/deploy-workers.yml on main.

[[routes]]
pattern = "govchain.us/*"
zone_name = "govchain.us"

[[routes]]
pattern = "www.govchain.us/*"
zone_name = "govchain.us"

[observability]
enabled = true

# Read-only Supabase access for /opportunities and /api/govchain/*.
# The anon key is public by design (it ships in browsers on every Supabase
# project); row-level security on gov_opportunities / gov_proposals is what
# actually restricts these reads, so it must grant `anon` SELECT or the feed
# comes back empty with a 200. Not a secret — deliberately [vars], not a
# wrangler secret.
[vars]
# Origin that renders /onboard (worker-app dynamic intake) and /p (SEO hubs).
APP_ORIGIN = "https://authichain.govchain.us"
SUPABASE_URL = "https://nhdnkzhtadfkkluiulhs.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG5remh0YWRma2tsdWl1bGhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzgyNTUsImV4cCI6MjA4OTUxNDI1NX0.akaWgxRilnjavzpsLqU149nBJqxDjbYOnRdAqrwz4J8"

# VERIFY_APP: service binding to the Next app worker `authichain-app`
# (wrangler.app.jsonc), which owns the auth_seals lookup behind
# POST /api/v1/agent-verify. Paid x402 / MCP verify calls are forwarded to it;
# without this binding they are refused 503 registry_not_bound before
# settlement. wrangler deploy fails if `authichain-app` is not deployed.
[[services]]
binding = "VERIFY_APP"
service = "authichain-app"
