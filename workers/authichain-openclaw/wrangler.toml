name = "authichain-openclaw"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Routes: mount on a subdomain so OpenClaw's webhook integrations and
# the AgentZ bridge share one Worker.
[[routes]]
pattern = "claw.authichain.com/*"
zone_name = "authichain.com"

# OpenClaw Gateway connection details (set as secrets):
#   OPENCLAW_GATEWAY_URL  — ws://localhost:18789 or https://your-gateway
#   OPENCLAW_API_KEY     — gateway auth token
#   AGENTZ_API_URL       — https://agentz.authichain.com (Cloudflare Containers)
#   AGENTZ_API_KEY       — same value as AgentZ AGENT_SECRET
#   SLACK_SIGNING_SECRET  — if using the Slack channel webhook
#
# Run: npx wrangler secret put OPENCLAW_GATEWAY_URL --name authichain-openclaw
# (repeat for each secret)

[vars]
OPENCLAW_API_VERSION = "1"
AGENTZ_TIMEOUT_MS = "30000"
# Public Containers host. Override with `wrangler secret put AGENTZ_API_URL` if needed.
# Do not invent OPENCLAW_GATEWAY_URL here — that stays owner-set.
AGENTZ_API_URL = "https://agentz.authichain.com"

[observability]
enabled = true
