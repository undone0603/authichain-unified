name = "authichain-openclaw"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Routes: mount on a subdomain so OpenClaw's webhook integrations and
# the AgentZ bridge share one Worker.
[[routes]]
pattern = "claw.authichain.com/*"
zone_name = "authichain.com"

# OpenClaw Gateway + AgentZ connection details (secrets only — not [vars]):
#   OPENCLAW_GATEWAY_URL  — owner-set reachable host (do not invent)
#   OPENCLAW_API_KEY     — gateway auth token
#   AGENTZ_API_URL       — public AgentZ base URL (named tunnel or
#                          trycloudflare). Secret-only: a [vars] entry with
#                          this name makes `wrangler secret put` fail 10053.
#   AGENTZ_API_KEY       — same value as AgentZ AGENT_SECRET
#   SLACK_SIGNING_SECRET  — if using the Slack channel webhook
#
# Run: npx wrangler secret put AGENTZ_API_URL --name authichain-openclaw
# (repeat for each secret). Bind via Actions: Bind claw AgentZ URL.

[vars]
OPENCLAW_API_VERSION = "1"
AGENTZ_TIMEOUT_MS = "30000"

[observability]
enabled = true
