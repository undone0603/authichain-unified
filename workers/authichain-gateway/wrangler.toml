name = "authichain-gateway"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "4c1869b90f13f86940aa3747839bf420"

# KV Namespaces (create with: wrangler kv namespace create <NAME>)
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "412b3dad203a4a4581f503c7f0a922cc"

[[kv_namespaces]]
binding = "TENANT_CACHE"
id = "8e81690a90eb426da747e969d35c52af"

[[kv_namespaces]]
binding = "USAGE_BUFFER"
id = "1d3cbcfaa1fc40e9834dd585c7362a0c"

[vars]
BACKEND_URL = "https://authichain-unified.vercel.app"
WORKER_VERSION = "2.0.0"

# Cron trigger: flush usage buffer every 5 minutes
[triggers]
crons = ["*/5 * * * *"]
