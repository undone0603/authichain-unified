name = "strainchain-io"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
# Not on PR Workers Builds. strainchain.io/* updates only via
# `wrangler deploy` from .github/workflows/deploy-workers.yml on main.

[[routes]]
pattern = "strainchain.io/*"
zone_name = "strainchain.io"

[[routes]]
pattern = "www.strainchain.io/*"
zone_name = "strainchain.io"

[vars]
# Origin that renders /genetics, /passport, /onboard, and /p (SEO hubs).
# Never use *.vercel.app for customer traffic.
APP_ORIGIN = "https://authichain.govchain.us"

[observability]
enabled = true

# VERIFY_APP: service binding to the `authichain-com` Worker, which owns the
# bound auth_seals lookup and the authenticated PayAI settle behind
# POST /api/v1/agent-verify. estate-x402 rewrites forwarded paid calls to the
# https://authichain.com origin (canonicalVerifyBinding). Without this binding
# paid calls are refused 503 registry_not_bound before settlement.
[[services]]
binding = "VERIFY_APP"
service = "authichain-com"

# x402 replay guard (CFA-343/356). Shared namespace; keys are site-scoped in code.
[[kv_namespaces]]
binding = "X402_REPLAY_KV"
id = "ab391dc529884161bd84707d7627a9f0"
