name = "strainchain-io"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[[routes]]
pattern = "strainchain.io/*"
zone_name = "strainchain.io"

[[routes]]
pattern = "www.strainchain.io/*"
zone_name = "strainchain.io"

[vars]
# Origin that renders /genetics and /passport (and /onboard once the app
# worker is bound). Never use *.vercel.app for customer traffic.
APP_ORIGIN = "https://authichain.com"

[observability]
enabled = true
