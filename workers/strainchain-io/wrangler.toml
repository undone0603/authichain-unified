name = "strainchain-io"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
# Not on PR Workers Builds. strainchain.io/* updates only via
# `wrangler deploy` from .github/workflows/deploy-workers.yml on main.

[[routes]]
pattern = "strainchain.io/*"
zone_name = "strainchain.io"

[[routes]]
pattern = "www.strainchain.io/*"
zone_name = "strainchain.io"

[vars]
# Origin that renders /genetics, /passport, /onboard, and /p (SEO hubs).
# Never use *.vercel.app for customer traffic.
APP_ORIGIN = "https://authichain.com"

[observability]
enabled = true
