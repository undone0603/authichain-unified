name = "strainchain-io"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[[routes]]
pattern = "strainchain.io/*"
zone_name = "strainchain.io"

[[routes]]
pattern = "www.strainchain.io/*"
zone_name = "strainchain.io"

[vars]
# Origin of the Next app that renders /genetics and /passport. Those paths are
# proxied there; everything else on strainchain.io is served by this worker.
APP_ORIGIN = "https://authichain-unified.vercel.app"

[observability]
enabled = true
