name = "authichain-telegram"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DATABASE"
database_name = "authichain-telegram-db"
database_id = "3a330910-b81a-43e9-b3fb-bd8e529cff07"  # replace after: wrangler d1 create authichain-telegram-db

[[kv_namespaces]]
binding = "SESSIONS"
id = "11d0f66da4ae4cb3890c7a75e6ecc0f5"           # replace after: wrangler kv namespace create SESSIONS

# Secrets — set via: wrangler secret put <NAME>
# TELEGRAM_BOT_TOKEN
# TELEGRAM_WEBHOOK_SECRET
# TELEGRAM_ADMIN_CHAT_ID
# SITE_URL

[vars]
ENVIRONMENT = "production"
