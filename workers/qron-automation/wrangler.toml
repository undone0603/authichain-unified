name = "qron-automation"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[triggers]
# The scheduled() handler branches on all three patterns; only */30 was
# registered, so the SEO ping (0 */6) and daily digest (0 12) never fired.
# Account cron budget (CF free plan allows 5): autopilot 1 + these 3 = 4.
crons = ["*/30 * * * *", "0 */6 * * *", "0 12 * * *"]

[observability]
enabled = true
