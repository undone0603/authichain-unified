name = "outreach-queue"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[[queues.consumers]]
queue = "outreach-jobs"
max_batch_size = 25
max_batch_timeout = 10

[vars]
OUTREACH_FROM_EMAIL = "noreply@qron.space"

[observability]
enabled = true
