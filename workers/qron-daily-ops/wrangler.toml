SUPABASE_URL = "https://nhdnkzhtadfkkluiulhs.supabase.co"
GMAIL_RELAY_URL = "https://gmail-relay.undone-k.workers.dev/emails"
RESEND_RELAY_URL = "https://resend-relay.undone-k.workers.dev/emails"

[[kv_namespaces]]
binding = "OUTREACH_KV"
id = "291baff0863044998e9ba716dfc06085"
