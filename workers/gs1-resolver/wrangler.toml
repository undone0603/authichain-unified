name = "gs1-resolver"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Reuse the existing provenance D1 from authichain-scan-validate.
[[d1_databases]]
binding = "DB"
database_name = "authichain-provenance"
database_id = "ebd8081b-ac13-485a-8b0e-a6cd9c0f7be5"

[vars]
# PASSPORT_ORIGIN is where a scanned seal sends a human. As of 2026-09-11 that
# route exists (src/app/passport/[id]) and passportUrl is populated again; the
# 2026-09-04 note about it serving the marketing homepage no longer applies.
# The passport page reads through /v1/passport/{id}, which is scan-free, so
# following the link cannot advance a seal's state.
PASSPORT_ORIGIN = "https://authichain.com"
RESOLVER_ORIGIN = "https://id.authichain.com"

# Custom domain id.authichain.com is attached in the Cloudflare dashboard
# (done as of 2026-09-30).
# Secret: the owner sets `gh secret set GS1_RESOLVER_ISSUE_SECRET` once;
# deploy-workers.yml's "Bind ISSUE_SECRET on gs1-resolver" step then binds it
# on every deploy. Until set, POST /issue returns 503 issuing_disabled --
# resolving existing seals is unaffected.

[env.staging]
name = "gs1-resolver-staging"

[env.staging.vars]
PASSPORT_ORIGIN = "https://authichain.com"
RESOLVER_ORIGIN = "https://gs1-resolver-staging.undone-k.workers.dev"

[observability]
enabled = true
