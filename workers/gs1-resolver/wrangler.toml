name = "gs1-resolver"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# Declared here so a deploy keeps it. It was first attached in the dashboard.
routes = [{ pattern = "id.authichain.com", custom_domain = true }]

# Reuse the existing provenance D1 from authichain-scan-validate.
[[d1_databases]]
binding = "DB"
database_name = "authichain-provenance"
database_id = "ebd8081b-ac13-485a-8b0e-a6cd9c0f7be5"
migrations_dir = "migrations"

[vars]
# PASSPORT_ORIGIN is where a scanned seal sends a human. As of 2026-09-11 that
# route exists (src/app/passport/[id]) and passportUrl is populated again; the
# 2026-09-04 note about it serving the marketing homepage no longer applies.
# The passport page reads through /v1/passport/{id}, which is scan-free, so
# following the link cannot advance a seal's state.
PASSPORT_ORIGIN = "https://authichain.com"
RESOLVER_ORIGIN = "https://id.authichain.com"

# Custom domain id.authichain.com was attached in the Cloudflare dashboard
# on 2026-09-30 and is now declared in `routes` above. ISSUE_SECRET is
# currently set directly in the dashboard (rotated 2026-09-30) -- POST /issue works today against that
# value. deploy-workers.yml has a "Bind ISSUE_SECRET on gs1-resolver" step
# that binds secrets.GS1_RESOLVER_ISSUE_SECRET on every deploy IF that GitHub
# secret is set; it no-ops otherwise. Setting that GitHub secret will
# OVERWRITE the current dashboard-set value on the next deploy -- once set,
# rotate ISSUE_SECRET with `gh secret set GS1_RESOLVER_ISSUE_SECRET`, not in
# the dashboard, or the two will drift.

[env.staging]
name = "gs1-resolver-staging"

[env.staging.vars]
PASSPORT_ORIGIN = "https://authichain.com"
RESOLVER_ORIGIN = "https://gs1-resolver-staging.undone-k.workers.dev"

[observability]
enabled = true
