name = "authichain-com"
main = "src/index.ts"
compatibility_date = "2026-04-01"
account_id = "4c1869b90f13f86940aa3747839bf420"
workers_dev = false

[[routes]]
pattern = "authichain.com/"
zone_name = "authichain.com"

[[routes]]
pattern = "www.authichain.com/"
zone_name = "authichain.com"

# Apex globs — taken over from the deleted legacy `authichain-unified` worker
# (2026-06-10 consolidation). Fallback in src/index.ts serves the landing for
# any unmatched deep path. Exact-path routes below remain (harmless overlap).
[[routes]]
pattern = "authichain.com/*"
zone_name = "authichain.com"

[[routes]]
pattern = "www.authichain.com/*"
zone_name = "authichain.com"

# Asset routes — explicit paths (cannot use glob, conflicts with
# authichain-landing-com worker which holds authichain.com/*).
[[routes]]
pattern = "authichain.com/og-image.svg"
zone_name = "authichain.com"

[[routes]]
pattern = "authichain.com/og-image.png"
zone_name = "authichain.com"

[[routes]]
pattern = "authichain.com/favicon.svg"
zone_name = "authichain.com"

[[routes]]
pattern = "authichain.com/favicon.ico"
zone_name = "authichain.com"

[[routes]]
pattern = "authichain.com/favicon.png"
zone_name = "authichain.com"

[[routes]]
pattern = "authichain.com/apple-touch-icon.svg"
zone_name = "authichain.com"

[[routes]]
pattern = "authichain.com/apple-touch-icon.png"
zone_name = "authichain.com"

# App entry points — redirect to the production app on Vercel
# (app.authichain.com). Explicit paths for the same glob-conflict reason.
[[routes]]
pattern = "authichain.com/login"
zone_name = "authichain.com"

[[routes]]
pattern = "authichain.com/signin"
zone_name = "authichain.com"

[[routes]]
pattern = "authichain.com/app"
zone_name = "authichain.com"

[[routes]]
pattern = "authichain.com/app/*"
zone_name = "authichain.com"



