name = "authichain-com"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
# Not on PR Workers Builds. Live checkout, x402 402, and /m/* update only via
# deploy-authichain-com.yml / deploy-workers.yml `wrangler deploy` on main.

# Apex + www — the wildcard covers all paths including static assets.
# The separate per-asset routes were redundant (the /* wildcard already
# matched them) and only added deploy-time registration overhead.
[[routes]]
pattern = "authichain.com/*"
zone_name = "authichain.com"

[[routes]]
pattern = "www.authichain.com/*"
zone_name = "authichain.com"

# More specific than edge-router's app.authichain.com/* so the empty SPA
# root 302s to /dashboard via Deploy authichain-com (gated edge-router
# deploys do not have to land first). /dashboard stays on the edge router.
[[routes]]
pattern = "app.authichain.com/"
zone_name = "authichain.com"

# Primary site host (moved from the apex). Workers Custom Domain on the
# govchain.us zone; attached live 2026-09-25. Declared here so a redeploy keeps it.
[[routes]]
pattern = "authichain.govchain.us"
custom_domain = true

[observability]
enabled = true

# APP_WORKER: service binding to `authichain-edge-router` (worker-app/index.ts),
# the native Cloudflare replacement for the old Vercel deployment
# (authichain-unified.vercel.app — that Vercel project no longer exists).
# A service binding calls the target Worker directly inside Cloudflare's
# network, with no public URL, DNS, or extra HTTP hop needed.
#
# BEFORE THIS TAKES EFFECT IN PRODUCTION: confirm `authichain-edge-router` is
# actually deployed (it is wired into .github/workflows/deploy-cloudflare.yml
# but gated behind the CLOUDFLARE_DEPLOY_ENABLED repo variable — verify that
# var is set and a deploy has actually succeeded) and that its D1/KV/Hyperdrive
# bindings point at production data (see worker-app/wrangler.toml). Deploying
# authichain-com with this binding wired up is what cuts traffic over — do
# not do that until the above is confirmed.
[[services]]
binding = "APP_WORKER"
service = "authichain-edge-router"

# Secrets (set at deploy from GitHub): STRIPE_SECRET_KEY, optional STRIPE_PRICE_ID

# VERIFY_APP: service binding to the Next app worker `authichain-app`
# (wrangler.app.jsonc), which owns the auth_seals lookup behind
# POST /api/v1/agent-verify. Paid x402 / MCP verify calls are forwarded to it;
# without this binding they are refused 503 registry_not_bound before
# settlement. wrangler deploy fails if `authichain-app` is not deployed.
[[services]]
binding = "VERIFY_APP"
service = "authichain-app"
