name = "authichain-com"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
# Not on PR Workers Builds. Live checkout, x402 402, and /m/* update only via
# deploy-authichain-com.yml / deploy-workers.yml `wrangler deploy` on main.

# Apex + www — the wildcard covers all paths including static assets.
# The separate per-asset routes were redundant (the /* wildcard already
# matched them) and only added deploy-time registration overhead.
# More specific than authichain-edge-router's authichain.com/api/x402*.
# That wildcard wins over authichain.com/*. Listing and growth are exact
# routes because the edge router answered them {"error":"Not found"}.
# These paths, including a trailing slash, are implemented here.
# Exact /api/x402, /api/x402/health, /api/x402/catalog, and
# /api/v1/agent-verify (plus trailing slash) live here so #1882's free tier
# is reachable. llms.txt sends agents to GET /api/x402/health first. The edge
# wildcard authichain.com/api/x402* is more specific than authichain.com/*
# and the edge router has no free tier, so /api/x402/health used to omit
# freeCalls. Catalog is here too, so its seal wording matches this worker.
# authichain.govchain.us /api/x402 and /api/x402/health stay on the edge:
# that host does not grant the free tier, and its health must not say it does.
# Routes match path, not method, so GET and paid POST on the exact /api/x402
# and /api/v1/agent-verify paths are served here.
# settle and every other /api/x402/* path stay on the edge router, as do
# /api/stripe/webhook and /api/checkout*.
# Rollback of the original exact x402 routes:
# npx wrangler rollback 1ef83048-3e1f-4065-83d2-b098e9fb15af --name authichain-com
[[routes]]
pattern = "authichain.com/api/x402"
zone_name = "authichain.com"

[[routes]]
pattern = "authichain.com/api/x402/"
zone_name = "authichain.com"

# Query strings miss the exact routes above and were served by the edge
# router's authichain.com/api/x402* wildcard as GET health 200. Keep the
# wildcard here so GET/HEAD/POST /api/x402?query is the unpaid 402 quote.
# health, catalog, listing, and growth stay on their more specific routes.
[[routes]]
pattern = "authichain.com/api/x402*"
zone_name = "authichain.com"

[[routes]]
pattern = "authichain.com/api/v1/agent-verify"
zone_name = "authichain.com"

[[routes]]
pattern = "authichain.com/api/v1/agent-verify/"
zone_name = "authichain.com"

# Query-string GETs do not match the exact routes above. Edge used to own
# agent-verify* and answered 200 health, so GET-first crawlers saw no paywall.
# Keep this wildcard on the landing worker (GET/HEAD 402). Live CF route id
# 936e5446f2f1456c84f11be9649d7fc0 was pointed here 2026-10-28.
[[routes]]
pattern = "authichain.com/api/v1/agent-verify*"
zone_name = "authichain.com"

[[routes]]
pattern = "authichain.com/api/x402/health"
zone_name = "authichain.com"

[[routes]]
pattern = "authichain.com/api/x402/health/"
zone_name = "authichain.com"

[[routes]]
pattern = "authichain.com/api/x402/catalog"
zone_name = "authichain.com"

[[routes]]
pattern = "authichain.com/api/x402/catalog/"
zone_name = "authichain.com"

[[routes]]
pattern = "authichain.com/api/x402/listing"
zone_name = "authichain.com"

[[routes]]
pattern = "authichain.com/api/x402/growth"
zone_name = "authichain.com"

[[routes]]
pattern = "authichain.com/api/x402/listing/"
zone_name = "authichain.com"

[[routes]]
pattern = "authichain.com/api/x402/growth/"
zone_name = "authichain.com"

[[routes]]
pattern = "authichain.govchain.us/api/x402/listing"
zone_name = "govchain.us"

[[routes]]
pattern = "authichain.govchain.us/api/x402/growth"
zone_name = "govchain.us"

[[routes]]
pattern = "authichain.govchain.us/api/x402/listing/"
zone_name = "govchain.us"

[[routes]]
pattern = "authichain.govchain.us/api/x402/growth/"
zone_name = "govchain.us"

# More specific than edge-router so live JWKS is this worker. The 8.8 MiB
# edge-router versions POST cannot complete from authichain-wsl. After the
# matching edge-router routes are deleted, authichain.com/* would also
# reach these handlers; keep the exact routes so a future edge-router
# deploy cannot steal JWKS back.
[[routes]]
pattern = "authichain.com/.well-known/jwks.json"
zone_name = "authichain.com"

[[routes]]
pattern = "authichain.com/protocol/jwks.json"
zone_name = "authichain.com"

[[routes]]
pattern = "authichain.com/protocol/issuer.json"
zone_name = "authichain.com"

[[routes]]
pattern = "authichain.govchain.us/.well-known/jwks.json"
zone_name = "govchain.us"

[[routes]]
pattern = "authichain.govchain.us/protocol/jwks.json"
zone_name = "govchain.us"

[[routes]]
pattern = "authichain.govchain.us/protocol/issuer.json"
zone_name = "govchain.us"

[[routes]]
pattern = "authichain.com/*"
zone_name = "authichain.com"

[[routes]]
pattern = "www.authichain.com/*"
zone_name = "authichain.com"

# More specific than edge-router's app.authichain.com/* so the empty SPA
# root 302s to /dashboard via Deploy authichain-com (gated edge-router
# deploys do not have to land first). /dashboard stays on the edge router.
[[routes]]
pattern = "app.authichain.com/"
zone_name = "authichain.com"

# Primary site host (moved from the apex). Workers Custom Domain on the
# govchain.us zone; attached live 2026-09-25. Declared here so a redeploy keeps it.
[[routes]]
pattern = "authichain.govchain.us"
custom_domain = true

# authichain.com apex Workers Custom Domain (attached out-of-band before #1245;
# the post-#1245 deploy removed it because it was not declared here, and it had
# to be reattached via API on 2026-09-25). Declared so deploys keep it.
[[routes]]
pattern = "authichain.com"
custom_domain = true

[observability]
enabled = true

[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# APP_WORKER: service binding to `authichain-edge-router` (worker-app/index.ts),
# the native Cloudflare replacement for the old Vercel deployment
# (authichain-unified.vercel.app — that Vercel project no longer exists).
# A service binding calls the target Worker directly inside Cloudflare's
# network, with no public URL, DNS, or extra HTTP hop needed.
#
# BEFORE THIS TAKES EFFECT IN PRODUCTION: confirm `authichain-edge-router` is
# actually deployed (it is wired into .github/workflows/deploy-cloudflare.yml
# but gated behind the CLOUDFLARE_DEPLOY_ENABLED repo variable — verify that
# var is set and a deploy has actually succeeded) and that its D1/KV/Hyperdrive
# bindings point at production data (see worker-app/wrangler.toml). Deploying
# authichain-com with this binding wired up is what cuts traffic over — do
# not do that until the above is confirmed.
[[services]]
binding = "APP_WORKER"
service = "authichain-edge-router"

# API_WORKER: service binding to authichain-api for the public /api/v1 endpoints.
[[services]]
binding = "API_WORKER"
service = "authichain-api"

# Secrets (set at deploy from GitHub): STRIPE_SECRET_KEY, optional STRIPE_PRICE_ID.
# DPP_SMOKE_SECRET (16+ chars) gates the $0 DPP-SMOKE-E2E session. Unset fails closed.
# IP_HASH_SALT (optional): wrangler secret put IP_HASH_SALT --name authichain-com
# Unset or empty fails closed: 503, no write.
# AGENTZ_READINESS_PRIVATE_JWK (optional): wrangler secret put AGENTZ_READINESS_PRIVATE_JWK --name authichain-com # pragma: allowlist secret
# Source: KEY_DIR/agentz.ed25519.pem exported as a JWK. Never commit. Unset fails closed on POST /api/agentz/readiness-sign.

# VERIFY_APP: service binding to the Next app worker `authichain-app`
# (wrangler.app.jsonc). Paid verify prefers the Supabase read below. This
# binding is only the fallback when those vars are absent. wrangler deploy
# fails if `authichain-app` is not deployed.
[[services]]
binding = "VERIFY_APP"
service = "authichain-app"

# Public auth_seals SELECT (RLS allows it). The service role is not committed;
# if SUPABASE_SERVICE_ROLE_KEY is set as a secret, the paid path prefers it.
# Deploy with --keep-vars so dashboard x402 vars stay.
[vars]
SUPABASE_URL = "https://nhdnkzhtadfkkluiulhs.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG5remh0YWRma2tsdWl1bGhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzgyNTUsImV4cCI6MjA4OTUxNDI1NX0.akaWgxRilnjavzpsLqU149nBJqxDjbYOnRdAqrwz4J8"
# Paid verify reads auth_seals here (SUPABASE_URL + key above, VERIFY_APP
# fallback), so discovery reports paidVerify bound. Rollback: delete this line.
X402_PAID_VERIFY_PATH = "seal_lookup"
# PR2 AgentZ readiness signing. Both must be the string "true" or nothing is signed.
# Stay false until Research smoke-checks the merged SHA.
READINESS_SIGNING_ENABLED = "false"
FEATURE_ENABLED = "false"

[browser]
binding = "MYBROWSER"

# POST /api/agentz/readiness-sign: 10 requests / 60s / client IP.
# Workers Rate Limiting binding — included with Workers, $0 extra. Same
# [[ratelimits]] surface as api/wrangler.toml SALES_RATE_LIMITER (namespace
# 2401). Unique namespace_id so counters are not shared. KV cannot hold a
# strict per-minute counter (eventually consistent; missing-key reads cache
# at the edge for ~60s). Fail closed in code if this binding is missing.
# Durable Objects would also be $0 on this free-plan account (sqlite classes)
# but are not needed: sequential same-location POSTs increment the local
# count, which is the live-smoke failure mode. IPv6 keys on the /64 (first
# 4 hextets); IPv4 and IPv4-mapped IPv6 (::ffff:a.b.c.d) key on the IPv4.
[[ratelimits]]
name = "READINESS_SIGN_RATE_LIMITER"
namespace_id = "8491"
simple = { limit = 10, period = 60 }

# x402 replay guard (CFA-343/351). Namespace created 2026-10-16 (PM-approved);
# delete it if #1900 does not ship.
[[kv_namespaces]]
binding = "X402_REPLAY_KV"
id = "ab391dc529884161bd84707d7627a9f0"

# Optional email opt-in from the free checks (email_optins, migrations/0001 + 0002 country/unsub).
# Existing AuthiChain-owned D1, $0. Rollback: delete this block.
[[d1_databases]]
binding = "DB"
database_name = "authichain-db"
database_id = "ebd8081b-ac13-485a-8b0e-a6cd9c0f7be5"
migrations_dir = "migrations"
