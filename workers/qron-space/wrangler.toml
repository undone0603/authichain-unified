name = "qron-space"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
# PR Workers Builds uses `npx wrangler versions upload` (dashboard deploy
# command). That updates the latest version; qron.space/* keeps serving the
# last `wrangler deploy` from .github/workflows/deploy-workers.yml on main.

[[routes]]
pattern = "qron.space/*"
zone_name = "qron.space"

[[routes]]
pattern = "www.qron.space/*"
zone_name = "qron.space"

[vars]
# Origin that renders /generate (Living QR intake) and /p (SEO hubs).
APP_ORIGIN = "https://authichain.com"
# Kill switch for the hourly mode-usage digest. "false" = log dry-run only.
MODE_USAGE_CRON_ENABLED = "false"

[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true

# VERIFY_APP: service binding to the Next app worker `authichain-app`
# (wrangler.app.jsonc), which owns the auth_seals lookup behind
# POST /api/v1/agent-verify. Paid x402 / MCP verify calls are forwarded to it;
# without this binding they are refused 503 registry_not_bound before
# settlement. wrangler deploy fails if `authichain-app` is not deployed.
[[services]]
binding = "VERIFY_APP"
service = "authichain-app"

# x402 replay guard (CFA-343/356). Shared namespace; keys are site-scoped in code.
[[kv_namespaces]]
binding = "X402_REPLAY_KV"
id = "ab391dc529884161bd84707d7627a9f0"
