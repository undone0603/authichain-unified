name = "authichain-license-issuer"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# ──────────────────────────────────────────────────────────────────────────────
# FIRST-TIME SETUP
#   Run the provisioning script to replace placeholder IDs and apply migrations:
#     cd workers/authichain-license-issuer
#     bash scripts/provision.sh
#
# DEPLOY
#     wrangler deploy
# ──────────────────────────────────────────────────────────────────────────────

[[d1_databases]]
binding = "DATABASE"
database_name = "authichain-license-db"
database_id = "7757b9f2-d25f-4561-866b-37392d5cb660"

[[kv_namespaces]]
binding = "SESSIONS"
id = "48d7f33917be4a7fb86c852ae0ef7033"

# Secrets — set via: wrangler secret put <NAME>
# Probe presence (never values) with GET /health after deploy.
# Required for a D1 license write:
#   STRIPE_WEBHOOK_SECRET
#   LICENSE_PRIVATE_KEY_PEM
# Optional: STRIPE_SECRET_KEY (read-only session retrieve to expand line_items)
# STRIPE_AGENT_BROWSER_PRO_PRICE_ID
# STRIPE_AGENT_BROWSER_ENTERPRISE_PRICE_ID
# LICENSE_PUBLIC_KEY_PEM
# TELEGRAM_BOT_TOKEN
# TELEGRAM_ADMIN_CHAT_ID
# RESEND_API_KEY

[vars]
ENVIRONMENT = "production"

[observability]
enabled = true
