name = "authichain-qron-provenance"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
NEXT_PUBLIC_SITE_URL = "https://authichain.com"

[[d1_databases]]
binding = "DB"
database_name = "authichain-provenance"
database_id = "ebd8081b-ac13-485a-8b0e-a6cd9c0f7be5"

[[routes]]
pattern = "authichain.com/api/qron-register*"
zone_name = "authichain.com"

# Primary host (govchain.us zone). Attached live 2026-09-25; declared here so
# deploys stop removing it.
[[routes]]
pattern = "authichain.govchain.us/api/qron-register*"
zone_name = "govchain.us"

[env.production]
name = "authichain-qron-provenance"

[env.staging]
name = "authichain-qron-provenance-staging"

[observability]
enabled = true
