[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "f80875ad11c043c4ac9fdf3740f0faa1"

[[kv_namespaces]]
binding = "LEADS"
id = "720b15b316324b22b3d8225ab5780b10"
