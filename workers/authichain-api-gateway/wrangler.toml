name = "authichain-api-gateway"
main = "src/index.ts"
compatibility_date = "2026-04-01"
account_id = "4c1869b90f13f86940aa3747839bf420"
workers_dev = false

[[routes]]
pattern = "api.authichain.com/*"
zone_name = "authichain.com"

# API keys + lead storage (set STRIPE_WEBHOOK_SECRET + ADMIN_SECRET via `wrangler secret put`)
[[kv_namespaces]]
binding = "API_KEYS"
id = "placeholder-create-via-wrangler-kv-namespace-create"

[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "placeholder-create-via-wrangler-kv-namespace-create"

[[kv_namespaces]]
binding = "LEADS"
id = "placeholder-create-via-wrangler-kv-namespace-create"
