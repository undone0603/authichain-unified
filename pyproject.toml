# AgentZ Python package. AgentZ ships separately from the AuthiChain web app.
#
# Dependencies here are AgentZ's direct imports, with ranges that contain the
# exact host pins. requirements-agentz.txt stays the lock: install with
#   pip install -c requirements-agentz.txt -e '.[test]'
# so the host and CI resolve the same versions as the protected host image.
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentz"
dynamic = ["version"]
description = "AuthiChain autonomous agent orchestrator backed by LM Studio"
readme = "agentz/README.md"
requires-python = ">=3.11"
dependencies = [
  "browser-use>=0.11.13,<0.12",
  "cryptography>=50.0.0,<51",
  "eth-hash>=0.8,<0.9",
  "fastapi>=0.136,<0.137",
  "httpx>=0.28,<0.29",
  "jsonschema>=4.26,<5",
  "langchain-core>=1.4,<2",
  "langchain-google-genai>=4.2,<5",
  "langchain-groq>=1.1,<2",
  "langchain-ollama>=1.1,<2",
  "langchain-openai>=1.3,<2",
  "mcp>=1.30.0,<2.0",
  "pandas>=3.0,<4",
  "playwright>=1.60,<2",
  "psutil>=7.2,<8",
  "pydantic>=2.13,<3",
  "python-dotenv>=1.2,<2",
  "PyYAML>=6.0,<7",
  "qrcode>=8.2,<9",
  "reportlab>=4.5,<5",
  "requests>=2.34,<3",
  "starlette>=1.3,<2",
  "streamlit>=1.58,<2",
  "stripe>=15.2,<16",
  "supabase>=2.31,<3",
  "tenacity>=9.1,<10",
  "uvicorn>=0.49,<0.50",
  "web3>=7.16,<8",
]

[project.optional-dependencies]
# Imported lazily in agentz/core/llm.py; not part of the host pins.
anthropic = ["langchain-anthropic"]
test = [
  "pytest>=9.0,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-mock>=3.15,<4",
]

[project.scripts]
agentz = "agentz.cli:main"

[tool.setuptools.dynamic]
version = { attr = "agentz.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["agentz*"]
exclude = ["agentz.tests*"]

[tool.setuptools.package-data]
agentz = [
  "**/*.yaml",
  "**/*.sql",
  "**/*.html",
  "**/*.json",
  "**/*.md",
  "**/*.js",
  "**/*.mjs",
  "**/*.ts",
  "**/*.sh",
]

[tool.setuptools.exclude-package-data]
# Node workers, test data and generated deliverables do not ship in the wheel.
agentz = [
  "cloudflare-mcp/**",
  "reqbin-rest-mcp/**",
  "fixtures/**",
  "tests/**",
  "knowledge/deliverables/**",
]
