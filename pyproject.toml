[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "agentz"
version = "2.0.0"
description = "Zero-dependency Autonomous Trust Infrastructure"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
packages = ["agentz"]

[project.scripts]
agentz = "agentz.cli:main"
