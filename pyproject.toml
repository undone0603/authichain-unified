[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentz"
version = "0.1.0"
description = "AuthiChain autonomous agent orchestrator backed by LM Studio"
requires-python = ">=3.11"
dependencies = [
  "browser-use==0.12.7",
  "pydantic>=2.0,<3.0",
  "pytest>=7.0",
  "pytest-asyncio>=0.23,<2.0",
  "mcp>=1.0,<2.0",
  "uvicorn>=0.30,<1.0",
]

[project.scripts]
agentz = "agentz.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentz*"]
