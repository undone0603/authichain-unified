[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "agentz"
version = "0.1.0"
description = "AuthiChain autonomous agent orchestrator backed by LM Studio"
requires-python = ">=3.11"
dependencies = ["browser-use==0.12.7"]

[project.scripts]
agentz = "agentz.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentz*"]
