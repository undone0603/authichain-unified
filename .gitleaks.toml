# Gitleaks configuration for authichain-unified
# Prevents secrets from being committed to git

[allowlist]
description = "Allowlisted paths and patterns"
paths = [
  '''\.env\.example$''',
  '''\.env\.local\.example$''',
  '''docs/archive/misc/.*_envs\.txt$''',
  '''^fixtures/.*\.jws$''',
]
regexes = [
  '''\*\*\*REMOVED\*\*''',
  '''REPLACE_WITH_.*''',
  '''your_.*_here''',
  '''sk_live_your_stripe_secret_key''',
  '''whsec_your_webhook_secret''',
]

[[rules]]
id = "stripe-live-key"
description = "Stripe Live Secret Key"
regex = '''sk_live_[a-zA-Z0-9]{20,}'''
tags = ["key", "stripe"]

[[rules]]
id = "stripe-test-key"
description = "Stripe Test Secret Key"
regex = '''sk_test_[a-zA-Z0-9]{20,}'''
tags = ["key", "stripe"]

[[rules]]
id = "stripe-webhook-secret"
description = "Stripe Webhook Secret"
regex = '''whsec_[a-zA-Z0-9]{20,}'''
tags = ["key", "stripe"]

[[rules]]
id = "openai-key"
description = "OpenAI API Key"
regex = '''sk-proj-[a-zA-Z0-9_-]{40,}'''
tags = ["key", "openai"]

[[rules]]
id = "resend-key"
description = "Resend API Key"
# Current keys are re_<8>_<24+>; the first alternative alone missed them because
# of the inner underscore (one sat in agentz/workflows/registry.yaml unflagged).
regex = '''(?:^|["'=:\s(`])re_(?:[a-zA-Z0-9]{20,}|[a-zA-Z0-9]{8}_[a-zA-Z0-9]{20,})\b'''
tags = ["key", "resend"]

[[rules]]
id = "groq-key"
description = "Groq API Key"
regex = '''gsk_[a-zA-Z0-9]{20,}'''
tags = ["key", "groq"]

[[rules]]
id = "telegram-bot-token"
description = "Telegram Bot Token"
regex = '''[0-9]{8,10}:[a-zA-Z0-9_-]{30,}'''
tags = ["token", "telegram"]

[[rules]]
id = "supabase-jwt"
description = "Supabase service_role JWT"
# Matches a JWT whose payload carries "service_role" at any of the three base64
# alignments. The previous pattern demanded a 50+ char header, but a standard
# Supabase header is 36 chars, so a committed service_role key went unflagged.
# Anon keys are public by design (shipped to browsers) and are not matched.
regex = '''eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]*(?:c2VydmljZV9yb2xl|NlcnZpY2Vfcm9s|zZXJ2aWNlX3Jv)[A-Za-z0-9_-]*\.[A-Za-z0-9_-]{10,}'''
tags = ["key", "supabase"]
