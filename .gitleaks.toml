# gitleaks config — extends the default ruleset.
# We allowlist scripts/_agentz-env-keys.ts because it contains ENV VAR NAMES
# only (no values). The generic-api-key heuristic occasionally trips on
# high-entropy all-caps tokens like "FAL_KEY" — those are identifiers, not
# secrets. If new files of the same nature are added, list them here too.

[extend]
useDefault = true

[allowlist]
description = "Identifier-only files that are not secrets"
paths = [
  '''scripts/_agentz-env-keys\.ts$''',
]
