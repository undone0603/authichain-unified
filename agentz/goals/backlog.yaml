# AgentZ goals backlog. AgentZ reads this at the start of each cycle.
#
# Give goals, not scripts. AgentZ may research, explore, prototype, add its own
# goals (source: agentz) and change plans when evidence changes. Gated, always:
# sending to customers or prospects, spending or charges, merging, deploying,
# publishing credentials or identity, editing its own guardrail code.
# Status: open | active | blocked | done | dropped (with a one-line reason).
version: 1
updated: 2026-11-19
principle: >
  Lifetime outside revenue is $0.80 (x402) and $0 (Stripe). One $950 gap report
  equals about 19,000 x402 calls. Favor goals that produce the first paying
  customer before the EU battery passport deadline (2027-02-18).

goals:
  # --- Reliability (from the 2026-11-19 chaos drill) ---
  - id: watchdog
    goal: Signal, the agentz-dex tunnel and the AgentZ API recover by themselves within 5 minutes of any crash.
    measure: A repeat chaos drill (D1/D5) passes with no human action.
    status: open
    priority: 1
  - id: reasoning-model
    goal: AgentZ's planner has a working local model at $0 that fits the host's memory.
    measure: "`agentz health` reports a reachable model; one governor dry-run produces a plan."
    status: blocked
    blocked_on: owner picks the model or approves the download
    priority: 1
  - id: fail-closed-clarity
    goal: Missing-secret and unreachable-dependency failures are explicit (503 / non-zero exit), not a bare 500 or exit 0.
    measure: Chaos drill D2 and D6 rows turn green.
    status: open
    priority: 3

  # --- Revenue: battery passport ---
  - id: battery-who-must-comply
    goal: For the 33 battery leads, find who sells into the EU and through which importer.
    measure: A ranked list with a public source per row, plus Gmail drafts the owner can send.
    status: open
    priority: 1
  - id: gap-report-best-in-market
    goal: Every gap-report item cites its article in Regulation (EU) 2023/1542 or a delegated act, and flags open questions.
    measure: The knowledge base is checked into docs/, and the generator emits citations.
    status: open
    priority: 2
  - id: gap-map-capture
    goal: Free gap-map users can optionally email themselves the result and opt in.
    measure: Draft PR with owner-approved consent wording.
    status: open
    priority: 2
  - id: activation-email-status
    goal: Port only the activation-email status recording from PR #2478 onto current main.
    measure: Small tested PR; #2478 can then close.
    status: open
    priority: 3

  # --- x402 ---
  - id: x402-demand-map
    goal: Find categories in the Coinbase and PayAI directories where agents pay but supply is thin.
    measure: 2-3 endpoint proposals that build on existing AuthiChain capabilities, each with evidence.
    status: open
    priority: 3
  - id: x402-credit-pack
    goal: Port the $5/120-credit pack (PR #2403) onto current main.
    measure: Tested draft PR, disabled until the owner approves the price.
    status: open
    priority: 4

  # --- Trust and identity ---
  - id: daily-signed-evidence
    goal: A daily AgentZ-signed revenue and health report in docs/evidence/.
    measure: 7 consecutive days, each verifying offline.
    status: open
    priority: 2
  - id: reanchor-plan
    goal: Estimate the gas and draft a plan to re-anchor identities on Polygon. Spend nothing.
    measure: Plan with cost range and steps, for the owner to decide.
    status: open
    priority: 4

  # --- Upkeep ---
  - id: test-debt
    goal: Sort the local pytest failures into environment problems and real bugs; fix the real ones.
    measure: Classified list plus fix PRs.
    status: open
    priority: 3
  - id: pr-backlog
    goal: Every open PR is classified as superseded, stale, mergeable or needing work, with evidence.
    measure: A close list the owner approves. (#2415 and #2508 are already flagged superseded.)
    status: open
    priority: 3
  - id: credential-value
    goal: Rank which 5 of AgentZ's 100 missing credentials would unlock the most value.
    measure: A ranked list with which workflows each one unblocks.
    status: open
    priority: 3

  # --- Growth ---
  - id: answer-engines
    goal: See how AI assistants answer "EU battery passport readiness" questions, and draft content that earns citations.
    measure: Before and after answer snapshots, plus drafts.
    status: open
    priority: 3
  - id: gov-and-grants
    goal: Scan SAM.gov, the Base and Polygon ecosystems and DLA follow-ups for provenance and authentication opportunities.
    measure: A qualified list with deadlines; submissions stay with the owner.
    status: open
    priority: 3

  # --- Divergent round (2026-11-19). Generated by Claude because AgentZ has no model yet; scored 1-5. ---
  - id: idea-eu-importers
    goal: "10x: sell to EU importers, who carry the passport obligation for many brands at once, not to individual US makers."
    score: {impact: 5, cost: 2, evidence: 4}
    status: open
    priority: 1
  - id: idea-bulk-reports
    goal: "10x: bulk gap reports via a CSV intake. Up to 21 models per order is $950 + 20 x $350 = $7,950."
    score: {impact: 4, cost: 2, evidence: 4}
    status: open
    priority: 2
  - id: idea-notarize-x402
    goal: "Wild: AgentZ signs any submitted file's SHA-256 as an evidence record for $0.05 via x402. Notarization agents can buy, using the new key."
    score: {impact: 3, cost: 2, evidence: 3}
    status: open
    priority: 2
  - id: idea-first-three-free
    goal: "Contrarian: offer the gap report free to the first 3 companies in exchange for case-study permission. No customer proof exists yet."
    score: {impact: 4, cost: 1, evidence: 3}
    status: open
    priority: 2
    note: Owner decision (pricing / offer).
  - id: idea-signed-checklist
    goal: "Cheap: a free, AgentZ-signed Annex XIII field checklist as a lead magnet."
    score: {impact: 3, cost: 1, evidence: 3}
    status: open
    priority: 3
  - id: idea-deadline-clock
    goal: "Weird: a public countdown to 2027-02-18 with a readiness index built only from public data."
    score: {impact: 2, cost: 2, evidence: 2}
    status: open
    priority: 4
  - id: idea-seller-reliability
    goal: "Wild: publish AgentZ-signed uptime and settlement reliability scores for x402 sellers. PayAPI shows reliability as 'unscored'."
    score: {impact: 3, cost: 3, evidence: 2}
    status: open
    priority: 4
  - id: idea-focus-60
    goal: "Contrarian principle: pause new x402 work for 60 days, so all build effort goes to the battery deadline."
    score: {impact: 4, cost: 1, evidence: 4}
    status: open
    priority: 1
    note: Owner decision.
