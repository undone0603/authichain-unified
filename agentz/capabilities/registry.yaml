# AgentZ capability registry (machine-readable).
#
# One entry per real repository capability AgentZ can discover. Status values:
#   AVAILABLE          independently verified and callable (evidence below)
#   INTEGRATION_READY  implemented, not yet connected to AgentZ
#   PARTIAL            needs repair or a missing dependency
#   BLOCKED            needs credentials, runtime identity, approval or external access
#   PROPOSED           no verified working implementation
#
# Only entries with `agentz_executable: true` can be invoked by
# agentz/integrations/authichain_mcp.py, and only when the live server's MCP
# annotations also say readOnlyHint=true and destructiveHint=false. Everything
# financial, signing, privileged or host-executable stays non-executable here.
# A source file, route or passing mock is not evidence of a working capability.
schema_version: 1
registry_version: 1
baseline_revision: b4afbb3fc7a44dee4f7b2b2b1b8f58a9e4dcc883
hosted_mcp_endpoint: https://authichain.com/mcp

