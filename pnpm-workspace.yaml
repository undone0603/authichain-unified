allowBuilds:
  '@clerk/shared': true
  bufferutil: true
  esbuild: true
  keccak: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
  workerd: true
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - miniflare@4.20260701.0
  - wrangler@4.107.0
  # @smithy/* packages published 2026-07-20 — within minimumReleaseAge window
  - "@smithy/fetch-http-handler@4.0.0"
  - "@smithy/hash-blob-browser@4.4.11"
  - "@smithy/hash-node@4.4.11"
  - "@smithy/hash-stream-node@4.4.11"
  - "@smithy/invalid-dependency@4.4.11"
  - "@smithy/md5-js@4.4.11"
  - "@smithy/middleware-content-length@4.4.11"
  - "@smithy/middleware-endpoint@4.6.11"
  - "@smithy/middleware-retry@4.7.11"
  - "@smithy/middleware-serde@4.4.11"
  - "@smithy/middleware-stack@4.4.11"
  - "@smithy/node-config-provider@4.5.11"
  - "@smithy/node-http-handler@4.9.8"
  - "@smithy/protocol-http@5.5.11"
  - "@smithy/fetch-http-handler@3.0.0"
  - "@smithy/util-body-length-browser@4.4.11"
  - "@smithy/util-body-length-node@4.4.11"
  - "@smithy/util-defaults-mode-browser@4.4.11"
  - "@smithy/util-defaults-mode-node@4.4.11"
  - "@smithy/util-endpoints@4.4.11"
  - "@smithy/util-middleware@4.4.11"
  - "@smithy/util-retry@4.4.11"
  - "@smithy/util-stream@4.4.11"
  - "@smithy/util-utf8@4.4.11"
  - "@smithy/smithy-client@4.4.11"
# pnpm settings (pnpm 10+ reads overrides from here, not package.json).
# Scoped security overrides: each selector targets only the vulnerable range,
# so unaffected versions (e.g. ws@7.x) are left untouched.
overrides:
  serialize-javascript: 7.0.3
  # GHSA high: form-data CRLF injection in multipart field/filenames.
  'form-data@>=4.0.0 <4.0.6': 4.0.6
  # GHSA high: js-cookie per-instance prototype hijack in assign().
  'js-cookie@<=3.0.5': 3.0.7
  # GHSA high: ws memory-exhaustion DoS from tiny fragments (8.x only).
  # Note: miniflare depends on ws@8.18.0, so we allow up to 8.21.0 but don't force it
  # Dependabot should be able to update within this range as deps allow
  'ws@>=8.0.0 <8.18.0': 8.18.0
  # GHSA: vite server.fs.deny bypass + NTLMv2 hash disclosure (vitest peer pulls 5.x).
  'vite@<6.4.3': 6.4.3
  # GHSA moderate: postcss XSS via unescaped </style> (transitive via next).
  'postcss@<8.5.10': 8.5.10
