allowBuilds:
  '@clerk/shared': true
  bufferutil: true
  esbuild: true
  keccak: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
  workerd: true
# Supply-chain protection: require packages to be at least 1 day old before
# install, so a freshly-published malicious version cannot be pulled in before
# npm/the community catches it. (1440 minutes = the effective policy that was
# already applying; the prior `minimumReleaseAge: 0` did not actually disable
# it — pnpm 10.x applies a ~1-day default this value was not overriding.)
minimumReleaseAge: 1440
# Scope/name globs for trusted vendors that publish frequently and would
# otherwise trip the age check on every routine update (AWS SDK low-level libs
# and Cloudflare tooling). Using globs instead of a hand-maintained version
# list avoids the drift that repeatedly broke CI. Protection stays ON for all
# other packages.
minimumReleaseAgeExclude:
  - "@smithy/*"
  - "@aws-sdk/*"
  - "miniflare"
  - "wrangler"
# pnpm settings (pnpm 10+ reads overrides from here, not package.json).
# Scoped security overrides: each selector targets only the vulnerable range,
# so unaffected versions (e.g. ws@7.x) are left untouched.
overrides:
  serialize-javascript: 7.0.3
  # GHSA high: form-data CRLF injection in multipart field/filenames.
  'form-data@>=4.0.0 <4.0.6': 4.0.6
  # GHSA high: js-cookie per-instance prototype hijack in assign().
  'js-cookie@<=3.0.5': 3.0.7
  # GHSA high: ws memory-exhaustion DoS from tiny fragments (8.x only).
  # Note: miniflare depends on ws@8.18.0, so we allow up to 8.21.0 but don't force it
  # Dependabot should be able to update within this range as deps allow
  'ws@>=8.0.0 <8.18.0': 8.18.0
  # GHSA: vite server.fs.deny bypass + NTLMv2 hash disclosure (vitest peer pulls 5.x).
  'vite@<6.4.3': 6.4.3
  # GHSA moderate: postcss XSS via unescaped </style> (transitive via next).
  'postcss@<8.5.10': 8.5.10
