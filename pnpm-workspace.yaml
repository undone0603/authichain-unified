packages:
  - apps/*
  - packages/*
  - workers/*
  - worker
  - mcp
allowBuilds:
  '@clerk/shared': true
  agent-browser: false
  bufferutil: true
  esbuild: true
  keccak: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
  workerd: true
minimumReleaseAgeExclude:
  - miniflare@4.20260701.0
  - wrangler@4.107.0
# pnpm settings (pnpm 10+ reads overrides from here, not package.json).
# Scoped security overrides: each selector targets only the vulnerable range,
# so unaffected versions (e.g. ws@7.x) are left untouched.
overrides:
  serialize-javascript: 7.0.3
  # GHSA: deepmerge-ts prototype pollution (transitive via webdriverio; wdio pins ^7).
  deepmerge-ts: ^8.0.2
  # GHSA high: form-data CRLF injection in multipart field/filenames.
  'form-data@>=4.0.0 <4.0.6': 4.0.6
  # GHSA high: js-cookie per-instance prototype hijack in assign().
  'js-cookie@<=3.0.5': 3.0.7
  # GHSA high: ws memory-exhaustion DoS from tiny fragments (8.x only).
  # Bumped 2026-09-11 (Blocker Register recuyUrMAPEEwQIr1): 8.18.0 was itself
  # vulnerable by the time this was re-audited. 8.21.3 dedupes onto a version
  # already resolved elsewhere in the tree (openai, @solana/*) rather than
  # introducing a new one.
  'ws@>=8.0.0 <8.21.0': 8.21.3
  # GHSA: vite server.fs.deny bypass + NTLMv2 hash disclosure (vitest peer pulls 5.x).
  'vite@<6.4.3': 6.4.3
  # GHSA moderate: postcss XSS via unescaped </style> (transitive via next).
  # Bumped 2026-09-11 (recuyUrMAPEEwQIr1): 8.5.10 was itself vulnerable by the
  # time this was re-audited. 8.5.26 dedupes onto the root devDependency version.
  'postcss@<8.5.18': 8.5.26
  # GHSA high: axios <1.18.0 SSRF/credential-leak on absolute-URL redirects.
  # Added 2026-09-11 (recuyUrMAPEEwQIr1). 1.20.0 dedupes onto the version
  # already resolved as a direct dependency and via @sendgrid/mail.
  'axios@<1.18.0': 1.20.0
  # GHSA high: js-yaml <4.3.1 prototype pollution / code exec on untrusted input.
  # Added 2026-09-11 (recuyUrMAPEEwQIr1). Patch release on the 4.x line already in use.
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
verifyDepsBeforeRun: false
