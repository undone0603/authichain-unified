version: 2.1

jobs:
  deploy-workers-rollback:
    docker:
      - image: cimg/node:22.15
    environment:
      COMPONENT_NAME: "<< pipeline.deploy.component_name >>"
      ENVIRONMENT_NAME: "<< pipeline.deploy.environment_name >>"
      TARGET_VERSION: "<< pipeline.deploy.target_version >>"
      CURRENT_VERSION: "<< pipeline.deploy.current_version >>"
      ROLLBACK_REASON: "<< pipeline.deploy.reason >>"
    steps:
      - checkout
      - run:
          name: Plan rollback
          command: |
            echo "rollback reason: ${ROLLBACK_REASON}"
            echo "rolling back from: ${CURRENT_VERSION}"
            circleci run release plan deploy-workers-rollback \
              --environment-name="${ENVIRONMENT_NAME}" \
              --component-name="${COMPONENT_NAME}" \
              --target-version="${TARGET_VERSION}" \
              --rollback
      - run:
          name: Check out the version to restore
          command: |
            set -euo pipefail
            if [ -z "${TARGET_VERSION}" ]; then
              echo "TARGET_VERSION is empty. Choose the git commit to restore."
              exit 1
            fi
            git fetch --force origin "${TARGET_VERSION}"
            git checkout --detach FETCH_HEAD
      - run:
          name: Perform rollback
          command: bash scripts/circleci/deploy-workers.sh
      - run:
          name: Update deployment status to running
          command: circleci run release update deploy-workers-rollback --status=RUNNING
      - run:
          name: Update deployment status to success
          command: circleci run release update deploy-workers-rollback --status=SUCCESS
          when: on_success
      - run:
          name: Update deployment status to failed
          command: circleci run release update deploy-workers-rollback --status=FAILED
          when: on_fail

  cancel-deploy-workers-rollback:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Update planned release to CANCELED
          command: |
            circleci run release update deploy-workers-rollback \
              --status=CANCELED

workflows:
  rollback:
    jobs:
      - deploy-workers-rollback
      - cancel-deploy-workers-rollback:
          requires:
            - deploy-workers-rollback:
                - canceled
