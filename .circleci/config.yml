# Evidence-only native DPP payment/webhook validation; no deploy.
# This branch is separate from PR #2411. It changes ONLY this CI config.
version: 2.1

jobs:
  dpp-proof:
    docker:
      - image: cimg/node:22.23.3
    resource_class: medium
    working_directory: ~/project
    environment:
      CI: "true"
      HUSKY: "0"
      NODE_OPTIONS: "--max-old-space-size=3072"
    steps:
      - checkout
      - run:
          name: Confirm exact PR #2411 source ancestry and no app files differ
          command: |
            set -euo pipefail
            source_sha="7fa7ad6f3310d0a8195f8d630d446ed4c5a27e57"
            # The code under test is the exact PR source ancestor. Allow
            # a later manual-trigger commit without changing product code.
            git merge-base --is-ancestor "$source_sha" HEAD
            test "$(git diff --name-only "$source_sha" HEAD)" = ".circleci/config.yml"
            test -z "$(git status --porcelain)"
            echo "Verified PR source ancestor: $source_sha"
            echo "CircleCI checkout: $CIRCLE_SHA1"
      - run:
          name: Reject production credentials and install locked dependencies
          command: |
            set -euo pipefail
            for name in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_WEBHOOK_AUTHICHAIN_SECRET SUPABASE_SERVICE_ROLE_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RESEND_API_KEY; do
              if [ -n "${!name:-}" ]; then
                echo "Forbidden production credential injected: $name" >&2
                exit 1
              fi
            done
            mkdir -p "$HOME/.local/bin"
            export PATH="$HOME/.local/bin:$PATH"
            corepack enable --install-directory "$HOME/.local/bin"
            corepack prepare pnpm@10.28.2 --activate
            timeout --signal=TERM --kill-after=10s 420s pnpm install --frozen-lockfile --prefer-offline
      - run:
          name: Native exact-source DPP webhook and return-page tests
          command: |
            set -euo pipefail
            mkdir -p "$HOME/.local/bin"
            export PATH="$HOME/.local/bin:$PATH"
            timeout --signal=TERM --kill-after=10s 240s pnpm exec vitest run \
              src/lib/dpp-payment-eligibility.test.ts \
              src/lib/dpp-fulfill-checkout.test.ts \
              server/webhooks/stripe.test.ts \
              src/app/api/stripe/webhook/route.test.ts \
              src/app/checkout-return-truth.test.ts \
              src/lib/stripe-construct-event.test.ts
      - run:
          name: Report immutable evidence
          when: always
          command: |
            echo "CircleCI commit: ${CIRCLE_SHA1:-unknown}"
            echo "Application PR parent: 7fa7ad6f3310d0a8195f8d630d446ed4c5a27e57"
            echo "NOTE: this test-only branch is NOT the protected six-job release gate."

workflows:
  focused-dpp:
    jobs:
      - dpp-proof:
          filters:
            branches:
              only:
                - ci/circleci-dpp-proof-7fa7ad6
