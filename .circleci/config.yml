# Quality gate on CircleCI. GitHub Actions does not start these jobs while
# the account is billing-locked. This file does not deploy. Do not add a
# Cloudflare or Stripe token to the CircleCI project for this pipeline.
version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:22.23.3
    resource_class: large
    working_directory: ~/project

commands:
  verify-revision:
    steps:
      - run:
          name: Verify exact pipeline revision
          command: |
            set -euo pipefail
            test "$(git rev-parse HEAD)" = "${CIRCLE_SHA1:?Missing pipeline commit}"
  setup-node:
    steps:
      - run:
          name: Install pnpm 10.28.2
          command: |
            sudo corepack enable
            corepack prepare pnpm@10.28.2 --activate
            pnpm config set store-dir ~/.pnpm-store
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile --prefer-offline
          no_output_timeout: 20m

jobs:
  quality:
    executor: node
    steps:
      - checkout
      - verify-revision
      - setup-node
      - run:
          name: Type check
          command: pnpm check
          no_output_timeout: 20m
      - run:
          name: Lint
          command: pnpm lint:ci
          no_output_timeout: 20m
      - run:
          name: Workflow and deploy invariants
          command: |
            node scripts/check-workflow-cannot-fail.mjs
            node scripts/ci/check-deploy-invariants.mjs
            node scripts/ci/check-node-test-runners.mjs

  typecheck-ratchet:
    executor: node
    environment:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - checkout
      - verify-revision
      - setup-node
      - run:
          name: Typecheck ratchet
          command: node scripts/typecheck-ratchet.mjs
          no_output_timeout: 20m

  test-workers:
    executor: node
    steps:
      - checkout
      - verify-revision
      - setup-node
      - run:
          name: Test workers
          command: |
            if pnpm test --filter=./workers/* --continue=dependencies-successful; then
              exit 0
            fi
            echo "Tests failed; retrying once"
            sleep 15
            pnpm test --filter=./workers/* --continue=dependencies-successful
          no_output_timeout: 30m

  test-other:
    executor: node
    steps:
      - checkout
      - verify-revision
      - setup-node
      - run:
          name: Install Playwright Chromium
          command: pnpm --filter agent-browser exec playwright install --with-deps chromium
          no_output_timeout: 20m
      - run:
          name: Test the other workspaces
          command: |
            if pnpm test --filter='!./workers/*' --continue=dependencies-successful; then
              exit 0
            fi
            echo "Tests failed; retrying once"
            sleep 15
            pnpm test --filter='!./workers/*' --continue=dependencies-successful
          no_output_timeout: 30m

  build:
    executor: node
    environment:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - checkout
      - verify-revision
      - setup-node
      - run:
          name: Production build
          command: |
            if pnpm build; then
              exit 0
            fi
            echo "Production build failed; retrying once"
            sleep 15
            pnpm build
          no_output_timeout: 30m


  extras:
    executor: node
    steps:
      - checkout
      - verify-revision
      - setup-node
      - run:
          name: Verify Drizzle migration source of truth
          command: node scripts/check-drizzle-migrations.mjs
      - run:
          name: Install dedicated Python test environment
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends python3-venv
            python3 -m venv /tmp/agentz-ci-venv
            /tmp/agentz-ci-venv/bin/python -m pip install -r requirements-agentz.txt
          no_output_timeout: 20m
      - run:
          name: Execute AgentZ pytest
          command: |
            mkdir -p /tmp/pytest-results
            PYTHONPATH="$PWD" /tmp/agentz-ci-venv/bin/python -m pytest agentz/tests --junitxml=/tmp/pytest-results/agentz.xml
          no_output_timeout: 20m
      - store_test_results:
          path: /tmp/pytest-results

  main-quality-gate:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run:
          name: Six required jobs succeeded
          command: |
            echo "CircleCI six-job quality gate completed for ${CIRCLE_SHA1:?missing pipeline commit}"

workflows:
  quality-gate:
    jobs:
      - quality:
          requires: [test-workers]
          filters:
            branches:
              ignore:
                - /dependabot\/.*/
      - typecheck-ratchet:
          requires: [test-workers]
          filters:
            branches:
              ignore:
                - /dependabot\/.*/
      - test-workers:
          filters:
            branches:
              ignore:
                - /dependabot\/.*/
      - test-other:
          requires: [test-workers]
          filters:
            branches:
              ignore:
                - /dependabot\/.*/
      - build:
          requires: [test-workers]
          filters:
            branches:
              ignore:
                - /dependabot\/.*/
      - extras:
          requires: [test-workers]
          filters:
            branches:
              ignore:
                - /dependabot\/.*/
      - main-quality-gate:
          requires:
            - quality
            - typecheck-ratchet
            - test-workers
            - test-other
            - build
            - extras
          filters:
            branches:
              ignore:
                - /dependabot\/.*/
