# Credential-free quality checks only. This configuration does not deploy.
# Do not add production tokens or contexts to this pipeline.
version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:22.23.3
    resource_class: large
    working_directory: ~/project

  # Synthetic, disposable database visible only to the test-other container.
  # Never attach a production context, external volume or service credential.
  node-postgres:
    docker:
      - image: cimg/node:22.23.3
      - image: postgres:16-alpine
        environment:
          POSTGRES_USER: dpp_ci
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: dpp_ci
    resource_class: large
    working_directory: ~/project

commands:
  bounded-check:
    parameters:
      task:
        type: enum
        enum: [quality, typecheck-ratchet, test-workers, test-other, build, extras, agentz]
      seconds:
        type: integer
    steps:
      - checkout
      - restore_cache:
          keys:
            - pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-store-v1-
      - run:
          name: "Bounded << parameters.task >> (<< parameters.seconds >>s)"
          # A single wall-clock deadline includes installation and all checks.
          # GNU timeout signals the process group; KILL follows TERM after 10s.
          # Expiry fails the job (124/137); there are no automatic retries.
          command: timeout --signal=TERM --kill-after=10s << parameters.seconds >>s /bin/bash .circleci/quality-check.sh << parameters.task >>
          no_output_timeout: 35m
      - save_cache:
          key: pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store

jobs:
  quality:
    executor: node
    steps:
      - bounded-check:
          task: quality
          seconds: 900

  typecheck-ratchet:
    executor: node
    environment:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - bounded-check:
          task: typecheck-ratchet
          seconds: 900

  test-workers:
    executor: node
    steps:
      - bounded-check:
          task: test-workers
          seconds: 1200

  test-other:
    executor: node-postgres
    environment:
      DPP_ISOLATED_POSTGRES: "true"
      DPP_TEST_DATABASE_URL: postgresql://dpp_ci:ci-local-only@127.0.0.1:5432/dpp_ci
    steps:
      - bounded-check:
          task: test-other
          seconds: 1800

  build:
    executor: node
    environment:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - bounded-check:
          task: build
          seconds: 1200

  extras:
    executor: node
    steps:
      - bounded-check:
          task: extras
          seconds: 900

  # AgentZ: Python suite, wheel packaging smoke, and edge/scheduler node tests.
  # Skipped (and reported green) when the diff only touches AuthiChain app roots.
  agentz:
    executor: node
    steps:
      - bounded-check:
          task: agentz
          seconds: 1500
      - store_test_results:
          path: /tmp/pytest-results

  runtime-db-attestation-postgres:
    docker:
      - image: cimg/node:22.23.3
      - image: postgres:16
        environment:
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: postgres
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Execute unchanged migration and verify actual PostgreSQL roles
          command: |
            set -euo pipefail
            test "$(git rev-parse HEAD)" = "${CIRCLE_SHA1:?missing exact SHA}"
            scope="$(node scripts/ci/ci-scope.mjs runtime-db-attestation-postgres)" || scope="full"
            if [ "$scope" = "skip" ]; then
              echo "Scoped CI fast path: runtime-db-attestation-postgres not affected by the diff"
              exit 0
            fi
            mkdir -p "$HOME/.local/bin"
            export PATH="$HOME/.local/bin:$PATH"
            corepack enable --install-directory "$HOME/.local/bin"
            corepack prepare pnpm@10.28.2 --activate
            pnpm config set store-dir ~/.pnpm-store
            pnpm install --frozen-lockfile --prefer-offline
            export PG_TEST_PASSWORD=isolated-ci-only
            for i in $(seq 1 40); do
              if node -e 'const {Client}=require("pg");const c=new Client({host:"127.0.0.1",user:"postgres",password:process.env.PG_TEST_PASSWORD,database:"postgres"});c.connect().then(()=>c.end()).catch(()=>process.exit(1))'; then break; fi
              sleep 2
            done
            timeout --signal=TERM --kill-after=10s 120s node scripts/ci/runtime-db-attestation-postgres-acceptance.mjs
            timeout --signal=TERM --kill-after=10s 120s node scripts/ci/dpp-activation-outbox-postgres-acceptance.mjs
          no_output_timeout: 20m

  authichain-quality-gate:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run:
          name: AuthiChain required jobs succeeded
          command: |
            timeout --signal=TERM --kill-after=10s 60s /bin/bash -eu -o pipefail -c 'echo "CircleCI AuthiChain quality gate completed for ${CIRCLE_SHA1:?missing pipeline revision}"'
          no_output_timeout: 2m

  agentz-quality-gate:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run:
          name: AgentZ required jobs succeeded
          command: |
            timeout --signal=TERM --kill-after=10s 60s /bin/bash -eu -o pipefail -c 'echo "CircleCI AgentZ quality gate completed for ${CIRCLE_SHA1:?missing pipeline revision}"'
          no_output_timeout: 2m

  # The branch ruleset requires this context. It now means "both product
  # gates passed"; each product gate is scoped by scripts/ci/ci-scope.mjs.
  main-quality-gate:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run:
          name: Both product gates succeeded
          command: |
            timeout --signal=TERM --kill-after=10s 60s /bin/bash -eu -o pipefail -c 'echo "CircleCI main quality gate (AuthiChain + AgentZ) completed for ${CIRCLE_SHA1:?missing pipeline revision}"'
          no_output_timeout: 2m

workflows:
  quality-gate:
    jobs:
      # Fail early before starting the other five large executors.
      - test-workers:
          filters: &quality-branches
            branches:
              ignore:
                - /dependabot\/.*/
      - quality:
          requires: [test-workers]
          filters: *quality-branches
      - typecheck-ratchet:
          requires: [test-workers]
          filters: *quality-branches
      - test-other:
          requires: [test-workers]
          filters: *quality-branches
      - build:
          requires: [test-workers]
          filters: *quality-branches
      - extras:
          requires: [test-workers]
          filters: *quality-branches
      - runtime-db-attestation-postgres:
          requires: [test-workers]
          filters: *quality-branches
      # AgentZ does not wait on AuthiChain's test-workers.
      - agentz:
          filters: *quality-branches
      - authichain-quality-gate:
          requires:
            - quality
            - typecheck-ratchet
            - test-workers
            - test-other
            - build
            - extras
            - runtime-db-attestation-postgres
          filters: *quality-branches
      - agentz-quality-gate:
          requires:
            - quality
            - agentz
          filters: *quality-branches
      - main-quality-gate:
          requires:
            - authichain-quality-gate
            - agentz-quality-gate
          filters: *quality-branches
