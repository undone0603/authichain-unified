version: 2.1

orbs:
  node: circleci/node@6.3.0

jobs:
  verify:
    docker:
      - image: cimg/node:22.14
    resource_class: medium
    steps:
      - checkout

      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-v1-

      - run:
          name: Enable Corepack and install dependencies
          command: |
            corepack enable
            corepack prepare pnpm@10.28.2 --activate
            pnpm --version
            pnpm install --frozen-lockfile

      - save_cache:
          key: pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store

      - run:
          name: Typecheck and lint
          command: |
            pnpm run check
            pnpm run lint:ci

      - run:
          name: Unit and integration tests
          command: pnpm run test

      - run:
          name: Contract tests
          command: pnpm run test:contracts

      - run:
          name: Repository verification
          command: pnpm run verify

      - run:
          name: Production build
          command: pnpm run build

      - run:
          name: Write release evidence
          command: |
            mkdir -p artifacts
            {
              echo "CircleCI independent verification"
              echo "commit: ${CIRCLE_SHA1}"
              echo "branch: ${CIRCLE_BRANCH}"
              echo "build: PASS"
              echo "tests: PASS"
              echo "contracts: PASS"
              echo "verification: PASS"
              echo "production deployment: NOT PERFORMED"
              echo "economic actions: NOT PERFORMED"
            } > artifacts/release-evidence.txt

      - store_artifacts:
          path: artifacts
          destination: release-evidence

workflows:
  independent-release-verification:
    jobs:
      - verify
