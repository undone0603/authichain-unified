version: 2.1

jobs:
  deploy-authichain-com:
    docker:
      - image: cimg/node:22.15
    environment:
      COMPONENT_NAME: "<< pipeline.deploy.component_name >>"
      ENVIRONMENT_NAME: "<< pipeline.deploy.environment_name >>"
      TARGET_VERSION: "<< pipeline.deploy.target_version >>"
    steps:
      - checkout
      - run:
          name: Plan deployment
          command: |
            set -euo pipefail
            component="${COMPONENT_NAME:-authichain-com}"
            environment="${ENVIRONMENT_NAME:-production}"
            if [ "$component" != "authichain-com" ] || [ "$environment" != "production" ]; then
              echo "Refusing ${component} / ${environment}. First release is authichain-com in production."
              exit 1
            fi
            circleci run release plan authichain-com-production \
              --environment-name="${environment}" \
              --component-name="${component}" \
              --target-version="${TARGET_VERSION}"
      - run:
          name: Check out the selected version
          command: |
            set -euo pipefail
            if [ -z "${TARGET_VERSION}" ]; then
              echo "TARGET_VERSION is empty. Choose the git commit to deploy."
              exit 1
            fi
            git fetch --force origin "${TARGET_VERSION}"
            git checkout --detach FETCH_HEAD
      - run:
          name: Deploy authichain-com
          command: bash scripts/circleci/deploy-authichain-com.sh
      - run:
          name: Update deployment status to running
          command: circleci run release update authichain-com-production --status=RUNNING
      - run:
          name: Update deployment status to failed
          command: circleci run release update authichain-com-production --status=FAILED
          when: on_fail

  release-authichain-com:
    type: release
    plan_name: authichain-com-production
    validation:
      enabled: true
      # Off until a monitor tags component_name=authichain-com and env=production.
      auto_rollback_on_failure: false

  cancel-deploy-authichain-com:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Update planned release to CANCELED
          command: |
            circleci run release update authichain-com-production \
              --status=CANCELED

workflows:
  deploy:
    jobs:
      - deploy-authichain-com
      - release-authichain-com:
          requires:
            - deploy-authichain-com
      - cancel-deploy-authichain-com:
          requires:
            - deploy-authichain-com:
                - canceled
