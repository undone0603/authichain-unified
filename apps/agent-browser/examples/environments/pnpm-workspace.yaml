# Scoped security overrides — Dependabot alerts across vendored agent-browser
# copies (CLI, docs site, examples/environments). Superset applied to every
# vendored pnpm project; a selector that matches nothing in a given project
# is simply inert.
overrides:
  # GHSA: @babel/core arbitrary code exec via crafted plugin config.
  '@babel/core@<=7.29.0': 7.29.6
  # GHSA: @hono/node-server header-handling bug (covers both 1.x and 2.x advisories).
  '@hono/node-server@<2.0.5': 2.0.5
  # GHSA: basic-ftp path traversal + follow-up hardening releases.
  'basic-ftp@<=5.3.0': 5.3.1
  # GHSA: body-parser DoS via crafted request body.
  'body-parser@>=2.0.0 <2.3.0': 2.3.0
  # GHSA: brace-expansion ReDoS, 1.x line.
  'brace-expansion@<1.1.16': 1.1.16
  # GHSA: brace-expansion ReDoS, 2.x line. Widened from 2.1.2 -> 2.1.3 — a
  # second, newer GHSA superseded the first fix (same staleness pattern hit
  # ws/postcss at the repo root: verify the target still holds before reuse).
  'brace-expansion@>=2.0.0 <2.1.3': 2.1.3
  # Supply-chain compromise: brace-expansion 3.0.0-5.0.7 were published as
  # part of a worm-style npm compromise (unrelated to the legitimate 1.x/2.x
  # lines) — route anything in that window to the clean 5.0.8.
  'brace-expansion@>=3.0.0 <=5.0.7': 5.0.8
  # GHSA high: rollup DOM-clobbering-adjacent bug in the plugin/build pipeline.
  'rollup@>=4.0.0 <4.59.0': 4.59.0
  # GHSA high: sharp — heap overflow processing crafted images.
  'sharp@<0.35.0': 0.35.0
  # GHSA: fast-uri ReDoS / prototype pollution, latest advisory supersedes earlier ones.
  'fast-uri@<=3.1.3': 3.1.4
  # GHSA: fast-xml-parser DOCTYPE entity-injection family, latest supersedes earlier ones.
  'fast-xml-parser@>=5.0.0 <5.7.0': 5.7.0
  # GHSA: file-type malformed-input DoS.
  'file-type@>=13.0.0 <=21.3.1': 21.3.2
  # GHSA: flatted prototype pollution.
  'flatted@<=3.4.1': 3.4.2
  # GHSA: hono — several advisories over time, latest supersedes all earlier ceilings.
  'hono@<4.12.27': 4.12.27
