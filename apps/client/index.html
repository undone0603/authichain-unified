<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>AuthiChain – Blockchain Product Authentication Platform</title>
    <meta name="description" content="Protect your brand with AI-powered blockchain authentication. NFT certificates, supply chain tracking, and anti-counterfeiting verification." />
    <meta name="keywords" content="blockchain authentication, product verification, anti-counterfeiting, NFT certificates, supply chain tracking, AI image analysis, brand protection, QR code verification, enterprise authentication, counterfeit detection" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var ep = "%VITE_ANALYTICS_ENDPOINT%";
        var id = "%VITE_ANALYTICS_WEBSITE_ID%";
        if (ep && ep.charAt(0) !== "%") {
          var s = document.createElement("script");
          s.defer = true;
          s.src = ep + "/umami";
          if (id && id.charAt(0) !== "%") s.setAttribute("data-website-id", id);
          document.head.appendChild(s);
        }
      })();
    </script>
  </body>

</html>
