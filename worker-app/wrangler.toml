name = "authichain-edge-router"
main = "index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (wrangler secret put, not committed): STRIPE_SECRET_KEY is required
# for GET /api/checkout/dpp. Optional NEXT_PUBLIC_SUPABASE_URL +
# SUPABASE_SERVICE_ROLE_KEY to record checkout_started on funnel_events.

# NOTE: services/worker-app/wrangler.toml declares the same worker name and
# KV/Hyperdrive/Durable Object bindings as this file (only the assets
# directory and alias differ). Keep the [[kv_namespaces]], [[hyperdrive]],
# [[durable_objects.bindings]] and [[migrations]] blocks below in sync with
# that file — a divergence here previously caused the RateLimiter Durable
# Object migration to use new_classes in one file and new_sqlite_classes in
# the other. scripts/check-wrangler-durable-objects.mjs (run in CI) will
# catch a `new_classes` regression in either file.

[alias]
playwright-core = "./playwright-unavailable.ts"

[assets]
directory = "../client/public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "single-page-application"
# Worker-first: the Worker is the SINGLE routing authority (Task 3.2). Every
# navigation request is routed to the Worker so route-manifest.ts/resolveOwner
# decides the owner, OVERRIDING what a naive static-asset layer would do (e.g.
# dist/site/admin.html exists but /admin must serve the SPA shell; pricing.html
# exists and /pricing must serve marketing). The negative rules let the two
# hashed/immutable static-asset dirs be served directly by the Asset Worker for
# speed - correctness for those paths does not depend on the manifest.
run_worker_first = ["/*", "!/_next/*", "!/assets/*"]

# More specific than authichain-com's authichain.com/* glob so JWKS is not
# swallowed by landing HTML. Requires AUTHICHAIN_ATTESTATION_PRIVATE_KEY_B64
# (and optional AUTHICHAIN_ATTESTATION_KEY_ID) as Worker secrets.
[[routes]]
pattern = "authichain.com/.well-known/jwks.json"
zone_name = "authichain.com"

# Never-cached launch alias. /.well-known/jwks.json is a CF HIT of landing HTML
# and the token cannot purge (401/10000).
[[routes]]
pattern = "authichain.com/protocol/jwks.json"
zone_name = "authichain.com"

[[kv_namespaces]]
binding = "SESSIONS"
id = "7c8e9466e57843199f6f768615e42a5c"  # reuse the existing SESSIONS KV from the root wrangler.toml

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "97d767ff69584161a0672cd942e9364a"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# ─── Cron Triggers ────────────────────────────────────
# ONE trigger, ten jobs. Cloudflare caps cron triggers PER ACCOUNT at five on
# the free plan, and three are already spent (qron-automation,
# authichain-autopilot, authichain-infra), so the ten GROUP A schedules below
# could never each have had their own trigger. Rather than dropping five jobs,
# the worker registers a single hourly trigger and worker-app/cron-dispatch.ts
# decides which jobs that hour is due for.
#
# This replaces the previous plan of one trigger per job. The old note here said
# scheduled() "dispatches it to the job whose `schedule` equals it" — that was
# aspirational: index.ts had no scheduled() handler at all until cron-dispatch.ts
# added one. It does now, but the handler alone schedules nothing; the trigger
# below is what would.
#
# STILL COMMENTED OUT — enabling is a deliberate production decision, not a
# side effect of merging this file. Uncommenting starts all ten GROUP A jobs on
# the next deploy, including transactional customer email (dunning-escalation,
# certificate-expiry-check).
#
# Note for whoever enables it: the prior reason for holding these back was that
# "the live Vercel deployment is ALREADY running these jobs via its own
# node-cron", so enabling would DOUBLE-FIRE against the same production
# database. That reasoning looks stale — authichain-unified.vercel.app no longer
# exists (see the APP_WORKER doc comment in
# workers/authichain-com/src/index.ts). Confirm no second runner survives
# anywhere before uncommenting; if one does, this stays off.
#
# [triggers]
# crons = ["0 * * * *"]
#
# ── GROUP A — the ten jobs the hourly dispatcher would fire ──────────────────
# Internal maintenance, read-only monitoring, and transactional notifications
# to existing customers about their OWN accounts. No autonomous outreach, no
# money movement, no on-chain writes. This list is documentation; the array that
# actually decides is CLEARED_JOBS in cron-dispatch.ts, and
# cron-dispatch.test.ts asserts the two agree with server/scheduled-jobs.ts.
# dispatched_group_a = [
#   "0 3 * * *",   # database-cleanup — deletes old job-run/notification/session rows (internal)
#   "0 5 * * *",   # customer-health-score — recomputes health scores in DB (no external calls)
#   "0 6 * * *",   # subscription-health-check — in-app expiry notices, marks past-due, resets quotas (internal)
#   "0 7 * * *",   # certificate-expiry-check — notifies cert owners of expiry (transactional)
#   "0 8 * * *",   # dunning-escalation — transactional payment-failed/past-due emails to affected customers (standard billing recovery)
#   "0 8 * * 1",   # weekly-analytics-digest — Monday internal stats report to the owner
#   "0 11 * * *",  # live-systems-check — read-only ping of Stripe/HubSpot/Gmail/PostHog/GA4 liveness
#   "0 12 * * *",  # token-metrics — read-only on-chain $QRON supply/gas snapshot
#   "0 13 * * *",  # ecosystem-health — read-only external uptime check across product domains
#   "0 */6 * * *", # fraud-detection-sweep — inserts fraud_alerts flags only (defensive; no revocation/outreach)
# ]
#
# ── GROUP B — HELD: do NOT enable without an explicit, per-job decision ──────
# Autonomous growth/outreach, external CRM writes, mission-spawning, on-chain
# writes, or money movement. Each needs a deliberate business sign-off before
# it runs autonomously on a new runtime — do NOT bulk-enable. To activate one,
# move its line into GROUP A's crons array (and confirm you actually want it
# firing autonomously).
# crons_HELD = [
#   "0 9 * * *",   # lead-nurturing — writes/syncs unsynced leads to HubSpot (external CRM writes)
#   "0 */4 * * *", # hubspot-crm-sync — syncs leads/payment events to HubSpot (external CRM writes)
#   "0 4 * * *",   # staking-rewards — inserts pending $QRON reward-ledger entries (creates financial obligations)
#   "0 9 1 * *",   # founder-payout — monthly Stripe pay-yourself-first split (MOVES REAL MONEY; 1st of month)
#   "0 * * * *",   # strainchain-metrc-sync — METRC sync + on-chain Truth-Layer anchoring (costs gas; external)
#   "*/2 * * * *", # autonomous-pipeline-tick — AgentZ revenue engine: finds leads, DRAFTS OUTREACH, monitors deals (also env-gated by ENV.autonomousPipelineEnabled; every 2 min)
#   "*/10 * * * *",# vertical-cloner — autonomously spawns industry-expansion missions
#   "*/30 * * * *",# newsjacking-monitor — monitors news and triggers PR/outreach missions (autonomous external)
# ]
