version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "all"
    ignore:
      # decode-uri-component is a transitive dependency of query-string@7.1.3,
      # which pins it to ^0.2.0. The lockfile already resolves to 0.2.2, which
      # contains the fix for GHSA-w573-4hg7-7wgq, so there is no outstanding
      # vulnerability. Dependabot's proposed bump to 0.5.0 cannot be applied
      # because it violates query-string's version range and pnpm fails to
      # produce a valid lockfile. Revisit once query-string (or the packages
      # that depend on it) supports decode-uri-component >=0.5.0.
      - dependency-name: "decode-uri-component"
      # js-yaml 3.x is a transitive dependency of read-yaml-file@1.1.0 ->
      # @manypkg/get-packages@1 -> turbo (build tooling only, never shipped).
      # The fix requires js-yaml >=4.3.2, but read-yaml-file@1 pins ^3.x and
      # its API (safeLoad) is incompatible with js-yaml 4, so Dependabot
      # cannot produce a valid lockfile (security_update_not_possible).
      # Revisit when turbo bumps @manypkg/get-packages to a js-yaml 4 line.
      - dependency-name: "js-yaml"
        versions: ["3.x"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
