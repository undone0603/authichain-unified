# Dependabot config
# Note: pnpm cannot update transitive dependencies. Packages pinned only via
# pnpm.overrides in package.json must be maintained manually — Dependabot
# would fail with "tool_feature_not_supported" for them.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # These packages are pinned via pnpm.overrides (transitive-only).
      # Bump them manually in package.json "overrides" block instead.
      - dependency-name: "hono"
      - dependency-name: "dompurify"
      - dependency-name: "fast-xml-parser"
      - dependency-name: "socket.io-parser"
      - dependency-name: "h3"
      - dependency-name: "undici"
      - dependency-name: "tar"
      - dependency-name: "rollup"
      - dependency-name: "qs"
      - dependency-name: "mdast-util-to-hast"
      - dependency-name: "@smithy/config-resolver"
      - dependency-name: "path-to-regexp"
      - dependency-name: "uuid"
      - dependency-name: "picomatch"
      - dependency-name: "lodash"
      - dependency-name: "lodash-es"
      - dependency-name: "srvx"
      - dependency-name: "yaml"

  - package-ecosystem: npm
    directory: "/worker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/workers/stripe-webhook"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: "/workers/authichain-telegram"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: "/workers/authichain-verify-worker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: "/workers/authichain-license-issuer"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: "/workers/authichain-scan-validate"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: "/workers/authichain-qron-provenance"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: "/workers/authichain-gateway"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
