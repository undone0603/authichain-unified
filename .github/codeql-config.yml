name: "AuthiChain CodeQL Configuration"

paths-ignore:
  # Exclude bundled files - these are compiled outputs, not source code
  # False positives from minified/bundled third-party code should not be scanned
  - api/server.js
  - "**/*.min.js"
  - "**/dist/**"
  - "**/build/**"
  - "**/.next/**"
  - "**/node_modules/**"
  # Chatbot native browser app (separate project with own dependencies)
  - "apps/chatbot/**"
  # strainchain-io index.ts contains large embedded base64 assets that crash the CodeQL TypeScript parser
  - "workers/strainchain-io/**"
  # qron-space index.ts also embeds large base64 assets that crash the CodeQL TypeScript parser
  - "workers/qron-space/**"

queries:
  - uses: security-extended
  - uses: security-and-quality
