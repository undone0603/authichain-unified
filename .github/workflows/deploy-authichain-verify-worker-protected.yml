name: Deploy authichain-verify-worker (protected)

# Intentionally manual-only. The legacy deploy-workers.yml workflow is
# disabled and must not be re-enabled as a shortcut around release controls.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact current protected main SHA with all required checks green"
        required: true
        type: string

permissions:
  contents: read
  statuses: read
  actions: read
  deployments: write

concurrency:
  group: deploy-authichain-verify-worker-protected
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Pin exact main SHA
        id: pin
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$EXPECTED_SHA" = "$DISPATCH_SHA"
          echo "sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pin.outputs.sha }}
          persist-credentials: false
          clean: true
      - name: Restore full checkout and confirm exact commit
        env:
          EXPECTED_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          git sparse-checkout disable || true
          git reset --hard HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f workers/authichain-verify-worker/wrangler.toml
      - name: Fail closed on main protection, environment policy, and CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const repo=process.env.REPO,sha=process.env.EXPECTED_SHA;
          const headers={authorization:'Bearer '+process.env.GH_TOKEN,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28'};
          async function get(path) {
            const r=await fetch('https://api.github.com/repos/'+repo+path,{headers});
            if(!r.ok) throw new Error('Required GitHub policy unavailable: '+path+' HTTP '+r.status);
            return r.json();
          }
          const branch=await get('/branches/main');
          if(branch.commit?.sha!==sha || branch.protected!==true) throw new Error('Protected main SHA mismatch');
          const env=await get('/environments/production-cloudflare');
          if(env.deployment_branch_policy?.protected_branches!==true ||
             env.deployment_branch_policy?.custom_branch_policies!==false ||
             env.can_admins_bypass!==false)
            throw new Error('Environment must allow protected branches only and prohibit administrator bypass');
          // Enforced approval rules remain effective; never bypass them.
          const statuses=await get('/commits/'+sha+'/status');
          const required=['ci/circleci: test-workers','ci/circleci: test-other',
            'ci/circleci: build','ci/circleci: extras','ci/circleci: quality',
            'ci/circleci: typecheck-ratchet','ci/circleci: main-quality-gate'];
          for(const name of required) {
            const status=statuses.statuses?.find(s=>s.context===name);
            if(status?.state!=='success') throw new Error('Missing or failing exact-SHA check: '+name);
          }
          console.log('Exact protected-main, environment branch policy, and seven CI statuses verified');
          NODE

  deploy:
    name: Deploy one verified Worker
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 30
    environment:
      name: production-cloudflare
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
          clean: true
      - name: Verify exact checked-out commit
        env:
          EXPECTED_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          git sparse-checkout disable || true
          git reset --hard HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify deployment secrets are present
        env:
          CF_TOKEN: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN"
          test -n "$CF_ACCOUNT"
      - name: Deploy only authichain-verify-worker
        working-directory: workers/authichain-verify-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.149.0 deploy --minify --keep-vars --config wrangler.toml
