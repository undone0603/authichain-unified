name: Deploy authichain-verify-worker (protected)

# Intentionally manual-only. The legacy deploy-workers.yml workflow is
# disabled and must not be re-enabled as a shortcut around release controls.
# The verify Worker uses an isolated protected environment and account-owned
# Specified Workers / Editor identity, not authichain-com's user token.
# The release is intentionally blocked until independent policy evidence is
# committed separately on protected main and matched to the stored token ID.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact current protected main SHA with all required checks green"
        required: true
        type: string

permissions:
  contents: read
  statuses: read
  actions: read
  deployments: write

concurrency:
  group: deploy-authichain-verify-worker-protected
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Pin exact main SHA
        id: pin
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$EXPECTED_SHA" = "$DISPATCH_SHA"
          echo "sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pin.outputs.sha }}
          persist-credentials: false
          clean: true
      - name: Restore full checkout and confirm exact commit
        env:
          EXPECTED_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          git sparse-checkout disable
          git reset --hard HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f workers/authichain-verify-worker/wrangler.toml
      - name: Fail closed on main protection, environment policy, and CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const repo=process.env.REPO,sha=process.env.EXPECTED_SHA;
          const headers={authorization:'Bearer '+process.env.GH_TOKEN,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28'};
          async function get(path) {
            const r=await fetch('https://api.github.com/repos/'+repo+path,{headers});
            if(!r.ok) throw new Error('Required GitHub policy unavailable: '+path+' HTTP '+r.status);
            return r.json();
          }
          const branch=await get('/branches/main');
          if(branch.commit?.sha!==sha || branch.protected!==true) throw new Error('Protected main SHA mismatch');
          const env=await get('/environments/production-cloudflare-verify-worker');
          if(env.deployment_branch_policy?.protected_branches!==true ||
             env.deployment_branch_policy?.custom_branch_policies!==false ||
             env.can_admins_bypass!==false)
            throw new Error('Environment must allow protected branches only and prohibit administrator bypass');
          // Enforced approval rules remain effective; never bypass them.
          const statuses=await get('/commits/'+sha+'/status');
          const required=['ci/circleci: test-workers','ci/circleci: test-other',
            'ci/circleci: build','ci/circleci: extras','ci/circleci: quality',
            'ci/circleci: typecheck-ratchet','ci/circleci: main-quality-gate'];
          for(const name of required) {
            const status=statuses.statuses?.find(s=>s.context===name);
            if(status?.state!=='success') throw new Error('Missing or failing exact-SHA check: '+name);
          }
          console.log('Exact protected-main, environment branch policy, and seven CI statuses verified');
          NODE

  deploy:
    name: Deploy one verified Worker
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 30
    environment:
      name: production-cloudflare-verify-worker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
          clean: true
      - name: Verify exact checked-out commit
        env:
          EXPECTED_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          git sparse-checkout disable
          git reset --hard HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          # This job may have waited for protected-environment approval.
          # Do not publish an older commit if main advanced while waiting.
          REMOTE_MAIN="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "$REMOTE_MAIN" = "$EXPECTED_SHA"
      - name: Prepare pinned Node 22 and pnpm
        run: |
          set -euo pipefail
          if [ -s "$HOME/.nvm/nvm.sh" ]; then
            . "$HOME/.nvm/nvm.sh"
            nvm use 22 >/dev/null
          fi
          command -v node
          command -v pnpm
          node --version
          test "$(node --version | cut -d. -f1)" = "v22"
          test "$(pnpm --version)" = "10.28.2"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
      - name: Install locked verify-worker dependencies
        env:
          npm_config_build_from_source: "false"
        run: pnpm install --frozen-lockfile --filter 'authichain-verify-worker...' --prefer-offline --config.minimumReleaseAge=0
      - name: Confirm Worker bundles without publishing
        working-directory: workers/authichain-verify-worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4.149.0 deploy --dry-run --minify --outdir /tmp/authichain-verify-worker-preflight --config wrangler.toml
      - name: Recheck pinned main immediately before publish
        env:
          EXPECTED_SHA: ${{ needs.verify.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          ACTUAL_SHA=$(node --input-type=module -e "const r=await fetch('https://api.github.com/repos/' + process.env.REPO + '/branches/main',{headers:{authorization:'Bearer ' + process.env.GH_TOKEN,accept:'application/vnd.github+json'}});if(!r.ok)process.exit(1);const d=await r.json();console.log(d.commit.sha)")
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - name: Confirm isolated account token and independently reviewed scope
        env:
          CF_TOKEN: ${{ secrets.AUTHICHAIN_VERIFY_WORKER_CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.AUTHICHAIN_VERIFY_WORKER_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const account = process.env.CF_ACCOUNT;
          const token = process.env.CF_TOKEN;
          const expectedAccount = '4c1869b90f13f86940aa3747839bf420';
          const target = 'authichain-verify-worker';
          if (!token || account !== expectedAccount) throw new Error('Dedicated token/account missing or mismatched');
          async function probe(path) {
            const response = await fetch('https://api.cloudflare.com/client/v4' + path, {
              method: 'GET',
              headers: { authorization: 'Bearer ' + token, accept: 'application/json' },
              redirect: 'error', signal: AbortSignal.timeout(15000),
            });
            const data = await response.json().catch(() => null);
            return { ok: response.status === 200 && data?.success === true, result: data?.result };
          }
          // Do not accept user tokens: this release is strictly account-owned.
          const verified = await probe('/accounts/' + account + '/tokens/verify');
          if (!verified.ok || verified.result?.status !== 'active' ||
              !/^[0-9a-f]{32}$/i.test(verified.result?.id ?? '')) {
            throw new Error('Dedicated account-owned token not proven active');
          }
          const worker = await probe('/accounts/' + account + '/workers/scripts/' + target + '/deployments');
          if (!worker.ok) throw new Error('Dedicated token cannot read the intended Worker');
          // This file does not exist until a separate protected PR records a
          // recent, independently examined Cloudflare account-token policy.
          const path = '.github/credential-policies/authichain-verify-worker.json';
          let evidence;
          try { evidence = JSON.parse(readFileSync(path, 'utf8')); }
          catch { throw new Error('Independent account-token policy evidence absent or unreadable; deployment held'); }
          const digest = createHash('sha256').update(verified.result.id).digest('hex');
          const observedAt = Date.parse(evidence?.observed_at);
          const age = Date.now() - observedAt;
          if (evidence?.schema_version !== 1 ||
              evidence?.token_id_sha256 !== digest ||
              evidence?.account_id !== account ||
              evidence?.worker !== target ||
              evidence?.token_kind !== 'account-owned' ||
              evidence?.scope !== 'Specified Workers' ||
              evidence?.role !== 'Editor' ||
              evidence?.policy_source !== 'independent-cloudflare-account-token-detail' ||
              !Array.isArray(evidence?.additional_permissions) ||
              evidence.additional_permissions.length !== 0 ||
              !Number.isFinite(age) || age < 0 || age > 30 * 24 * 60 * 60 * 1000) {
            throw new Error('Token ID/policy evidence mismatch, overbroad permissions, or stale attestation; deployment held');
          }
          console.log('Dedicated active account-owned credential and recent reviewed Worker-only policy matched (no secrets emitted)');
          NODE
      - name: Verify deployment secrets are present
        env:
          CF_TOKEN: ${{ secrets.AUTHICHAIN_VERIFY_WORKER_CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.AUTHICHAIN_VERIFY_WORKER_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN"
          test -n "$CF_ACCOUNT"
      - name: Deploy only authichain-verify-worker
        working-directory: workers/authichain-verify-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AUTHICHAIN_VERIFY_WORKER_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.AUTHICHAIN_VERIFY_WORKER_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.149.0 deploy --minify --keep-vars --config wrangler.toml
