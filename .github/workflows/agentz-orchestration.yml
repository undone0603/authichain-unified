name: AgentZ — Autonomous Sales & Lead Orchestration

on:
  schedule:
    - cron: '0 8 * * *'   # Daily 8 AM UTC (after gov-engine at 6 AM)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — no DB writes or outreach'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: agentz-orchestration
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.28.2'

jobs:
  # ── Phase 1: Qualify inbound leads ──────────────────────────────────────────
  qualify-leads:
    name: Qualify Leads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: Qualify leads with AI scoring
        run: pnpm exec tsx scripts/qualify-leads.ts
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          HUBSPOT_TOKEN:        ${{ secrets.HUBSPOT_TOKEN }}
          DRY_RUN:              ${{ inputs.dry_run || 'false' }}

  # ── Phase 2: Sync MI cannabis leads to HubSpot ──────────────────────────────
  sync-mi-leads:
    name: Sync Michigan Leads → HubSpot
    runs-on: ubuntu-latest
    needs: qualify-leads
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: Sync MI leads to HubSpot CRM
        run: pnpm exec tsx scripts/sync-mi-leads-hubspot.ts
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HUBSPOT_TOKEN:        ${{ secrets.HUBSPOT_TOKEN }}
          AIRTABLE_API_KEY:     ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID:     ${{ secrets.AIRTABLE_BASE_ID }}
          DRY_RUN:              ${{ inputs.dry_run || 'false' }}

  # ── Phase 3: Funnel health report ───────────────────────────────────────────
  funnel-report:
    name: Funnel Report
    runs-on: ubuntu-latest
    needs: sync-mi-leads
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: Generate funnel performance report
        run: pnpm exec tsx scripts/funnel-report.ts
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HUBSPOT_TOKEN:        ${{ secrets.HUBSPOT_TOKEN }}
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          DRY_RUN:              ${{ inputs.dry_run || 'false' }}

  # ── Phase 4: Notify AgentZ webhook ──────────────────────────────────────────
  notify-webhook:
    name: Notify AgentZ Webhook
    runs-on: ubuntu-latest
    needs: [qualify-leads, sync-mi-leads, funnel-report]
    if: always()
    steps:
      - name: Post orchestration summary to webhook
        run: |
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "x-agentz-secret: ${{ secrets.AGENTZ_WEBHOOK_SECRET }}" \
            "${{ secrets.VERCEL_APP_URL }}/api/agentz/webhook" \
            -d '{
              "event": "automation.complete",
              "payload": {
                "workflow": "agentz-orchestration",
                "run_id": "${{ github.run_id }}",
                "timestamp": "${{ github.event.head_commit.timestamp || github.run_attempt }}"
              }
            }' || echo "Webhook notify failed (non-blocking)"
