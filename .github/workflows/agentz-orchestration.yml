name: AgentZ — Autonomous Sales & Lead Orchestration

on:
  schedule:
    - cron: '0 8 * * *'   # Daily 8 AM UTC (after gov-engine at 6 AM)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — no DB writes or outreach'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: agentz-orchestration
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.28.2'
  APP_URL: ${{ vars.APP_URL || 'https://authichain.com' }}

jobs:
  # ── Phase 1: Qualify inbound leads ──────────────────────────────────────────
  qualify-leads:
    name: Qualify Leads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: Qualify leads with AI scoring
        continue-on-error: true
        run: pnpm exec tsx scripts/qualify-leads.ts
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACE_API_KEY:  ${{ secrets.HUGGINGFACE_API_KEY }}
          LOCAL_MODEL_URL:      ${{ secrets.LOCAL_MODEL_URL }}
          HUBSPOT_TOKEN:        ${{ secrets.HUBSPOT_TOKEN || secrets.HUBSPOT_ACCESS_TOKEN }}
          DRY_RUN:              ${{ inputs.dry_run || 'false' }}

  # ── Phase 2: Sync MI cannabis leads to HubSpot ──────────────────────────────
  sync-mi-leads:
    name: Sync Michigan Leads → HubSpot
    runs-on: ubuntu-latest
    needs: qualify-leads
    # Non-critical: qualify-leads uses continue-on-error so this always runs
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: Sync MI leads to HubSpot CRM
        continue-on-error: true
        run: pnpm exec tsx scripts/sync-mi-leads-hubspot.ts
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HUBSPOT_TOKEN:        ${{ secrets.HUBSPOT_TOKEN || secrets.HUBSPOT_ACCESS_TOKEN }}
          HUBSPOT_SERVICE_KEY:  ${{ secrets.HUBSPOT_SERVICE_KEY || secrets.HUBSPOT_TOKEN || secrets.HUBSPOT_ACCESS_TOKEN }}
          AIRTABLE_API_KEY:     ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID:     ${{ secrets.AIRTABLE_BASE_ID }}
          DRY_RUN:              ${{ inputs.dry_run || 'false' }}

  # ── Phase 3: Funnel health report ───────────────────────────────────────────
  funnel-report:
    name: Funnel Report
    runs-on: ubuntu-latest
    needs: sync-mi-leads
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: Generate funnel performance report
        continue-on-error: true
        run: pnpm exec tsx scripts/funnel-report.ts
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HUBSPOT_TOKEN:        ${{ secrets.HUBSPOT_TOKEN || secrets.HUBSPOT_ACCESS_TOKEN }}
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          DRY_RUN:              ${{ inputs.dry_run || 'false' }}

  # ── Phase 4: Notify AgentZ webhook ──────────────────────────────────────────
  notify-webhook:
    name: Notify AgentZ Webhook
    runs-on: ubuntu-latest
    needs: [qualify-leads, sync-mi-leads, funnel-report]
    if: always()
    steps:
      - name: Post orchestration summary to webhook
        env:
          AGENTZ_WEBHOOK_SECRET: ${{ secrets.AGENTZ_WEBHOOK_SECRET }}
          APP_URL: ${{ vars.APP_URL || secrets.VERCEL_APP_URL || 'https://authichain.com' }}
        run: |
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -H "x-agentz-secret: ${AGENTZ_WEBHOOK_SECRET}" \
            "${APP_URL}/api/agentz/webhook" \
            -d "{
              \"event\": \"automation.complete\",
              \"payload\": {
                \"workflow\": \"agentz-orchestration\",
                \"run_id\": \"${{ github.run_id }}\",
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }
            }" || echo "::warning::Webhook notify failed (non-blocking)"
