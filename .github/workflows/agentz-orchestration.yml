name: AgentZ — Autonomous Sales & Lead Orchestration

# Outbound AgentZ orchestration (2026-09-19).
# Calls live claw + AgentZ. Does not invent OPENCLAW_GATEWAY_URL.
# Does not thaw content-publish or genesis cold send.
# Architect via claw is dry-run only. Qualify/HubSpot stay dry-run on
# schedule; live DB/CRM only when dispatch unchecks dry_run.
#
# Public hosts (not secrets):
#   CLAW_URL=https://claw.authichain.com
#   AGENTZ_API_URL=https://agentz.authichain.com

on:
  schedule:
    - cron: "0 8 * * *" # Daily 8 AM UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — no DB writes, no HubSpot sync. AgentZ architect stays dry-run either way."
        required: false
        default: true
        type: boolean
      ping_agentz:
        description: "GET claw + AgentZ /health and (if a bearer secret exists) POST claw /architect/cycle dry-run"
        required: false
        default: true
        type: boolean

concurrency:
  group: agentz-orchestration
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.28.2"
  CLAW_URL: https://claw.authichain.com
  AGENTZ_API_URL: https://agentz.authichain.com

jobs:
  resolve-mode:
    name: Resolve dry-run / ping
    runs-on: ubuntu-latest
    outputs:
      dry_run: ${{ steps.mode.outputs.dry_run }}
      ping_agentz: ${{ steps.mode.outputs.ping_agentz }}
    steps:
      - id: mode
        shell: bash
        run: |
          set -euo pipefail
          # Schedule is always dry-run. OWNER_LIVE_SEND gates email-proposals /
          # b2b-outreach only — it must not flip AgentZ to auto or HubSpot live.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "ping_agentz=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled run → dry-run (qualify/HubSpot skipped writes; claw/AgentZ health + architect dry-run)"
            exit 0
          fi
          dry="${{ inputs.dry_run }}"
          ping="${{ inputs.ping_agentz }}"
          if [ "$dry" = "false" ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch → live qualify/HubSpot (AgentZ architect still dry-run)"
          else
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "Resolved dry_run=true"
          fi
          if [ "$ping" = "false" ]; then
            echo "ping_agentz=false" >> "$GITHUB_OUTPUT"
          else
            echo "ping_agentz=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Phase 0: Live claw + AgentZ (health; architect dry-run if keyed) ────────
  ping-claw-agentz:
    name: Ping claw + AgentZ
    runs-on: ubuntu-latest
    needs: resolve-mode
    if: needs.resolve-mode.outputs.ping_agentz == 'true'
    outputs:
      status: ${{ job.status }}
    env:
      CLAW_URL: ${{ env.CLAW_URL }}
      AGENTZ_API_URL: ${{ env.AGENTZ_API_URL }}
      OPENCLAW_API_KEY: ${{ secrets.OPENCLAW_API_KEY }}
      AGENTZ_API_KEY: ${{ secrets.AGENTZ_API_KEY }}
      AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Health + optional architect dry-run
        run: |
          set -euo pipefail
          if [ -n "${OPENCLAW_GATEWAY_URL:-}" ]; then
            echo "::warning::OPENCLAW_GATEWAY_URL is set in this job env — this workflow must not invent or require it. Unset for the ping."
            unset OPENCLAW_GATEWAY_URL
          fi
          chmod +x scripts/ops/ping_claw_agentz.py
          if [ -n "${OPENCLAW_API_KEY:-}${AGENTZ_API_KEY:-}${AGENT_SECRET:-}" ]; then
            echo "bearer secret present — health + claw /architect/cycle dry-run"
            python3 scripts/ops/ping_claw_agentz.py --architect --mode dry-run
          else
            echo "::notice::No OPENCLAW_API_KEY / AGENTZ_API_KEY / AGENT_SECRET in Actions — health only. Architect dry-run skipped."
            python3 scripts/ops/ping_claw_agentz.py --health-only
          fi

  preflight:
    name: Verify live-operation prerequisites
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN || secrets.HUBSPOT_ACCESS_TOKEN }}
      AGENTZ_WEBHOOK_SECRET: ${{ secrets.AGENTZ_WEBHOOK_SECRET }}
      APP_URL: ${{ vars.APP_URL || 'https://authichain.com' }}
    steps:
      - id: check
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for required in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY HUBSPOT_TOKEN AGENTZ_WEBHOOK_SECRET; do
            if [ -z "${!required}" ]; then
              missing+=("$required")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::AgentZ skipped because required secrets are missing: ${missing[*]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

  # ── Phase 1: Qualify inbound leads ──────────────────────────────────────────
  qualify-leads:
    name: Qualify Leads
    runs-on: ubuntu-latest
    needs: [preflight, resolve-mode]
    if: needs.preflight.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0
      - name: Qualify leads with AI scoring
        run: pnpm exec tsx scripts/qualify-leads.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          # Reaches the founder's local model only when the tunnel URL secret
          # points somewhere routable from CI; otherwise disabled in one fast
          # connection error by the cascade's circuit breaker.
          LOCAL_MODEL_URL: ${{ secrets.LOCAL_MODEL_URL }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN || secrets.HUBSPOT_ACCESS_TOKEN }}
          DRY_RUN: ${{ needs.resolve-mode.outputs.dry_run }}

  # ── Phase 2: Sync MI cannabis leads to HubSpot ──────────────────────────────
  sync-mi-leads:
    name: Sync Michigan Leads → HubSpot
    runs-on: ubuntu-latest
    needs: [qualify-leads, resolve-mode]
    # sync-mi-leads-hubspot.ts does not honor DRY_RUN — skip on dry-run.
    if: needs.resolve-mode.outputs.dry_run != 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0
      - name: Sync MI leads to HubSpot CRM
        run: pnpm exec tsx scripts/sync-mi-leads-hubspot.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN || secrets.HUBSPOT_ACCESS_TOKEN }}
          # sync-mi-leads-hubspot.ts reads HUBSPOT_SERVICE_KEY; without it the
          # sync "succeeds" as a silent no-op. HUBSPOT_ACCESS_TOKEN is the only
          # HubSpot secret that actually exists in this repo.
          HUBSPOT_SERVICE_KEY: ${{ secrets.HUBSPOT_SERVICE_KEY || secrets.HUBSPOT_TOKEN || secrets.HUBSPOT_ACCESS_TOKEN }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          DRY_RUN: ${{ needs.resolve-mode.outputs.dry_run }}

  # ── Phase 3: Funnel health report ───────────────────────────────────────────
  funnel-report:
    name: Funnel Report
    runs-on: ubuntu-latest
    needs: [qualify-leads, resolve-mode]
    if: always() && needs.qualify-leads.result != 'cancelled'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0
      - name: Generate funnel performance report
        run: pnpm exec tsx scripts/funnel-report.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN || secrets.HUBSPOT_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_API_KEY2: ${{ secrets.RESEND_API_KEY2 }}
          DRY_RUN: ${{ needs.resolve-mode.outputs.dry_run }}

  # ── Phase 4: Notify AgentZ webhook ──────────────────────────────────────────
  notify-webhook:
    name: Notify AgentZ Webhook
    runs-on: ubuntu-latest
    needs:
      [
        resolve-mode,
        ping-claw-agentz,
        preflight,
        qualify-leads,
        sync-mi-leads,
        funnel-report,
      ]
    if: always()
    steps:
      - name: Post orchestration summary to webhook
        env:
          PING_STATUS: ${{ needs.ping-claw-agentz.result }}
          PREFLIGHT_STATUS: ${{ needs.preflight.result }}
          QUALIFY_LEADS_STATUS: ${{ needs.qualify-leads.result }}
          SYNC_MI_LEADS_STATUS: ${{ needs.sync-mi-leads.result }}
          FUNNEL_REPORT_STATUS: ${{ needs.funnel-report.result }}
          DRY_RUN: ${{ needs.resolve-mode.outputs.dry_run }}
          AGENTZ_WEBHOOK_SECRET: ${{ secrets.AGENTZ_WEBHOOK_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://authichain.com' }}
        run: |
          set -euo pipefail
          status="success"
          # skipped HubSpot on dry-run is expected, not a failure
          for stage in "$PING_STATUS" "$PREFLIGHT_STATUS" "$QUALIFY_LEADS_STATUS" "$FUNNEL_REPORT_STATUS"; do
            if [ "$stage" != "success" ] && [ "$stage" != "skipped" ]; then
              status="failure"
              break
            fi
          done
          if [ "$DRY_RUN" != "true" ] && [ "$SYNC_MI_LEADS_STATUS" != "success" ] && [ "$SYNC_MI_LEADS_STATUS" != "skipped" ]; then
            status="failure"
          fi

          curl --fail-with-body --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            -H "x-agentz-secret: $AGENTZ_WEBHOOK_SECRET" \
            "$APP_URL/api/agentz/webhook" \
            -d "{\"event\":\"automation.complete\",\"payload\":{\"workflow\":\"agentz-orchestration\",\"run_id\":\"${{ github.run_id }}\",\"status\":\"$status\",\"dry_run\":\"$DRY_RUN\",\"claw_url\":\"${CLAW_URL}\",\"agentz_url\":\"${AGENTZ_API_URL}\",\"stages\":{\"ping_claw_agentz\":\"$PING_STATUS\",\"preflight\":\"$PREFLIGHT_STATUS\",\"qualify_leads\":\"$QUALIFY_LEADS_STATUS\",\"sync_mi_leads\":\"$SYNC_MI_LEADS_STATUS\",\"funnel_report\":\"$FUNNEL_REPORT_STATUS\"}}}"

          if [ "$status" != "success" ]; then
            echo "::error::AgentZ reported a failed or skipped stage. See the orchestration summary above."
            exit 1
          fi
