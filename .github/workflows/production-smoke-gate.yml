name: Production smoke gate

# Money + verification path. Read-only. HEAD on checkout 303s so CI
# never creates a Stripe session. GET /api/checkout is JSON health (200).
on:
  push:
    branches: [main]
  schedule:
    - cron: "35 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: authichain.com money + verify path
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "10.28.2"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0
      - name: Run smoke gate
        env:
          AUTHICHAIN_ORIGIN: https://authichain.com
        run: pnpm exec tsx scripts/production-smoke-gate.ts --run
