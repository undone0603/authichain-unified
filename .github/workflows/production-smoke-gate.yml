name: Production smoke gate

# Money + verification path. Read-only GETs. Not a substitute for pnpm check —
# this is the live commercial loop after required CI on main.
on:
  push:
    branches: [main]
  schedule:
    - cron: "35 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: authichain.com money + verify path
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: "10.28.2"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0
      - name: Run smoke gate
        env:
          AUTHICHAIN_ORIGIN: https://authichain.com
        run: pnpm exec tsx scripts/production-smoke-gate.ts --run
