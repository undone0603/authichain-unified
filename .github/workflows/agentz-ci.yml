name: AgentZ Autonomous CI
# Push runs only on main. pull_request already covers every PR head, and
# push on every branch doubled the self-hosted runner load (two runs per
# PR push, both failing on the missing `python` alias).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-and-heal:
    runs-on: ${{ vars.AUTHICHAIN_CI_SELF_HOSTED == 'true' && fromJSON('["self-hosted","Linux","ARM64","authichain-ops"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Restore full tree after sparse checkout
        if: runner.environment == 'self-hosted'
        run: |
          git sparse-checkout disable
          git reset --hard HEAD
          test -f package.json

      # The self-hosted ARM64 runner has python3 but no `python` alias (run
      # 40835361953, exit 127). No setup-python download: registry access
      # from that runner is unreliable (see #2165).
      - name: Compile AgentZ Python sources
        run: python3 -m compileall -q agentz

      # agentz/tests is a pytest suite with runtime dependencies. It already
      # runs in CI / Drizzle + Pytest Extras (ci.yml) against the cached
      # requirements-agentz.txt venv, so it is not repeated here.

      - name: Confirm the web-client stub is not sold as an ABI
        run: |
          # apps/web-client.ts is an unused stub. Nothing imports AuthTokenABI.
          # Failing on the word "Placeholder" only triggered agentz/healing/auto-fix.js,
          # which then died on a missing @modelcontextprotocol/sdk install and, when
          # it ran, wrote { status: "secure" } and opened a pull request. That object
          # is not an ABI. Do not treat this file as a contract.
          test -f apps/web-client.ts
          if grep -q 'status: "secure"' apps/web-client.ts; then
            echo "web-client.ts must not claim a secure ABI that is not wired"
            exit 1
          fi
          echo "web-client.ts is a stub. No contract ABI is wired."
