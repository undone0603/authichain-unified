name: AgentZ Autonomous CI
on: [push, pull_request]

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-and-heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Run Integration Tests
        run: |
          echo "Executing full-stack integration tests..."
          if grep -q "Placeholder" apps/web-client.ts; then
            echo "❌ Error: Missing ABI definitions in web-client.ts"
            exit 1
          else
            echo "✅ ABI is secure."
          fi
          
      - name: Trigger AgentZ Self-Healing
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node agentz/healing/auto-fix.js
