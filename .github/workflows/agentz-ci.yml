name: AgentZ Autonomous CI

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      allow_healing:
        description: "Allow AgentZ to attempt autonomous repair"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  checks: write
  actions: read

concurrency:
  group: agentz-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.9.0"
  PNPM_VERSION: "10.28.2"
  CI: "true"

jobs:
  baseline:
    name: Baseline Verification
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Verify toolchain
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repository status
        run: |
          git status --short --branch
          git log -1 --oneline

      - name: Focused Slice 1 tests
        run: |
          pnpm exec vitest run \
            worker-app/attestation-failure-causes.test.ts \
            worker-app/attestation-registry.test.ts \
            packages/verifier/src/index.test.ts \
            --reporter=verbose

      - name: Full test suite
        run: pnpm test

      - name: Typecheck
        run: |
          if pnpm run | grep -q "typecheck"; then
            pnpm run typecheck
          else
            echo "No root typecheck script; running repository verification."
            pnpm verify
          fi

      - name: Hardhat contracts
        run: pnpm test:contracts

      - name: Check generated artifacts
        run: |
          if git status --short | grep -E \
            '(^|/)(artifacts|cache|coverage|dist|\.next)/'; then
            echo "::error::Generated artifacts changed the working tree."
            git status --short
            exit 1
          fi

      - name: Final repository status
        if: always()
        run: git status --short --branch

  agentz-heal:
    name: AgentZ Diagnosis
    needs: baseline
    if: |
      always() &&
      needs.baseline.result == 'failure' &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.allow_healing == true
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout failing revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture failure context
        run: |
          mkdir -p .agentz/run

          {
            echo "=== AGENTZ CI FAILURE ==="
            echo "Repository: $GITHUB_REPOSITORY"
            echo "SHA: $GITHUB_SHA"
            echo "REF: $GITHUB_REF"
            echo "RUN: $GITHUB_RUN_ID"
            echo "EVENT: $GITHUB_EVENT_NAME"
            echo
            echo "=== STATUS ==="
            git status --short --branch
            echo
            echo "=== COMMIT ==="
            git log -1 --oneline
          } | tee .agentz/run/context.txt

      - name: AgentZ preflight
        run: |
          if [ -f agentz/healing/preflight.js ]; then
            node agentz/healing/preflight.js
          else
            echo "No AgentZ preflight implementation."
          fi

      - name: Diagnose failure
        run: |
          if [ ! -f agentz/healing/auto-fix.js ]; then
            echo "::error::AgentZ healing entrypoint does not exist."
            exit 1
          fi

          echo "::warning::AgentZ diagnosis requested."
          echo "Failure context:"
          cat .agentz/run/context.txt

          # IMPORTANT:
          # Do not invoke the legacy auto-fix.js blindly yet.
          # It currently contains a hard-coded ABI repair and auto-merge path.
          #
          # Replace this gate with the new trust-aware AgentZ repair runner
          # once it accepts CI failure context and produces a validated patch.
          exit 1

      - name: Inspect AgentZ changes
        if: always()
        run: |
          git status --short
          git diff --stat
          git diff --check

  verify-repair:
    name: Verify AgentZ Repair
    needs: agentz-heal
    if: needs.agentz-heal.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused Slice 1 verification
        run: |
          pnpm exec vitest run \
            worker-app/attestation-failure-causes.test.ts \
            worker-app/attestation-registry.test.ts \
            packages/verifier/src/index.test.ts \
            --reporter=verbose

      - name: Full regression
        run: pnpm test

      - name: Typecheck
        run: |
          if pnpm run | grep -q "typecheck"; then
            pnpm run typecheck
          else
            pnpm verify
          fi

      - name: Hardhat contracts
        run: pnpm test:contracts

      - name: Repository integrity
        run: |
          git diff --check

          if git status --short | grep -E \
            '(^|/)(artifacts|cache|coverage|dist|\.next)/'; then
            echo "::error::Generated artifacts detected."
            git status --short
            exit 1
          fi

      - name: Verified repair summary
        run: |
          {
            echo "## AgentZ Repair Verified"
            echo
            echo "✅ Focused Slice 1 tests"
            echo "✅ Full regression suite"
            echo "✅ Type verification"
            echo "✅ Hardhat contracts"
            echo "✅ Generated-artifact check"
            echo
            echo "Production deployment was NOT performed."
          } >> "$GITHUB_STEP_SUMMARY"
