name: AgentZ Autonomous CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify-and-heal:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","ARM64","authichain-ops"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7

      # Self-hosted ARM64 runner does not provide the `python` command by
      # default (CI run 40835361953, exit 127). Provision the interpreter
      # explicitly, as the existing AgentZ orchestration workflow does.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile AgentZ Python sources
        run: python -m compileall -q agentz

      # The suite uses pytest fixtures and imports runtime libraries. Running
      # unittest discovery without the project's dependencies produces import
      # errors instead of meaningful AgentZ test results.
      - name: Install AgentZ test dependencies
        run: python -m pip install -r requirements-agentz.txt

      - name: Run AgentZ control-plane tests
        run: python -m pytest agentz/tests

      - name: Confirm the web-client stub is not sold as an ABI
        run: |
          # apps/web-client.ts is an unused stub. Nothing imports AuthTokenABI.
          # Failing on the word "Placeholder" only triggered agentz/healing/auto-fix.js,
          # which then died on a missing @modelcontextprotocol/sdk install and, when
          # it ran, wrote { status: "secure" } and opened a pull request. That object
          # is not an ABI. Do not treat this file as a contract.
          test -f apps/web-client.ts
          if grep -q 'status: "secure"' apps/web-client.ts; then
            echo "web-client.ts must not claim a secure ABI that is not wired"
            exit 1
          fi
          echo "web-client.ts is a stub. No contract ABI is wired."
