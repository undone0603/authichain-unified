name: Bind claw AgentZ URL

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The claw API key is only ever bound to this established production origin.
  AGENTZ_API_URL: https://agentz.authichain.com

jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Install worker dependencies
        working-directory: workers/authichain-openclaw
        run: npm install

      - name: Deploy authichain-openclaw (drop plaintext AGENTZ_API_URL var)
        working-directory: workers/authichain-openclaw
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_API_TOKEN is empty"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_ACCOUNT_ID is empty"
            exit 1
          fi
          # Live Worker still has [vars] AGENTZ_API_URL from older deploys.
          # secret put then fails with Cloudflare 10053 (binding name in use).
          # Redeploy from this tree (no AGENTZ_API_URL in [vars]) so the
          # plaintext binding is gone. Existing secrets persist. Do not set
          # OPENCLAW_GATEWAY_URL here — owner-set only.
          wrangler deploy --minify
          echo "deployed authichain-openclaw without [vars] AGENTZ_API_URL"

      - name: Bind AGENTZ_API_URL + AGENTZ_API_KEY
        working-directory: workers/authichain-openclaw
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_API_TOKEN is empty"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_ACCOUNT_ID is empty"
            exit 1
          fi
          EXPECTED_AGENTZ_API_URL="https://agentz.authichain.com"
          if [ "$AGENTZ_API_URL" != "$EXPECTED_AGENTZ_API_URL" ]; then
            echo "::error::AGENTZ_API_URL must be the fixed production origin"
            exit 1
          fi
          response_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-redirs 0 --connect-timeout 10 "$AGENTZ_API_URL" || true)"
          case "$response_code" in
            3*)
              echo "::error::AGENTZ_API_URL must not redirect"
              exit 1
              ;;
          esac
          if [ -z "${AGENT_SECRET:-}" ] || [ -z "${AGENT_SECRET//[[:space:]]/}" ]; then
            echo "::error::GitHub secret AGENT_SECRET is empty. Set it in Actions secrets before dispatching; do not transfer it through workflow artifacts."
            exit 1
          fi
          printf '%s' "$AGENTZ_API_URL" | wrangler secret put AGENTZ_API_URL --name authichain-openclaw
          printf '%s' "$AGENT_SECRET" | wrangler secret put AGENTZ_API_KEY --name authichain-openclaw
          echo "bound claw to the fixed production AgentZ origin (secret values not logged)"
          echo "skipped OPENCLAW_GATEWAY_URL (owner-set only; do not invent)"
