name: Bind claw AgentZ URL

on:
  workflow_dispatch:
    inputs:
      agentz_url:
        description: "Public AgentZ base URL (https, no trailing slash)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Install worker dependencies
        working-directory: workers/authichain-openclaw
        run: npm install

      - name: Deploy authichain-openclaw (drop plaintext AGENTZ_API_URL var)
        working-directory: workers/authichain-openclaw
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_API_TOKEN is empty"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_ACCOUNT_ID is empty"
            exit 1
          fi
          # Live Worker still has [vars] AGENTZ_API_URL from older deploys.
          # secret put then fails with Cloudflare 10053 (binding name in use).
          # Redeploy from this tree (no AGENTZ_API_URL in [vars]) so the
          # plaintext binding is gone. Existing secrets persist. Do not set
          # OPENCLAW_GATEWAY_URL here — owner-set only.
          wrangler deploy --minify
          echo "deployed authichain-openclaw without [vars] AGENTZ_API_URL"

      - name: Bind AGENTZ_API_URL + AGENTZ_API_KEY
        working-directory: workers/authichain-openclaw
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXISTING: ${{ secrets.AGENT_SECRET }}
          AGENTZ_URL: ${{ github.event.inputs.agentz_url }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_API_TOKEN is empty"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_ACCOUNT_ID is empty"
            exit 1
          fi
          AGENTZ_URL="${AGENTZ_URL%/}"
          if [ -z "${AGENTZ_URL}" ]; then
            echo "::error::agentz_url input is empty"
            exit 1
          fi
          case "$AGENTZ_URL" in
            https://*) ;;
            *)
              echo "::error::agentz_url must be an https URL (got a non-https value; not logged)"
              exit 1
              ;;
          esac
          if [ -n "${EXISTING:-}" ]; then
            AGENT_SECRET="$EXISTING"
            echo "using existing GitHub secret AGENT_SECRET (value not logged)"
          else
            AGENT_SECRET=$(openssl rand -base64 32 | tr -d '\n')
            echo "minted AGENT_SECRET in-job (repo secret was empty; value not logged)"
          fi
          printf '%s' "$AGENT_SECRET" > "${{ runner.temp }}/agent_secret.value"
          printf '%s' "$AGENTZ_URL" | wrangler secret put AGENTZ_API_URL --name authichain-openclaw
          printf '%s' "$AGENT_SECRET" | wrangler secret put AGENTZ_API_KEY --name authichain-openclaw
          echo "bound claw to ${AGENTZ_URL} (secret values not logged)"
          echo "skipped OPENCLAW_GATEWAY_URL (owner-set only; do not invent)"

      - uses: actions/upload-artifact@v7
        with:
          name: agentz-agent-secret
          path: ${{ runner.temp }}/agent_secret.value
          retention-days: 1
          if-no-files-found: ignore
