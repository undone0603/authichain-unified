name: Lint

on:
  pull_request:
    branches: [main]
    # GB-26 fix 3: skip PRs that touch ONLY these paths. Kept narrow on
    # purpose: docs/** is NOT ignored because product code renders and
    # validates it (workers/authichain-com docs pages, identity validators,
    # src/lib/authentic-economy.ts). Pushes to main are never filtered.
    paths-ignore:
      - "*.md"
      - "**/CHANGELOG.md"
      - "docs/archive/**"
  push:
    branches: [main]

concurrency:
  # PM ruling Oct 24: CI-only per-workflow group, cancel stale runs so a
  # # push to main cannot pile CI up ahead of a deploy on the single
  # # self-hosted runner. Never a deploy group name.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Self-hosted ARM64 runner cannot run this tooling yet (PM ruling Oct 24).
# Flip to 'false' once the runner is verified; the skip step warns visibly.
env:
  SKIP_HARDHAT_ON_SELF_HOSTED: "true"

# Least privilege (self-hosted CI move). Jobs that need more set it per job.
permissions:
  contents: read
jobs:
  lint:
    # Same-repo jobs use the authichain-ops ARM64 runners. Fork PR stays on
    # ubuntu-24.04 so untrusted code never lands on the self-hosted machine.
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","ARM64","authichain-wsl"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Restore full tree after sparse checkout
        if: runner.environment == 'self-hosted'
        run: |
          git sparse-checkout disable
          git reset --hard HEAD
          test -f package.json

      # Self-hosted WSL cannot use pnpm/action-setup for 10.28.2. The
      # download ETIMEDOUT and the signature check then refuses to run.
      - name: Use the runner Node and pnpm
        if: runner.environment == 'self-hosted'
        run: bash scripts/ci/use-runner-pnpm.sh
      - name: Install pnpm
        timeout-minutes: 15
        if: runner.environment != 'self-hosted'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "10.28.2"

      - name: Setup Node.js
        timeout-minutes: 15
        if: runner.environment != 'self-hosted'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Syntax-check autonomy scripts
        run: |
          for f in scripts/autonomy/*.mjs; do
            node --check "$f"
          done

      - name: Install dependencies
        timeout-minutes: 15
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run lint and prettier
        run: pnpm run --dir "${GITHUB_WORKSPACE}" lint:ci

      - name: Check for structural cannot-fail patterns in workflows
        run: node scripts/check-workflow-cannot-fail.mjs

      - name: Check deploy invariants (workers_dev off, no deploy cancels)
        run: node scripts/ci/check-deploy-invariants.mjs

      - name: Check every node:test file has a CI runner
        run: node scripts/ci/check-node-test-runners.mjs

      - name: Check wrangler.toml Durable Object migrations
        run: node scripts/check-wrangler-durable-objects.mjs

      # Persistent self-hosted runner: drop deps and build outputs so state
      # never leaks into the next run. Workspace-only; never outside it.
      - name: Clean workspace (self-hosted)
        if: always()
        run: |
          set -eu
          ws="${GITHUB_WORKSPACE:?}"
          case "$ws" in /|"") echo "::error::bad GITHUB_WORKSPACE"; exit 1;; esac
          cd "$ws"
          find . -mindepth 1 -type d \( -name node_modules -o -name .venv -o -name .next -o -name .open-next -o -name .turbo -o -name dist -o -name test-results \) -prune -exec rm -rf -- {} +

  test:
    needs: lint
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","ARM64","authichain-wsl"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Restore full tree after sparse checkout
        if: runner.environment == 'self-hosted'
        run: |
          git sparse-checkout disable
          git reset --hard HEAD
          test -f package.json

      # Self-hosted WSL cannot use pnpm/action-setup for 10.28.2. The
      # download ETIMEDOUT and the signature check then refuses to run.
      - name: Use the runner Node and pnpm
        if: runner.environment == 'self-hosted'
        run: bash scripts/ci/use-runner-pnpm.sh
      - name: Install pnpm
        timeout-minutes: 15
        if: runner.environment != 'self-hosted'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "10.28.2"

      - name: Setup Node.js
        timeout-minutes: 15
        if: runner.environment != 'self-hosted'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        timeout-minutes: 15
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Check openclaw AGENT_SECRET bind skip ($0 Deploy Workers)
        run: pnpm exec vitest run scripts/__tests__/bind-openclaw-agentz-secrets.test.ts

      - name: Check sister x402 facilitator bind matches authichain-com
        run: pnpm exec vitest run scripts/__tests__/bind-x402-secrets.test.ts

      - name: Check AgentZ tunnel gh secret set ($0 bring-up)
        run: pnpm exec vitest run scripts/__tests__/resolve-agent-secret.test.ts

      - name: Check autonomy manifest, reconciler, breaker and pulse
        run: pnpm exec vitest run scripts/__tests__/autonomy.test.ts

      # Owner HOLD on #2555: the two-connection suite must not skip.
      # Self-hosted WSL has no passwordless sudo, so this is user-space
      # only. CircleCI is left unchanged to preserve credit reserve.
      - name: Install local PostgreSQL binaries
        run: bash scripts/ci/install-local-postgres.sh

      - name: Catalog grant two-connection PostgreSQL
        env:
          CATALOG_GRANT_PG_REQUIRED: "1"
        run: |
          set -euo pipefail
          test -n "${PG_BINDIR:-}"
          test -x "$PG_BINDIR/initdb"
          test -x "$PG_BINDIR/postgres"
          echo "git_head=$(git rev-parse HEAD)"
          echo "migration_sha256=$(sha256sum supabase/migrations/20261115180000_atomic_catalog_session_grants.sql)"
          echo "pg_bindir=$PG_BINDIR"
          echo "pg_version=$("$PG_BINDIR/postgres" --version)"
          pnpm exec vitest run src/lib/catalog-session-grant.concurrency.pg.test.ts --reporter=verbose

      # The root package's suites (src, server, worker-app, packages, scripts,
      # client, workers) are outside `turbo test --filter=!`, so no other job
      # runs them. node:test files are excluded by vitest.config.ts and run on
      # their workspace runners, or in the next step when they have none.
      - name: Root Vitest suite
        env:
          CATALOG_GRANT_PG_REQUIRED: "1"
          # Both self-hosted runners share one 8 GB WSL VM. Vitest's default
          # (cpus - 1 jsdom workers) starved it on 2026-11-19 and the runner
          # lost its GitHub session mid-suite. Hosted runners keep the default.
          VITEST_WORKER_ARGS: ${{ runner.environment == 'self-hosted' && '--maxWorkers=2' || '' }}
        run: |
          set -euo pipefail
          test -n "${PG_BINDIR:-}"
          test -x "$PG_BINDIR/initdb"
          # The mandatory five-case PostgreSQL suite already passed above.
          # Do not start another disposable cluster in parallel root Vitest.
          # shellcheck disable=SC2086 # empty on hosted runners, one flag otherwise
          pnpm exec vitest run $VITEST_WORKER_ARGS --exclude src/lib/catalog-session-grant.concurrency.pg.test.ts

      # node:test files that no workspace `test` script runs. Named, not
      # globbed, past scripts/ci: scripts/lib and worker-app also hold Vitest
      # suites, which node --test cannot run.
      - name: Check node:test suites with no workspace runner
        run: >-
          node --experimental-strip-types --test
          scripts/autonomy/*.test.mjs
          scripts/ci/*.test.mjs
          scripts/agent-adoption/*.test.mjs
          agentz/reqbin-rest-mcp/test/reqbin-rest.test.mjs
          scripts/alliances/a2a-card-evidence-audit.test.mjs
          scripts/alliances/peer-subject-binding-fixture.test.mjs
          scripts/growth/x402-authenticated.test.mjs
          scripts/growth/x402-base-receipt.test.mjs
          scripts/growth/x402-reconcile.test.mjs
          scripts/__tests__/verify-demand.test.mjs
          protocol/qfs/envelope.test.mjs
          scripts/lib/b2b-send-policy.test.ts
          src/lib/generation-seal.test.ts
          worker-app/cron-dispatch.test.ts
          workers/authichain-verify-worker/src/protocol-verify.test.mjs
          workers/authichain-verify-worker/src/published-record.test.mjs

      # node:test suites outside scripts/autonomy and scripts/ci that no other
      # job ran: the QFS envelope, the B2B send policy and the cron dispatcher.
      - name: Check other node:test suites
        run: pnpm exec tsx --test protocol/qfs/envelope.test.mjs scripts/agent-identity/sign-evidence.test.mjs scripts/lib/b2b-send-policy.test.ts worker-app/cron-dispatch.test.ts workers/authichain-verify-worker/src/agent-d1-concurrency.node-test.mjs scripts/ops/merge-train.test.mjs

      # Hardhat contract tests (test/AuthiChainLedger.test.ts). Hardhat fetches
      # solc 0.8.19 on first run; no other job ran these.
      - name: Contract tests (Hardhat)
        if: env.SKIP_HARDHAT_ON_SELF_HOSTED != 'true'
        run: pnpm test:contracts

      - name: "Skipped on self-hosted: Hardhat contract tests"
        if: env.SKIP_HARDHAT_ON_SELF_HOSTED == 'true'
        run: echo "::warning title=Skipped on self-hosted::Hardhat contract tests (pnpm test:contracts) not run - solc 0.8.19 fetch/ARM64 binary unverified on the runner. Not a pass."

      # Persistent self-hosted runner: drop deps and build outputs so state
      # never leaks into the next run. Workspace-only; never outside it.
      - name: Clean workspace (self-hosted)
        if: always()
        run: |
          set -eu
          ws="${GITHUB_WORKSPACE:?}"
          case "$ws" in /|"") echo "::error::bad GITHUB_WORKSPACE"; exit 1;; esac
          cd "$ws"
          find . -mindepth 1 -type d \( -name node_modules -o -name .venv -o -name .next -o -name .open-next -o -name .turbo -o -name dist -o -name test-results \) -prune -exec rm -rf -- {} +
