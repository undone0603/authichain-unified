name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.28.2"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      - name: Run lint and prettier
        run: pnpm run lint:ci

      - name: Check for job-level continue-on-error in workflows
        run: node scripts/check-workflow-continue-on-error.mjs

      - name: Check wrangler.toml Durable Object migrations
        run: node scripts/check-wrangler-durable-objects.mjs
