name: Lint

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Fixed: Changed from @v7 to @v4
      - uses: actions/checkout@v7
      
      - name: Install pnpm
        # Fixed: Simplified to the standard @v4 tag for consistency
        uses: pnpm/action-setup@v4
        with:
          version: '10.28.2'
          
      # Fixed: Changed from @v7 to @v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Run lint and prettier
        run: pnpm run lint:ci
