name: Deploy authichain-com
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/authichain-com/**"
      - "src/lib/generation-seal.ts"
      - "src/lib/plans.ts"
      - "src/lib/checkout-gate.ts"
      - "content/microsites/**"
      - "scripts/sync-microsite-packs.mjs"
      - ".github/workflows/deploy-authichain-com.yml"
permissions:
  contents: read
jobs:
  deploy:
    # Publish runner only: authichain-wsl. CI stays on authichain-ops (laptop).
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 30
    env:
      # WSL has no IPv6. Node 22 Happy Eyeballs races AAAA (ENETUNREACH) with
      # Cloudflare anycast A records and aborts in ~1.6s (wrangler fetch failed
      # on 40874574341). ipv4first alone still tries AAAA. This flag makes
      # undici connect IPv4-only. Proven on runner node v22.23.4: default
      # fetch fail 1596ms, this combo HTTP 400 (unauthenticated verify) 4415ms.
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
    steps:
      - uses: actions/checkout@v7
      # Self-hosted WSL already has pnpm (11.x). pnpm/action-setup@v6 with
      # version 10.28.2 downloads from npm and ETIMEDOUT / signature-fails
      # (runs 40865371006). GitHub-hosted still uses the pin.
      - uses: pnpm/action-setup@v6
        if: runner.environment != 'self-hosted'
        with:
          version: "10.28.2"
          run_install: false
      - name: Use runner pnpm (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          command -v pnpm
          pnpm --version
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          # Self-hosted runners already keep a local pnpm store. Saving it
          # through actions/cache packs ~1 GB and the post-step fails the
          # deploy after wrangler publish has already succeeded.
          cache: ${{ runner.environment != 'self-hosted' && 'pnpm' || '' }}
          cache-dependency-path: pnpm-lock.yaml
      - name: Install node-gyp (native builds)
        run: npm i -g node-gyp@11
      - name: Install
        env:
          # bufferutil/utf-8-validate are optional ws speedups; ws falls back to JS.
          # Skip their native builds here instead of installing toolchains on the runner.
          npm_config_build_from_source: "false"
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0
      - name: Embed microsite HTML
        run: node scripts/sync-microsite-packs.mjs
      - name: Apply D1 migrations (authichain-db, email_optins)
        working-directory: workers/authichain-com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply authichain-db --remote --config wrangler.toml
      - name: Publish authichain-com
        working-directory: workers/authichain-com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The versions POST body is large. Undici's headers timer
          # (UND_ERR_HEADERS_TIMEOUT) and a mid-upload ECONNRESET killed
          # run 41181414792 after ipv4first was already set. Zero means
          # no header or body deadline on this step only.
          NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection --require ${{ github.workspace }}/workers/authichain-com/undici-long-timeout.cjs"
        run: npx wrangler deploy --minify --keep-vars --config wrangler.toml
      - name: Bind STRIPE_SECRET_KEY from GitHub secrets
        working-directory: workers/authichain-com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${STRIPE_SECRET_KEY:-}" ]; then
            echo "::error::GitHub secret STRIPE_SECRET_KEY is empty"
            exit 1
          fi
          printf '%s' "$STRIPE_SECRET_KEY" | npx wrangler secret put STRIPE_SECRET_KEY --name authichain-com
          if [ -n "${STRIPE_PRICE_ID:-}" ]; then
            printf '%s' "$STRIPE_PRICE_ID" | npx wrangler secret put STRIPE_PRICE_ID --name authichain-com
          fi
          echo "bound STRIPE_SECRET_KEY on authichain-com"

      # Owner-directed live x402 pair (public pay-to + public facilitator URL).
      # Same values as bind-x402-secrets.yml. Not invented. Landing intercept
      # reads these on /api/x402; secret put after deploy keeps them attached.
      - name: Bind X402_PAY_TO + X402_FACILITATOR_URL + X402_USDC_ASSET
        working-directory: workers/authichain-com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          PAY_TO='0x5db511706FB6317cd23A7655F67450c5AC6e6AA2' # pragma: allowlist secret
          FACILITATOR='https://facilitator.payai.network'
          USDC_ASSET='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          printf '%s' "$PAY_TO" | npx wrangler secret put X402_PAY_TO --name authichain-com
          printf '%s' "$FACILITATOR" | npx wrangler secret put X402_FACILITATOR_URL --name authichain-com
          printf '%s' "$USDC_ASSET" | npx wrangler secret put X402_USDC_ASSET --name authichain-com
          printf '%s' "$PAY_TO" | npx wrangler secret put X402_PAY_TO --name authichain-edge-router
          printf '%s' "$FACILITATOR" | npx wrangler secret put X402_FACILITATOR_URL --name authichain-edge-router
          printf '%s' "$USDC_ASSET" | npx wrangler secret put X402_USDC_ASSET --name authichain-edge-router
          echo "bound X402_PAY_TO + X402_FACILITATOR_URL + X402_USDC_ASSET on authichain-com and authichain-edge-router (values not logged)"
