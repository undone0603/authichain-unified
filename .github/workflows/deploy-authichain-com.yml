name: Deploy authichain-com (protected)

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character main commit to release, after verified CI
        type: string
        required: true

permissions:
  contents: read
  statuses: read
  actions: read

concurrency:
  group: deploy-authichain-com
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact-main commit and CircleCI gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Pin dispatch commit
        id: head
        env:
          TARGET_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[[:xdigit:]]{40}$ ]]
          test "$TARGET_SHA" = "$DISPATCH_SHA"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
      - name: Require a preconfigured protected production-cloudflare environment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const repo = process.env.REPOSITORY;
          if (repo !== 'undone0603/authichain-unified') throw Error('wrong repository');
          const res = await fetch('https://api.github.com/repos/' + repo + '/environments/production-cloudflare', {
            headers: {authorization: 'Bearer ' + process.env.GH_TOKEN,
              accept: 'application/vnd.github+json', 'x-github-api-version': '2022-11-28'}
          });
          if (!res.ok) throw Error('production environment missing or inaccessible, HTTP ' + res.status);
          const policy = await res.json();
          if (policy.name !== 'production-cloudflare') throw Error('wrong deployment environment');
          if (policy.deployment_branch_policy?.protected_branches !== true)
            throw Error('production environment must allow protected branches only');
          const reviewers = policy.protection_rules?.find(rule => rule.type === 'required_reviewers');
          if (!reviewers || reviewers.prevent_self_review !== true || !Array.isArray(reviewers.reviewers) || reviewers.reviewers.length < 1)
            throw Error('production environment needs independent approval with self-review blocked');
          console.log('Protected production-cloudflare environment verified without changing settings');
          NODE
      - name: Require seven successful CircleCI statuses at exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.head.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const sha = process.env.TARGET_SHA;
          const repo = process.env.REPOSITORY;
          if (!/^[a-f0-9]{40}$/i.test(sha ?? '') || repo !== 'undone0603/authichain-unified') throw Error('wrong target');
          const required = ['test-workers', 'test-other', 'typecheck-ratchet', 'quality', 'extras', 'build', 'main-quality-gate'].map(x => 'ci/circleci: ' + x);
          const url = 'https://api.github.com/repos/' + repo + '/commits/' + sha + '/status?per_page=100';
          const response = await fetch(url, { headers: { authorization: 'Bearer ' + process.env.GH_TOKEN, accept: 'application/vnd.github+json', 'x-github-api-version': '2022-11-28' } });
          if (!response.ok) throw Error('status query ' + response.status);
          const data = await response.json();
          if (!Array.isArray(data.statuses) || data.total_count > 100 || data.statuses.length < 7) throw Error('incomplete status response');
          const statuses = new Map();
          for (const status of data.statuses) if (!statuses.has(status.context)) statuses.set(status.context, status);
          for (const context of required) {
            const status = statuses.get(context);
            if (status?.state !== 'success' || !status?.target_url?.startsWith('https://circleci.com/gh/undone0603/authichain-unified/')) throw Error('required CircleCI check not verified: ' + context);
          }
          console.log('Exact ' + sha + ': seven required CircleCI statuses successful');
          NODE

  deploy:
    name: Review and publish exact approved Worker
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production-cloudflare
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Confirm checked-out and current main SHA
        env:
          EXPECTED_SHA: ${{ needs.verify.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          HEAD_SHA=$(node --input-type=module -e "const r=await fetch('https://api.github.com/repos/' + process.env.REPOSITORY + '/branches/main',{headers:{authorization:'Bearer ' + process.env.GH_TOKEN,accept:'application/vnd.github+json'}});if(!r.ok)process.exit(1);const d=await r.json();console.log(d.commit.sha)")
          test "$HEAD_SHA" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0
      - name: Native receipt and full Worker routing tests
        working-directory: workers/authichain-com
        run: |
          set -euo pipefail
          pnpm exec vitest run src/dpp-routes.test.ts
          pnpm exec tsx --import ./test/register-md.mjs --test src/routing.test.ts
      - name: Embed microsite HTML
        run: node scripts/sync-microsite-packs.mjs
      - name: Upload and promote this exact Worker version only
        working-directory: workers/authichain-com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx --yes wrangler@4.149.0 versions upload --minify --keep-vars --config wrangler.toml \
            2>&1 | tee /tmp/ac-protected-version-upload.log
          vid=$(node ../../scripts/ci/parse-wrangler-version-id.mjs /tmp/ac-protected-version-upload.log)
          test -n "$vid"
          node ../../scripts/ci/promote-worker-version.mjs authichain-com "$vid"
      - name: Read-only truthful checkout return smoke
        run: |
          set -euo pipefail
          for path in success dpp/thanks; do
            body=$(curl --fail --silent --show-error --max-time 25 "https://authichain.com/$path")
            grep -q 'No checkout reference provided' <<< "$body"
            if grep -Eq 'Payment received|Workspace opened|Your payment added' <<< "$body"; then
              echo "::error::Unverified payment claim at /$path"
              exit 1
            fi
          done
