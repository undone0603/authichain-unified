name: Deploy authichain-com (protected)

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character main commit to release, after verified CI
        type: string
        required: true

permissions:
  contents: read
  statuses: read
  actions: read

concurrency:
  group: deploy-authichain-com
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact-main commit and CircleCI gate
    if: github.ref == 'refs/heads/main'
    # Self-hosted: GitHub-hosted ubuntu is billing-locked on this account.
    # Free path is the local WSL runner (wsl-zac-arm64 / authichain-wsl).
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 5
    env:
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Pin dispatch commit
        id: head
        env:
          TARGET_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[[:xdigit:]]{40}$ ]]
          test "$TARGET_SHA" = "$DISPATCH_SHA"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
      # Separately tested, fail-closed automated protection instead of a human
      # environment reviewer. Missing/stale evidence stops the release.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.head.outputs.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
      # Sparse-checkout settings persist in the shared self-hosted work dir
      # (gov-engine.yml and agentz-orchestration.yml check out two files), so a
      # job that inherits them sees a partial tree while HEAD still names the
      # right commit. Run 43046291702 failed this way: the gate test step exited
      # 1 in ~6ms with no output because test -f of scripts/ci/autonomous-release-gate
      # files failed. Same guard deploy-authichain-edge-router.yml uses.
      - name: Restore full tree after sparse checkout
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          git sparse-checkout disable
          git reset --hard HEAD
          test "$(git rev-parse HEAD)" = "${{ steps.head.outputs.sha }}"
          test -z "$(git ls-files -v | awk '$1 == "S" { print }')"
          test -f scripts/ci/autonomous-release-gate.test.mjs
          test -f scripts/ci/autonomous-release-gate.mjs
          test -f scripts/ci/parse-wrangler-version-id.mjs
          test -f scripts/ci/promote-worker-version.mjs
          test -f workers/authichain-com/wrangler.toml
      - name: Use runner Node 22
        run: |
          set -euo pipefail
          # Prefer nvm Node 22 when present; fall back to PATH node.
          if [ -s "$HOME/.nvm/nvm.sh" ]; then
            # shellcheck disable=SC1091
            . "$HOME/.nvm/nvm.sh"
            nvm use 22 >/dev/null
          fi
          command -v node
          node --version
          echo "NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
      - name: Test fail-closed automated release policy
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo "cwd=$(pwd) head=$(git rev-parse HEAD) node=$(command -v node)"
          if ! test -f scripts/ci/autonomous-release-gate.test.mjs || ! test -f scripts/ci/autonomous-release-gate.mjs; then
            echo "::error::Release-gate files missing from the worktree after checkout."
            ls -la scripts/ci || ls -la scripts || true
            git status --short | head -50
            git ls-files -v | awk '$1 == "S" { print }' | head -50
            exit 1
          fi
          ls -la scripts/ci/autonomous-release-gate*
          node --test "$GITHUB_WORKSPACE/scripts/ci/autonomous-release-gate.test.mjs"
      - name: Enforce automated exact-main release policy
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ steps.head.outputs.sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: node "$GITHUB_WORKSPACE/scripts/ci/autonomous-release-gate.mjs"

  deploy:
    name: Publish exact automatically policy-approved Worker
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 30
    environment:
      name: production-cloudflare
    env:
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
      # Sparse-checkout settings persist in the shared self-hosted work dir
      # (gov-engine.yml and agentz-orchestration.yml check out two files), so a
      # job that inherits them sees a partial tree while HEAD still names the
      # right commit. Run 43046291702 failed this way: the gate test step exited
      # 1 in ~6ms with no output because test -f of scripts/ci/autonomous-release-gate
      # files failed. Same guard deploy-authichain-edge-router.yml uses.
      - name: Restore full tree after sparse checkout
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          git sparse-checkout disable
          git reset --hard HEAD
          test "$(git rev-parse HEAD)" = "${{ needs.verify.outputs.sha }}"
          test -z "$(git ls-files -v | awk '$1 == "S" { print }')"
          test -f scripts/ci/autonomous-release-gate.test.mjs
          test -f scripts/ci/autonomous-release-gate.mjs
          test -f scripts/ci/parse-wrangler-version-id.mjs
          test -f scripts/ci/promote-worker-version.mjs
          test -f workers/authichain-com/wrangler.toml
      - name: Confirm checked-out and current main SHA
        env:
          EXPECTED_SHA: ${{ needs.verify.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          HEAD_SHA=$(node --input-type=module -e "const r=await fetch('https://api.github.com/repos/' + process.env.REPOSITORY + '/branches/main',{headers:{authorization:'Bearer ' + process.env.GH_TOKEN,accept:'application/vnd.github+json'}});if(!r.ok)process.exit(1);const d=await r.json();console.log(d.commit.sha)")
          test "$HEAD_SHA" = "$EXPECTED_SHA"
      - name: Use runner pnpm + Node 22
        run: |
          set -euo pipefail
          if [ -s "$HOME/.nvm/nvm.sh" ]; then
            # shellcheck disable=SC1091
            . "$HOME/.nvm/nvm.sh"
            nvm use 22 >/dev/null
          fi
          command -v pnpm
          pnpm --version
          command -v node
          node --version
          echo "PATH=$PATH" >> "$GITHUB_ENV"
      - name: Install pinned dependencies
        env:
          npm_config_build_from_source: "false"
        run: pnpm install --frozen-lockfile --prefer-offline --config.minimumReleaseAge=0
      - name: Native receipt and full Worker routing tests
        working-directory: workers/authichain-com
        env:
          npm_config_build_from_source: "false"
        run: |
          set -euo pipefail
          # Nested workspace: root pnpm exec cannot see these binaries.
          # Install this package's lockfile so local vitest/tsx resolve.
          pnpm install --frozen-lockfile --prefer-offline --config.minimumReleaseAge=0
          pnpm exec vitest run src/dpp-routes.test.ts
          pnpm exec tsx --import ./test/register-md.mjs --test src/routing.test.ts
      - name: Embed microsite HTML
        run: node scripts/sync-microsite-packs.mjs
      - name: Recheck automated release policy immediately before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ needs.verify.outputs.sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: node "$GITHUB_WORKSPACE/scripts/ci/autonomous-release-gate.mjs"
      # Require these names to be configured ONLY as production-cloudflare environment secrets.
      # Never define these aliases as repository/org secrets: GitHub falls back to broader scope.
      # Provision a Workers-only scoped Cloudflare token; no D1/zone/DNS rights.
      # Pinned x402 pair, same values as bind-x402-secrets.yml. This publish
      # passes --keep-vars and must not re-put these secrets.
      # PAY_TO='0x5db511706FB6317cd23A7655F67450c5AC6e6AA2' # pragma: allowlist secret
      # FACILITATOR='https://facilitator.payai.network'
      # USDC_ASSET='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
      - name: Upload and promote this exact Worker version only
        working-directory: workers/authichain-com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx --yes wrangler@4.149.0 versions upload --minify --keep-vars --config wrangler.toml \
            2>&1 | tee /tmp/ac-protected-version-upload.log
          vid=$(node ../../scripts/ci/parse-wrangler-version-id.mjs /tmp/ac-protected-version-upload.log)
          test -n "$vid"
          node ../../scripts/ci/promote-worker-version.mjs authichain-com "$vid"
      - name: Read-only truthful checkout return smoke
        run: |
          set -euo pipefail
          for path in success dpp/thanks; do
            body=$(curl --fail --silent --show-error --max-time 25 "https://authichain.com/$path")
            if ! grep -Eq 'No checkout reference provided|does not confirm payment' <<< "$body"; then
              echo "::error::Missing honesty marker at /$path"
              exit 1
            fi
            if grep -Eq 'Payment received|Workspace opened|Your payment added' <<< "$body"; then
              echo "::error::Unverified payment claim at /$path"
              exit 1
            fi
          done
