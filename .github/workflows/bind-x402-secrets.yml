# Bind X402_PAY_TO + X402_FACILITATOR_URL + X402_USDC_ASSET on the live x402 Workers.
# GET /api/x402/health stays 200 "not_configured" until pay-to + facilitator exist.
# authichain-com (landing intercept), authichain-edge-router, and the sister
# apexes (qron-space, strainchain-io, govchain-us) all settle on this pair.
# Sisters 402 without the facilitator secret — a third-party pay would be a
# dead listing. Same values as authichain-com. Do not invent a pay-to or
# facilitator. Do not print secret values. Do not rebind to a different URL.
# Owner-authorized payTo is 0x5db5…6AA2 (owner's keyed EOA on Base).
# Never bind X402_PAY_TO to 0xAebf…E437: that is the $QRON ERC-20 contract on
# Polygon (no code and no key on Base) — USDC sent there on Base is stuck.
# Facilitator must support Base mainnet (e.g. https://facilitator.payai.network).
# Do not use https://x402.org/facilitator (testnet-only).
#
# Protected explicit single-Worker binding only. Never rebind on main pushes.
# Owner-approved wallet/facilitator are pinned below; a change needs a reviewed PR.
name: Bind x402 secrets

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact protected main SHA with successful CI
        required: true
        type: string
      pay_to:
        description: "EVM pay-to address (0x + 40 hex)"
        required: true
        type: string
      facilitator_url:
        description: "x402 facilitator HTTPS URL (no trailing slash)"
        required: true
        type: string
      worker_name:
        description: "The single approved Worker to bind in this dispatch"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  statuses: read
  deployments: read

# Serialize all manual credential writes across these binder workflows.
concurrency:
  group: production-secret-binding-${{ github.repository }}
  cancel-in-progress: false

jobs:
  bind:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment:
      name: production-cloudflare-x402-secrets
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
          clean: true
      - name: Restore full checkout and confirm source SHA
        run: |
          set -euo pipefail
          git sparse-checkout disable
          git reset --hard HEAD
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          test -f scripts/ci/guard-production-secret-binding.mjs

      - name: Fail closed on protected main and CI immediately before writes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          RELEASE_ENV: production-cloudflare-x402-secrets
        run: node scripts/ci/guard-production-secret-binding.mjs

      - name: Install wrangler
        timeout-minutes: 15
        run: npm install -g wrangler

      - name: Bind X402_PAY_TO + X402_FACILITATOR_URL + X402_USDC_ASSET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AUTHICHAIN_X402_SECRET_BIND_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.AUTHICHAIN_X402_SECRET_BIND_CLOUDFLARE_ACCOUNT_ID }}
          # Owner-authorized live pair (payTo EOA 0x5db5…6AA2 + PayAI Base-mainnet).
          PAY_TO: ${{ inputs.pay_to }}
          FACILITATOR: ${{ inputs.facilitator_url }}
          # Official Circle USDC on Base — PayAI settle rejects the ticker "USDC".
          USDC_ASSET: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
          WORKER: ${{ inputs.worker_name }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_API_TOKEN is empty"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_ACCOUNT_ID is empty"
            exit 1
          fi
          if [ -z "${PAY_TO:-}" ]; then
            echo "::error::pay_to input is empty"
            exit 1
          fi
          if ! printf '%s' "$PAY_TO" | grep -Eq '^0x[a-fA-F0-9]{40}$'; then
            echo "::error::pay_to must match /^0x[a-fA-F0-9]{40}$/ (value not logged)"
            exit 1
          fi
          APPROVED_PAY_TO="0x5db511706FB6317cd23A7655F67450c5AC6e6AA2" # pragma: allowlist secret
          if [ "${PAY_TO,,}" != "${APPROVED_PAY_TO,,}" ]; then
            echo "::error::Unreviewed pay-to destination refused"
            exit 1
          fi
          FACILITATOR="${FACILITATOR%/}"
          APPROVED_FACILITATOR='https://facilitator.payai.network'
          if [ "$FACILITATOR" != "$APPROVED_FACILITATOR" ]; then
            echo "::error::Unreviewed facilitator refused"
            exit 1
          fi
          if [ -z "${FACILITATOR}" ]; then
            echo "::error::facilitator_url input is empty"
            exit 1
          fi
          case "$FACILITATOR" in
            https://*) ;;
            *)
              echo "::error::facilitator_url must be an https URL with no trailing slash (got a non-https value; not logged)"
              exit 1
              ;;
          esac
          WORKER="${WORKER:?Explicit single Worker required}"
          case "$WORKER" in
            authichain-com|authichain-edge-router|qron-space|strainchain-io|govchain-us) ;;
            *)
              echo "::error::worker_name must be authichain-com, authichain-edge-router, qron-space, strainchain-io, or govchain-us (value not logged)"
              exit 1
              ;;
          esac
          bind_pair() {
            local name="$1"
            printf '%s' "$PAY_TO" | npx wrangler secret put X402_PAY_TO --name "$name"
            printf '%s' "$FACILITATOR" | npx wrangler secret put X402_FACILITATOR_URL --name "$name"
            printf '%s' "$USDC_ASSET" | npx wrangler secret put X402_USDC_ASSET --name "$name"
            echo "bound X402_PAY_TO + X402_FACILITATOR_URL + X402_USDC_ASSET on ${name} (values not logged)"
          }
          # One Worker per audited dispatch: never fan out a wallet mutation.
          bind_pair "$WORKER"
