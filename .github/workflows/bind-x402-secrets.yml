# Bind X402_PAY_TO + X402_FACILITATOR_URL on the live x402 Workers.
# GET /api/x402/health stays 200 "not_configured" until both secrets exist.
# Both authichain-com (landing intercept) and authichain-edge-router (Env
# includes X402_*) read these vars for /api/x402 — bind the pair on both.
# Do not invent a pay-to or facilitator. Do not print secret values.
# Facilitator must support Base mainnet (e.g. https://facilitator.payai.network).
# Do not use https://x402.org/facilitator (testnet-only).
#
# workflow_dispatch is the intended owner path. The Cursor GitHub App token
# can merge but cannot create workflow_dispatch events (HTTP 403), so a
# push to this file on main also runs the bind using the owner-directed
# Base ops wallet + PayAI facilitator defaults (not invented).
name: Bind x402 secrets

on:
  workflow_dispatch:
    inputs:
      pay_to:
        description: "EVM pay-to address (0x + 40 hex)"
        required: true
        type: string
      facilitator_url:
        description: "x402 facilitator HTTPS URL (no trailing slash)"
        required: true
        type: string
      worker_name:
        description: "Primary Worker to bind (companion edge-router/landing is also bound)"
        required: false
        type: string
        default: authichain-com
  push:
    branches: [main]
    paths:
      - ".github/workflows/bind-x402-secrets.yml"

permissions:
  contents: read

jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Bind X402_PAY_TO + X402_FACILITATOR_URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Owner-directed live pair (Base ops EOA + PayAI Base-mainnet).
          PAY_TO: ${{ github.event.inputs.pay_to || '0x5db511706FB6317cd23A7655F67450c5AC6e6AA2' }}
          FACILITATOR: ${{ github.event.inputs.facilitator_url || 'https://facilitator.payai.network' }}
          WORKER: ${{ github.event.inputs.worker_name || 'authichain-com' }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_API_TOKEN is empty"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_ACCOUNT_ID is empty"
            exit 1
          fi
          if [ -z "${PAY_TO:-}" ]; then
            echo "::error::pay_to input is empty"
            exit 1
          fi
          if ! printf '%s' "$PAY_TO" | grep -Eq '^0x[a-fA-F0-9]{40}$'; then
            echo "::error::pay_to must match /^0x[a-fA-F0-9]{40}$/ (value not logged)"
            exit 1
          fi
          FACILITATOR="${FACILITATOR%/}"
          if [ -z "${FACILITATOR}" ]; then
            echo "::error::facilitator_url input is empty"
            exit 1
          fi
          case "$FACILITATOR" in
            https://*) ;;
            *)
              echo "::error::facilitator_url must be an https URL with no trailing slash (got a non-https value; not logged)"
              exit 1
              ;;
          esac
          WORKER="${WORKER:-authichain-com}"
          case "$WORKER" in
            authichain-com|authichain-edge-router) ;;
            *)
              echo "::error::worker_name must be authichain-com or authichain-edge-router (value not logged)"
              exit 1
              ;;
          esac
          bind_pair() {
            local name="$1"
            printf '%s' "$PAY_TO" | npx wrangler secret put X402_PAY_TO --name "$name"
            printf '%s' "$FACILITATOR" | npx wrangler secret put X402_FACILITATOR_URL --name "$name"
            echo "bound X402_PAY_TO + X402_FACILITATOR_URL on ${name} (values not logged)"
          }
          bind_pair "$WORKER"
          if [ "$WORKER" = "authichain-com" ]; then
            bind_pair "authichain-edge-router"
          elif [ "$WORKER" = "authichain-edge-router" ]; then
            bind_pair "authichain-com"
          fi
