# Bind X402_PAY_TO + X402_FACILITATOR_URL + X402_USDC_ASSET on the live x402 Workers.
# GET /api/x402/health stays 200 "not_configured" until pay-to + facilitator exist.
# authichain-com (landing intercept), authichain-edge-router, and the sister
# apexes (qron-space, strainchain-io, govchain-us) all settle on this pair.
# Sisters 402 without the facilitator secret — a third-party pay would be a
# dead listing. Same values as authichain-com. Do not invent a pay-to or
# facilitator. Do not print secret values. Do not rebind to a different URL.
# Owner-authorized treasury is now 0xaebf…e437.
# Do not rebind X402_PAY_TO back to 0x5db511706FB6317cd23A7655F67450c5AC6e6AA2.
# Facilitator must support Base mainnet (e.g. https://facilitator.payai.network).
# Do not use https://x402.org/facilitator (testnet-only).
#
# workflow_dispatch is the intended owner path. The Cursor GitHub App token
# can merge but cannot create workflow_dispatch events (HTTP 403), so a
# push to this file on main also runs the bind using the owner-authorized
# treasury + PayAI facilitator defaults (not invented).
name: Bind x402 secrets

on:
  workflow_dispatch:
    inputs:
      pay_to:
        description: "EVM pay-to address (0x + 40 hex)"
        required: true
        type: string
      facilitator_url:
        description: "x402 facilitator HTTPS URL (no trailing slash)"
        required: true
        type: string
      worker_name:
        description: "Primary Worker to bind (landing pair + sister apexes are also bound)"
        required: false
        type: string
        default: authichain-com
  push:
    branches: [main]
    paths:
      - ".github/workflows/bind-x402-secrets.yml"

permissions:
  contents: read

jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Bind X402_PAY_TO + X402_FACILITATOR_URL + X402_USDC_ASSET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Owner-authorized live pair (treasury 0xaebf…e437 + PayAI Base-mainnet).
          PAY_TO: ${{ github.event.inputs.pay_to || '0xaebfa6b08fb25b59748c93273ab8880e20ffe437' }} # pragma: allowlist secret
          FACILITATOR: ${{ github.event.inputs.facilitator_url || 'https://facilitator.payai.network' }}
          # Official Circle USDC on Base — PayAI settle rejects the ticker "USDC".
          USDC_ASSET: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
          WORKER: ${{ github.event.inputs.worker_name || 'authichain-com' }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_API_TOKEN is empty"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_ACCOUNT_ID is empty"
            exit 1
          fi
          if [ -z "${PAY_TO:-}" ]; then
            echo "::error::pay_to input is empty"
            exit 1
          fi
          if ! printf '%s' "$PAY_TO" | grep -Eq '^0x[a-fA-F0-9]{40}$'; then
            echo "::error::pay_to must match /^0x[a-fA-F0-9]{40}$/ (value not logged)"
            exit 1
          fi
          FACILITATOR="${FACILITATOR%/}"
          if [ -z "${FACILITATOR}" ]; then
            echo "::error::facilitator_url input is empty"
            exit 1
          fi
          case "$FACILITATOR" in
            https://*) ;;
            *)
              echo "::error::facilitator_url must be an https URL with no trailing slash (got a non-https value; not logged)"
              exit 1
              ;;
          esac
          WORKER="${WORKER:-authichain-com}"
          case "$WORKER" in
            authichain-com|authichain-edge-router|qron-space|strainchain-io|govchain-us) ;;
            *)
              echo "::error::worker_name must be authichain-com, authichain-edge-router, qron-space, strainchain-io, or govchain-us (value not logged)"
              exit 1
              ;;
          esac
          bind_pair() {
            local name="$1"
            printf '%s' "$PAY_TO" | npx wrangler secret put X402_PAY_TO --name "$name"
            printf '%s' "$FACILITATOR" | npx wrangler secret put X402_FACILITATOR_URL --name "$name"
            printf '%s' "$USDC_ASSET" | npx wrangler secret put X402_USDC_ASSET --name "$name"
            echo "bound X402_PAY_TO + X402_FACILITATOR_URL + X402_USDC_ASSET on ${name} (values not logged)"
          }
          # Same pair on every live x402 intercept. Do not invent a second URL.
          for name in authichain-com authichain-edge-router qron-space strainchain-io govchain-us; do
            bind_pair "$name"
          done
