name: MCP Registry Publish

# Lists the live remote MCP server (https://authichain.com/mcp) in the official
# MCP registry as com.authichain/authichain.
# github-oidc can only publish io.github.* names, so com.authichain/* uses
# registry DNS auth: an Ed25519 key whose public half is published in a TXT
# record on authichain.com, with the private half (hex) in the repo secret
# MCP_REGISTRY_PRIVATE_KEY. Without that secret the publish step fails with a
# clear message instead of attempting a login that cannot succeed.
# Bump "version" in server.json to publish a new entry; an already-listed
# version is skipped.

on:
  push:
    branches: [main]
    paths: [server.json]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish server.json
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          # The authichain-wsl runner is aarch64; the amd64 build cannot exec there.
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "::error::unsupported runner arch $(uname -m)"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_${arch}.tar.gz" | tar xz mcp-publisher

      - name: Validate
        run: ./mcp-publisher validate

      - name: Skip if this version is already listed
        id: listed
        run: |
          set -euo pipefail
          name=$(jq -r .name server.json)
          ver=$(jq -r .version server.json)
          # GET ?search=<name> (no version filter) and match the exact name+version.
          # If it is listed, skip login+publish: github-oidc cannot publish com.authichain/*.
          if curl -fsS --get "https://registry.modelcontextprotocol.io/v0/servers" \
            --data-urlencode "search=${name}" --data-urlencode "limit=100" \
            | jq -e --arg n "$name" --arg v "$ver" '[.servers[]? | select(.server.name == $n and .server.version == $v)] | length > 0' >/dev/null; then
            echo "listed=true" >> "$GITHUB_OUTPUT"
            echo "$name@$ver is already in the registry"
          else
            echo "listed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login (DNS auth for com.authichain) and publish
        if: steps.listed.outputs.listed == 'false'
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MCP_REGISTRY_PRIVATE_KEY:-}" ]; then
            echo "::error::MCP_REGISTRY_PRIVATE_KEY is not set. com.authichain/* needs DNS (or HTTP) registry auth; github-oidc only covers io.github.* names."
            exit 1
          fi
          ./mcp-publisher login dns --domain authichain.com --private-key "$MCP_REGISTRY_PRIVATE_KEY"
          ./mcp-publisher publish
