name: Content Routine PR

# Closes the loop for the autonomous content Routines.
#
# Those Routines fire without MCP connector tools and this environment has no
# `gh` CLI, so they can commit and `git push` but cannot open or merge a pull
# request themselves. This workflow does that part: any push to a content
# routine branch gets a PR opened, and auto-merge enabled so it lands the
# moment required checks pass — no human in the loop.
#
# The safety property is the path filter below, not a human. A routine branch
# that touches anything outside the content surface gets a PR that stays open
# and is labelled for review instead of auto-merging.

on:
  push:
    branches:
      - "claude/content-research-*"
      - "claude/adoption-radar-*"
      - "claude/social-bundle-*"

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    name: Open and auto-merge content PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify the diff
        id: scope
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin "${{ github.event.repository.default_branch }}" --depth=1 || true
          BASE="origin/${{ github.event.repository.default_branch }}"
          FILES=$(git diff --name-only "$BASE"...HEAD || true)
          echo "Changed files:"; echo "$FILES"

          # Everything the content routines are allowed to touch unattended.
          OUTSIDE=$(echo "$FILES" | grep -vE '^(content/|docs/|scripts/gen-seo-pages\.cjs$)' || true)
          if [ -n "$OUTSIDE" ]; then
            echo "Files outside the content surface:"; echo "$OUTSIDE"
            echo "content_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "content_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          BASE: ${{ github.event.repository.default_branch }}
          CONTENT_ONLY: ${{ steps.scope.outputs.content_only }}
        run: |
          set -euo pipefail
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "number=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "Reusing open PR #$EXISTING"
          else
            TITLE=$(git log -1 --pretty=%s)
            BODY=$(printf '%s\n\n%s\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' \
              "$(git log -1 --pretty=%b)" \
              "Opened automatically by \`content-routine-pr.yml\` for branch \`$BRANCH\`.")

            NUMBER=$(gh pr create --base "$BASE" --head "$BRANCH" --title "$TITLE" --body "$BODY" \
              | grep -oE '[0-9]+$')
            echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable auto-merge for content-only changes
        if: steps.scope.outputs.content_only == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -uo pipefail
          if [ -z "${NUMBER:-}" ]; then
            echo "No PR number; cannot enable auto-merge."
            exit 1
          fi

          MAX_ATTEMPTS=6
          SLEEP_SECONDS=10
          last_err=""

          is_unstable_or_pending() {
            local msg
            msg=$(echo "$1" | tr '[:upper:]' '[:lower:]')
            case "$msg" in
              *unstable*) return 0 ;;
              *enablepullrequestautomerge*) return 0 ;;
              *"checks have not finished"*) return 0 ;;
              *"required status check"*) return 0 ;;
              *"merge state is blocked"*) return 0 ;;
              *"not mergeable"*) return 0 ;;
            esac
            return 1
          }

          is_permanent_failure() {
            local msg
            msg=$(echo "$1" | tr '[:upper:]' '[:lower:]')
            case "$msg" in
              *"merge conflict"*|*conflicting*) return 0 ;;
              *"not authorized"*|*"permission denied"*|*"resource not accessible"*) return 0 ;;
              *"auto merge is not allowed"*|*"auto-merge is not allowed"*) return 0 ;;
              *"authentication"*|*"bad credentials"*) return 0 ;;
            esac
            return 1
          }

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            set +e
            err=$(gh pr merge "$NUMBER" --squash --auto 2>&1)
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              echo "Auto-merge enabled for PR #$NUMBER (squash)."
              exit 0
            fi

            last_err="$err"
            echo "Attempt $attempt/$MAX_ATTEMPTS: could not enable auto-merge yet."
            echo "$err"

            if is_permanent_failure "$err"; then
              echo "Permanent error enabling auto-merge; failing the job."
              exit 1
            fi

            if is_unstable_or_pending "$err"; then
              if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
                sleep "$SLEEP_SECONDS"
                continue
              fi
              echo "PR #$NUMBER is still unstable or waiting on checks after $MAX_ATTEMPTS attempts."
              echo "Exiting successfully so this workflow does not block the PR — enable auto-merge manually or re-run when checks are green."
              exit 0
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
              continue
            fi
          done

          echo "Could not enable auto-merge for PR #$NUMBER:"
          echo "$last_err"
          exit 1

      - name: Flag for review when the diff leaves the content surface
        if: steps.scope.outputs.content_only != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ steps.pr.outputs.number }}" --body "$(printf '%s\n\n%s\n\n---\n%s\n' \
            'This routine branch changed files outside \`content/\`, \`docs/\` and \`scripts/gen-seo-pages.cjs\`, so auto-merge was not enabled.' \
            'Review the diff before merging.' \
            '_Generated by [Claude Code](https://claude.ai/code)_')"
