# Bind GitHub-stored webhook secrets to the live apex Worker and verify safely.
# Dashboard we_1UGTCSGqTruSqV8ThM9bXVWp POSTs https://authichain.com/api/stripe/webhook
# which is authichain-edge-router (worker-app), not authichain-revenue-worker.
#
# Secrets are only read by the runner, never accepted as dispatch inputs or
# printed. The webhook probes send no event and cannot write application data.
#
# See docs/operations/stripe-webhook-signing-secret.md and AGENTZ_ORCHESTRATION.md
name: Bind edge webhook secrets

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Check required GitHub secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_WEBHOOK_AUTHICHAIN_SECRET: ${{ secrets.STRIPE_WEBHOOK_AUTHICHAIN_SECRET }}
          AGENTZ_WEBHOOK_SECRET: ${{ secrets.AGENTZ_WEBHOOK_SECRET }}
          AGENTZ_DRY_RUN_BEARER: ${{ secrets.OPENCLAW_API_KEY || secrets.AGENTZ_API_KEY || secrets.AGENT_SECRET }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STRIPE_WEBHOOK_AUTHICHAIN_SECRET AGENTZ_WEBHOOK_SECRET AGENTZ_DRY_RUN_BEARER; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required GitHub secret for $name is empty"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install Wrangler
        run: npm install --global wrangler@4.141.0

      - name: Bind webhook secrets on authichain-edge-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_WEBHOOK_AUTHICHAIN_SECRET: ${{ secrets.STRIPE_WEBHOOK_AUTHICHAIN_SECRET }}
          AGENTZ_WEBHOOK_SECRET: ${{ secrets.AGENTZ_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          WORKER_NAME="authichain-edge-router"
          for key in AGENTZ_WEBHOOK_SECRET STRIPE_WEBHOOK_AUTHICHAIN_SECRET; do
            value="${!key}"
            printf '%s' "$value" | wrangler secret put "$key" --name "$WORKER_NAME" >/dev/null
            echo "bound $key on $WORKER_NAME (value not logged)"
          done
          if [ -n "${STRIPE_WEBHOOK_SECRET:-}" ]; then
            printf '%s' "$STRIPE_WEBHOOK_SECRET" | wrangler secret put STRIPE_WEBHOOK_SECRET --name "$WORKER_NAME" >/dev/null
            echo "bound STRIPE_WEBHOOK_SECRET on $WORKER_NAME (value not logged)"
          fi

      - name: Run AgentZ architect dry-run
        env:
          OPENCLAW_API_KEY: ${{ secrets.OPENCLAW_API_KEY || secrets.AGENTZ_API_KEY || secrets.AGENT_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          python3 scripts/ops/ping_claw_agentz.py --architect --mode dry-run

      - name: Verify webhook authentication without submitting events
        env:
          AGENTZ_WEBHOOK_SECRET: ${{ secrets.AGENTZ_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          request = Request(
              "https://authichain.com/api/agentz/webhook",
              data=b"{}",
              headers={
                  "Content-Type": "application/json",
                  "x-agentz-secret": os.environ["AGENTZ_WEBHOOK_SECRET"],
              },
              method="POST",
          )
          try:
              response = urlopen(request, timeout=20)
              status, body = response.status, response.read()
          except HTTPError as error:
              status, body = error.code, error.read()
          try:
              payload = json.loads(body)
          except (ValueError, TypeError):
              payload = {}
          if status != 400 or payload.get("error") != "Missing event":
              raise SystemExit(
                  f"AgentZ webhook auth probe failed (HTTP {status}); "
                  "expected authenticated no-op rejection."
              )
          print("AgentZ webhook auth probe passed; empty no-op payload rejected.")
          PY

          response="$RUNNER_TEMP/stripe-webhook-probe.json"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --request POST https://authichain.com/api/stripe/webhook \
            --header 'Content-Type: application/json' --data-binary '{}')"
          if [ "$status" != "400" ] || ! jq -e '.error | test("stripe-signature"; "i")' "$response" >/dev/null; then
            echo "::error::Stripe webhook no-signature probe failed (HTTP $status); expected rejection before event processing."
            exit 1
          fi
          echo "Stripe webhook no-signature probe passed; request rejected before event processing."
