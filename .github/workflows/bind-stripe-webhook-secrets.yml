# Copy GitHub repo Stripe webhook signing secrets onto the live apex Worker.
# Dashboard we_1UGTCSGqTruSqV8ThM9bXVWp POSTs https://authichain.com/api/stripe/webhook
# which is authichain-edge-router (worker-app), not authichain-revenue-worker.
#
# Do NOT pass whsec_ values as workflow_dispatch inputs — they appear in run
# metadata. Paste them into GitHub Actions secrets first, then run this job.
#
# See docs/operations/stripe-webhook-signing-secret.md
name: Bind Stripe webhook signing secrets

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Bind signing secrets on authichain-edge-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_WEBHOOK_AUTHICHAIN_SECRET: ${{ secrets.STRIPE_WEBHOOK_AUTHICHAIN_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_API_TOKEN is empty"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_ACCOUNT_ID is empty"
            exit 1
          fi
          WORKER_NAME="authichain-edge-router"
          bound=0
          put_secret() {
            local key="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "::notice::$key GitHub secret empty — not bound on $WORKER_NAME"
              return 0
            fi
            # printf, not echo: a trailing newline breaks Stripe HMAC verify.
            printf '%s' "$value" | wrangler secret put "$key" --name "$WORKER_NAME"
            echo "bound $key on $WORKER_NAME (value not logged)"
            bound=$((bound + 1))
          }
          put_secret STRIPE_WEBHOOK_AUTHICHAIN_SECRET "$STRIPE_WEBHOOK_AUTHICHAIN_SECRET"
          put_secret STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET"
          if [ "$bound" -eq 0 ]; then
            echo "::error::Neither STRIPE_WEBHOOK_AUTHICHAIN_SECRET nor STRIPE_WEBHOOK_SECRET is set in GitHub Actions secrets. Paste the Dashboard Reveal signing secret for we_1UGTCS… into at least STRIPE_WEBHOOK_AUTHICHAIN_SECRET, then re-run."
            exit 1
          fi
