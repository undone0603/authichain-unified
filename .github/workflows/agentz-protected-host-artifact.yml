name: AgentZ protected host artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Build and smoke-test ARM64 image
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          context="$(mktemp -d)"
          image="agentz-host:$GITHUB_SHA"
          git archive "$GITHUB_SHA" agentz requirements-agentz.txt workers/authichain-agentz/Dockerfile |
            tar -x -C "$context"
          docker build --platform linux/arm64 --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image" --file "$context/workers/authichain-agentz/Dockerfile" "$context"
          container="$(docker run -d -p 127.0.0.1::8000 "$image")"
          trap 'docker rm -f "$container" >/dev/null' EXIT
          address="$(docker port "$container" 8000/tcp)"
          curl --fail --silent --show-error --retry 15 --retry-all-errors \
            --retry-delay 2 --max-time 5 "http://$address/health" > "$RUNNER_TEMP/agentz-health.json"
          python3 -c 'import json, sys; assert isinstance(json.load(open(sys.argv[1])), dict)' \
            "$RUNNER_TEMP/agentz-health.json"
          mkdir -p "$RUNNER_TEMP/agentz-release"
          docker save "$image" | gzip -n > "$RUNNER_TEMP/agentz-release/agentz-linux-arm64.tar.gz"

      - name: Record release provenance
        working-directory: ${{ runner.temp }}/agentz-release
        shell: bash
        run: |
          set -euo pipefail
          artifact=agentz-linux-arm64.tar.gz
          digest="$(sha256sum "$artifact" | cut -d ' ' -f 1)"
          image_id="$(docker image inspect --format '{{.Id}}' "agentz-host:$GITHUB_SHA")"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg source_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg filename "$artifact" --arg sha256 "$digest" --arg image_id "$image_id" \
            '{repository: $repository, source_sha: $source_sha, run_id: $run_id,
              run_attempt: $run_attempt, filename: $filename, sha256: $sha256, image_id: $image_id,
              platform: "linux/arm64"}' > release.json
          {
            printf 'Source SHA: `%s`\n\n' "$GITHUB_SHA"
            printf 'Build run: `%s` (attempt %s)\n\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'Artifact SHA-256: `%s`\n' "$digest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agentz-linux-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agentz-release/
          if-no-files-found: error
          compression-level: 0
