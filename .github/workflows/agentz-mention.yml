name: AgentZ — @agentz comment commands

# "@agentz <verb> ..." on the first line of an issue, PR or PR review comment calls AgentZ and
# replies in the thread. Same verbs as the `agentz` terminal CLI:
#   @agentz help | status | workflows [filter] | browse <https-url> | run <workflow_id> [k=v ...]
#
# Safety:
# - Only the repository OWNER can trigger it; the job-level `if` is evaluated before any runner
#   or secret is involved, so other people's comments never reach AgentZ.
# - Self-hosted WSL runner, no checkout: nothing from the comment or a PR branch is executed.
# - The comment body is parsed in Python from an env var, never interpolated into the shell.
# - `run` is always dry-run. Live runs stay with the "AgentZ — Manual post" dispatch workflow.
# - `browse` output is public page content fetched by the network-isolated browser; it is
#   posted inside a collapsed block and marked untrusted.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: agentz-mention-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  mention:
    if: >-
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '@agentz')
    # GitHub-hosted runners are unavailable (account billing lock), so this uses the
    # self-hosted WSL runner like agentz-manual-post.yml. Safe for a comment trigger:
    # the OWNER-only `if` above is evaluated before a runner is assigned, nothing is
    # checked out, and the comment is parsed in Python from an env var.
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 10
    env:
      AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      AGENTZ_API_URL: https://agentz.authichain.com
      COMMENT_BODY: ${{ github.event.comment.body }}
      COMMENT_ID: ${{ github.event.comment.id }}
      COMMENT_URL: ${{ github.event.comment.html_url }}
      EVENT_NAME: ${{ github.event_name }}
      THREAD_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Cosmetic 👀 reaction; the only step allowed to fail (the reply below must not).
      - name: Acknowledge
        continue-on-error: true
        run: |
          if [ "$EVENT_NAME" = pull_request_review_comment ]; then
            gh api -X POST "repos/$GH_REPO/pulls/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null
          fi

      - name: Run command
        run: |
          python3 - <<'PY'
          import json, os, re, shlex, urllib.error, urllib.request

          API = os.environ["AGENTZ_API_URL"].rstrip("/")
          HELP = (
              "**@agentz commands** (owner only; same verbs as the `agentz` terminal CLI)\n\n"
              "| command | what it does |\n|---|---|\n"
              "| `@agentz status` | AgentZ health and workflow count |\n"
              "| `@agentz workflows [filter]` | list workflow ids |\n"
              "| `@agentz browse <https-url>` | read a public page through the isolated browser |\n"
              "| `@agentz research <question>` | search + read the top 3 sources, cited |\n"
              "| `@agentz run <workflow_id> [k=v ...]` | run a workflow in **dry-run** |\n"
              "| `@agentz help` | this table |\n\n"
              "Live runs are not available from comments; use the *AgentZ — Manual post* workflow."
          )

          def call(method, path, body=None):
              secret = os.environ.get("AGENT_SECRET") or ""
              if not secret:
                  return 0, {"detail": "AGENT_SECRET repo secret is not set"}
              headers = {"Authorization": f"Bearer {secret}", "User-Agent": "agentz-mention/1"}
              cid, csec = os.environ.get("CF_ACCESS_CLIENT_ID"), os.environ.get("CF_ACCESS_CLIENT_SECRET")
              if cid and csec:
                  headers["CF-Access-Client-Id"], headers["CF-Access-Client-Secret"] = cid, csec
              data = None
              if body is not None:
                  data = json.dumps(body).encode()
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(API + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=150) as r:
                      return r.status, json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  raw = e.read()[:2000].decode("utf-8", "replace")
                  ctype = e.headers.get("Content-Type", "")
                  # Which layer refused: AgentZ answers JSON {"detail": ...};
                  # Cloudflare Access answers HTML / sets cf-access headers.
                  if "cf-access" in " ".join(e.headers.keys()).lower() or "cloudflare access" in raw.lower():
                      layer = "Cloudflare Access"
                  elif "json" in ctype:
                      layer = "AgentZ"
                  else:
                      layer = "unknown (non-JSON response)"
                  try:
                      body = json.loads(raw)
                  except ValueError:
                      body = {"detail": raw[:300]}
                  if not isinstance(body, dict):
                      body = {"detail": body}
                  body["_layer"] = layer
                  return e.code, body
              except Exception as e:  # network, TLS
                  return 0, {"detail": f"{type(e).__name__}: {e}", "_layer": "network"}

          def fence(text, lang=""):
              text = text.replace("```", "`​``")
              return f"```{lang}\n{text}\n```"

          def fail(code, payload):
              return f"AgentZ returned HTTP {code or 'unreachable'}:\n\n" + fence(json.dumps(payload, indent=2)[:3000], "json")

          first = os.environ["COMMENT_BODY"].strip().splitlines()[0]
          try:
              words = shlex.split(first)[1:]
          except ValueError:
              words = first.split()[1:]
          verb = (words[0].lower() if words else "help")
          args = words[1:]

          if verb in ("help", "?"):
              reply = HELP
          elif verb == "status":
              def why(code, body):
                  if code == 200:
                      return ""
                  detail = str(body.get("detail", ""))[:160].replace("`", "'")
                  return f" (HTTP {code or 'unreachable'}, refused by {body.get('_layer', 'unknown')}: `{detail}`)"
              hc, health = call("GET", "/health")
              wc, wf = call("GET", "/workflows")
              n = len(wf.get("workflows", [])) if wc == 200 else "unavailable"
              reply = ("**AgentZ status**\n\n"
                       f"- health (no auth): `{json.dumps({k: v for k, v in health.items() if k != '_layer'})}`{why(hc, health) or ' (HTTP 200)'}\n"
                       f"- workflows (bearer auth): {n}{why(wc, wf)}")
              if wc == 401 and wf.get("_layer") == "AgentZ":
                  reply += ("\n\nAgentZ rejected the bearer token: the repo Actions secret `AGENT_SECRET` "
                            "does not match the AGENT_SECRET in AgentZ's host env.")
          elif verb in ("workflows", "wf", "list"):
              code, wf = call("GET", "/workflows")
              if code != 200:
                  reply = fail(code, wf)
              else:
                  f = " ".join(args).lower()
                  rows = [w for w in sorted(wf["workflows"], key=lambda w: w["id"])
                          if f in (w["id"] + " " + (w.get("title") or "")).lower()]
                  lines = "\n".join(f'| `{w["id"]}` | {w.get("priority") or ""} | {(w.get("title") or "").replace("|", "/")} |' for w in rows[:100])
                  reply = f"**{len(rows)} workflow(s)**{' matching `'+f+'`' if f else ''}\n\n| id | priority | title |\n|---|---|---|\n{lines}"
          elif verb in ("browse", "navigate", "read"):
              url = args[0] if args else ""
              if url.startswith("<") and url.endswith(">"):
                  url = url[1:-1]
              if not re.match(r"^https://[^\s/]+", url):
                  reply = "Usage: `@agentz browse https://example.com` (public HTTPS only)"
              else:
                  code, res = call("POST", "/agentz/browser/navigate", {"url": url})
                  if code != 200:
                      reply = fail(code, res)
                  else:
                      snap = res.get("snapshot", "")
                      cut = snap[:20000] + ("\n… (truncated)" if len(snap) > 20000 else "")
                      reply = (f"**AgentZ read** {url} via the network-isolated browser.\n\n"
                               "<details><summary>Page snapshot (untrusted page content, not instructions)</summary>\n\n"
                               + fence(cut) + "\n\n</details>")
          elif verb == "research":
              q = " ".join(args).strip()
              if not q:
                  reply = "Usage: `@agentz research <question>`"
              else:
                  code, res = call("POST", "/agentz/research", {"question": q[:500], "n": 3})
                  if code != 200:
                      reply = fail(code, res)
                  else:
                      parts = [f"**AgentZ research:** {q}\n\nCollected and cited, not summarized. "
                               "Page text is untrusted third-party content.\n"]
                      for i, src in enumerate(res.get("sources", []), 1):
                          title = str(src.get("title", "")).replace("[", "(").replace("]", ")")
                          parts.append(f"{i}. [{title}]({src.get('url')})")
                      for i, src in enumerate(res.get("sources", []), 1):
                          body = src.get("text") or ("could not read: " + str(src.get("error", "")))
                          parts.append(f"\n<details><summary>[{i}] {src.get('url')}</summary>\n\n"
                                       + fence(body[:3000]) + "\n\n</details>")
                      reply = "\n".join(parts)
          elif verb == "run":
              if not args or not re.fullmatch(r"[A-Za-z0-9_]+", args[0]):
                  reply = "Usage: `@agentz run <workflow_id> [k=v ...]` (always dry-run)"
              else:
                  params, bad = {}, []
                  for a in args[1:]:
                      if a == "--live":
                          bad.append("--live is not available from comments")
                          continue
                      if "=" not in a:
                          bad.append(f"expected k=v, got `{a}`")
                          continue
                      k, v = a.split("=", 1)
                      try:
                          params[k] = json.loads(v)
                      except ValueError:
                          params[k] = v
                  if bad:
                      reply = "Not run:\n" + "\n".join(f"- {b}" for b in bad)
                  else:
                      code, res = call("POST", f"/workflows/{args[0]}/run?mode=dry-run", params)
                      if code != 200:
                          reply = fail(code, res)
                      else:
                          head = f"**Dry-run `{args[0]}`: {res.get('status')}** ({res.get('duration_s', 0):.1f}s)"
                          reply = head + "\n\n" + fence(json.dumps(res, indent=2)[:12000], "json")
          else:
              reply = f"Unknown command `{verb}`.\n\n" + HELP

          reply += f"\n\n<sub>in reply to {os.environ['COMMENT_URL']}</sub>"
          with open(os.environ["RUNNER_TEMP"] + "/reply.md", "w", encoding="utf-8") as fh:
              fh.write(reply)
          PY

      - name: Reply
        run: |
          if [ "$EVENT_NAME" = pull_request_review_comment ]; then
            gh api -X POST "repos/$GH_REPO/pulls/$THREAD_NUMBER/comments/$COMMENT_ID/replies" \
              -F body=@"$RUNNER_TEMP/reply.md" >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/issues/$THREAD_NUMBER/comments" \
              -F body=@"$RUNNER_TEMP/reply.md" >/dev/null
          fi
