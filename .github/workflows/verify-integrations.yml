name: Integration Health Check

# Weekly smoke test of all connected integrations. Runs verify-integrations.ts
# which makes read-only API calls to each configured service and reports
# pass/fail/skip. Missing credentials are SKIP (yellow), not failure.
# Open-source, zero-cost, no external services required.

on:
  schedule:
    - cron: '0 10 * * 1'   # Every Monday 10:00 UTC (6 AM ET)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: Smoke-test all integrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with: { version: '10.28.2' }

      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: pnpm }

      - run: pnpm install --no-frozen-lockfile

      - name: Run integration verification
        run: pnpm exec tsx scripts/verify-integrations.ts
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:         ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY:              ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          STRIPE_SECRET_KEY:         ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY:            ${{ secrets.RESEND_API_KEY }}
          HUBSPOT_ACCESS_TOKEN:      ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          PINECONE_API_KEY:          ${{ secrets.PINECONE_API_KEY }}
          PINECONE_HOST:             ${{ secrets.PINECONE_HOST }}
          DATABASE_URL:              ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_API_TOKEN:      ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:     ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
