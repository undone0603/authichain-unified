name: AgentZ MCP focused verification

on:
  pull_request:
    paths:
      - "agentz/**"
      - "workers/authichain-automation/**"
      - "tests/test_agentz_*"
      - ".github/workflows/agentz-mcp-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    # Hosted ubuntu-latest is billing-locked (jobs complete with zero steps).
    # Same-repo PRs use WSL like other quality gates; forks stay hosted.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","ARM64","authichain-wsl"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore full tree after sparse checkout
        if: runner.environment == 'self-hosted'
        run: |
          git sparse-checkout disable
          git reset --hard HEAD
          test -f package.json
      - uses: actions/setup-python@v7
        if: runner.environment != 'self-hosted'
        with:
          python-version: "3.11"
      - name: Install MCP runtime
        run: python3 -m pip install 'mcp>=1,<2'
      - name: Run AgentZ focused tests
        run: |
          python3 -m unittest discover -s tests -p 'test_agentz_capability_policy.py'
          python3 -m unittest discover -s tests -p 'test_agentz_browser_executor.py'
          python3 -m unittest discover -s tests -p 'test_agentz_navigation_dispatch.py'
          python3 -m unittest discover -s tests -p 'test_agentz_code_proposals.py'
          python3 -m unittest discover -s tests -p 'test_agentz_mcp_readiness.py'
      - name: AgentZ edge and scheduler Node integration tests
        run: |
          node --test agentz/cloudflare-mcp/worker-runtime.test.mjs agentz/cloudflare-mcp/automation-integration.test.mjs
      - name: MCP tool registration smoke
        run: |
          python3 - <<'PY'
          from agentz.mcp_browser_server import mcp
          assert mcp is not None
          print('MCP server imports successfully')
          PY
