name: AgentZ MCP focused verification

on:
  pull_request:
    paths:
      - "agentz/**"
      - "workers/authichain-automation/**"
      - "pyproject.toml"
      - ".github/workflows/agentz-mcp-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    # GitHub-hosted ubuntu-latest is billing-locked (jobs start with zero steps).
    # Same WSL labels as other same-repo PR CI. Do not use actions/setup-python
    # on this ARM64 runner; PEP 668 blocks a system pip install.
    # Fork pull requests must never execute on a persistent self-hosted runner.
    # Keep fork CI on the hosted executor even when GitHub-hosted billing is blocked.
    # Same-repo PRs and authorized manual dispatch use the existing WSL labels.
    runs-on: ${{ (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","ARM64","authichain-wsl"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore full tree after sparse checkout
        if: runner.environment == 'self-hosted'
        run: |
          git sparse-checkout disable
          git reset --hard HEAD
          test -f package.json
      - name: Create venv and install test dependencies
        timeout-minutes: 15
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check 'mcp>=1,<2' pytest
      - name: Run AgentZ focused tests
        run: |
          .venv/bin/python -m pytest -q agentz/tests/test_agentz_capability_policy.py
          .venv/bin/python -m pytest -q agentz/tests/test_agentz_browser_executor.py
          .venv/bin/python -m pytest -q agentz/tests/test_agentz_navigation_dispatch.py
          .venv/bin/python -m pytest -q agentz/tests/test_agentz_code_proposals.py
          .venv/bin/python -m pytest -q agentz/tests/test_agentz_mcp_readiness.py
          .venv/bin/python -m pytest -q agentz/tests/test_ping_claw_agentz.py
      - name: AgentZ edge and scheduler Node integration tests
        run: |
          node --test agentz/cloudflare-mcp/worker-runtime.test.mjs agentz/cloudflare-mcp/automation-integration.test.mjs
      - name: MCP tool registration smoke
        run: |
          .venv/bin/python - <<'PY'
          from agentz.mcp_browser_server import mcp
          assert mcp is not None
          print('MCP server imports successfully')
          PY
      - name: Clean workspace (self-hosted)
        if: always()
        run: |
          set -eu
          ws="${GITHUB_WORKSPACE:?}"
          case "$ws" in /|"") echo "::error::bad GITHUB_WORKSPACE"; exit 1;; esac
          cd "$ws"
          rm -rf -- .venv
