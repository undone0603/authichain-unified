name: AgentZ MCP focused verification

on:
  pull_request:
    paths:
      - "agentz/**"
      - "workers/authichain-automation/**"
      - "tests/test_agentz_*"
      - ".github/workflows/agentz-mcp-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install MCP runtime
        run: python -m pip install 'mcp>=1,<2'
      - name: Run AgentZ focused tests
        run: |
          python -m unittest discover -s tests -p 'test_agentz_capability_policy.py'
          python -m unittest discover -s tests -p 'test_agentz_browser_executor.py'
          python -m unittest discover -s tests -p 'test_agentz_navigation_dispatch.py'
          python -m unittest discover -s tests -p 'test_agentz_code_proposals.py'
          python -m unittest discover -s tests -p 'test_agentz_mcp_readiness.py'
      - name: AgentZ edge and scheduler Node integration tests
        run: |
          node --test agentz/cloudflare-mcp/worker-runtime.test.mjs agentz/cloudflare-mcp/automation-integration.test.mjs
      - name: MCP tool registration smoke
        run: |
          python - <<'PY'
          from agentz.mcp_browser_server import mcp
          assert mcp is not None
          print('MCP server imports successfully')
          PY
