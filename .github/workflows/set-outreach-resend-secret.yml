name: Set Outreach RESEND_API_KEY2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-secrets:
    name: Push RESEND_API_KEY2 to outreach Workers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker:
          - authichain-outreach-engine
          - resend-relay
          - outreach-queue
    steps:
      - uses: actions/checkout@v7

      - name: Push RESEND_API_KEY2 as RESEND_API_KEY
        working-directory: workers/${{ matrix.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_KEY: ${{ secrets.RESEND_API_KEY2 }}
        run: |
          set -e
          echo "$RESEND_KEY" | npx wrangler secret put RESEND_API_KEY
          echo "Pushed RESEND_API_KEY2 -> RESEND_API_KEY on ${{ matrix.worker }}"
