# Audits the Stripe webhook events declared in .github/autonomy.json after a
# related deployment. These workflows do not publish the canonical handler
# (worker-app / authichain-edge-router), so workflow_run is always plan-only.
# Explicit manual apply is reserved for a verified handler deployment.
name: Stripe webhook reconcile

on:
  workflow_run:
    workflows: ["Deploy to Cloudflare"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      plan:
        description: "Plan only; set false only after verifying the canonical handler deployment"
        type: boolean
        default: true

concurrency:
  group: stripe-webhook-reconcile
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    if: >-
      github.repository == 'undone0603/authichain-unified' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: [self-hosted, Linux, ARM64, authichain-ops]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Reconcile
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PLAN: ${{ (github.event_name != 'workflow_dispatch' || inputs.plan) && '--plan' || '' }}
        run: node scripts/autonomy/stripe-webhooks.mjs $PLAN
