# Adds the Stripe webhook events declared in .github/autonomy.json once the
# handler that serves them is live (after an existing public-router deploy
# succeeds on main). Add-only; never removes events or touches undeclared endpoints.
name: Stripe webhook reconcile

on:
  workflow_run:
    workflows:
      [
        "Deploy to Cloudflare",
        "Deploy authichain-com",
        "Deploy Cloudflare Edge Worker",
      ]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      plan:
        description: "Show what would change without writing"
        type: boolean
        default: true

concurrency:
  group: stripe-webhook-reconcile
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    if: >-
      github.repository == 'undone0603/authichain-unified' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: [self-hosted, Linux, ARM64, authichain-ops]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Reconcile
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PLAN: ${{ github.event_name == 'workflow_dispatch' && inputs.plan && '--plan' || '' }}
        run: node scripts/autonomy/stripe-webhooks.mjs $PLAN
