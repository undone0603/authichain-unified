# Loop 1 heartbeat: read-only probes of the public sites and every managed
# loop. Opens ONE issue labelled `ops-alert` when something is red and closes
# it when green. No issue = healthy. See docs/OPERATING_CHARTER.md.
name: Ops pulse

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: ops-pulse
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Pulse
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/autonomy/ops-pulse.mjs
