name: Cloudflare estate audit

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "workers/**/wrangler.toml"
      - "worker/**/wrangler.toml"
      - "api/**"
      - "config/cloudflare-estate.json"
      - "scripts/cloudflare/audit-estate.mjs"
      - ".github/workflows/cloudflare-estate-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: "10.28.2"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Audit Worker identities
        run: node scripts/cloudflare/audit-estate.mjs
