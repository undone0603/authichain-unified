name: Trigger QRON Outreach (every 4h)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Send next outreach email
        run: |
          STATUS=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            "https://qron-outreach.undone-k.workers.dev/send-next?key=${{ secrets.QRON_OUTREACH_AUTH_TOKEN }}")
          cat /tmp/resp.json
          echo "HTTP $STATUS"
          [[ "$STATUS" =~ ^2 ]] || exit 1
