name: IndexNow submit

# Daily: submit every page URL in the four brand sitemaps to IndexNow
# (Bing, Yandex, Seznam, Naver and others share submissions).
# Inbound-only — tells search engines which of our own public pages exist.
# Sends no email and posts nothing; separate from marketing-autonomous.yml,
# which is on operator hold for its social/publishing jobs.
# Script: scripts/seo/indexnow-submit.mjs

on:
  schedule:
    - cron: "17 7 * * *" # daily 07:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List URLs without submitting"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: indexnow-submit
  cancel-in-progress: false

jobs:
  submit:
    name: Submit sitemap URLs to IndexNow
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # setup-node's installer hits the Windows npm shim on this WSL host.
      # The runner already has Linux arm64 Node 22.
      - name: Use the runner Node
        run: |
          set -euo pipefail
          node_bin="${HOME}/.nvm/versions/node/v22.23.4/bin"
          test -x "${node_bin}/node"
          echo "${node_bin}" >> "$GITHUB_PATH"
          "${node_bin}/node" -v | grep -q '^v22\.'
      - name: Submit
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first --no-network-family-autoselection
        run: node scripts/seo/indexnow-submit.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
