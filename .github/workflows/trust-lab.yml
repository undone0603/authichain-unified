name: trust-lab
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "protocol/trust-kernel/**"
      - "protocol/adversarial/**"
      - "protocol/attestation/**"
      - "packages/verifier/**"
      - "packages/policy/**"
      - ".github/workflows/trust-lab.yml"
permissions:
  contents: read

jobs:
  adversarial:
    runs-on: ${{ github.event_name != 'pull_request' && vars.AUTHICHAIN_OPS_ISOLATION_ATTESTED == 'true' && fromJSON('["self-hosted","Linux","ARM64","authichain-ops"]') || 'ubuntu-24.04' }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run adversarial fixtures
        run: node protocol/adversarial/run.mjs --strict
