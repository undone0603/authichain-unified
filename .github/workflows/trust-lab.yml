name: trust-lab
on:
  pull_request:
  push:
    paths:
      - "protocol/trust-kernel/**"
      - "protocol/adversarial/**"
      - "protocol/attestation/**"
      - "packages/verifier/**"
      - "packages/policy/**"
      - ".github/workflows/trust-lab.yml"
jobs:
  adversarial:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","ARM64","authichain-ci-isolated"]') || 'ubuntu-24.04' }}
    timeout-minutes: 3
    steps:
      - name: Assert dedicated CI runner identity
        if: runner.environment == 'self-hosted'
        env:
          EXPECTED_RUNNER: ${{ runner.name }}
        run: |
          if [ "$EXPECTED_RUNNER" != "authichain-ci-arm64-01" ]; then
            echo "::error::CI is not running on the isolated host."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run adversarial fixtures
        run: node protocol/adversarial/run.mjs --strict
