name: trust-lab
on:
  pull_request:
  push:
    paths:
      - "protocol/trust-kernel/**"
      - "protocol/adversarial/**"
      - "protocol/attestation/**"
      - "packages/verifier/**"
      - "packages/policy/**"
      - ".github/workflows/trust-lab.yml"
jobs:
  adversarial:
    runs-on: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted","Linux","ARM64","authichain-ops"]') || 'ubuntu-24.04' }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run adversarial fixtures
        run: node protocol/adversarial/run.mjs --strict
