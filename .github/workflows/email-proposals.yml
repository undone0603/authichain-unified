# .github/workflows/email-proposals.yml
name: Email Government Proposals

on:
  schedule:
    # Every weekday (Mon-Fri) at 10 AM EST (15:00 UTC)
    - cron: '0 15 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        # STAGED ACTIVATION: defaults to true so scheduled runs and default
        # manual runs log the proposal emails they *would* send without sending.
        # To send live for one run, dispatch manually with this unchecked. To
        # remove the guard permanently after reviewing staged output, flip this
        # default and the `|| 'true'` fallback below back to 'false'.
        description: 'Dry run (log emails without sending)'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: email-proposals
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.28.2'

jobs:
  email-proposals:
    name: Email Proposals to Agencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Email high-fit proposals to agency contacts
        run: pnpm exec tsx scripts/email-proposals.ts
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # authichain.com is verified on the second account; the preflight
          # picks whichever credential owns EMAIL_FROM.
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          RESEND_API_KEY2:      ${{ secrets.RESEND_API_KEY2 }}
          GOVCHAIN_URL:         ${{ secrets.GOVCHAIN_URL || 'https://govchain.us' }}
          EMAIL_FROM:           ${{ secrets.EMAIL_FROM || 'proposals@authichain.com' }}
          CALENDLY_LINK:        ${{ secrets.CALENDLY_LINK || 'https://calendly.com/authichain/discovery' }}
          SALES_EMAIL:          ${{ secrets.SALES_EMAIL || 'sales@authichain.com' }}
          # STAGED: fallback is 'true' so scheduled runs never send live.
          DRY_RUN:              ${{ inputs.dry_run || 'true' }}
          # CAN-SPAM requires a physical postal address in every commercial
          # email, and guardedSend fails CLOSED without one. This is NOT a
          # secret — the whole point is that it is printed in every message —
          # so it is a plain default rather than a repo secret, and the channel
          # works out of the box. Value is the address already filed on the DHS
          # SVIP application and the state partnership proposals
          # (docs/submissions/, docs/strategy/). Override with the secret if the
          # registered address changes.
          MAILING_ADDRESS:      ${{ secrets.MAILING_ADDRESS || '109 N 4th St, Roscommon, MI 48653-9090 USA' }}
          UNSUBSCRIBE_URL:      ${{ secrets.UNSUBSCRIBE_URL || 'https://authichain.com/unsubscribe' }}
          RESEND_REPLY_TO:      ${{ secrets.RESEND_REPLY_TO || 'hello@authichain.com' }}

      - name: Report email job failure to Slack
        if: failure()
        continue-on-error: true
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "Email Proposals workflow failed",
              "attachments": [
                {
                  "color": "danger",
                  "title": "Email Proposals Job Failed",
                  "title_link": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                  "text": "Check the workflow run for details."
                }
              ]
            }'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
