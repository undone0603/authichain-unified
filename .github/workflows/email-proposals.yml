# .github/workflows/email-proposals.yml
# Emails the OWNER a digest of high-fit opportunities. It no longer emails any
# agency: see the header of scripts/email-proposals.ts for why.
name: Government Opportunity Digest

on:
  schedule:
    # Every weekday (Mon-Fri) at 10 AM EST (15:00 UTC)
    - cron: "0 15 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        # STAGED: default true. Live send also requires vars.OWNER_LIVE_SEND=true
        # (one-click flip — see PUBLIC_LOOP_FREEZE.md). Unset / false = no spam.
        description: "Dry run (log the digest without sending)"
        required: false
        default: "true"
        type: boolean

concurrency:
  group: email-proposals
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.28.2"

jobs:
  email-proposals:
    name: Email opportunity digest to owner
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      - name: Resolve dry-run / live mode
        id: mode
        run: |
          set -euo pipefail
          # Schedule is fail-closed unless the owner explicitly armed
          # OWNER_LIVE_SEND. Empty inputs must never imply live send.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ vars.OWNER_LIVE_SEND }}" = "true" ]; then
              echo "dry_run=false" >> "$GITHUB_OUTPUT"
              echo "Scheduled run → LIVE (OWNER_LIVE_SEND=true)"
            else
              echo "dry_run=true" >> "$GITHUB_OUTPUT"
              echo "Scheduled run → forced dry-run (OWNER_LIVE_SEND unset/false)"
            fi
            exit 0
          fi
          dry="${{ inputs.dry_run }}"
          if [ "$dry" = "false" ]; then
            if [ "${{ vars.OWNER_LIVE_SEND }}" != "true" ]; then
              echo "::warning::live requested but vars.OWNER_LIVE_SEND is not true — forcing dry-run"
              echo "dry_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "Manual live send (OWNER_LIVE_SEND=true)"
            exit 0
          fi
          echo "dry_run=true" >> "$GITHUB_OUTPUT"
          echo "Resolved dry_run=true"

      - name: Email high-fit opportunity digest to owner
        run: pnpm exec tsx scripts/email-proposals.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # authichain.com is verified on the second account; the preflight
          # picks whichever credential owns EMAIL_FROM.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_API_KEY2: ${{ secrets.RESEND_API_KEY2 }}
          GOVCHAIN_URL: ${{ secrets.GOVCHAIN_URL || 'https://govchain.us' }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || 'proposals@authichain.com' }}
          # Internal recipient of the digest. Never an agency address.
          OWNER_NOTIFY_EMAIL: ${{ secrets.OWNER_NOTIFY_EMAIL || secrets.RESEND_REPLY_TO || 'hello@authichain.com' }}
          # STAGED: resolve-mode defaults to dry-run. Live requires
          # vars.OWNER_LIVE_SEND=true (one-click flip).
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}

      - name: Report email job failure to Slack
        if: failure()
        continue-on-error: true
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "Email Proposals workflow failed",
              "attachments": [
                {
                  "color": "danger",
                  "title": "Email Proposals Job Failed",
                  "title_link": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                  "text": "Check the workflow run for details."
                }
              ]
            }'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
