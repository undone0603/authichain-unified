name: Self-hosted ops smoke
# Proves the WSL authichain-ops runner is picking up jobs.
# No secrets, no deploy, no checkout of untrusted PR code.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, Linux, ARM64, authichain-ci-isolated]
    timeout-minutes: 5
    steps:
      - name: Assert the CI runner is not the production publisher
        if: runner.environment == 'self-hosted'
        env:
          AUTHICHAIN_RUNNER_NAME: ${{ runner.name }}
        run: |
          if [ "$AUTHICHAIN_RUNNER_NAME" != "authichain-ci-arm64-01" ]; then
            echo "::error::Refusing PR execution on a non-isolated runner"
            exit 1
          fi
      - name: Identity
        run: |
          set -euo pipefail
          echo "runner_ok=1"
          uname -a
          echo "github_ref=${GITHUB_REF}"
          echo "event=${GITHUB_EVENT_NAME}"
