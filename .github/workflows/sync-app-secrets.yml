name: Sync app secrets to authichain-app

# One-off ops workflow (branch-only). Not listed in .github/autonomy.json
# because it lives only on ops/sync-app-secrets and is never merged.

on:
  push:
    branches:
      - ops/sync-app-secrets
    paths:
      - .github/workflows/sync-app-secrets.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bulk upload secrets to authichain-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          HUBSPOT_SERVICE_KEY: ${{ secrets.HUBSPOT_SERVICE_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          set -euo pipefail
          umask 077
          OUT="$RUNNER_TEMP/s.json"
          trap 'rm -f "$OUT"' EXIT
          node -e '
            const fs = require("fs");
            const names = ["HEYGEN_API_KEY","HUBSPOT_SERVICE_KEY","GMAIL_APP_PASSWORD","MAKE_WEBHOOK_URL","APOLLO_API_KEY","FAL_KEY"];
            const obj = {}; const present = []; const missing = [];
            for (const n of names) {
              const v = process.env[n];
              if (v && v.length > 0) { obj[n] = v; present.push(n); } else { missing.push(n); }
            }
            console.log("PRESENT: " + (present.join(", ") || "(none)"));
            console.log("MISSING: " + (missing.join(", ") || "(none)"));
            if (present.length === 0) { console.error("ERROR: none of the six secrets are set in GitHub; nothing to upload."); process.exit(2); }
            fs.writeFileSync(process.argv[1], JSON.stringify(obj), { mode: 0o600 });
          ' "$OUT"
          rc=0
          npx --yes wrangler@4 secret bulk "$OUT" --name authichain-app || rc=$?
          rm -f "$OUT"
          if [ "$rc" -ne 0 ]; then
            echo "wrangler secret bulk failed with exit code $rc"
            exit "$rc"
          fi
          echo "wrangler secret bulk completed successfully"
