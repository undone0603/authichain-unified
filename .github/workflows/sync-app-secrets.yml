name: Sync app secrets to authichain-app

# One-off ops workflow (branch-only). Not listed in .github/autonomy.json
# because it lives only on ops/sync-app-secrets and is never merged.

on:
  push:
    branches:
      - ops/sync-app-secrets
    paths:
      - .github/workflows/sync-app-secrets.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: Production
      deployment: false
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bulk upload secrets to authichain-app (with 64-variable guard)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          umask 077
          OUT="$RUNNER_TEMP/s.json"
          EXIST="$RUNNER_TEMP/existing.txt"
          trap 'rm -f "$OUT" "$EXIST"' EXIT
          npm i -g wrangler@4 >/dev/null 2>&1

          wrangler secret list --name authichain-app --format json | jq -r '.[].name' > "$EXIST"
          current=$(wc -l < "$EXIST" | tr -d ' ')
          echo "Current secret count on authichain-app: $current (+1 APP_ORIGIN text var)"

          node -e '
            const fs = require("fs");
            const existing = new Set(fs.readFileSync(process.argv[2], "utf8").split("\n").filter(Boolean));
            const names = ["HEYGEN_API_KEY","FAL_KEY","MAKE_WEBHOOK_URL"];
            const obj = {}; const present = []; const missing = []; const fresh = [];
            for (const n of names) {
              const v = process.env[n];
              if (v && v.length > 0) { obj[n] = v; present.push(n); if (!existing.has(n)) fresh.push(n); } else { missing.push(n); }
            }
            console.log("PRESENT: " + (present.join(", ") || "(none)"));
            console.log("MISSING (skipped): " + (missing.join(", ") || "(none)"));
            console.log("NEW names to add: " + (fresh.join(", ") || "(none)"));
            if (present.length === 0) { console.error("ERROR: none of HEYGEN_API_KEY, FAL_KEY, MAKE_WEBHOOK_URL are set in the Production environment; nothing to upload."); process.exit(2); }
            fs.writeFileSync(process.argv[1], JSON.stringify(obj), { mode: 0o600 });
            fs.writeFileSync(process.env.RUNNER_TEMP + "/newcount", String(fresh.length));
          ' "$OUT" "$EXIST"

          newcount=$(cat "$RUNNER_TEMP/newcount")
          projected=$((current + 1 + newcount))
          echo "Projected total (secrets + APP_ORIGIN): $projected / 64"
          if [ "$projected" -gt 64 ]; then
            rm -f "$OUT"
            echo "::error::Refusing to upload: $current secrets + 1 text var + $newcount new = $projected exceeds the Workers Free limit of 64. Nothing uploaded."
            exit 3
          fi

          rc=0
          wrangler secret bulk "$OUT" --name authichain-app || rc=$?
          rm -f "$OUT"
          if [ "$rc" -ne 0 ]; then
            echo "wrangler secret bulk failed with exit code $rc"
            exit "$rc"
          fi
          echo "wrangler secret bulk completed successfully"
          final=$(wrangler secret list --name authichain-app --format json | jq 'length')
          echo "Final secret count on authichain-app: $final (+1 APP_ORIGIN text var = $((final + 1)) / 64)"
