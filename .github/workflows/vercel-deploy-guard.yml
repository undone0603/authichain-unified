name: Vercel deploy guard

# Cloudflare is the deploy authority. Fail if a workflow reintroduces Vercel deploy.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/guard-vercel-deploy.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/guard-vercel-deploy.mjs"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    name: No Vercel deploy steps
    # Fork PRs stay on ubuntu-24.04; same-repo PRs keep WSL.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","ARM64","authichain-wsl"]') || 'ubuntu-24.04' }} # pragma: allowlist secret
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Scan workflows
        run: node scripts/guard-vercel-deploy.mjs --run
