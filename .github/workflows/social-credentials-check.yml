name: Social Credential Check

# Publishing is unattended, so an expired token is indistinguishable from a
# quiet week: no post goes out and nothing complains. This authenticates against
# each channel read-only and fails loudly when a channel has credentials that no
# longer work.
#
# Weekly because LinkedIn access tokens expire every 60 days — this gives roughly
# eight warnings before one lapses rather than discovering it from a missing post.
#
# Nothing here posts. Every probe is a GET.

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      strict:
        description: "Also fail if a channel has no credentials configured at all"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

jobs:
  check:
    name: Probe channel credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with: { python-version: "3.12" }

      - name: Install probe dependencies
        run: pip install --quiet requests requests-oauthlib praw

      - name: Check credentials
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          SOCIAL_WEBHOOK_URL: ${{ secrets.SOCIAL_WEBHOOK_URL }}
          SOCIAL_WEBHOOK_TOKEN: ${{ secrets.SOCIAL_WEBHOOK_TOKEN }}
        run: |
          # The probe signals failure through its exit code, and it is piped into
          # tee. Without pipefail the step takes tee's status — always 0 — so a
          # broken credential would report green and this whole workflow would be
          # decorative. Keep this line.
          set -o pipefail
          ARGS="--check-credentials"
          if [ "${{ inputs.strict }}" = "true" ]; then ARGS="$ARGS --strict"; fi
          python3 scripts/publish-social-bundle.py $ARGS | tee "$GITHUB_STEP_SUMMARY"
