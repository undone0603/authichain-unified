name: Contract Tests (Hardhat)

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - "test/**"
      - "hardhat.config.*"
      - "tsconfig.hardhat.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/contract-tests.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "test/**"
      - "hardhat.config.*"
      - "tsconfig.hardhat.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/contract-tests.yml"
  workflow_dispatch:

concurrency:
  group: hardhat-contract-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hardhat:
    name: Contract tests (Hardhat)
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name == github.repository && vars.AUTHICHAIN_OPS_ISOLATION_ATTESTED == 'true' && fromJSON('["self-hosted","Linux","ARM64","authichain-ops"]') || 'ubuntu-24.04') || fromJSON('["self-hosted","Linux","ARM64","authichain-wsl"]') }}
    timeout-minutes: 20
    steps:
      # PR jobs must not erase corrupted Git evidence. Quarantine/repair is an
      # operator-only task after the host has independently passed isolation review.
      - name: Check stale Git metadata (read-only; fail closed)
        if: runner.environment == 'self-hosted' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY:?}" = "undone0603/authichain-unified"
          test "${GITHUB_WORKSPACE:?}" = "${RUNNER_WORKSPACE:?}/authichain-unified"
          test ! -L "$GITHUB_WORKSPACE"
          if test -e "$GITHUB_WORKSPACE/.git" || test -L "$GITHUB_WORKSPACE/.git"; then
            test -d "$GITHUB_WORKSPACE/.git"
            test ! -L "$GITHUB_WORKSPACE/.git"
            if ! git -C "$GITHUB_WORKSPACE" fsck --full --no-reflogs >/dev/null; then
              echo "::error::Corrupt PR checkout; stop and quarantine this workspace from the operator host."
              exit 1
            fi
            if test -e "$GITHUB_WORKSPACE/.git/ORIG_HEAD"; then
              git -C "$GITHUB_WORKSPACE" rev-parse --verify 'ORIG_HEAD^{commit}' >/dev/null
            fi
          fi
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.28.2"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Contract tests (Hardhat)
        run: pnpm test:contracts
