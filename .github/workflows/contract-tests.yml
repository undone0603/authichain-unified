name: Contract Tests (Hardhat)

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - "test/**"
      - "hardhat.config.*"
      - "tsconfig.hardhat.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/contract-tests.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "test/**"
      - "hardhat.config.*"
      - "tsconfig.hardhat.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/contract-tests.yml"
  workflow_dispatch:

concurrency:
  group: hardhat-contract-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hardhat:
    name: Contract tests (Hardhat)
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore full tree after sparse checkout
        if: runner.environment == 'self-hosted'
        run: |
          git sparse-checkout disable
          git reset --hard HEAD
          test -f package.json

      # Self-hosted WSL cannot use pnpm/action-setup for 10.28.2. The
      # download ETIMEDOUT and the signature check then refuses to run.
      # GitHub-hosted runners still use the pin.
      - name: Use the runner Node and pnpm
        if: runner.environment == 'self-hosted'
        run: bash scripts/ci/use-runner-pnpm.sh

      - name: Install pnpm
        if: runner.environment != 'self-hosted'
        uses: pnpm/action-setup@v6
        with:
          version: "10.28.2"

      - name: Setup Node
        if: runner.environment != 'self-hosted'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Contract tests (Hardhat)
        run: pnpm test:contracts
