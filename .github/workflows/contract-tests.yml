name: Contract Tests (Hardhat)

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - "test/**"
      - "hardhat.config.*"
      - "tsconfig.hardhat.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/contract-tests.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "test/**"
      - "hardhat.config.*"
      - "tsconfig.hardhat.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/contract-tests.yml"
  workflow_dispatch:

concurrency:
  group: hardhat-contract-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hardhat:
    name: Contract tests (Hardhat)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.28.2"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Contract tests (Hardhat)
        run: pnpm test:contracts
