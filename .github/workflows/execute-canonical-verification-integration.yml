name: Execute canonical verification integration

on:
  push:
    branches: [feat/north-star-mvps]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/north-star-mvps
          fetch-depth: 0

      - name: Patch canonical worker and consumers
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          worker = Path('worker-app/attestation-api.ts')
          s = worker.read_text()
          s = s.replace(
              '  evaluateAttestation,\n',
              '  evaluateAttestation,\n  resolveVerificationDecision,\n',
              1,
          )
          old = '''  const evaluation = evaluateAttestation(attestation);
  const issuer = await registry.getIssuer(env, attestation.issuer.id);
  if (!issuer.ok) {
    return {
      status: issuer.status,
      payload: { valid: false, error: issuer.error, signature: "valid" },
    };
  }
  const now = Date.now();
  const issuerActive =
    issuer.issuer.status === "trusted" &&
    Date.parse(issuer.issuer.validFrom) <= now &&
    (!issuer.issuer.validUntil || Date.parse(issuer.issuer.validUntil) > now);
  const durable = await registry.getCurrentStatus(env, attestation.attestation_id);
  if (!durable.ok) {
    return {
      status: durable.status as 503,
      payload: { valid: false, error: durable.error, signature: "valid" },
    };
  }
  const durableStatus = durable.status?.claimStatus;
  const valid = !issuerActive || (durableStatus && durableStatus !== "active")
    ? false
    : evaluation.valid;
  const reasons = [
    ...evaluation.reasons,
    ...(!issuerActive ? [`issuer_status_${issuer.issuer.status}`] : []),
    ...(durableStatus && durableStatus !== "active" ? [`durable_status_${durableStatus}`] : []),
  ];
  const effectiveStatus = durableStatus ?? evaluation.status;
  return {
    status: valid ? 200 : 409,
    payload: {
      valid,
      contract: "AuthiChain Attestation Contract",
      version: "0.1",
      decision: evaluation.decision,
      status: effectiveStatus,
      claim_status: effectiveStatus,
      cryptographic_status: "valid",
      issuer_status: issuer.issuer.status,
      overall_valid: valid,
      ...(durable.status ? {
        status_event_id: durable.status.eventId,
        effective_at: durable.status.effectiveAt,
        ...(durable.status.reasonCode ? { reason_code: durable.status.reasonCode } : {}),
      } : {}),
      expired: evaluation.expired,
      reasons,
      signature: "valid",
      attestation,
    },
  };'''
          new = '''  const evaluation = evaluateAttestation(attestation);
  const issuer = await registry.getIssuer(env, attestation.issuer.id);
  if (!issuer.ok) {
    return {
      status: issuer.status,
      payload: { valid: false, error: issuer.error, signature: "valid" },
    };
  }
  const now = Date.now();
  const issuerActive =
    issuer.issuer.status === "trusted" &&
    Date.parse(issuer.issuer.validFrom) <= now &&
    (!issuer.issuer.validUntil || Date.parse(issuer.issuer.validUntil) > now);
  const durable = await registry.getCurrentStatus(env, attestation.attestation_id);
  if (!durable.ok) {
    return {
      status: durable.status as 503,
      payload: { valid: false, error: durable.error, signature: "valid" },
    };
  }
  const durableStatus = durable.status?.claimStatus ?? null;
  const decisionResult = resolveVerificationDecision({
    cryptographicValid: true,
    issuerTrusted: issuerActive,
    claimStatus: durableStatus ?? evaluation.status,
    signedDecision: attestation.decision,
    expired: evaluation.expired,
    found: true,
  });
  const effectiveStatus = durableStatus ?? evaluation.status;
  return {
    status: decisionResult.valid ? 200 : 409,
    payload: {
      valid: decisionResult.valid,
      contract: "AuthiChain Attestation Contract",
      version: "0.1",
      decision: decisionResult.decision,
      decision_contract: "AuthiChain Verification Decision v1",
      status: effectiveStatus,
      claim_status: effectiveStatus,
      cryptographic_status: "valid",
      issuer_status: issuer.issuer.status,
      overall_valid: decisionResult.valid,
      ...(durable.status ? {
        status_event_id: durable.status.eventId,
        effective_at: durable.status.effectiveAt,
        ...(durable.status.reasonCode ? { reason_code: durable.status.reasonCode } : {}),
      } : {}),
      expired: evaluation.expired,
      reasons: decisionResult.reasons,
      signature: "valid",
      attestation,
    },
  };'''
          if old not in s:
              raise SystemExit('canonical verifyResponse block not found; refusing to patch')
          worker.write_text(s.replace(old, new, 1))

          client = Path('packages/verifier/src/canonical-worker-client.ts')
          client.write_text('''export type CanonicalVerificationResponse = {
  valid: boolean;
  decision: string;
  decision_contract?: string;
  status?: string;
  claim_status?: string;
  cryptographic_status?: string;
  issuer_status?: string;
  overall_valid?: boolean;
  reasons?: string[];
  [key: string]: unknown;
};

export async function verifyWithCanonicalWorker(
  endpoint: string,
  jws: string,
  expectedObjectId?: string,
): Promise<{ httpStatus: number; response: CanonicalVerificationResponse }> {
  const body: Record<string, string> = { jws };
  if (expectedObjectId) body.expected_object_id = expectedObjectId;
  const res = await fetch(endpoint, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body),
  });
  const response = await res.json() as CanonicalVerificationResponse;
  return { httpStatus: res.status, response };
}
''')

          index = Path('packages/verifier/src/index.ts')
          idx = index.read_text()
          export_line = 'export * from "./canonical-worker-client";\n'
          if export_line not in idx:
              index.write_text(idx + '\n' + export_line)

          route = Path('src/app/api/v1/attestations/verify/route.ts')
          r = route.read_text()
          start = r.index('import { NextRequest, NextResponse }')
          # Replace the entire legacy local verification implementation with a thin paid edge adapter.
          route.write_text('''import { NextRequest, NextResponse } from "next/server";
import { verifyWithCanonicalWorker } from "@authichain/verifier";
import { checkAndIncrementUsage, ApiUsageLimitError } from "@/lib/api-usage";

export const dynamic = "force-dynamic";

export async function POST(req: NextRequest) {
  try {
    const userId = 1;
    await checkAndIncrementUsage(userId);
    const body = await req.json();
    if (!body || typeof body.jws !== "string" || !body.jws.trim()) {
      return NextResponse.json({ valid: false, error: "jws is required" }, { status: 400 });
    }
    const endpoint = process.env.AUTHICHAIN_CANONICAL_VERIFY_URL;
    if (!endpoint) {
      return NextResponse.json(
        { valid: false, error: "AUTHICHAIN_CANONICAL_VERIFY_URL not configured" },
        { status: 503 },
      );
    }
    const result = await verifyWithCanonicalWorker(
      endpoint,
      body.jws.trim(),
      typeof body.expected_object_id === "string" ? body.expected_object_id : undefined,
    );
    return NextResponse.json(result.response, { status: result.httpStatus });
  } catch (error) {
    if (error instanceof ApiUsageLimitError) {
      return NextResponse.json({ valid: false, error: error.message }, { status: 402 });
    }
    return NextResponse.json(
      { valid: false, error: error instanceof Error ? error.message : "canonical verification failed" },
      { status: 502 },
    );
  }
}
''')

          qron = Path('server/qron-service.ts')
          qs = qron.read_text()
          if 'verifyWithCanonicalWorker' not in qs:
              qs = qs.replace(
                  'import { ENV } from "./_core/env";\n',
                  'import { ENV } from "./_core/env";\nimport { verifyWithCanonicalWorker, type CanonicalVerificationResponse } from "../packages/verifier/src/canonical-worker-client";\n',
                  1,
              )
              qs += '''\n\n/** Consume the canonical worker decision for a QRON scan. QRON visual layers remain evidence; they do not replace protocol verification. */\nexport async function verifyQRONAttestation(params: {\n  jws: string;\n  expectedObjectId?: string;\n  endpoint?: string;\n}): Promise<{ httpStatus: number; response: CanonicalVerificationResponse }> {\n  const endpoint = params.endpoint ?? process.env.AUTHICHAIN_CANONICAL_VERIFY_URL;\n  if (!endpoint) throw new Error("AUTHICHAIN_CANONICAL_VERIFY_URL not configured");\n  return verifyWithCanonicalWorker(endpoint, params.jws, params.expectedObjectId);\n}\n'''
              qron.write_text(qs)

          # Strengthen existing route regressions to assert the actual canonical decision contract.
          tests = Path('worker-app/attestation-api.test.ts')
          t = tests.read_text()
          t = t.replace(
              '      overall_valid: true,\n',
              '      overall_valid: true,\n      decision_contract: "AuthiChain Verification Decision v1",\n',
              1,
          )
          t = t.replace(
              '      decision: "blocked",\n    });\n  });\n\n  it("an expired',
              '      decision: "blocked",\n      decision_contract: "AuthiChain Verification Decision v1",\n    });\n  });\n\n  it("an expired',
              1,
          )
          t = t.replace(
              '      expired: true,\n    });\n  });',
              '      expired: true,\n      decision: "expired",\n      decision_contract: "AuthiChain Verification Decision v1",\n    });\n  });',
              1,
          )
          t = t.replace(
              '      decision: "blocked",\n    });\n  });\n\n  it("an expired',
              '      decision: "revoked",\n      decision_contract: "AuthiChain Verification Decision v1",\n    });\n  });\n\n  it("an expired',
              1,
          )
          tests.write_text(t)
          PY

      - name: Verify changed source
        run: |
          grep -n "resolveVerificationDecision\|decision_contract" worker-app/attestation-api.ts worker-app/attestation-api.test.ts
          grep -n "verifyWithCanonicalWorker" src/app/api/v1/attestations/verify/route.ts server/qron-service.ts packages/verifier/src/canonical-worker-client.ts

      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Route regression tests
        run: pnpm exec vitest run worker-app/attestation-api.test.ts packages/verifier/src/verification-decision.test.ts

      - name: Typecheck targeted packages
        run: pnpm exec tsc --noEmit --pretty false

      - name: Commit executed integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker-app/attestation-api.ts worker-app/attestation-api.test.ts packages/verifier/src/canonical-worker-client.ts packages/verifier/src/index.ts src/app/api/v1/attestations/verify/route.ts server/qron-service.ts
          git commit -m 'feat: route canonical verification through decision contract'
          git push origin feat/north-star-mvps

      - name: Remove one-shot executor
        if: success()
        run: |
          git rm .github/workflows/execute-canonical-verification-integration.yml
          git commit -m 'chore: remove one-shot integration executor'
          git push origin feat/north-star-mvps
