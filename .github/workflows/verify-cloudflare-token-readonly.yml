name: Validate Cloudflare production credential (read-only)

# Explicit operator action only. No push trigger, checkout, deployment, or cloud write.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact, CI-green SHA currently on protected main
        required: true
        type: string

permissions:
  contents: read
  statuses: read

concurrency:
  group: verify-cloudflare-production-token
  cancel-in-progress: false

jobs:
  token-preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 10
    environment:
      name: production-cloudflare
    steps:
      - name: Fail closed unless exact protected main and CircleCI pass
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const repo = process.env.REPO;
          const sha = process.env.EXPECTED_SHA;
          if (!/^[0-9a-f]{40}$/.test(sha ?? '') || sha !== process.env.DISPATCH_SHA) {
            throw new Error('Expected SHA must equal the exact dispatched main commit');
          }
          const headers = {
            authorization: 'Bearer ' + process.env.GH_TOKEN,
            accept: 'application/vnd.github+json',
            'x-github-api-version': '2022-11-28'
          };
          async function get(path) {
            const response = await fetch('https://api.github.com/repos/' + repo + path, {
              headers, redirect: 'error', signal: AbortSignal.timeout(10000)
            });
            if (!response.ok) throw new Error('GitHub verification unavailable: HTTP ' + response.status);
            return response.json();
          }
          const branch = await get('/branches/main');
          if (branch.protected !== true || branch.commit?.sha !== sha) {
            throw new Error('Main protection or latest SHA mismatch');
          }
          const statuses = await get('/commits/' + sha + '/status');
          const required = [
            'ci/circleci: test-workers', 'ci/circleci: test-other',
            'ci/circleci: build', 'ci/circleci: extras',
            'ci/circleci: quality', 'ci/circleci: typecheck-ratchet',
            'ci/circleci: main-quality-gate'
          ];
          for (const context of required) {
            const status = statuses.statuses?.find(entry => entry.context === context);
            if (status?.state !== 'success') throw new Error('Missing exact-SHA green status: ' + context);
          }
          console.log('PASS: protected main and all seven exact-SHA CircleCI statuses');
          NODE

      - name: Verify Cloudflare token identity and account read access without exposing secrets
        env:
          CF_TOKEN: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          const token = process.env.CF_TOKEN;
          const account = process.env.CF_ACCOUNT;
          if (!token || !/^[0-9a-f]{32}$/i.test(account ?? '')) {
            throw new Error('Cloudflare environment secrets missing or account ID malformed');
          }
          // No raw token, token ID, account ID, or provider response body is logged.
          async function probe(path) {
            const response = await fetch('https://api.cloudflare.com/client/v4' + path, {
              headers: { authorization: 'Bearer ' + token, accept: 'application/json' },
              redirect: 'error', signal: AbortSignal.timeout(10000)
            });
            const body = await response.json().catch(() => null);
            return { http: response.status, body };
          }
          let verified = null;
          // Support either a user-owned or an account-owned API token.
          for (const path of ['/user/tokens/verify', '/accounts/' + account + '/tokens/verify']) {
            const response = await probe(path);
            if (response.http === 200 && response.body?.result?.status &&
                response.body.result.status !== 'active') {
              throw new Error('Cloudflare token is not active');
            }
            if (response.http === 200 && response.body?.success === true &&
                response.body?.result?.status === 'active' &&
                /^[0-9a-f]{32}$/i.test(response.body.result.id ?? '')) {
              verified = response.body.result;
              break;
            }
          }
          if (!verified) throw new Error('Cloudflare token validity not established');
          const target = await probe('/accounts/' + account);
          if (target.http !== 200 || target.body?.success !== true ||
              target.body?.result?.id?.toLowerCase() !== account.toLowerCase()) {
            throw new Error('Cloudflare token cannot read the configured account');
          }
          const tokenIdFingerprint = createHash('sha256').update(verified.id).digest('hex').slice(0, 16);
          console.log('PASS: Cloudflare API token is active and target account is readable');
          console.log('Token-ID SHA-256 prefix (not the secret): ' + tokenIdFingerprint);
          console.log('NOT VERIFIED: Workers write permission or deployment authorization');
          NODE
