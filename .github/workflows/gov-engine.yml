# Orchestrator for gov-ingest → gov-score → gov-proposals → gov-mint → gov-notify.
# Enabled under launch mode (docs/OPERATING_CHARTER.md). Scheduled mint, score
# and proposals stay dry, so no chain writes or model spend happen until item 5
# (AuthiChainNFT bytecode on Base 8453) and a live dispatch. Scheduled notify
# (owner Slack) is live only while launch mode is active.
name: Government Lead-Gen Engine

on:
  schedule:
    - cron: "0 6 * * *" # Daily 6 AM UTC — ingest runs live; everything downstream stays dry
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no email sends, no chain writes). Uncheck only for a live run."
        required: false
        default: true
        type: boolean

concurrency:
  group: gov-engine
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Validate SAM.gov API key
        run: |
          KEY="${SAM_API_KEY:-$SAM_GOV_API_KEY}"
          if [ -z "$KEY" ]; then
            echo "Neither SAM_API_KEY nor SAM_GOV_API_KEY is set"
            exit 1
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.sam.gov/opportunities/v2/search?api_key=${KEY}&limit=1&postedFrom=01/01/2026&postedTo=01/02/2026")
          if [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
            echo "SAM key is invalid (HTTP $STATUS) — rotate it at https://sam.gov/profile/details"
            exit 1
          fi
          echo "SAM key valid (HTTP $STATUS)"
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}

      - name: Validate Supabase connectivity
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/")
          if [ "$STATUS" != "200" ]; then
            echo "Supabase unreachable (HTTP $STATUS)"
            exit 1
          fi
          echo "Supabase reachable (HTTP $STATUS)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # Ingest is the one stage cleared to write on the schedule. It reads SAM.gov
  # and upserts gov_opportunities — no email, no chain writes, no money. Until
  # now the nightly run ingested in dry-run, so the table only ever filled when
  # somebody remembered to dispatch manually, and everything downstream had
  # nothing current to work from.
  #
  # The stages below stay dry on the schedule deliberately: score spends model
  # credits, proposals drafts outbound content, mint writes on-chain. Each needs
  # its own decision and its own manual dispatch. Notify (owner Slack channel
  # only) goes live on the schedule while launch mode is active.
  launch:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.launch.outputs.active }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/autonomy.json
            scripts/autonomy/launch-mode.mjs
          sparse-checkout-cone-mode: false
      - id: launch
        run: node scripts/autonomy/launch-mode.mjs

  ingest:
    needs: preflight
    uses: ./.github/workflows/gov-ingest.yml
    with:
      dry_run: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
    secrets: inherit

  score:
    needs: ingest
    uses: ./.github/workflows/gov-score.yml
    with:
      dry_run: ${{ github.event_name == 'schedule' && 'true' || inputs.dry_run }}
    secrets: inherit

  proposals:
    needs: score
    uses: ./.github/workflows/gov-proposals.yml
    with:
      dry_run: ${{ github.event_name == 'schedule' && 'true' || inputs.dry_run }}
    secrets: inherit

  mint:
    needs: proposals
    uses: ./.github/workflows/gov-mint.yml
    with:
      dry_run: ${{ github.event_name == 'schedule' && 'true' || inputs.dry_run }}
    secrets: inherit

  notify:
    needs: [launch, ingest, score, proposals]
    if: always()
    uses: ./.github/workflows/gov-notify.yml
    with:
      dry_run: ${{ github.event_name == 'schedule' && (needs.launch.outputs.active == 'true' && 'false' || 'true') || inputs.dry_run }}
    secrets: inherit
