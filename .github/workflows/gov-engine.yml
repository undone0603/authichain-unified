# .github/workflows/gov-engine.yml
# Autonomous Government Lead-Gen Engine
# Runs every 6 hours (and on manual trigger / push to main)
# Fires startGovernmentEngine() from src/agents/government-lead-gen-v2.ts

name: Government Lead-Gen Engine

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:         # Manual trigger from GitHub Actions UI
    inputs:
      ingest_first:
        description: 'Run SAM.gov ingestion before lead-gen (yes/no)'
        required: false
        default: 'yes'
  push:
    branches: [main]
    paths:
      - 'src/agents/government-lead-gen-v2.ts'
      - 'packages/vector-store/**'

jobs:
  run-gov-engine:
    name: Autonomous Gov Lead-Gen + Pilot NFT Minting
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # ───────────────────────────────────────────────────────────
      # These must be added to: Settings > Secrets and variables > Actions
      # ───────────────────────────────────────────────────────────

      # Vector store
      VECTOR_STORE_PROVIDER: ${{ secrets.VECTOR_STORE_PROVIDER }}   # pinecone | chroma
      PINECONE_API_KEY:       ${{ secrets.PINECONE_API_KEY }}
      PINECONE_INDEX:         ${{ secrets.PINECONE_INDEX }}          # authichain-opportunities
      PINECONE_ENVIRONMENT:   ${{ secrets.PINECONE_ENVIRONMENT }}
      CHROMA_HOST:            ${{ secrets.CHROMA_HOST }}

      # Embeddings + LLM
      OPENAI_API_KEY:         ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER:           openai

      # SAM.gov
      SAM_API_KEY:            ${{ secrets.SAM_API_KEY }}

      # Polygon / on-chain
      POLYGON_RPC_URL:        ${{ secrets.POLYGON_RPC_URL }}
      POLYGON_PRIVATE_KEY:    ${{ secrets.POLYGON_PRIVATE_KEY }}

      # AuthiChain
      AUTHICHAIN_API_KEY:     ${{ secrets.AUTHICHAIN_API_KEY }}
      NEXT_PUBLIC_APP_URL:    https://authichain.com

    steps:
      - name: Checkout repo (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive          # pulls libs/opensam automatically
          fetch-depth: 1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install OpenSAM submodule dependencies
        working-directory: libs/opensam
        run: npm ci --ignore-scripts

      - name: Ingest fresh SAM.gov opportunities into vector store
        if: ${{ github.event.inputs.ingest_first != 'no' }}
        run: |
          npx tsx -e "
            import { vectorStoreUtils } from './packages/vector-store/index.ts';
            await vectorStoreUtils.ingestSAMOpportunities();
            console.log('SAM.gov ingestion complete');
          "
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}

      - name: Run autonomous government lead-gen engine
        run: |
          npx tsx -e "
            import { startGovernmentEngine } from './src/agents/government-lead-gen-v2.ts';
            await startGovernmentEngine();
          "

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gov-engine-run-${{ github.run_id }}
          path: |
            logs/
            *.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Government lead-gen engine failed on run ${{ github.run_id }}"
          echo "Check logs above. Common causes:"
          echo "  - Missing secrets (PINECONE_API_KEY, SAM_API_KEY, POLYGON_PRIVATE_KEY)"
          echo "  - Vector store not seeded (run with ingest_first=yes)"
          echo "  - Polygon RPC rate limit"
