name: Security Scan
# Runs gitleaks on every push to main, every PR, and weekly.
# Uses --no-git mode on PRs for speed; full history scan on schedule.
# Historical findings in docs/archive and scripts are allow-listed via .gitleaksignore

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 12 * * 1' # Mondays 12:00 UTC
  workflow_dispatch:

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # Skip Dependabot PRs - its GITHUB_TOKEN is read-only on PR events
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks-action always diffs a specific commit against its parent
          # (see its own --first-parent COMMIT^..COMMIT invocation), so shallow
          # fetch-depth: 1 leaves the parent unreachable and fails outright on
          # any PR whose head isn't a single commit off the fetched ref. Full
          # history avoids that regardless of event type; gitleaks-action's own
          # commit-range scoping (not fetch depth) is what limits PR noise.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: ${{ github.event_name == 'pull_request' }}
        with:
          config: .gitleaksignore
