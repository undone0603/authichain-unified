name: Security Scan
# Runs gitleaks on every push to main, every PR, and weekly.
# Uses --no-git mode on PRs for speed; full history scan on schedule.
# Historical findings in docs/archive and scripts are allow-listed via .gitleaksignore

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 12 * * 1' # Mondays 12:00 UTC
  workflow_dispatch:

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is required for org repos on gitleaks-action v2.
          # On public/personal repos it is optional — pass it through if set
          # so the action doesn't print a noisy warning.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: ${{ github.event_name == 'pull_request' }}
