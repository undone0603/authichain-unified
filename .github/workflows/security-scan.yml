name: Security Scan
# Runs the gitleaks binary on every push to main, every PR, and weekly.
# PRs and pushes scan the tree only. The Monday schedule scans history.
# Historical findings in docs/archive and scripts are allow-listed via .gitleaksignore.
# gitleaks-action@v3 looks up a license through the GitHub API and fails
# the job when that call is rate-limited. This binary does not.

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 12 * * 1" # Mondays 12:00 UTC
  workflow_dispatch:


# GB-26 fix 4: a newer commit on the same PR cancels the older run. Pushes to
# main, schedules and dispatches get one group per commit and are never
# cancelled (PM-328).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # Skip Dependabot PRs - its GITHUB_TOKEN is read-only on PR events
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The Monday history scan needs every commit. Tree scans do not.
          # A bare 0 is falsy in an expression, so the depths are strings.
          fetch-depth: ${{ github.event_name == 'schedule' && '0' || '1' }}
      - name: Scan for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o gitleaks.tgz
          tar --no-same-owner -xzf gitleaks.tgz gitleaks
          if [ "$EVENT_NAME" = "schedule" ]; then
            ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose
          else
            ./gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose
          fi
