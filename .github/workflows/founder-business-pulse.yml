name: Founder business pulse

on:
  schedule:
    - cron: "23 13 * * 1-5"
  workflow_dispatch:

concurrency:
  group: founder-business-pulse
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pulse:
    name: Verify founder-only business control plane
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: "10.28.2"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check founder business invariants
        run: node scripts/autonomy/founder-business-pulse.mjs
