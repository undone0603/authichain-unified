name: CI Main

# Required quality gate: install, typecheck, lint, test, production build.
# Schema/AgentZ extras live in ci.yml so this job is not duplicated there.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets content-routine-pr.yml run this gate on routine branches. PRs opened
  # with GITHUB_TOKEN never trigger pull_request workflows, so without this a
  # routine PR gets no "Main quality gate" check at all (that is how #1474
  # merged with no CI on 2026-10-02). workflow_dispatch from GITHUB_TOKEN does
  # start runs. production-proof stays push-only (its `if:` is unchanged).
  workflow_dispatch:

concurrency:
  # PRs: one active CI Main run per source branch; a newer commit supersedes
  # an older run even when GitHub opened a new PR for the same feature branch.
  # Pushes to main: one group PER COMMIT (CFA-123). GitHub keeps at most one
  # pending run per group and cancels the older pending one when a newer run
  # queues, whatever cancel-in-progress says; with a shared main group that
  # cancelled the 5cd3f6de run at 9:22 AM ET on Oct 9 before it started.
  # Rollback: restore `group: ci-main-${{ github.head_ref || github.ref }}`.
  group: ci-main-${{ github.event_name == 'push' && github.sha || github.head_ref || github.ref }}
  # Only PR runs are superseded; a push to main must never cancel a running
  # deploy/check mid-way (PM-328). With per-commit push groups, main runs
  # never queue behind or cancel each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # GB-26 fix 1: the old single "Main quality gate" job ran typecheck, lint,
  # tests (~314 s) and the production build (~218 s) one after another. They
  # now run as parallel jobs, tests split into 2 shards. The job below keeps
  # the exact check name "Main quality gate" (the only required status check
  # in ruleset main-no-direct-push) and goes green only when every
  # parallel job succeeded.
  # Rollback: git revert <merge sha> (restores the single serial job).
  quality:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.28.2"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      - name: Validate secrets format
        run: node scripts/check-secrets-format.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint:ci

  test:
    # The workspace suites mix Vitest, node:test and tsx --test, so
    # `vitest --shard` cannot split them. Shards split turbo's package graph
    # instead: shard 1 = workers/*, shard 2 = every other workspace package.
    # Together they equal the old `turbo test --filter=!.`.
    name: Tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            filter: "--filter=./workers/*"
          - shard: 2
            filter: "--filter=!. --filter=!./workers/*"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.28.2"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      - name: Install Playwright browsers
        if: matrix.shard == 2
        run: pnpm --filter agent-browser exec playwright install --with-deps chromium

      # turbo.json's test task dependsOn build, so each shard builds the
      # workspace apps it tests. One retry for the next/font/google fetch
      # flake; the second run keeps the step's exit code (no `set +e`).
      # --continue=dependencies-successful keeps other packages' tests
      # running after one fails; turbo still exits non-zero.
      - name: Run tests
        run: |
          if pnpm exec turbo test ${{ matrix.filter }} --continue=dependencies-successful; then
            exit 0
          fi
          echo "Tests failed; retrying once for a possible next/font fetch flake in a workspace build"
          sleep 15
          pnpm exec turbo test ${{ matrix.filter }} --continue=dependencies-successful

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.28.2"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      # next/font/google sometimes 404s mid-build (null CSS parse at
      # google/loader.js:122 on Public_Sans); one retry. Second `pnpm build`
      # keeps the step's exit code. 4096 MB heap kept from the serial job
      # (next build --webpack aborted with exit 134 under the ~2 GB cap).
      - name: Production build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          if pnpm build; then
            exit 0
          fi
          echo "Production build failed; retrying once for next/font fetch flake"
          sleep 15
          pnpm build

  ci:
    name: Main quality gate
    needs: [quality, test, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All CI Main jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "quality/test/build results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::A CI Main job did not succeed ($r)"
              exit 1
            fi
          done

  production-proof:
    name: Production launch proof
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[pipeline-proof]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.28.2"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      - name: Run autonomous revenue pipeline
        env:
          AUTONOMOUS_PIPELINE_ENABLED: ${{ vars.PIPELINE_TICK_ENABLED != 'false' && 'true' || 'false' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: pnpm tsx server/jobs/pipeline-tick.ts

      - name: Produce cryptographic QRON + StoryMode proof
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTHICHAIN_ATTESTATION_KEY_ID: ${{ secrets.AUTHICHAIN_ATTESTATION_KEY_ID }}
          AUTHICHAIN_ATTESTATION_PRIVATE_KEY_B64: ${{ secrets.AUTHICHAIN_ATTESTATION_PRIVATE_KEY_B64 }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: pnpm tsx scripts/launch-proof.ts

      - name: Upload launch proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: authichain-production-launch-proof
          path: |
            artifacts/production-launch-proof.json
            artifacts/launch-proof-qron.png
          if-no-files-found: warn
