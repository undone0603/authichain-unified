name: Windows path safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read


# GB-26 fix 4: a newer commit on the same PR cancels the older run. Pushes to
# main, schedules and dispatches get one group per commit and are never
# cancelled (PM-328).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  paths:
    name: Reject NTFS-illegal filenames
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Scan index
        run: bash scripts/check-windows-paths.sh
