name: AgentZ protected provenance build (no deployment)

# Produces immutable, hash-addressed AgentZ source evidence from protected main.
# This is not a production launch or proof that a host runs these bytes.
on:
  push:
    branches: [main]
    paths:
      - "agentz/**"
      - "requirements-agentz.txt"
      - ".github/workflows/agentz-protected-provenance-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentz-provenance-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build AgentZ protected source artifact
    # Never grant release-asset write access to a non-protected branch.
    if: github.ref == 'refs/heads/main' && github.ref_protected && github.repository == 'undone0603/authichain-unified'
    permissions:
      contents: write # exclusively to create unpublished, hash-verified evidence assets
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 30
    steps:
      - name: Checkout exact protected source without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - name: Assert immutable source and compile AgentZ Python
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$GITHUB_SHA" ]; then
            echo "::error title=source-mismatch::Git checkout SHA does not match the immutable event SHA."
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error title=ref-mismatch::Build is not running from protected main."
            exit 1
          fi
          # The self-hosted runner can report a correct checkout HEAD while
          # its working directory is missing tracked files. Extract from the
          # immutable Git tree rather than trusting that working directory.
          for tracked in agentz/api/main.py requirements-agentz.txt; do
            if ! git cat-file -e "HEAD:$tracked"; then
              echo "::error title=missing-git-object::Required tracked source is missing from protected commit: $tracked"
              exit 1
            fi
          done
          if ! command -v python3 >/dev/null; then
            echo "::error title=missing-python::Python 3 was not found on ARM64 runner."
            exit 1
          fi
          source_dir="$RUNNER_TEMP/agentz-provenance-source"
          mkdir -p "$source_dir"
          git archive --format=tar HEAD agentz requirements-agentz.txt | tar -xf - -C "$source_dir"
          test -s "$source_dir/agentz/api/main.py"
          test -s "$source_dir/requirements-agentz.txt"
          echo "[agentz-evidence] exact protected Git tree exported; compiling AgentZ..."
          python3 -m compileall -q "$source_dir/agentz"
          echo "[agentz-evidence] compileall passed"
      - name: Package tracked AgentZ source and record SHA-256 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agentz-build-evidence
          git archive --format=tar HEAD agentz requirements-agentz.txt | gzip -n > agentz-build-evidence/agentz-source.tar.gz
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path

          def digest(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          evidence = Path("agentz-build-evidence")
          staged_source = Path(os.environ["RUNNER_TEMP"]) / "agentz-provenance-source"
          source_sha = os.environ["GITHUB_SHA"]
          if len(source_sha) != 40 or any(c not in "0123456789abcdef" for c in source_sha):
              raise SystemExit("Invalid source SHA")
          receipt = {
              "schema": "authichain.agentz.protected-source-build/1",
              "sourceSha": source_sha,
              "githubRunId": os.environ["GITHUB_RUN_ID"],
              "githubRunAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "githubRef": os.environ["GITHUB_REF"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "buildTimeUtc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "artifactFile": "agentz-source.tar.gz",
              "artifactSha256": digest(evidence / "agentz-source.tar.gz"),
              "apiMainSourceSha256": digest(staged_source / "agentz/api/main.py"),
              "dependenciesFileSha256": digest(staged_source / "requirements-agentz.txt"),
              "pythonCompileall": "passed",
              "productionDeployment": False,
              "runningExecutableAttested": False,
          }
          (evidence / "manifest.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          print(json.dumps(receipt, sort_keys=True))
          PY
          (
            cd agentz-build-evidence
            sha256sum agentz-source.tar.gz manifest.json > sha256sums.txt
            sha256sum -c sha256sums.txt
          )
      # The Actions artifact quota is exhausted on this estate. Keep the
      # protected source receipt independently downloadable as an unpublished
      # draft-release asset, with GitHub-side sha256/size readback verification.
      - name: Publish SHA-verified draft source evidence (no deployment)
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null || { echo "::error::gh CLI unavailable"; exit 1; }
          command -v jq >/dev/null || { echo "::error::jq unavailable"; exit 1; }
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cd agentz-build-evidence
          sha256sum --check sha256sums.txt
          for file in agentz-source.tar.gz manifest.json sha256sums.txt; do
            test -s "$file"
            test "$(stat -c%s "$file")" -lt 2147483648
          done
          tag="agentz-source-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" agentz-source.tar.gz manifest.json sha256sums.txt \
            --repo "$GITHUB_REPOSITORY" --draft --prerelease --target "$GITHUB_SHA" \
            --title "AgentZ source evidence $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --notes "BUILD EVIDENCE ONLY. Not a production release, host attestation, trading signer proof, DNS clearance, or authorization to place orders. SHA: $GITHUB_SHA. Run: $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT."
          payload="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          jq -e --arg sha "$GITHUB_SHA" --arg tag "$tag" \
            '.draft == true and .tag_name == $tag and .target_commitish == $sha and .published_at == null' \
            <<< "$payload" >/dev/null
          for file in agentz-source.tar.gz manifest.json sha256sums.txt; do
            digest="$(sha256sum "$file" | cut -d ' ' -f 1)"
            size="$(stat -c%s "$file")"
            jq -e --arg file "$file" --arg digest "sha256:$digest" \
              --argjson size "$size" \
              '[.assets[] | select(.name == $file and .state == "uploaded" and .digest == $digest and .size == $size)] | length == 1' \
              <<< "$payload" >/dev/null
          done
          {
            echo "AgentZ source evidence for exact protected main SHA: $GITHUB_SHA"
            echo "Draft release tag: $tag (unpublished, **not** a version release)"
            echo "All three assets matched GitHub REST SHA-256 and byte-size metadata."
            echo "**Running host artifact, EVM wallet authority and live swaps remain unverified.**"
          } >> "$GITHUB_STEP_SUMMARY"
