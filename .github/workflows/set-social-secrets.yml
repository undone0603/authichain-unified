name: Set Social Media Secrets

on:
  workflow_dispatch:
    inputs:
      TWITTER_API_KEY:
        description: "X/Twitter Consumer Key (@AuthiChain)"
        required: false
      TWITTER_API_SECRET:
        description: "X/Twitter Consumer Secret (@AuthiChain)"
        required: false
      TWITTER_ACCESS_TOKEN:
        description: "X/Twitter Access Token (@AuthiChain)"
        required: false
      TWITTER_ACCESS_TOKEN_SECRET:
        description: "X/Twitter Access Token Secret (@AuthiChain)"
        required: false

      TWITTER_QRON_API_KEY:
        description: "X/Twitter Consumer Key (@QRONspace)"
        required: false
      TWITTER_QRON_API_SECRET:
        description: "X/Twitter Consumer Secret (@QRONspace)"
        required: false
      TWITTER_QRON_ACCESS_TOKEN:
        description: "X/Twitter Access Token (@QRONspace)"
        required: false
      TWITTER_QRON_ACCESS_TOKEN_SECRET:
        description: "X/Twitter Access Token Secret (@QRONspace)"
        required: false

permissions:
  contents: read

jobs:
  set-social-secrets:
    name: Push social media secrets to Cloudflare Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Push secrets to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler secret put TWITTER_API_KEY --name authichain-unified <<< "${{ github.event.inputs.TWITTER_API_KEY }}"
          wrangler secret put TWITTER_API_SECRET --name authichain-unified <<< "${{ github.event.inputs.TWITTER_API_SECRET }}"
          wrangler secret put TWITTER_ACCESS_TOKEN --name authichain-unified <<< "${{ github.event.inputs.TWITTER_ACCESS_TOKEN }}"
          wrangler secret put TWITTER_ACCESS_TOKEN_SECRET --name authichain-unified <<< "${{ github.event.inputs.TWITTER_ACCESS_TOKEN_SECRET }}"

          wrangler secret put TWITTER_QRON_API_KEY --name authichain-unified <<< "${{ github.event.inputs.TWITTER_QRON_API_KEY }}"
          wrangler secret put TWITTER_QRON_API_SECRET --name authichain-unified <<< "${{ github.event.inputs.TWITTER_QRON_API_SECRET }}"
          wrangler secret put TWITTER_QRON_ACCESS_TOKEN --name authichain-unified <<< "${{ github.event.inputs.TWITTER_QRON_ACCESS_TOKEN }}"
          wrangler secret put TWITTER_QRON_ACCESS_TOKEN_SECRET --name authichain-unified <<< "${{ github.event.inputs.TWITTER_QRON_ACCESS_TOKEN_SECRET }}"
