name: Set Social Media Secrets

on:
  workflow_dispatch:
    inputs:
      TWITTER_API_KEY:
        description: "X/Twitter Consumer Key (@AuthiChain)"
        required: false
      TWITTER_API_SECRET:
        description: "X/Twitter Consumer Secret (@AuthiChain)"
        required: false
      TWITTER_ACCESS_TOKEN:
        description: "X/Twitter Access Token (@AuthiChain)"
        required: false
      TWITTER_ACCESS_TOKEN_SECRET:
        description: "X/Twitter Access Token Secret (@AuthiChain)"
        required: false
      TWITTER_QRON_API_KEY:
        description: "X/Twitter Consumer Key (@QRONspace)"
        required: false
      TWITTER_QRON_API_SECRET:
        description: "X/Twitter Consumer Secret (@QRONspace)"
        required: false
      TWITTER_QRON_ACCESS_TOKEN:
        description: "X/Twitter Access Token (@QRONspace)"
        required: false
      TWITTER_QRON_ACCESS_TOKEN_SECRET:
        description: "X/Twitter Access Token Secret (@QRONspace)"
        required: false
      YOUTUBE_CLIENT_ID:
        description: "YouTube OAuth Client ID"
        required: false
      YOUTUBE_CLIENT_SECRET:
        description: "YouTube OAuth Client Secret"
        required: false
      YOUTUBE_REFRESH_TOKEN:
        description: "YouTube OAuth Refresh Token (AuthiChain channel)"
        required: false
      YOUTUBE_CHANNEL_ID:
        description: "YouTube Channel ID (AuthiChain, e.g. UCxxxxxxxx)"
        required: false
      YOUTUBE_QRON_REFRESH_TOKEN:
        description: "YouTube OAuth Refresh Token (QRON channel)"
        required: false
      YOUTUBE_QRON_CHANNEL_ID:
        description: "YouTube Channel ID (QRON)"
        required: false
      QRON_AUTHICHAIN_KEY:
        description: "QRON ↔ AuthiChain bridge API key"
        required: false
      LINKEDIN_CLIENT_ID:
        description: "LinkedIn OAuth 2.0 Client ID"
        required: false
      LINKEDIN_CLIENT_SECRET:
        description: "LinkedIn OAuth 2.0 Client Secret"
        required: false
      LINKEDIN_ACCESS_TOKEN:
        description: "LinkedIn OAuth Access Token (60-day lifetime)"
        required: false
      LINKEDIN_REFRESH_TOKEN:
        description: "LinkedIn OAuth Refresh Token (if available)"
        required: false
      LINKEDIN_PERSON_URN:
        description: "LinkedIn Person URN (e.g. urn:li:person:XXXXXXXX)"
        required: false
      LINKEDIN_ORG_URN:
        description: "LinkedIn Organization URN for company page posts (optional)"
        required: false

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Push secrets to Cloudflare Worker
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: authichain-unified
        run: |
          set -e
          push_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "⏭  Skipping $name (not provided)"
              return
            fi
            http_status=$(curl -s -o /tmp/cf_resp.json -w "%{http_code}" \
              -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/secrets" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"${name}\",\"text\":\"${value}\",\"type\":\"secret_text\"}")
            if [ "$http_status" != "200" ] && [ "$http_status" != "201" ]; then
              echo "ERROR setting $name: HTTP $http_status"
              cat /tmp/cf_resp.json
              exit 1
            fi
            echo "✓ $name set on $WORKER_NAME"
          }

          push_secret "TWITTER_API_KEY"                   "${{ github.event.inputs.TWITTER_API_KEY }}"
          push_secret "TWITTER_API_SECRET"                "${{ github.event.inputs.TWITTER_API_SECRET }}"
          push_secret "TWITTER_ACCESS_TOKEN"              "${{ github.event.inputs.TWITTER_ACCESS_TOKEN }}"
          push_secret "TWITTER_ACCESS_TOKEN_SECRET"       "${{ github.event.inputs.TWITTER_ACCESS_TOKEN_SECRET }}"
          push_secret "TWITTER_QRON_API_KEY"              "${{ github.event.inputs.TWITTER_QRON_API_KEY }}"
          push_secret "TWITTER_QRON_API_SECRET"           "${{ github.event.inputs.TWITTER_QRON_API_SECRET }}"
          push_secret "TWITTER_QRON_ACCESS_TOKEN"         "${{ github.event.inputs.TWITTER_QRON_ACCESS_TOKEN }}"
          push_secret "TWITTER_QRON_ACCESS_TOKEN_SECRET"  "${{ github.event.inputs.TWITTER_QRON_ACCESS_TOKEN_SECRET }}"
          push_secret "YOUTUBE_CLIENT_ID"                 "${{ github.event.inputs.YOUTUBE_CLIENT_ID }}"
          push_secret "YOUTUBE_CLIENT_SECRET"             "${{ github.event.inputs.YOUTUBE_CLIENT_SECRET }}"
          push_secret "YOUTUBE_REFRESH_TOKEN"             "${{ github.event.inputs.YOUTUBE_REFRESH_TOKEN }}"
          push_secret "YOUTUBE_CHANNEL_ID"                "${{ github.event.inputs.YOUTUBE_CHANNEL_ID }}"
          push_secret "YOUTUBE_QRON_REFRESH_TOKEN"        "${{ github.event.inputs.YOUTUBE_QRON_REFRESH_TOKEN }}"
          push_secret "YOUTUBE_QRON_CHANNEL_ID"           "${{ github.event.inputs.YOUTUBE_QRON_CHANNEL_ID }}"
          push_secret "QRON_AUTHICHAIN_KEY"               "${{ github.event.inputs.QRON_AUTHICHAIN_KEY }}"
          push_secret "LINKEDIN_CLIENT_ID"               "${{ github.event.inputs.LINKEDIN_CLIENT_ID }}"
          push_secret "LINKEDIN_CLIENT_SECRET"           "${{ github.event.inputs.LINKEDIN_CLIENT_SECRET }}"
          push_secret "LINKEDIN_ACCESS_TOKEN"            "${{ github.event.inputs.LINKEDIN_ACCESS_TOKEN }}"
          push_secret "LINKEDIN_REFRESH_TOKEN"           "${{ github.event.inputs.LINKEDIN_REFRESH_TOKEN }}"
          push_secret "LINKEDIN_PERSON_URN"              "${{ github.event.inputs.LINKEDIN_PERSON_URN }}"
          push_secret "LINKEDIN_ORG_URN"                 "${{ github.event.inputs.LINKEDIN_ORG_URN }}"
          echo "All secrets processed."
