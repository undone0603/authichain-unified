name: Set Social Media Secrets

on:
  workflow_dispatch:
    inputs:
      TWITTER_API_KEY:
        description: "X/Twitter Consumer Key (@AuthiChain)"
        required: false
      TWITTER_API_SECRET:
        description: "X/Twitter Consumer Secret (@AuthiChain)"
        required: false
      TWITTER_ACCESS_TOKEN:
        description: "X/Twitter Access Token (@AuthiChain)"
        required: false
      TWITTER_ACCESS_TOKEN_SECRET:
        description: "X/Twitter Access Token Secret (@AuthiChain)"
        required: false
      TWITTER_QRON_API_KEY:
        description: "X/Twitter Consumer Key (@QRONspace)"
        required: false
      TWITTER_QRON_API_SECRET:
        description: "X/Twitter Consumer Secret (@QRONspace)"
        required: false
      TWITTER_QRON_ACCESS_TOKEN:
        description: "X/Twitter Access Token (@QRONspace)"
        required: false
      TWITTER_QRON_ACCESS_TOKEN_SECRET:
        description: "X/Twitter Access Token Secret (@QRONspace)"
        required: false
      YOUTUBE_CLIENT_ID:
        description: "YouTube OAuth Client ID"
        required: false
      YOUTUBE_CLIENT_SECRET:
        description: "YouTube OAuth Client Secret"
        required: false
      YOUTUBE_REFRESH_TOKEN:
        description: "YouTube OAuth Refresh Token (AuthiChain channel)"
        required: false
      YOUTUBE_CHANNEL_ID:
        description: "YouTube Channel ID (AuthiChain, e.g. UCxxxxxxxx)"
        required: false
      YOUTUBE_QRON_REFRESH_TOKEN:
        description: "YouTube OAuth Refresh Token (QRON channel)"
        required: false
      YOUTUBE_QRON_CHANNEL_ID:
        description: "YouTube Channel ID (QRON)"
        required: false
      QRON_AUTHICHAIN_KEY:
        description: "QRON ↔ AuthiChain bridge API key"
        required: false
      LINKEDIN_CLIENT_ID:
        description: "LinkedIn OAuth 2.0 Client ID"
        required: false
      LINKEDIN_CLIENT_SECRET:
        description: "LinkedIn OAuth 2.0 Client Secret"
        required: false
      LINKEDIN_ACCESS_TOKEN:
        description: "LinkedIn OAuth Access Token (60-day lifetime)"
        required: false
      LINKEDIN_REFRESH_TOKEN:
        description: "LinkedIn OAuth Refresh Token (if available)"
        required: false
      LINKEDIN_PERSON_URN:
        description: "LinkedIn Person URN (e.g. urn:li:person:XXXXXXXX)"
        required: false
      LINKEDIN_ORG_URN:
        description: "LinkedIn Organization URN for company page posts (optional)"
        required: false

permissions:
  contents: read

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push secrets to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # All inputs bound to env vars — never interpolate ${{ inputs.* }}
          # directly into run: scripts; that allows shell metacharacter injection.
          IN_TWITTER_API_KEY:               ${{ github.event.inputs.TWITTER_API_KEY }}
          IN_TWITTER_API_SECRET:            ${{ github.event.inputs.TWITTER_API_SECRET }}
          IN_TWITTER_ACCESS_TOKEN:          ${{ github.event.inputs.TWITTER_ACCESS_TOKEN }}
          IN_TWITTER_ACCESS_TOKEN_SECRET:   ${{ github.event.inputs.TWITTER_ACCESS_TOKEN_SECRET }}
          IN_TWITTER_QRON_API_KEY:          ${{ github.event.inputs.TWITTER_QRON_API_KEY }}
          IN_TWITTER_QRON_API_SECRET:       ${{ github.event.inputs.TWITTER_QRON_API_SECRET }}
          IN_TWITTER_QRON_ACCESS_TOKEN:     ${{ github.event.inputs.TWITTER_QRON_ACCESS_TOKEN }}
          IN_TWITTER_QRON_ACCESS_TOKEN_SECRET: ${{ github.event.inputs.TWITTER_QRON_ACCESS_TOKEN_SECRET }}
          IN_YOUTUBE_CLIENT_ID:             ${{ github.event.inputs.YOUTUBE_CLIENT_ID }}
          IN_YOUTUBE_CLIENT_SECRET:         ${{ github.event.inputs.YOUTUBE_CLIENT_SECRET }}
          IN_YOUTUBE_REFRESH_TOKEN:         ${{ github.event.inputs.YOUTUBE_REFRESH_TOKEN }}
          IN_YOUTUBE_CHANNEL_ID:            ${{ github.event.inputs.YOUTUBE_CHANNEL_ID }}
          IN_YOUTUBE_QRON_REFRESH_TOKEN:    ${{ github.event.inputs.YOUTUBE_QRON_REFRESH_TOKEN }}
          IN_YOUTUBE_QRON_CHANNEL_ID:       ${{ github.event.inputs.YOUTUBE_QRON_CHANNEL_ID }}
          IN_QRON_AUTHICHAIN_KEY:           ${{ github.event.inputs.QRON_AUTHICHAIN_KEY }}
          IN_LINKEDIN_CLIENT_ID:            ${{ github.event.inputs.LINKEDIN_CLIENT_ID }}
          IN_LINKEDIN_CLIENT_SECRET:        ${{ github.event.inputs.LINKEDIN_CLIENT_SECRET }}
          IN_LINKEDIN_ACCESS_TOKEN:         ${{ github.event.inputs.LINKEDIN_ACCESS_TOKEN }}
          IN_LINKEDIN_REFRESH_TOKEN:        ${{ github.event.inputs.LINKEDIN_REFRESH_TOKEN }}
          IN_LINKEDIN_PERSON_URN:           ${{ github.event.inputs.LINKEDIN_PERSON_URN }}
          IN_LINKEDIN_ORG_URN:              ${{ github.event.inputs.LINKEDIN_ORG_URN }}
        run: |
          set -e
          push_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "⏭  Skipping $name (not provided)"
              return
            fi
            echo "$value" | npx wrangler secret put "$name"
            echo "✓ $name set"
          }

          push_secret "TWITTER_API_KEY"                  "$IN_TWITTER_API_KEY"
          push_secret "TWITTER_API_SECRET"               "$IN_TWITTER_API_SECRET"
          push_secret "TWITTER_ACCESS_TOKEN"             "$IN_TWITTER_ACCESS_TOKEN"
          push_secret "TWITTER_ACCESS_TOKEN_SECRET"      "$IN_TWITTER_ACCESS_TOKEN_SECRET"
          push_secret "TWITTER_QRON_API_KEY"             "$IN_TWITTER_QRON_API_KEY"
          push_secret "TWITTER_QRON_API_SECRET"          "$IN_TWITTER_QRON_API_SECRET"
          push_secret "TWITTER_QRON_ACCESS_TOKEN"        "$IN_TWITTER_QRON_ACCESS_TOKEN"
          push_secret "TWITTER_QRON_ACCESS_TOKEN_SECRET" "$IN_TWITTER_QRON_ACCESS_TOKEN_SECRET"
          push_secret "YOUTUBE_CLIENT_ID"                "$IN_YOUTUBE_CLIENT_ID"
          push_secret "YOUTUBE_CLIENT_SECRET"            "$IN_YOUTUBE_CLIENT_SECRET"
          push_secret "YOUTUBE_REFRESH_TOKEN"            "$IN_YOUTUBE_REFRESH_TOKEN"
          push_secret "YOUTUBE_CHANNEL_ID"               "$IN_YOUTUBE_CHANNEL_ID"
          push_secret "YOUTUBE_QRON_REFRESH_TOKEN"       "$IN_YOUTUBE_QRON_REFRESH_TOKEN"
          push_secret "YOUTUBE_QRON_CHANNEL_ID"          "$IN_YOUTUBE_QRON_CHANNEL_ID"
          push_secret "QRON_AUTHICHAIN_KEY"              "$IN_QRON_AUTHICHAIN_KEY"
          push_secret "LINKEDIN_CLIENT_ID"               "$IN_LINKEDIN_CLIENT_ID"
          push_secret "LINKEDIN_CLIENT_SECRET"           "$IN_LINKEDIN_CLIENT_SECRET"
          push_secret "LINKEDIN_ACCESS_TOKEN"            "$IN_LINKEDIN_ACCESS_TOKEN"
          push_secret "LINKEDIN_REFRESH_TOKEN"           "$IN_LINKEDIN_REFRESH_TOKEN"
          push_secret "LINKEDIN_PERSON_URN"              "$IN_LINKEDIN_PERSON_URN"
          push_secret "LINKEDIN_ORG_URN"                 "$IN_LINKEDIN_ORG_URN"
          echo "All social secrets processed."
