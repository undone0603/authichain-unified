name: Set Social Media Secrets

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  set-social-secrets:
    name: Push social media secrets to Cloudflare Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Push secrets to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          TWITTER_QRON_API_KEY: ${{ secrets.TWITTER_QRON_API_KEY }}
          TWITTER_QRON_API_SECRET: ${{ secrets.TWITTER_QRON_API_SECRET }}
          TWITTER_QRON_ACCESS_TOKEN: ${{ secrets.TWITTER_QRON_ACCESS_TOKEN }}
          TWITTER_QRON_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_QRON_ACCESS_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          for required in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!required:-}" ]; then
              echo "::error::GitHub secret $required is empty"
              exit 1
            fi
          done
          for key in TWITTER_API_KEY TWITTER_API_SECRET TWITTER_ACCESS_TOKEN TWITTER_ACCESS_TOKEN_SECRET \
                     TWITTER_QRON_API_KEY TWITTER_QRON_API_SECRET TWITTER_QRON_ACCESS_TOKEN TWITTER_QRON_ACCESS_TOKEN_SECRET; do
            if [ -z "${!key:-}" ]; then
              echo "::notice::$key GitHub secret empty — not bound on authichain-unified"
              continue
            fi
            printf '%s' "${!key}" | wrangler secret put "$key" --name authichain-unified
            echo "bound $key on authichain-unified (value not logged)"
          done
