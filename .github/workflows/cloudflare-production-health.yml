name: Cloudflare production health

# Read-only probes of authichain.com + optional Workers API list.
# Never deploys. Never prints secret values.
on:
  push:
    branches: [main]
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

# These probes are read-only: a new main revision supersedes older probes.
concurrency:
  group: cloudflare-production-health-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  health:
    name: Public edge + Workers inventory
    # Runner labels alone do not prove host or credential isolation.
    if: ${{ vars.AUTHICHAIN_OPS_ISOLATION_ATTESTED == 'true' }}
    runs-on: [self-hosted, Linux, ARM64, authichain-ops]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Restore full tree after sparse checkout
        if: runner.environment == 'self-hosted'
        run: |
          git sparse-checkout disable
          git reset --hard HEAD
          test -f scripts/cloudflare-production-health.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Probe production
        env:
          AUTHICHAIN_ORIGIN: https://authichain.com
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare-production-health.mjs --run
