name: Nightstamp Scan Gate

on:
  pull_request:
    paths:
      - "src/lib/starmap/**"
      - "src/lib/vision.ts"
      - "src/app/api/starmap/**"
      - "scripts/nightstamp-scan-gate.ts"
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  scan-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0
      - run: pnpm exec tsx scripts/nightstamp-scan-gate.ts
