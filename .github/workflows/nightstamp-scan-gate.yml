name: Nightstamp Scan Gate

on:
  pull_request:
    paths:
      - "src/lib/starmap/**"
      - "src/lib/vision.ts"
      - "src/app/api/starmap/**"
      - "scripts/nightstamp-scan-gate.ts"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan-gate:
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0
      - run: pnpm exec tsx scripts/nightstamp-scan-gate.ts
