name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "30 1 * * 0"   # Sundays 01:30 UTC
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
          - language: python
          - language: actions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  # Gate job whose name matches the "CodeQL" required status check.
  # Waits for every matrix analysis job to complete before reporting,
  # which prevents the 2-second false-failure from the default setup.
  CodeQL:
    name: CodeQL
    needs: analyze
    runs-on: ubuntu-latest
    if: always()
    permissions: {}
    steps:
      - name: Require all analysis jobs to pass
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: |
          if [[ "$ANALYZE_RESULT" == "success" ]]; then
            echo "All CodeQL analysis jobs passed."
          else
            echo "CodeQL analysis result: $ANALYZE_RESULT"
            exit 1
          fi
