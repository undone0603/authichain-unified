name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "30 1 * * 0"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            # build-mode: none = extract from source without compiling.
            # Required for JS/TS in pnpm monorepos — autobuild exits 1.
            build-mode: none
          - language: python
            build-mode: none
            # Python scan failures are non-blocking — repo is primarily TS/JS.
            continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Do NOT use expression fallback — all matrix entries define build-mode explicitly.
          # The '|| autobuild' fallback was causing the action to ignore the matrix value.
          build-mode: ${{ matrix.build-mode }}
          config-file: .github/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  CodeQL:
    name: CodeQL
    needs: analyze
    runs-on: ubuntu-latest
    if: always()
    permissions: {}
    steps:
      - name: Require all analysis jobs to pass
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: |
          if [[ "$ANALYZE_RESULT" == "success" ]]; then
            echo "All CodeQL analysis jobs passed."
          else
            echo "CodeQL analysis result: $ANALYZE_RESULT"
            exit 1
          fi
