name: AgentZ Autonomous Edge Deploy

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  deploy-to-edge:
    # This ensures the action ONLY runs if the PR was actually merged, not just closed
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install Deployment CLIs
        run: npm install -g vercel wrangler
        
      - name: Execute AgentZ Deployment Router
        run: node agentz/deployment/edge-deploy.js
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
