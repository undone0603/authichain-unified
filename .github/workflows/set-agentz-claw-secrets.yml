# Bind claw bridge AGENTZ_* from GitHub Actions secrets onto Workers.
# Claw-only (skips authichain-agentz Containers Worker on $0 path).
# Does not print secret values.
name: Set agentz/claw secrets

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bind-claw:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Bind AGENTZ_* on authichain-openclaw
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
        run: |
          set -euo pipefail
          missing=0
          for name in AGENT_SECRET CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::GitHub secret $name is empty"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          printf '%s' 'https://agentz.authichain.com' | npx --yes wrangler@4 secret put AGENTZ_API_URL --name authichain-openclaw
          printf '%s' "$AGENT_SECRET" | npx --yes wrangler@4 secret put AGENTZ_API_KEY --name authichain-openclaw
          echo "bound claw AGENTZ_* secrets (values not logged)"
