# Bind claw AGENTZ_* from existing Actions secrets.
# Claw-only path does not require SUPABASE_*. authichain-agentz Containers
# bind is a separate best-effort job (continue-on-error).
# Does not invent OPENCLAW_GATEWAY_URL. Does not print secret values.
name: Set agentz/claw secrets

on:
  workflow_dispatch:
    inputs:
      bind_agentz_containers:
        description: "Also bind authichain-agentz Containers secrets (AGENT_SECRET + SUPABASE_*). Default off — $0 path is claw-only."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bind-claw:
    name: Bind claw AGENTZ_* only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install wrangler
        run: npm install -g wrangler
      - name: Put AGENTZ_API_URL + AGENTZ_API_KEY on authichain-openclaw
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
          DEV_TEAM_GITHUB_TOKEN: ${{ secrets.DEV_TEAM_GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          AGENT_SECRET_OUT: ${{ runner.temp }}/agent-secret.txt
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::GitHub secret $name is empty"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          chmod +x scripts/agentz-tunnel/resolve-agent-secret.sh
          scripts/agentz-tunnel/resolve-agent-secret.sh
          printf '%s' 'https://agentz.authichain.com' | wrangler secret put AGENTZ_API_URL --name authichain-openclaw
          wrangler secret put AGENTZ_API_KEY --name authichain-openclaw < "$AGENT_SECRET_OUT"
          echo "bound AGENTZ_API_URL + AGENTZ_API_KEY on authichain-openclaw (values not logged)"
          echo "skipped OPENCLAW_GATEWAY_URL (owner-set only; do not invent)"
      - name: Upload 1-day minted AGENT_SECRET (only if minted this run)
        if: env.minted_agent_secret == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: agentz-agent-secret
          path: ${{ runner.temp }}/agent-secret.txt
          retention-days: 1
          if-no-files-found: ignore

  bind-agentz:
    name: Bind authichain-agentz (best-effort)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.inputs.bind_agentz_containers == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Install wrangler
        run: npm install -g wrangler
      - name: Put Containers secrets on authichain-agentz
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AGENT_SECRET:-}" ]; then
            echo "::notice::AGENT_SECRET empty — skipping authichain-agentz (Containers stay undeployed on \$0)."
            exit 0
          fi
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::notice::SUPABASE_* missing — skipping authichain-agentz Worker secrets."
            exit 0
          fi
          printf '%s' "$AGENT_SECRET" | wrangler secret put AGENT_SECRET --name authichain-agentz
          printf '%s' "$SUPABASE_URL" | wrangler secret put SUPABASE_URL --name authichain-agentz
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | wrangler secret put SUPABASE_SERVICE_ROLE_KEY --name authichain-agentz
          echo "bound authichain-agentz secrets (values not logged)"
