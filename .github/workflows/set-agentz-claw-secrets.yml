# Bind AgentZ + claw bridge secrets from GitHub Actions secrets onto Workers.
# Does not print secret values. Requires AGENT_SECRET, SUPABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: Set agentz/claw secrets

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "10.28.2"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0
      - name: Bind secrets on authichain-agentz and authichain-openclaw
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in AGENT_SECRET SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::GitHub secret $name is empty"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          printf '%s' "$AGENT_SECRET" | npx wrangler secret put AGENT_SECRET --name authichain-agentz
          printf '%s' "$SUPABASE_URL" | npx wrangler secret put SUPABASE_URL --name authichain-agentz
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --name authichain-agentz
          printf '%s' 'https://agentz.authichain.com' | npx wrangler secret put AGENTZ_API_URL --name authichain-openclaw
          printf '%s' "$AGENT_SECRET" | npx wrangler secret put AGENTZ_API_KEY --name authichain-openclaw
          echo "bound agentz + claw AGENTZ_* secrets (values not logged)"
