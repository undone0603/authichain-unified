name: Pipeline Task Monitor

# A separate read-only heartbeat. This workflow only queries task metrics and
# never invokes the pipeline tick or writes task state.
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

concurrency:
  group: pipeline-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL repo secret is not set; read-only pipeline monitoring cannot run."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      - name: Read-only pipeline snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: pnpm tsx scripts/monitor-autonomous-pipeline.ts --once
