name: Deploy Next.js to Cloudflare Workers (OpenNext)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-nextjs:
    runs-on: ubuntu-latest
    name: Build + deploy (authichain.com)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: '10.28.2'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build with OpenNext for Cloudflare
        run: pnpm cf:build
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
          NODE_ENV: production

      - name: Run Database Migrations
        run: |
          set +e
          if [ -n "$DATABASE_URL" ]; then
            npx tsx scripts/migrate-pg.ts
            RESULT=$?
            if [ $RESULT -ne 0 ]; then
              echo "Migrations failed (exit $RESULT) — DB already up-to-date or unreachable, continuing deploy"
            fi
          else
            echo "DATABASE_URL not set — skipping migrations"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Debug — bundle and inspect final worker for .resolve calls
        run: |
          echo "=== .open-next/worker.js line count ==="
          wc -l .open-next/worker.js 2>/dev/null || echo "not found"
          echo "=== .open-next/server-functions/ structure ==="
          find .open-next/server-functions -name "*.mjs" -o -name "*.js" 2>/dev/null | head -10
          echo ""
          # Bundle the worker without deploying (--dry-run outputs the bundle path)
          # Use wrangler to generate the bundle so we can inspect the final artifact
          echo "=== Generating bundle with wrangler --dry-run ==="
          pnpm exec wrangler deploy --dry-run --outdir .wrangler/bundle-debug 2>&1 || true
          echo ""
          echo "=== files in .wrangler/bundle-debug ==="
          ls -la .wrangler/bundle-debug/ 2>/dev/null || echo "not found"
          echo ""
          # Find the largest JS file (the actual bundle)
          BUNDLE=$(find .wrangler/bundle-debug -name "*.js" -o -name "*.mjs" 2>/dev/null | xargs wc -l 2>/dev/null | sort -rn | head -1 | awk '{print $2}')
          if [ -n "$BUNDLE" ] && [ -f "$BUNDLE" ]; then
            echo "=== bundle: $BUNDLE ($(wc -l < "$BUNDLE") lines) ==="
            echo "=== .resolve( calls (non-Promise/path/require) ==="
            grep -n "\.resolve(" "$BUNDLE" | grep -v "Promise\.resolve\|path\.resolve\|URL\.resolve\|require\.resolve\|_resolve\b" | head -30 || echo "(none)"
            echo "=== __require.resolve / __require2.resolve ==="
            grep -n "__require[0-9]*\.resolve" "$BUNDLE" | head -20 || echo "(none — patch applied)"
            echo "=== cacheHandlerPath ==="
            grep -n "cacheHandlerPath\|composableCacheHandlerPath" "$BUNDLE" | head -10 || echo "(none)"
          else
            echo "bundle file not found; searching /tmp for large JS files..."
            find /tmp -name "*.js" -size +1M 2>/dev/null | head -5
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Sync secrets to CF Worker
        run: |
          set +e
          push_secret() {
            local name=$1
            local value=$2
            if [ -n "$value" ]; then
              echo "$value" | pnpm exec wrangler secret put "$name" --name authichain-unified
              echo "✓ $name"
            else
              echo "⚠ $name not set in GitHub secrets — skipping"
            fi
          }
          push_secret SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          push_secret DATABASE_URL             "$DATABASE_URL"
          push_secret STRIPE_SECRET_KEY        "$STRIPE_SECRET_KEY"
          push_secret STRIPE_WEBHOOK_SECRET    "$STRIPE_WEBHOOK_SECRET"
          push_secret RESEND_API_KEY           "$RESEND_API_KEY"
          push_secret INTERNAL_API_SECRET      "$INTERNAL_API_SECRET"
          push_secret HUBSPOT_ACCESS_TOKEN     "$HUBSPOT_ACCESS_TOKEN"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
