name: Deploy Next.js to Cloudflare Workers (OpenNext)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-nextjs:
    runs-on: ubuntu-latest
    name: Build + deploy (authichain.com)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: '10.28.2'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build with OpenNext for Cloudflare
        run: pnpm cf:build
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
          NODE_ENV: production

      - name: Run Database Migrations
        run: |
          set +e
          if [ -n "$DATABASE_URL" ]; then
            npx tsx scripts/migrate-pg.ts
            RESULT=$?
            if [ $RESULT -ne 0 ]; then
              echo "Migrations failed (exit $RESULT) — DB already up-to-date or unreachable, continuing deploy"
            fi
          else
            echo "DATABASE_URL not set — skipping migrations"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Debug — bundle, inspect, and upload worker artifact
        run: |
          echo "=== Generating bundle with wrangler --dry-run ==="
          pnpm exec wrangler deploy --dry-run --outdir .wrangler/bundle-debug 2>&1 || true
          echo ""
          BUNDLE=".wrangler/bundle-debug/worker.js"
          if [ ! -f "$BUNDLE" ]; then echo "bundle not found"; exit 0; fi
          echo "=== bundle: $(wc -l < "$BUNDLE") lines ==="
          echo ""
          echo "=== .resolve( calls (non-Promise/path/require) with 3-line context ==="
          grep -n "\.resolve(" "$BUNDLE" \
            | grep -v "Promise\.resolve\|path\.resolve\|URL\.resolve\|require\.resolve\|_resolve\b" \
            | head -30 \
            | while IFS=: read -r LINENO REST; do
                echo "--- line $LINENO ---"
                sed -n "$((LINENO-1)),$((LINENO+1))p" "$BUNDLE" | cut -c1-200
              done || echo "(none)"
          echo ""
          echo "=== __require.resolve occurrences ==="
          grep -n "__require[0-9]*\.resolve" "$BUNDLE" | head -10 || echo "(none — cacheHandlerPath patch applied)"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Upload worker bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-bundle
          path: .wrangler/bundle-debug/worker.js
          retention-days: 1

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Sync secrets to CF Worker
        run: |
          set +e
          push_secret() {
            local name=$1
            local value=$2
            if [ -n "$value" ]; then
              echo "$value" | pnpm exec wrangler secret put "$name" --name authichain-unified
              echo "✓ $name"
            else
              echo "⚠ $name not set in GitHub secrets — skipping"
            fi
          }
          push_secret SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          push_secret DATABASE_URL             "$DATABASE_URL"
          push_secret STRIPE_SECRET_KEY        "$STRIPE_SECRET_KEY"
          push_secret STRIPE_WEBHOOK_SECRET    "$STRIPE_WEBHOOK_SECRET"
          push_secret RESEND_API_KEY           "$RESEND_API_KEY"
          push_secret INTERNAL_API_SECRET      "$INTERNAL_API_SECRET"
          push_secret HUBSPOT_ACCESS_TOKEN     "$HUBSPOT_ACCESS_TOKEN"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
