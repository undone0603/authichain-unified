name: Deploy Next.js to Cloudflare Workers (OpenNext)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-nextjs:
    runs-on: ubuntu-latest
    name: Build + deploy (authichain.com)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: '10.28.2'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with OpenNext for Cloudflare
        run: pnpm cf:build
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
          NODE_ENV: production

      - name: Run Database Migrations
        run: |
          set +e
          if [ -n "$DATABASE_URL" ]; then
            npx tsx scripts/migrate-pg.ts
            RESULT=$?
            if [ $RESULT -ne 0 ]; then
              echo "Migrations failed (exit $RESULT) — DB already up-to-date or unreachable, continuing deploy"
            fi
          else
            echo "DATABASE_URL not set — skipping migrations"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Patch handler.mjs — remove require.resolve cache calls OpenNext missed
        run: |
          HANDLER=".open-next/server-functions/default/handler.mjs"
          if [ ! -f "$HANDLER" ]; then echo "handler.mjs not found, skipping"; exit 0; fi
          echo "=== handler.mjs size: $(wc -l < "$HANDLER") lines ==="
          echo "=== searching for require.resolve cache calls ==="
          grep -n "resolve.*cache\.cjs\|cacheHandlerPath\|composable-cache\.cjs" "$HANDLER" | head -10
          # Patch: replace __require.resolve("./cache.cjs") and variants with ""
          # These are require.resolve calls for Next.js cache modules that crash on CF Workers
          sed -i 's/\b\w\+\.resolve("\.\/cache\.cjs")/\"\"/g' "$HANDLER"
          sed -i 's/\b\w\+\.resolve("\.\/composable-cache\.cjs")/\"\"/g' "$HANDLER"
          echo "=== after patch — remaining resolve calls ==="
          grep -n "resolve.*cache\.cjs\|resolve.*composable-cache" "$HANDLER" | head -5 || echo "(none — patched successfully)"

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Clear root-domain zone routes + restore subdomain routes
        run: |
          set +e
          echo "=== Getting zone ID for authichain.com ==="
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=authichain.com" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | \
            python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('result',[]);print(r[0]['id'] if r else '')" 2>/dev/null)
          if [ -z "$ZONE_ID" ]; then
            echo "Cannot resolve zone ID (token may lack Zone:Read) — skipping"
            exit 0
          fi
          echo "Zone ID: $ZONE_ID"

          echo "=== Current zone routes ==="
          ROUTES=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "$ROUTES" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for r in d.get('result',[]):
              print(f'  {r[\"id\"]}  {r.get(\"pattern\",\"\")}  →  {r.get(\"script\",\"(none)\")}')
          " 2>/dev/null || echo "$ROUTES"

          echo "=== Deleting root-domain routes that conflict with authichain-unified ==="
          # Only delete routes on the root domain (authichain.com/* or www.authichain.com/* or *.authichain.com/*)
          # Keep subdomain-specific routes (api.authichain.com/*, dashboard.authichain.com/*, etc.)
          for ROUTE_ID in $(echo "$ROUTES" | python3 -c "
          import sys,json,re
          d=json.load(sys.stdin)
          for r in d.get('result',[]):
              p=r.get('pattern',''); s=r.get('script','')
              is_root = (p.startswith('authichain.com/') or p.startswith('www.authichain.com/') or p == '*.authichain.com/*')
              if is_root and s != 'authichain-unified':
                  print(r['id'])
          " 2>/dev/null); do
            echo "  Deleting route $ROUTE_ID"
            curl -s -X DELETE \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes/$ROUTE_ID" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | \
              python3 -c "import sys,json;d=json.load(sys.stdin);print('  ✓ deleted' if d.get('success') else f'  ✗ {d}')" 2>/dev/null
          done

          echo "=== Ensuring subdomain routes exist ==="
          ensure_route() {
            local pattern=$1
            local script=$2
            EXISTING=$(echo "$ROUTES" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for r in d.get('result',[]):
              if r.get('pattern','') == '$pattern' and r.get('script','') == '$script':
                  print('exists')
                  break
          " 2>/dev/null)
            if [ "$EXISTING" = "exists" ]; then
              echo "  ✓ $pattern → $script (already exists)"
            else
              RESULT=$(curl -s -X POST \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"pattern\":\"$pattern\",\"script\":\"$script\"}")
              echo "$RESULT" | python3 -c "import sys,json;d=json.load(sys.stdin);print('  ✓ created $pattern → $script' if d.get('success') else f'  ✗ {d}')" 2>/dev/null
            fi
          }
          ensure_route "api.authichain.com/*"       "authichain-api-gateway"
          ensure_route "dashboard.authichain.com/*"  "authichain-dashboard"

          echo "=== Route management complete ==="
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Sync secrets to CF Worker
        run: |
          set +e
          push_secret() {
            local name=$1
            local value=$2
            if [ -n "$value" ]; then
              echo "$value" | pnpm exec wrangler secret put "$name" --name authichain-unified
              echo "✓ $name"
            else
              echo "⚠ $name not set in GitHub secrets — skipping"
            fi
          }
          push_secret SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          push_secret DATABASE_URL             "$DATABASE_URL"
          push_secret STRIPE_SECRET_KEY        "$STRIPE_SECRET_KEY"
          push_secret STRIPE_WEBHOOK_SECRET    "$STRIPE_WEBHOOK_SECRET"
          push_secret RESEND_API_KEY           "$RESEND_API_KEY"
          push_secret INTERNAL_API_SECRET      "$INTERNAL_API_SECRET"
          push_secret HUBSPOT_ACCESS_TOKEN     "$HUBSPOT_ACCESS_TOKEN"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
