name: Seed AGENT_SECRET if empty

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  seed-and-bind-claw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Resolve AGENT_SECRET and bind claw
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXISTING: ${{ secrets.AGENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          if [ -n "${EXISTING:-}" ]; then
            AGENT_SECRET="$EXISTING"
            echo "using existing AGENT_SECRET from Actions"
          else
            AGENT_SECRET=$(openssl rand -base64 32 | tr -d '\n')
            echo "generated ephemeral AGENT_SECRET for claw bind"
          fi
          printf '%s' "$AGENT_SECRET" > agent_secret.value
          printf '%s' 'https://agentz.authichain.com' | npx --yes wrangler@4 secret put AGENTZ_API_URL --name authichain-openclaw
          printf '%s' "$AGENT_SECRET" | npx --yes wrangler@4 secret put AGENTZ_API_KEY --name authichain-openclaw
          echo "bound claw AGENTZ_*"
      - uses: actions/upload-artifact@v4
        with:
          name: agentz-agent-secret
          path: agent_secret.value
          retention-days: 1
