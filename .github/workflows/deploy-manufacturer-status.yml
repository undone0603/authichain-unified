name: Deploy manufacturer-status Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy manufacturer-status
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check secrets
        id: secrets_check
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Missing CLOUDFLARE secrets"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup pnpm
        if: steps.secrets_check.outputs.skip != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node
        if: steps.secrets_check.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.secrets_check.outputs.skip != 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Deploy manufacturer-status
        if: steps.secrets_check.outputs.skip != 'true'
        working-directory: workers/manufacturer-status
        run: npx wrangler deploy --minify --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Done
        run: echo "manufacturer-status deployed (or skipped)"
