name: Verified deployment commit

on:
  push:
    branches:
      - fix/attestation-wiring-gaps

permissions:
  contents: write

jobs:
  establish-verified-commit:
    # GitHub's Actions App can produce a verified bot commit when the API
    # request uses GITHUB_TOKEN without custom author/committer/signature data.
    # The resulting commit gives Vercel a verified GitHub commit to deploy.
    runs-on: ubuntu-latest
    steps:
      - name: Create verified bot commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          content="Verified deployment bootstrap: ${GITHUB_SHA}"
          encoded="$(printf '%s' "$content" | base64 -w0)"
          gh api --method PUT \
            "repos/${REPO}/contents/.github/verified-deployment.marker" \
            -f message='chore: establish verified deployment commit' \
            -f content="$encoded" \
            -f branch="$BRANCH"
