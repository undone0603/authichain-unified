name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan the tree being deployed
        run: |
          # Same tree scan as deploy-workers.yml. gitleaks-action@v3 fails
          # the job when its license lookup is rate-limited, which skipped
          # this deploy without a secret in the tree.
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o gitleaks.tgz
          tar --no-same-owner -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: secret-scan
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check required secrets
        id: secrets_check
        shell: bash
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set — skipping Cloudflare deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup PNPM
        if: steps.secrets_check.outputs.skip != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node 22
        if: steps.secrets_check.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        if: steps.secrets_check.outputs.skip != 'true'
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      - name: Build frontend
        if: steps.secrets_check.outputs.skip != 'true'
        run: pnpm run build
        env:
          VITE_APP_ID: ${{ secrets.VITE_APP_ID }}
          VITE_ANALYTICS_ENDPOINT: ${{ secrets.VITE_ANALYTICS_ENDPOINT }}
          VITE_ANALYTICS_WEBSITE_ID: ${{ secrets.VITE_ANALYTICS_WEBSITE_ID }}

      - name: Inspect build output
        if: steps.secrets_check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== cwd ==="
          pwd
          echo "=== package.json scripts ==="
          node -e "const p=require('./package.json'); console.log(JSON.stringify(p.scripts||{},null,2))"
          echo "=== wrangler configs ==="
          find . -name 'wrangler.toml' -o -name 'wrangler.json' -o -name 'wrangler.jsonc' | head -50
          echo "=== deep artifact search ==="
          find . \( -path './.git' -o -path './node_modules' \) -prune -o \
            \( -name dist -o -name out -o -name .open-next -o -name .next -o -name build \) -print
          echo "=== next.config output ==="
          find . -name 'next.config.*' -print
      # Publishes worker-app as authichain-edge-router. Does NOT bind
      # STRIPE_WEBHOOK_* — those persist from wrangler secret put / the
      # bind-stripe-webhook-secrets workflow. A reminted Dashboard secret
      # will keep 400ing until that Worker secret is updated.
      - name: Publish application Worker + Assets
        if: steps.secrets_check.outputs.skip != 'true'
        working-directory: worker-app
        run: npx wrangler deploy --minify --keep-vars --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Bind attestation key on authichain-edge-router
        if: steps.secrets_check.outputs.skip != 'true'
        working-directory: worker-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTHICHAIN_ATTESTATION_PRIVATE_KEY_B64: ${{ secrets.AUTHICHAIN_ATTESTATION_PRIVATE_KEY_B64 }}
          AUTHICHAIN_ATTESTATION_KEY_ID: ${{ secrets.AUTHICHAIN_ATTESTATION_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          WORKER_NAME="authichain-edge-router"
          JWKS_CODE="$(curl -sS -o /tmp/jwks-probe.json -w '%{http_code}' \
            https://authichain.com/protocol/jwks.json || echo 000)"
          if [ "$JWKS_CODE" = "200" ]; then
            echo "JWKS already live ($JWKS_CODE)"
            # A key ID can be added or rotated independently of the private key.
            # Do not short-circuit before propagating a newly-added
            # AUTHICHAIN_ATTESTATION_KEY_ID secret to the Worker.
            if [ -n "${AUTHICHAIN_ATTESTATION_KEY_ID:-}" ]; then
              printf '%s' "$AUTHICHAIN_ATTESTATION_KEY_ID" | npx wrangler secret put \
                AUTHICHAIN_ATTESTATION_KEY_ID --name "$WORKER_NAME"
              echo "bound AUTHICHAIN_ATTESTATION_KEY_ID on $WORKER_NAME"
              npx wrangler deploy --minify --keep-vars --config wrangler.toml
            else
              echo "AUTHICHAIN_ATTESTATION_KEY_ID not supplied — leaving existing binding in place"
            fi
            exit 0
          fi
          KEY_B64="${AUTHICHAIN_ATTESTATION_PRIVATE_KEY_B64:-}"
          if [ -z "$KEY_B64" ]; then
            echo "GitHub secret empty and JWKS is $JWKS_CODE — generating Ed25519 v0.1 key"
          else
            echo "Deriving public JWK from the GitHub-stored PKCS#8"
          fi
          EXISTING_KEY_B64="$KEY_B64" node ../scripts/bind-attestation-jwks.mjs
          KEY_B64="$(cat /tmp/attest-pkcs8.b64)"
          printf '%s' "$KEY_B64" | npx wrangler secret put \
            AUTHICHAIN_ATTESTATION_PRIVATE_KEY_B64 --name "$WORKER_NAME"
          printf '%s' "$(cat /tmp/attest-pub.jwk)" | npx wrangler secret put \
            AUTHICHAIN_ATTESTATION_PUBLIC_JWK --name "$WORKER_NAME"
          if [ -n "${AUTHICHAIN_ATTESTATION_KEY_ID:-}" ]; then
            printf '%s' "$AUTHICHAIN_ATTESTATION_KEY_ID" | npx wrangler secret put \
              AUTHICHAIN_ATTESTATION_KEY_ID --name "$WORKER_NAME"
          fi
          echo "bound AUTHICHAIN_ATTESTATION_PRIVATE_KEY_B64 + PUBLIC_JWK on $WORKER_NAME"
          echo "re-deploying so custom routes attach to the version that has the secret"
          npx wrangler deploy --minify --keep-vars --config wrangler.toml
          for i in 1 2 3 4 5 6 7 8; do
            sleep 5
            AFTER="$(curl -sS -o /tmp/jwks-after.json -w '%{http_code}' \
              https://authichain.com/protocol/jwks.json || echo 000)"
            if [ "$AFTER" = "200" ]; then
              echo "JWKS live after bind ($AFTER)"
              exit 0
            fi
            echo "JWKS $AFTER after bind, retry $i"
            cat /tmp/jwks-after.json || true
            echo
          done
          echo "JWKS still not 200 after bind"
          cat /tmp/jwks-after.json || true
          exit 1

      - name: Deploy authichain-scan-validate
        if: ${{ always() && steps.secrets_check.outputs.skip != 'true' }}
        working-directory: workers/authichain-scan-validate
        run: npx wrangler deploy --minify --keep-vars --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy skipped notice
        if: steps.secrets_check.outputs.skip == 'true'
        run: echo "::notice::Cloudflare deploy skipped — set CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID in repo secrets to enable."
