name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy Worker + Static Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v5
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node 22 (required for Wrangler + Miniflare)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend (+ dist/public for Wrangler [assets])
        run: pnpm run build
        working-directory: workers/authichain-dashboard
        env:
          VITE_APP_ID: ${{ secrets.VITE_APP_ID }}

      - name: Publish Worker + Assets
        run: pnpm exec wrangler deploy --config wrangler.toml
        working-directory: workers/authichain-dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
