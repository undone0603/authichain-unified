name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact protected main SHA with eight successful CircleCI checks
        required: true
        type: string

permissions:
  contents: read
  actions: read
  statuses: read
  deployments: read

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secret-scan:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Secret scan
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan the tree being deployed
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_$(uname -m | sed "s/aarch64/arm64/;s/x86_64/x64/").tar.gz -o gitleaks.tgz
          tar --no-same-owner -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose

  deploy:
    name: Deploy to Cloudflare
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment:
      name: production-cloudflare-manufacturer-status
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    needs: secret-scan
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
          clean: true
      - name: Restore exact protected main checkout
        run: |
          set -euo pipefail
          git sparse-checkout disable
          git reset --hard HEAD
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
      - name: Verify protected exact-SHA release policy before mutations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          RELEASE_ENV: production-cloudflare-manufacturer-status
        run: node scripts/ci/guard-production-secret-binding.mjs

      - name: Check required dedicated Cloudflare credentials
        id: secrets_check
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AUTHICHAIN_MANUFACTURER_STATUS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.AUTHICHAIN_MANUFACTURER_STATUS_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Dedicated manufacturer-status Cloudflare credentials are unavailable; no release performed"
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Setup PNPM
        timeout-minutes: 15
        if: steps.secrets_check.outputs.skip != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node 22
        timeout-minutes: 15
        if: steps.secrets_check.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        timeout-minutes: 15
        if: steps.secrets_check.outputs.skip != 'true'
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      - name: Deploy manufacturer-status
        if: steps.secrets_check.outputs.skip != 'true'
        working-directory: workers/manufacturer-status
        run: npx wrangler deploy --minify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AUTHICHAIN_MANUFACTURER_STATUS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.AUTHICHAIN_MANUFACTURER_STATUS_CLOUDFLARE_ACCOUNT_ID }}

      # CFA-462 / CFA-464 (P1): this step only CHECKS that the attestation JWKS
      # is live. It never generates, installs or rotates a signing key, and it
      # never re-sets AUTHICHAIN_ATTESTATION_KEY_ID (the kid is derived from the
      # public key's RFC 7638 thumbprint in worker-app/jwks.ts). On 2026-10-09 a
      # non-200 probe here silently replaced the production key.
      - name: Check attestation JWKS on authichain-edge-router (no key changes)
        if: steps.secrets_check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          JWKS_CODE="$(curl -sS -o /tmp/jwks-probe.json -w '%{http_code}' \
            https://authichain.com/protocol/jwks.json || echo 000)"
          if [ "$JWKS_CODE" != "200" ]; then
            echo "::error::JWKS returned $JWKS_CODE; refusing to generate, install or rotate the signing key. Investigate by hand."
            exit 1
          fi
          echo "JWKS live ($JWKS_CODE); no key changes made"

      - name: Deploy skipped notice
        if: steps.secrets_check.outputs.skip == 'true'
        run: echo "::notice::Cloudflare deploy skipped — set CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID in repo secrets to enable."
