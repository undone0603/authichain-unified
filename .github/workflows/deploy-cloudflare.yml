name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy Worker + Static Assets
    runs-on: ubuntu-latest
              timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node 22 (required for Wrangler + Miniflare)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch missing Shadcn dependencies
        # Workaround: Installs the missing Tailwind v4 package workspace-wide
        run: pnpm add tw-animate-css

      - name: Build frontend (+ dist/public for Wrangler [assets])
        run: pnpm run build
        # If your root package.json build script handles the worker build, leave this as-is.
        # Otherwise, uncomment the line below to build a specific worker:
        # working-directory: workers/authichain-dashboard
        env:
          VITE_APP_ID: ${{ secrets.VITE_APP_ID }}
          VITE_ANALYTICS_ENDPOINT: ${{ secrets.VITE_ANALYTICS_ENDPOINT }}
          VITE_ANALYTICS_WEBSITE_ID: ${{ secrets.VITE_ANALYTICS_WEBSITE_ID }}

      - name: Publish Worker + Assets
        run: npx wrangler deploy --config wrangler.toml
        working-directory: workers/authichain-dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy authichain-scan-validate
        # Core product worker: decodes QR from image URL, stores scan result to D1
        # Requires D1 database binding (authichain-provenance, id: ebd8081b-ac13-485a-8b0e-a6cd9c0f7be5)
        run: npx wrangler deploy --config wrangler.toml
        working-directory: workers/authichain-scan-validate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
