name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Job 1: Dynamically Discover Workers ─────────────────────────────────────
  setup-matrix:
    name: Discover Worker Directories
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate matrix from workers/ directory
        id: set-matrix
        # This scans the "workers/" folder, finds all subdirectories containing
        # a "wrangler.toml", and outputs them as a JSON array for the next job.
        run: |
          node -e "
            const fs = require('fs');
            const dirs = fs.readdirSync('workers').filter(f => {
              const isDir = fs.statSync('workers/'+f).isDirectory();
              const hasToml = fs.existsSync('workers/'+f+'/wrangler.toml');
              return isDir && hasToml;
            });
            console.log('matrix=' + JSON.stringify(dirs));
          " >> "$GITHUB_OUTPUT"

  # ── Job 2: Deploy Matrix ────────────────────────────────────────────────────
  deploy:
    name: Deploy ${{ matrix.worker }}
    runs-on: ubuntu-latest
    needs: setup-matrix
    strategy:
      fail-fast: false # Prevents one failed worker from cancelling the rest
      matrix:
        worker: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node 22 (required for Wrangler + Miniflare)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend (+ dist/public for Wrangler [assets])
        run: pnpm run build
        env:
          VITE_APP_ID: ${{ secrets.VITE_APP_ID }}

      - name: Publish Worker + Assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Dynamically target the specific worker's configuration file
          command: deploy --config workers/${{ matrix.worker }}/wrangler.toml
