name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Serialize production deploys so an older commit can never land after a newer one.
# Never cancel a running deploy (a cancelled deploy can leave a Worker half-bound).
concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan the tree being deployed
        run: |
          # Same tree scan as deploy-workers.yml. gitleaks-action@v3 fails
          # the job when its license lookup is rate-limited, which skipped
          # this deploy without a secret in the tree.
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o gitleaks.tgz
          tar --no-same-owner -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose

  deploy:
    name: Deploy to Cloudflare
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    needs: secret-scan
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check required secrets
        id: secrets_check
        shell: bash
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set — skipping Cloudflare deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup PNPM
        if: steps.secrets_check.outputs.skip != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node 22
        if: steps.secrets_check.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        if: steps.secrets_check.outputs.skip != 'true'
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      - name: Build frontend
        if: steps.secrets_check.outputs.skip != 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_APP_ID: ${{ secrets.VITE_APP_ID }}
          VITE_ANALYTICS_ENDPOINT: ${{ secrets.VITE_ANALYTICS_ENDPOINT }}
          VITE_ANALYTICS_WEBSITE_ID: ${{ secrets.VITE_ANALYTICS_WEBSITE_ID }}
        run: |
          # Same cap as CI Main. The default heap aborts next build --webpack
          # with exit 134 before the edge router can publish.
          if pnpm build; then
            exit 0
          fi
          echo "Production build failed; retrying once"
          sleep 15
          pnpm build

      - name: Inspect build output
        if: steps.secrets_check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== cwd ==="
          pwd
          echo "=== package.json scripts ==="
          node -e "const p=require('./package.json'); console.log(JSON.stringify(p.scripts||{},null,2))"
          echo "=== wrangler configs ==="
          find . -name 'wrangler.toml' -o -name 'wrangler.json' -o -name 'wrangler.jsonc' | head -50
          echo "=== deep artifact search ==="
          find . \( -path './.git' -o -path './node_modules' \) -prune -o \
            \( -name dist -o -name out -o -name .open-next -o -name .next -o -name build \) -print
          echo "=== next.config output ==="
          find . -name 'next.config.*' -print
      # Publishes worker-app as authichain-edge-router. Does NOT bind
      # STRIPE_WEBHOOK_* — those persist from wrangler secret put / the
      # bind-stripe-webhook-secrets workflow. A reminted Dashboard secret
      # will keep 400ing until that Worker secret is updated.
      - name: Publish application Worker + Assets
        if: steps.secrets_check.outputs.skip != 'true'
        working-directory: worker-app
        run: npx wrangler deploy --minify --keep-vars --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # CFA-462 / CFA-464 (P1): this step only CHECKS that the attestation JWKS
      # is live. It never generates, installs or rotates a signing key, and it
      # never re-sets AUTHICHAIN_ATTESTATION_KEY_ID (the kid is derived from the
      # public key's RFC 7638 thumbprint in worker-app/jwks.ts). On 2026-10-09 a
      # non-200 probe here silently replaced the production key.
      - name: Check attestation JWKS on authichain-edge-router (no key changes)
        if: steps.secrets_check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          JWKS_CODE="$(curl -sS -o /tmp/jwks-probe.json -w '%{http_code}' \
            https://authichain.com/protocol/jwks.json || echo 000)"
          if [ "$JWKS_CODE" != "200" ]; then
            echo "::error::JWKS returned $JWKS_CODE; refusing to generate, install or rotate the signing key. Investigate by hand."
            exit 1
          fi
          echo "JWKS live ($JWKS_CODE); no key changes made"

      # success() || failure() still runs after a failed edge publish.
      # always() also runs after a cancel, which published this worker on
      # 2026-10-09 when the edge-router steps were cancelled.
      - name: Deploy authichain-scan-validate
        if: ${{ (success() || failure()) && steps.secrets_check.outputs.skip != 'true' }}
        working-directory: workers/authichain-scan-validate
        run: npx wrangler deploy --minify --keep-vars --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy skipped notice
        if: steps.secrets_check.outputs.skip == 'true'
        run: echo "::notice::Cloudflare deploy skipped — set CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID in repo secrets to enable."

  # PM-330 item 6: blocking post-deploy smoke, AFTER the deploy job. Fails the
  # run if a public money/protocol surface is down, answers the wrong code
  # (unsigned Stripe webhook must 400, unpaid /api/x402 must 402), or redirects
  # to cloudflareaccess.com. Read-only: HEAD on checkout, nothing signed.
  # Rollback: delete this job.
  post-deploy-smoke:
    name: Post-deploy smoke (blocking)
    needs: [deploy]
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Smoke public surfaces after deploy
        run: node scripts/ci/post-deploy-smoke.mjs
