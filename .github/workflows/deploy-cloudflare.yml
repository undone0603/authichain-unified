name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_CONFIG: .gitleaks.toml

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: secret-scan
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check required secrets
        id: secrets_check
        shell: bash
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set — skipping Cloudflare deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup PNPM
        if: steps.secrets_check.outputs.skip != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node 22
        if: steps.secrets_check.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        if: steps.secrets_check.outputs.skip != 'true'
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      - name: Build frontend
        if: steps.secrets_check.outputs.skip != 'true'
        run: pnpm run build
        env:
          VITE_APP_ID: ${{ secrets.VITE_APP_ID }}
          VITE_ANALYTICS_ENDPOINT: ${{ secrets.VITE_ANALYTICS_ENDPOINT }}
          VITE_ANALYTICS_WEBSITE_ID: ${{ secrets.VITE_ANALYTICS_WEBSITE_ID }}

      - name: Inspect build output
        if: steps.secrets_check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== cwd ==="
          pwd
          echo "=== package.json scripts ==="
          node -e "const p=require('./package.json'); console.log(JSON.stringify(p.scripts||{},null,2))"
          echo "=== wrangler configs ==="
          find . -name 'wrangler.toml' -o -name 'wrangler.json' -o -name 'wrangler.jsonc' | head -50
          echo "=== deep artifact search ==="
          find . \( -path './.git' -o -path './node_modules' \) -prune -o \
            \( -name dist -o -name out -o -name .open-next -o -name .next -o -name build \) -print
          echo "=== next.config output ==="
          find . -name 'next.config.*' -print
      - name: Publish application Worker + Assets
        if: steps.secrets_check.outputs.skip != 'true'
        working-directory: worker-app
        run: npx wrangler deploy --minify --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Bind attestation key on authichain-edge-router
        if: steps.secrets_check.outputs.skip != 'true'
        working-directory: worker-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTHICHAIN_ATTESTATION_PRIVATE_KEY_B64: ${{ secrets.AUTHICHAIN_ATTESTATION_PRIVATE_KEY_B64 }}
          AUTHICHAIN_ATTESTATION_KEY_ID: ${{ secrets.AUTHICHAIN_ATTESTATION_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          WORKER_NAME="authichain-edge-router"
          JWKS_CODE="$(curl -sS -o /tmp/jwks-probe.json -w '%{http_code}' \
            https://authichain.com/protocol/jwks.json || echo 000)"
          if [ "$JWKS_CODE" = "200" ]; then
            echo "JWKS already live ($JWKS_CODE) — leaving bound key in place"
            exit 0
          fi
          KEY_B64="${AUTHICHAIN_ATTESTATION_PRIVATE_KEY_B64:-}"
          if [ -z "$KEY_B64" ]; then
            echo "GitHub secret empty and JWKS is $JWKS_CODE — generating Ed25519 v0.1 key"
            KEY_B64="$(node --input-type=module -e '
              import { generateKeyPairSync } from "node:crypto";
              const { privateKey } = generateKeyPairSync("ed25519");
              const pem = privateKey.export({ type: "pkcs8", format: "pem" });
              process.stdout.write(Buffer.from(pem).toString("base64"));
            ')"
          fi
          printf '%s' "$KEY_B64" | npx wrangler secret put \
            AUTHICHAIN_ATTESTATION_PRIVATE_KEY_B64 --name "$WORKER_NAME"
          if [ -n "${AUTHICHAIN_ATTESTATION_KEY_ID:-}" ]; then
            printf '%s' "$AUTHICHAIN_ATTESTATION_KEY_ID" | npx wrangler secret put \
              AUTHICHAIN_ATTESTATION_KEY_ID --name "$WORKER_NAME"
          fi
          echo "bound AUTHICHAIN_ATTESTATION_PRIVATE_KEY_B64 on $WORKER_NAME"
          echo "re-deploying so custom routes attach to the version that has the secret"
          npx wrangler deploy --minify --config wrangler.toml
          for i in 1 2 3 4 5 6 7 8; do
            sleep 5
            AFTER="$(curl -sS -o /tmp/jwks-after.json -w '%{http_code}' \
              https://authichain.com/protocol/jwks.json || echo 000)"
            if [ "$AFTER" = "200" ]; then
              echo "JWKS live after bind ($AFTER)"
              exit 0
            fi
            echo "JWKS $AFTER after bind, retry $i"
            cat /tmp/jwks-after.json || true
            echo
          done
          echo "JWKS still not 200 after bind"
          cat /tmp/jwks-after.json || true
          exit 1

      - name: Deploy authichain-scan-validate
        if: ${{ always() && steps.secrets_check.outputs.skip != 'true' }}
        working-directory: workers/authichain-scan-validate
        run: npx wrangler deploy --minify --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy skipped notice
        if: steps.secrets_check.outputs.skip == 'true'
        run: echo "::notice::Cloudflare deploy skipped — set CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID in repo secrets to enable."
