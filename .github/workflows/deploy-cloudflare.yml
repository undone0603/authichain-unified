name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan the tree being deployed
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o gitleaks.tgz
          tar --no-same-owner -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose

  deploy:
    name: Deploy to Cloudflare
    runs-on: [self-hosted, Linux, ARM64, authichain-ops, authichain-wsl]
    needs: secret-scan
    timeout-minutes: 20
    # A skipped deployment is not evidence of a new live Worker revision.
    outputs:
      edge_deployed: ${{ steps.publish_edge.outcome == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check required secrets
        id: secrets_check
        shell: bash
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set — skipping Cloudflare deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup PNPM
        if: steps.secrets_check.outputs.skip != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node 22
        if: steps.secrets_check.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        if: steps.secrets_check.outputs.skip != 'true'
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      - name: Deploy manufacturer-status
        if: steps.secrets_check.outputs.skip != 'true'
        working-directory: workers/manufacturer-status
        run: npx wrangler deploy --minify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Recovery for #2114. No edge deploy occurs unless the existing owner
      # Cloudflare release switch is explicitly enabled. No secrets are
      # created, rotated or printed here; existing Worker bindings persist.
      - name: Require credentials for owner-enabled edge deploy
        if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && steps.secrets_check.outputs.skip == 'true' }}
        run: |
          echo "::error::Edge deploy enabled but Cloudflare credentials are missing"
          exit 1

      - name: Build canonical edge router (owner-gated)
        if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && steps.secrets_check.outputs.skip != 'true' }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build

      - name: Publish canonical edge router (owner-gated)
        id: publish_edge
        if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && steps.secrets_check.outputs.skip != 'true' }}
        working-directory: worker-app
        run: npx wrangler deploy --minify --keep-vars --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy skipped notice
        if: steps.secrets_check.outputs.skip == 'true'
        run: echo "::notice::Cloudflare deploy skipped — set CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID in repo secrets to enable."

  post-deploy-smoke:
    name: Post-deploy smoke (blocking; owner-gated edge publish only)
    needs: deploy
    if: ${{ needs.deploy.result == 'success' && needs.deploy.outputs.edge_deployed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Smoke public money and protocol surfaces
        run: node scripts/ci/post-deploy-smoke.mjs
