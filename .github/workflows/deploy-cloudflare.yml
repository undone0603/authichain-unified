name: Deploy to Cloudflare

# Deploys the Workers app defined by `wrangler.toml`:
#   - `main = "worker/index.ts"` is bundled by wrangler.
#   - `[assets] directory = "dist/public"` serves the static frontend,
#     which vite builds into that exact path.
#
# CLOUDFLARE_API_TOKEN must have these scopes (rotate in Cloudflare
# dashboard → My Profile → API Tokens):
#   - Account · Workers Scripts: Edit
#   - Account · Workers R2 Storage: Edit      (qron-images bucket)
#   - Account · D1: Edit                      (DB ebd8081b-…)
#   - Account · Workers KV Storage: Edit      (sessions)
#   - Account · Account Settings: Read
#   - User   · Memberships: Read
# The "Edit Cloudflare Workers" template covers all of the above in one go.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy Worker + Static Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.28.2
          run_install: false

      - uses: actions/setup-node@v5
        with:
          # Node 22 required: wrangler 3.114+ bundles miniflare which pulls in
          # undici@8, and undici@8's CacheStorage API fails to initialize on
          # Node 20.
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (→ dist/public for wrangler [assets])
        run: pnpm exec vite build
        env:
          VITE_APP_ID: ${{ secrets.VITE_APP_ID }}

      - name: Publish worker + assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
