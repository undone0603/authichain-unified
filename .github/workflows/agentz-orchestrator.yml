name: AgentZ Orchestrator

on:
  workflow_dispatch:

jobs:
  run-orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-agentz.txt ]; then pip install -r requirements-agentz.txt; fi

      - name: Execute Orchestrator
        run: python -m agentz.cli run --all --revenue-only --mode auto
        env:
          PYTHONUNBUFFERED: '1'
