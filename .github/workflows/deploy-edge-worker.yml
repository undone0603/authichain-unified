name: Deploy Cloudflare Edge Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-edge-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_CONFIG: .gitleaks.toml

  deploy:
    needs: secret-scan
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: production
      deploy-command: |
        pnpm exec wrangler whoami
        # Secret upload logic could be extracted to a separate composite action if reused often
        # printf '%s' "${{ secrets.SUPABASE_URL }}" | pnpm exec wrangler secret put SUPABASE_URL --name authichain-revenue-worker
        # ... (other secrets)
        pnpm exec wrangler deploy --minify --config api/wrangler.toml \
          --var "NEXT_PUBLIC_APP_URL:${{ vars.APP_URL || 'https://authichain.com' }}" \
          --var "CRM_BASE_URL:${{ vars.CRM_BASE_URL }}"
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
