name: Deploy Cloudflare Edge Worker

# Push trigger re-enabled after fixing:
#   1. pnpm minimumReleaseAge policy (@smithy/* now excluded in pnpm-workspace.yaml,
#      and --config.minimumReleaseAge=0 passed explicitly at install time since the
#      allowlist keeps drifting out of date as transitive deps publish new versions)
#   2. GITHUB_OUTPUT trailing-quote bug in secrets_check step
#   3. pnpm/action-setup must run before setup-node (for cache to work)
#   4. pnpm version pinned to 10.28.2 (matching deploy-workers.yml / deploy-cloudflare.yml)
#      instead of 'latest', which could pick up a version with different
#      minimumReleaseAge default/config-reading behavior
on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - '.github/workflows/deploy-edge-worker.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Revenue Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        id: secrets_check
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN not set — skipping edge worker deploy. Set in repo secrets to enable."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.secrets_check.outputs.skip != 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: '10.28.2'

      - name: Setup Node 22
        if: steps.secrets_check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install wrangler
        if: steps.secrets_check.outputs.skip != 'true'
        run: npm install -g wrangler@latest

      - name: Install dependencies
        if: steps.secrets_check.outputs.skip != 'true'
        # --config.minimumReleaseAge=0 bypasses pnpm's supply-chain
        # minimumReleaseAge policy for this CI install. pnpm-workspace.yaml
        # already sets minimumReleaseAge: 0 with a minimumReleaseAgeExclude
        # allowlist for known-fresh packages (e.g. @smithy/*), but that
        # allowlist drifts out of date every time those transitive deps
        # publish a new version (as happened here) — the CLI flag is the
        # authoritative override and doesn't need to be kept in sync.
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      - name: Upload secrets
        if: steps.secrets_check.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.SUPABASE_URL }}" | wrangler secret put SUPABASE_URL --name authichain-revenue-worker
          echo "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | wrangler secret put SUPABASE_SERVICE_ROLE_KEY --name authichain-revenue-worker
          echo "${{ secrets.STRIPE_SECRET_KEY }}" | wrangler secret put STRIPE_SECRET_KEY --name authichain-revenue-worker
          echo "${{ secrets.STRIPE_WEBHOOK_SECRET }}" | wrangler secret put STRIPE_WEBHOOK_SECRET --name authichain-revenue-worker
          echo "${{ secrets.STRIPE_PRICE_BASIC }}" | wrangler secret put STRIPE_PRICE_BASIC --name authichain-revenue-worker
          echo "${{ secrets.STRIPE_PRICE_PRO }}" | wrangler secret put STRIPE_PRICE_PRO --name authichain-revenue-worker
          echo "${{ secrets.STRIPE_PRICE_ENTERPRISE }}" | wrangler secret put STRIPE_PRICE_ENTERPRISE --name authichain-revenue-worker

      - name: Deploy worker
        if: steps.secrets_check.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config api/wrangler.toml

      - name: Deploy skipped
        if: steps.secrets_check.outputs.skip == 'true'
        run: echo "Edge worker deploy skipped — configure CLOUDFLARE_API_TOKEN in GitHub repo secrets."
