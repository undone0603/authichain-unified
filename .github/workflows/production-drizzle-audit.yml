name: Production Drizzle Audit

on:
  schedule:
    - cron: "30 7 * * 1"
  push:
    branches: [main]
    paths:
      - "drizzle/migrations/**"
      - "src/db/schema.ts"
  workflow_dispatch:

# GB-26 fix 4: a newer commit on the same PR cancels the older run. Pushes to
# main, schedules and dispatches get one group per commit and are never
# cancelled (PM-328).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Read-only production schema audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # DATABASE_URL is gated empty on pull_request (CFA-215 / #1769). This
      # workflow no longer triggers on PRs, but the gate stays as defense in
      # depth. Skip the audit (the job still passes) when the secret is
      # unavailable; runs that do have it audit as before.
      - name: Check database secret
        id: secret
        env:
          DATABASE_URL: ${{ github.event_name != 'pull_request' && secrets.DATABASE_URL || '' }} # CFA-215: empty on pull_request
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Schema audit skipped::DATABASE_URL is not available on pull_request runs, so the production schema audit was skipped."
          fi

      - name: Checkout
        if: steps.secret.outputs.available == 'true'
        uses: actions/checkout@v7

      - name: Install pnpm
        if: steps.secret.outputs.available == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: "10.28.2"

      - name: Use Node.js
        if: steps.secret.outputs.available == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        if: steps.secret.outputs.available == 'true'
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      - name: Audit production database
        if: steps.secret.outputs.available == 'true'
        run: node scripts/audit-production-drizzle.mjs
        env:
          DATABASE_URL: ${{ github.event_name != 'pull_request' && secrets.DATABASE_URL || '' }} # CFA-215: empty on pull_request

      - name: Upload audit artifact
        if: steps.secret.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: production-drizzle-audit
          path: artifacts/production-drizzle-audit.json
          retention-days: 7
