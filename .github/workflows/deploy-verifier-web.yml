name: Deploy verifier-web (verify.authichain.com)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/verifier-web/**"
      - "packages/verifier/**"
      - ".github/workflows/deploy-verifier-web.yml"
permissions:
  contents: read
concurrency:
  group: deploy-verifier-web
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: "10.28.2"
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0
      - name: Build
        working-directory: apps/verifier-web
        run: pnpm build
      - name: Publish verifier-web
        working-directory: apps/verifier-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml
