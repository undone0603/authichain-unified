name: Trigger EU DPP Outreach (every 8h)

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Send next DPP outreach email
        run: |
          STATUS=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            "https://qron-outreach.undone-k.workers.dev/send-dpp-next?key=${{ secrets.QRON_OUTREACH_AUTH_TOKEN }}")
          cat /tmp/resp.json
          echo "HTTP $STATUS"
          [[ "$STATUS" =~ ^2 ]] || exit 1
