name: Trigger EU DPP Outreach (manual)

# Schedule disabled 2026-08-07. The EU DPP outreach queue (4/4 sent) is exhausted, so every firing was a
# no-op that still burned CI minutes and masked the fact that outreach is dead.
# Re-enable only once the queue is repopulated AND sender authentication is fixed
# (see docs/outreach-deliverability-runbook.md) — sending into a 16% bounce rate
# from an unauthenticated domain makes the deliverability problem worse, not better.
on:
  # schedule:
  #   - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Send next DPP outreach email
        run: |
          STATUS=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            "https://qron-outreach.undone-k.workers.dev/send-dpp-next?key=${{ secrets.QRON_OUTREACH_AUTH_TOKEN }}")
          cat /tmp/resp.json
          echo "HTTP $STATUS"
          [[ "$STATUS" =~ ^2 ]] || exit 1
