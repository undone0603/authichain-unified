name: AgentZ host read-only runtime preflight

# Manual only, protected-main only. No checkout, secrets, keys, DNS, deploy,
# process control, outbound networking or writes to the AgentZ host.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, authichain-ops]
    timeout-minutes: 5
    steps:
      - name: Read host identity, agentz process and loopback health
        shell: bash
        env:
          EXPECTED_RUNNER: authichain-ops
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import platform
          import re
          import socket
          import subprocess
          import urllib.error
          import urllib.request
          from pathlib import Path

          def sha256_file(path):
              try:
                  h = hashlib.sha256()
                  with open(path, "rb") as file:
                      for chunk in iter(lambda: file.read(1024 * 1024), b""):
                          h.update(chunk)
                  return h.hexdigest()
              except (OSError, PermissionError):
                  return None

          def process_start(pid):
              # /proc/<pid>/stat field 22 is boot-relative clock ticks. Parse
              # after the final ')' because the comm field may contain spaces.
              stat = Path(f"/proc/{pid}/stat").read_text().rsplit(") ", 1)[1].split()
              ticks = int(stat[19])
              boot = next(int(line.split()[1]) for line in Path("/proc/stat").read_text().splitlines()
                          if line.startswith("btime "))
              value = boot + ticks / os.sysconf("SC_CLK_TCK")
              return datetime.datetime.fromtimestamp(value, datetime.timezone.utc).isoformat(), ticks

          def inspect_container(pid):
              # Read Docker's actual host PID-namespace membership, never just
              # a stale repository directory or a user-provided container name.
              target_ns = os.stat(f"/proc/{pid}/ns/pid").st_ino
              try:
                  ps = subprocess.run(["docker", "ps", "--quiet", "--no-trunc"],
                                      capture_output=True, text=True, timeout=4, check=False)
                  if ps.returncode != 0:
                      return {"container_probe": "docker-unavailable"}
                  matches = []
                  for cid in ps.stdout.splitlines()[:64]:
                      result = subprocess.run(["docker", "inspect", cid],
                                              capture_output=True, text=True, timeout=4, check=False)
                      if result.returncode != 0:
                          continue
                      details = json.loads(result.stdout)[0]
                      init_pid = int(details.get("State", {}).get("Pid") or 0)
                      if init_pid <= 0 or not details.get("State", {}).get("Running"):
                          continue
                      try:
                          if os.stat(f"/proc/{init_pid}/ns/pid").st_ino != target_ns:
                              continue
                      except OSError:
                          continue
                      # Fail closed if image code can be shadowed with a mount.
                      shadowed = any(
                          str(m.get("Destination", "")).rstrip("/") in ("/app", "/app/agentz")
                          or str(m.get("Destination", "")).startswith("/app/agentz/")
                          for m in details.get("Mounts", [])
                      )
                      image_id = details.get("Image")
                      image = subprocess.run(["docker", "image", "inspect", image_id],
                                             capture_output=True, text=True, timeout=4, check=False)
                      image_meta = json.loads(image.stdout)[0] if image.returncode == 0 else {}
                      labels = (image_meta.get("Config") or {}).get("Labels") or {}
                      matches.append({
                          "container_id_short": cid[:12],
                          "container_image_id": image_id,
                          "image_source_revision_label": labels.get("org.opencontainers.image.revision"),
                          "container_started_at_utc": details.get("State", {}).get("StartedAt"),
                          "app_source_mount_shadowed": shadowed,
                      })
                  return {"container_probe": "unique-pid-namespace-match", **matches[0]} if len(matches) == 1 else {
                      "container_probe": "no-unique-matching-container",
                      "matching_container_count": len(matches)
                  }
              except (OSError, subprocess.TimeoutExpired, ValueError, IndexError, KeyError):
                  return {"container_probe": "inspection-unavailable"}

          report = {
              "schema": "authichain.agentz.local-runtime-preflight/1",
              "probe_scope": "read-only-loopback-no-secret-access",
              "github_run_id": os.getenv("GITHUB_RUN_ID"),
              "workflow_sha_not_runtime_sha": os.getenv("GITHUB_SHA"),
              "runner_name": os.getenv("RUNNER_NAME"),
              "host": socket.gethostname(),
              "system": platform.system(),
              "architecture": platform.machine(),
              "process_count": 0,
              "process_start_time_utc": None,
              "process_start_ticks": None,
              "container_probe": "not-inspected",
              "container_image_id": None,
              "image_source_revision_label": None,
              "image_identity_matched_to_protected_build": False,
              "attestation_signed": False,
              "running_source_revision": None,
              "source_revision_origin": None,
              "api_source_sha256": None,
              "interpreter_sha256_not_app_artifact": None,
              "health_http_status": None,
              "health_response_sha256": None,
              "health_json_valid": False,
              "health_bytes": None,
              "result": "HOLD",
          }
          matches = []
          for entry in Path("/proc").iterdir():
              if not entry.name.isdigit():
                  continue
              try:
                  command = (entry / "cmdline").read_bytes().replace(b"\x00", b" ")
              except (OSError, PermissionError):
                  continue
              if b"agentz.api.main:app" in command and b"uvicorn" in command:
                  matches.append(entry)
          report["process_count"] = len(matches)
          if len(matches) == 1:
              proc = matches[0]
              report["api_pid"] = int(proc.name)
              try:
                  started, ticks = process_start(proc.name)
                  report["process_start_time_utc"] = started
                  report["process_start_ticks"] = ticks
                  report.update(inspect_container(proc.name))
              except (OSError, ValueError, StopIteration, IndexError):
                  report["process_start_probe"] = "unavailable"
              report["interpreter_sha256_not_app_artifact"] = sha256_file(proc / "exe")
              try:
                  cwd = (proc / "cwd").resolve(strict=True)
                  source = cwd / "agentz" / "api" / "main.py"
                  if source.is_file():
                      report["api_source_sha256"] = sha256_file(source)
                      sha = subprocess.run(
                          ["git", "-C", str(cwd), "rev-parse", "HEAD"],
                          capture_output=True, text=True, timeout=3,
                          check=False,
                      )
                      if sha.returncode == 0 and len(sha.stdout.strip()) == 40:
                          report["running_source_revision"] = sha.stdout.strip()
                          report["source_revision_origin"] = "process-cwd-git-head-not-loaded-code-proof"
              except (OSError, subprocess.TimeoutExpired):
                  pass
          try:
              request = urllib.request.Request(
                  "http://127.0.0.1:8000/health",
                  headers={"Accept": "application/json"},
              )
              with urllib.request.urlopen(request, timeout=5) as response:
                  report["health_http_status"] = response.status
                  raw = response.read(65537)
              if len(raw) <= 65536:
                  report["health_bytes"] = len(raw)
                  report["health_response_sha256"] = hashlib.sha256(raw).hexdigest()
                  try:
                      report["health_json_valid"] = isinstance(json.loads(raw), (dict, list))
                  except (ValueError, UnicodeError):
                      pass
              else:
                  report["health_oversize"] = True
          except urllib.error.HTTPError as error:
              report["health_http_status"] = error.code
          except (urllib.error.URLError, OSError):
              report["health_unreachable"] = True
          if (
              len(matches) == 1 and
              report["health_http_status"] == 200 and
              report["health_json_valid"] and
              report["health_response_sha256"]
          ):
              report["result"] = "LOCAL_ORIGIN_HEALTH_PROVEN"
          print("AGENTZ_RUNTIME_PREFLIGHT=" + json.dumps(report, sort_keys=True))
          if report["result"] != "LOCAL_ORIGIN_HEALTH_PROVEN":
              raise SystemExit(1)
          PY
