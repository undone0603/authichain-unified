name: Secret Scan
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        with:
          args: "--path=. --verbose --redact"
