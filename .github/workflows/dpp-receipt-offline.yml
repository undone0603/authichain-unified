name: DPP receipt offline safety

on:
  pull_request:
    paths:
      - "workers/authichain-com/src/dpp-routes.ts"
      - "workers/authichain-com/dpp-routes.offline.test.mjs"
      - ".github/workflows/dpp-receipt-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-source-smoke:
    name: DPP receipt Node 22 offline checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Validate actual DPP receipt TS route without npm, secrets or network
        run: node --test workers/authichain-com/dpp-routes.offline.test.mjs
