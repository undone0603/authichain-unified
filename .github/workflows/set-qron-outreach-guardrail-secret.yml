# .github/workflows/set-qron-outreach-guardrail-secret.yml
# One-time (and re-runnable) provisioning: pushes the existing INTERNAL_API_SECRET
# repo secret (already used by guardrail-digest.yml and b2b-outreach.yml) onto the
# qron-outreach Cloudflare Worker as a Wrangler secret, so its guardrail check/
# record/suppress calls can actually authenticate. Without this, the worker's
# guardrail client fails closed on every call (safe, but the channel could never
# send even once enabled). Trigger manually after this workflow lands on main.
name: Set qron-outreach guardrail secret

on:
  workflow_dispatch: {}

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Wrangler
        run: npm install -g wrangler
      - name: Set INTERNAL_API_SECRET on qron-outreach
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ secrets.INTERNAL_API_SECRET }}" | wrangler secret put INTERNAL_API_SECRET --name qron-outreach
