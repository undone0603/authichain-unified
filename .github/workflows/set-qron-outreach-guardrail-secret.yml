# .github/workflows/set-qron-outreach-guardrail-secret.yml
#
# Copies the existing repo secret INTERNAL_API_SECRET (same name already used
# by b2b-outreach.yml and guardrail-digest.yml) onto Cloudflare Workers:
#   - qron-outreach
#   - authichain-edge-router
#
# Does not invent a value. Exits 1 if the repo secret is empty.
#
# Why: POST https://authichain.com/api/guardrail/check (and app.authichain.com)
# returns HTTP 503 {"error":"INTERNAL_API_SECRET not configured"} until this
# Worker secret is bound. Routes are deployed; the secret is not.
#
# Dispatch (after this workflow is on main, or re-run any time the 503 returns):
#   Actions → "Set qron-outreach guardrail secret" → Run workflow
#   or:
#   gh workflow run set-qron-outreach-guardrail-secret.yml -R undone0603/authichain-unified
#
# deploy-cloudflare.yml also rebinds INTERNAL_API_SECRET on
# authichain-edge-router after each publish when the repo secret is set.
name: Set qron-outreach guardrail secret

on:
  workflow_dispatch: {}

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Wrangler
        run: npm install -g wrangler
      - name: Set INTERNAL_API_SECRET on qron-outreach + authichain-edge-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${INTERNAL_API_SECRET:-}" ]; then
            echo "::error::Repo secret INTERNAL_API_SECRET is empty. Refusing to bind an invented value."
            exit 1
          fi
          printf '%s' "$INTERNAL_API_SECRET" | wrangler secret put INTERNAL_API_SECRET --name qron-outreach
          printf '%s' "$INTERNAL_API_SECRET" | wrangler secret put INTERNAL_API_SECRET --name authichain-edge-router
          echo "bound INTERNAL_API_SECRET on qron-outreach and authichain-edge-router"
