# .github/workflows/set-qron-outreach-guardrail-secret.yml
# Protected manual-only binding of QRON_OUTREACH_INTERNAL_API_SECRET onto
# qron-outreach. The edge-router value must be rotated separately via the
# protected bind-lead-secrets workflow; never mutate two Workers from one token.
name: Set qron-outreach guardrail secret

permissions:
  contents: read
  actions: read
  statuses: read
  deployments: read

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact protected main commit with successful CI
        required: true
        type: string

# Serialize all manual credential writes across these binder workflows.
concurrency:
  group: production-secret-binding-${{ github.repository }}
  cancel-in-progress: false

jobs:
  set-secret:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment:
      name: production-cloudflare-qron-outreach
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
          clean: true
      - name: Restore full checkout and confirm source SHA
        run: |
          set -euo pipefail
          git sparse-checkout disable
          git reset --hard HEAD
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          test -f scripts/ci/guard-production-secret-binding.mjs
      - name: Fail closed on protected main and CI immediately before writes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          RELEASE_ENV: production-cloudflare-qron-outreach
        run: node scripts/ci/guard-production-secret-binding.mjs

      - name: Install Wrangler
        timeout-minutes: 15
        run: npm install -g wrangler
      - name: Set INTERNAL_API_SECRET on qron-outreach only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AUTHICHAIN_QRON_OUTREACH_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.AUTHICHAIN_QRON_OUTREACH_CLOUDFLARE_ACCOUNT_ID }}
          INTERNAL_API_SECRET: ${{ secrets.QRON_OUTREACH_INTERNAL_API_SECRET }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${INTERNAL_API_SECRET:-}"
          printf '%s' "$INTERNAL_API_SECRET" | wrangler secret put INTERNAL_API_SECRET --name qron-outreach
