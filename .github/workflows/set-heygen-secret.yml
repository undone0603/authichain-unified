name: Set HeyGen Secret

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Push HEYGEN_API_KEY to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: |
          set -euo pipefail
          for required in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID HEYGEN_API_KEY; do
            if [ -z "${!required:-}" ]; then
              echo "::error::GitHub secret $required is empty"
              exit 1
            fi
          done
          printf '%s' "$HEYGEN_API_KEY" | npx wrangler secret put HEYGEN_API_KEY
          echo "bound HEYGEN_API_KEY (value not logged)"
