name: Set HeyGen Secret

on:
  workflow_dispatch:
    inputs:
      HEYGEN_API_KEY:
        description: "HeyGen API Key"
        required: true

permissions:
  contents: read

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push HEYGEN_API_KEY to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          echo "${{ github.event.inputs.HEYGEN_API_KEY }}" | npx wrangler secret put HEYGEN_API_KEY
          echo "✓ HEYGEN_API_KEY set"
