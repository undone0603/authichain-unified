name: Set HeyGen Secret

on:
  workflow_dispatch:
    inputs:
      HEYGEN_API_KEY:
        description: "HeyGen API Key"
        required: true

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Push HEYGEN_API_KEY to Cloudflare Worker
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: authichain-unified
          HEYGEN_API_KEY: ${{ github.event.inputs.HEYGEN_API_KEY }}
        run: |
          set -e
          http_status=$(curl -s -o /tmp/cf_resp.json -w "%{http_code}" \
            -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/secrets" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"HEYGEN_API_KEY\",\"text\":\"${HEYGEN_API_KEY}\",\"type\":\"secret_text\"}")
          if [ "$http_status" != "200" ] && [ "$http_status" != "201" ]; then
            echo "ERROR: HTTP $http_status"
            cat /tmp/cf_resp.json
            exit 1
          fi
          echo "✓ HEYGEN_API_KEY set on worker: $WORKER_NAME"
