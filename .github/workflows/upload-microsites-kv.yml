name: Upload microsites KV
# Optional. Live serving is authichain-com /m/<slug>.
# This only writes MICROSITES_KV for the root worker's subdomain router.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: "10.28.2"
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0
      - name: Upload HTML to MICROSITES_KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/upload-microsites-kv.sh
