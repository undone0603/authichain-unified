name: Verify production Cloudflare credentials (read-only)

# One non-publishing probe after this workflow is added to protected main.
# No Cloudflare writes, Worker deployments, secret values, or retries.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-production-cloudflare-credentials.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-production-cloudflare-credentials
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 8
    environment:
      name: production-cloudflare
    steps:
      - name: Validate secret presence, active token, and verify-Worker access
        env:
          CF_TOKEN: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
          NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
        run: |
          set -euo pipefail
          command -v node >/dev/null
          node --input-type=module <<'NODE'
          const token = process.env.CF_TOKEN;
          const account = process.env.CF_ACCOUNT;
          const expectedAccount = '4c1869b90f13f86940aa3747839bf420';
          if (!token || !account) throw new Error('Required environment credentials absent');
          if (account !== expectedAccount) throw new Error('Deployment account does not match Worker configuration');

          async function readCloudflare(path, stage) {
            const response = await fetch('https://api.cloudflare.com/client/v4' + path, {
              headers: {
                Authorization: 'Bearer ' + token,
                Accept: 'application/json',
              },
              signal: AbortSignal.timeout(20000),
            });
            if (!response.ok) throw new Error(stage + ' rejected (HTTP ' + response.status + ')');
            const body = await response.json();
            if (body.success !== true) throw new Error(stage + ' did not succeed');
            return body.result;
          }

          const verification = await readCloudflare('/user/tokens/verify', 'Token verification');
          if (verification?.status !== 'active') throw new Error('Token is not active');
          console.log('PRODUCTION_CLOUDFLARE_TOKEN_ACTIVE');

          const deployments = await readCloudflare(
            '/accounts/' + account + '/workers/scripts/authichain-verify-worker/deployments',
            'Verify-Worker access'
          );
          if (!Array.isArray(deployments?.deployments))
            throw new Error('Verify-Worker deployment inventory unavailable');
          console.log('PRODUCTION_CLOUDFLARE_VERIFY_WORKER_READ_AUTHORIZED');
          console.log('No deployment or secret modification performed');
          NODE
