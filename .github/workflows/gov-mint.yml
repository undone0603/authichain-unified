name: GovChain – Mint Opportunity NFTs

on:
  workflow_call:
    inputs:
      dry_run:
        required: false
        type: string
        default: "true"
    secrets:
      ALCHEMY_API_KEY:
        required: false
      POLYGON_PRIVATE_KEY:
        required: false
      GOVCHAIN_NFT_CONTRACT:
        required: false
      SUPABASE_URL:
        required: false
      SUPABASE_SERVICE_ROLE_KEY:
        required: false
      GOVCHAIN_URL:
        required: false

jobs:
  mint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { version: "10.28.2" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      - name: Mint GovChain NFTs
        continue-on-error: true
        run: pnpm exec tsx scripts/mint-govchain-nfts.ts
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          WALLET_PRIVATE_KEY: ${{ secrets.POLYGON_PRIVATE_KEY }}
          CONTRACT_ADDRESS: ${{ secrets.GOVCHAIN_NFT_CONTRACT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOVCHAIN_URL: ${{ secrets.GOVCHAIN_URL || 'https://govchain.us' }}
          DRY_RUN: ${{ inputs.dry_run || 'true' }}
