# Enable only after AuthiChainNFT has bytecode on the target chain
# (item 5 / GOVCHAIN_NFT_CONTRACT). Default dry_run=true. Do not dispatch
# dry_run=false until eth_getCode != 0x on Base 8453.
#
# Workflow id: 304825951
# Enable: gh api -X PUT repos/undone0603/authichain-unified/actions/workflows/304825951/enable

name: GovChain – Mint Opportunity NFTs

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (no tx). Leave true until Base getCode is proven.
        required: false
        default: "true"
      chain:
        description: Chain key (base | base-sepolia | polygon)
        required: false
        default: "base"
  workflow_call:
    inputs:
      dry_run:
        required: false
        type: string
        default: "true"
      chain:
        required: false
        type: string
        default: "base"
    secrets:
      ALCHEMY_API_KEY:
        required: false
      POLYGON_PRIVATE_KEY:
        required: false
      WALLET_PRIVATE_KEY:
        required: false
      GOVCHAIN_NFT_CONTRACT:
        required: false
      SUPABASE_URL:
        required: false
      SUPABASE_SERVICE_ROLE_KEY:
        required: false
      GOVCHAIN_URL:
        required: false

permissions:
  contents: read

jobs:
  mint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { version: "10.28.2" }
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      - name: Preflight getCode (no keys)
        env:
          CHAIN: ${{ inputs.chain || 'base' }}
          CONTRACT: ${{ secrets.GOVCHAIN_NFT_CONTRACT }}
          DRY_RUN: ${{ inputs.dry_run || 'true' }}
        run: |
          if [ -z "$CONTRACT" ]; then
            echo "GOVCHAIN_NFT_CONTRACT secret is not set"
            if [ "$DRY_RUN" = "false" ]; then
              echo "::error::Live mint requires GOVCHAIN_NFT_CONTRACT with bytecode"
              exit 1
            fi
            echo "::warning::Dry-run mint will skip chain writes until the Base deploy lands"
            exit 0
          fi
          case "$CHAIN" in
            polygon) RPC="https://polygon-rpc.com" ;;
            base-sepolia) RPC="https://sepolia.base.org" ;;
            *) RPC="https://mainnet.base.org" ;;
          esac
          BODY=$(printf '{"jsonrpc":"2.0","id":1,"method":"eth_getCode","params":["%s","latest"]}' "$CONTRACT")
          RESP=$(curl -sS -X POST "$RPC" -H 'content-type: application/json' -d "$BODY")
          echo "${RESP:0:160}"
          CODE=$(printf '%s' "$RESP" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{process.stdout.write(String(JSON.parse(s).result||""))}catch{process.stdout.write("")}})')
          if [ -z "$CODE" ] || [ "$CODE" = "0x" ] || [ "$CODE" = "0x0" ]; then
            echo "getCode is empty for $CONTRACT on $CHAIN"
            if [ "$DRY_RUN" = "false" ]; then
              echo "::error::Refusing live mint without bytecode"
              exit 1
            fi
            echo "::warning::Item 5 is not met — mint script will skip"
            exit 0
          fi
          echo "getCode_ok contract=$CONTRACT chain=$CHAIN"

      - name: Mint GovChain NFTs
        run: pnpm exec tsx scripts/mint-govchain-nfts.ts
        env:
          CHAIN: ${{ inputs.chain || 'base' }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          WALLET_PRIVATE_KEY: ${{ secrets.WALLET_PRIVATE_KEY || secrets.POLYGON_PRIVATE_KEY }}
          GOVCHAIN_NFT_CONTRACT: ${{ secrets.GOVCHAIN_NFT_CONTRACT }}
          CONTRACT_ADDRESS: ${{ secrets.GOVCHAIN_NFT_CONTRACT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOVCHAIN_URL: ${{ secrets.GOVCHAIN_URL || 'https://govchain.us' }}
          DRY_RUN: ${{ inputs.dry_run || 'true' }}
