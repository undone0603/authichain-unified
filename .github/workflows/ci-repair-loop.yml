name: CI repair loop

# On Main quality gate failure: classify, optional deterministic format repair
# on a new branch, open a draft PR. Never merges. Never weakens permissions,
# deletes tests, applies production migrations, or deploys to Vercel/Cloudflare.
on:
  workflow_run:
    workflows: ["CI Main"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  classify:
    # Only repair the integration baseline. Never check out a PR head_sha —
    # that is untrusted on workflow_run even with a branches: [main] filter.
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "10.28.2"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Attempt safe prettier write (lint:ci targets only)
        id: fix
        run: |
          set -euo pipefail
          # Keep in sync with the prettier --check targets of `lint:ci` in
          # package.json. Formatting anything wider (e.g. all of src/) yields a
          # multi-thousand-file diff the classifier must refuse.
          pnpm exec prettier --write .github package.json postcss.config.mjs tailwind.config.ts vite.config.ts vitest.config.ts
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No deterministic format changes. Escalating — not merging."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Refuse unsafe repair diffs
        if: steps.fix.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # Pass the diff through files, not env vars: a large patch overflows
          # the kernel's per-string env limit (E2BIG, "Argument list too long").
          git diff --name-only > "$RUNNER_TEMP/repair-files.txt"
          git diff > "$RUNNER_TEMP/repair.patch"
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          import { classifyRepair } from './scripts/lib/ci-repair-classify.mjs';
          const tmp = process.env.RUNNER_TEMP;
          const files = readFileSync(`${tmp}/repair-files.txt`, 'utf8').split('\n').filter(Boolean);
          const patch = readFileSync(`${tmp}/repair.patch`, 'utf8');
          const r = classifyRepair({ files, patch, jobName: 'Lint' });
          console.log(JSON.stringify(r));
          if (!r.safe) process.exit(2);
          EOF

      - name: Open draft repair PR
        if: steps.fix.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="cursor/ci-repair-${{ github.event.workflow_run.run_id }}-c802"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- .github package.json postcss.config.mjs tailwind.config.ts vite.config.ts vitest.config.ts
          git commit -m "chore(ci): deterministic prettier repair (draft, no auto-merge)"
          git push -u origin "$branch"
          gh pr create --draft --base main --head "$branch" \
            --title "chore(ci): repair loop for failed CI Main" \
            --body "Deterministic format repair only. Green checks are not sufficient to merge. Human review required. No migrations, no Vercel, no permission changes, no test deletions."
