name: D1 license migrate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply authichain-license-db migrations
        working-directory: workers/authichain-license-issuer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations list authichain-license-db --remote
          npx --yes wrangler@4 d1 migrations apply authichain-license-db --remote --yes
          npx --yes wrangler@4 d1 migrations list authichain-license-db --remote
          npx --yes wrangler@4 d1 execute authichain-license-db --remote --command "SELECT name FROM sqlite_master WHERE type='index' AND name='idx_licenses_one_active_customer';"
