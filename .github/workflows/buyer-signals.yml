# Weekly, read-only lead finder (Loop 3, growth). Pulls public buying signals
# (EU tenders, FTC Made in USA actions and orders, CBP origin rulings, news,
# hiring posts, CA cannabis licences, German battery registrants),
# maps each to a live offer, and opens ONE issue labelled `buyer-signal` with
# the leads and a draft opener per lead. It sends nothing: every outreach still
# waits for the owner's go. See scripts/growth/buyer-signals.mjs.
name: Buyer signals

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print only; do not open the issue
        type: boolean
        default: true
  pull_request:
    paths:
      - scripts/growth/buyer-signals.mjs
      - .github/workflows/buyer-signals.yml

concurrency:
  group: buyer-signals-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  signals:
    if: github.repository == 'undone0603/authichain-unified'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Collect signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BUYER_SIGNALS_DRY_RUN: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) && 'true' || 'false' }}
        run: node scripts/growth/buyer-signals.mjs
