# Weekly, read-only lead finder (Loop 3, growth). Pulls public buying signals
# (EU tenders, FTC Made in USA actions and orders, CBP origin rulings, news,
# hiring posts, CA cannabis licences, German battery registrants),
# maps each to a live offer, and opens ONE issue labelled `buyer-signal` with
# the leads and a draft opener per lead. It sends nothing: every outreach still
# waits for the owner's go. See scripts/growth/buyer-signals.mjs.
name: Buyer signals

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print only; do not open the issue
        type: boolean
        default: true
  pull_request:
    paths:
      - scripts/growth/buyer-signals.mjs
      - .github/workflows/buyer-signals.yml

concurrency:
  group: buyer-signals-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Credential-free PR check: syntax only, no collector, no issues:write.
  # GitHub-hosted ubuntu-24.04 is billing-locked (jobs start with zero steps),
  # so this uses the same WSL runner as other same-repo PR jobs, with
  # persist-credentials: false and contents:read only.
  verify-pr:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore full tree after sparse checkout
        if: runner.environment == 'self-hosted'
        run: |
          git sparse-checkout disable
          git reset --hard HEAD
          test -f scripts/growth/buyer-signals.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate buyer-signals syntax (no outbound activity)
        run: node --check scripts/growth/buyer-signals.mjs

  # Trusted scheduled / manual collector. Separate from the PR job above.
  signals:
    if: github.repository == 'undone0603/authichain-unified' && github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore full tree after sparse checkout
        if: runner.environment == 'self-hosted'
        run: |
          git sparse-checkout disable
          git reset --hard HEAD
          test -f scripts/growth/buyer-signals.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Collect signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BUYER_SIGNALS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: node scripts/growth/buyer-signals.mjs
