# Weekly, read-only: compares live Cloudflare Workers with the wrangler configs
# in this repo and config/estate.json. Keeps ONE issue labelled `estate-drift`
# open only while a live Worker has no source and no inventory entry (a
# deploy from outside the repo, or a misused token). No issue = clean.
# See docs/OPERATING_CHARTER.md and scripts/autonomy/estate-drift.mjs.
name: Estate drift

on:
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print only; do not open or close the issue
        type: boolean
        default: true

concurrency:
  group: estate-drift
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  drift:
    if: github.repository == 'undone0603/authichain-unified'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Drift
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRIFT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: node scripts/autonomy/estate-drift.mjs
