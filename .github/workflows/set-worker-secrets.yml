name: Set Cloudflare Worker Secrets

on:
  workflow_dispatch:
    inputs:
      GMAIL_CLIENT_ID:
        description: "Google OAuth Client ID (from Google Cloud Console)"
        required: true
      GMAIL_CLIENT_SECRET:
        description: "Google OAuth Client Secret"
        required: true
      GMAIL_REFRESH_TOKEN:
        description: "Gmail Refresh Token"
        required: true
      GMAIL_FROM_EMAIL:
        description: "Gmail From email address"
        required: true

permissions:
  contents: read

jobs:
  set-secrets:
    name: Push secrets to Cloudflare Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Push secrets to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler secret put GMAIL_CLIENT_ID --name authichain-unified <<< "${{ github.event.inputs.GMAIL_CLIENT_ID }}"
          wrangler secret put GMAIL_CLIENT_SECRET --name authichain-unified <<< "${{ github.event.inputs.GMAIL_CLIENT_SECRET }}"
          wrangler secret put GMAIL_REFRESH_TOKEN --name authichain-unified <<< "${{ github.event.inputs.GMAIL_REFRESH_TOKEN }}"
          wrangler secret put GMAIL_FROM_EMAIL --name authichain-unified <<< "${{ github.event.inputs.GMAIL_FROM_EMAIL }}"
