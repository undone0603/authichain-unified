name: Set Cloudflare Worker Secrets

on:
  workflow_dispatch:
    inputs:
      GMAIL_CLIENT_ID:
        description: "Google OAuth Client ID (from Google Cloud Console)"
        required: true
      GMAIL_CLIENT_SECRET:
        description: "Google OAuth Client Secret"
        required: true
      GMAIL_REFRESH_TOKEN:
        description: "Gmail Refresh Token"
        required: true

jobs:
  set-secrets:
    name: Push secrets to Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Push all Gmail secrets via Cloudflare REST API
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: authichain-unified
          GMAIL_CLIENT_ID: ${{ github.event.inputs.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ github.event.inputs.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ github.event.inputs.GMAIL_REFRESH_TOKEN }}
          GMAIL_FROM_EMAIL: "Z@authichain.com"
        run: |
          set -e

          put_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "Skipping $name (empty)"
              return
            fi
            echo "Setting $name ..."
            http_status=$(curl -s -o /tmp/cf_resp.json -w "%{http_code}" \
              -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/secrets" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"${name}\",\"text\":\"${value}\",\"type\":\"secret_text\"}")
            if [ "$http_status" != "200" ] && [ "$http_status" != "201" ]; then
              echo "ERROR setting $name: HTTP $http_status"
              cat /tmp/cf_resp.json
              exit 1
            fi
            echo " ✓ $name set"
          }

          put_secret "GMAIL_CLIENT_ID"     "$GMAIL_CLIENT_ID"
          put_secret "GMAIL_CLIENT_SECRET" "$GMAIL_CLIENT_SECRET"
          put_secret "GMAIL_REFRESH_TOKEN" "$GMAIL_REFRESH_TOKEN"
          put_secret "GMAIL_FROM_EMAIL"    "$GMAIL_FROM_EMAIL"

          echo ""
          echo "Done. All 4 secrets set on worker: $WORKER_NAME"
