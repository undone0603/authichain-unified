name: Set Cloudflare Worker Secrets

on:
  workflow_dispatch:
    inputs:
      GMAIL_CLIENT_ID:
        description: "Google OAuth Client ID (from Google Cloud Console)"
        required: true
      GMAIL_CLIENT_SECRET:
        description: "Google OAuth Client Secret"
        required: true
      GMAIL_REFRESH_TOKEN:
        description: "Gmail Refresh Token"
        required: true
      GMAIL_FROM_EMAIL:
        description: "Gmail From email address"
        required: true

jobs:
  set-secrets:
    name: Push secrets to Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Push all Gmail secrets to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GMAIL_CLIENT_ID: ${{ github.event.inputs.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ github.event.inputs.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ github.event.inputs.GMAIL_REFRESH_TOKEN }}
          GMAIL_FROM_EMAIL: ${{ github.event.inputs.GMAIL_FROM_EMAIL }}
        run: |
          set -e
          echo "🚀 Pushing secrets to authichain-unified..."
          
          echo "$GMAIL_CLIENT_ID"     | npx wrangler secret put GMAIL_CLIENT_ID
          echo "$GMAIL_CLIENT_SECRET" | npx wrangler secret put GMAIL_CLIENT_SECRET
          echo "$GMAIL_REFRESH_TOKEN" | npx wrangler secret put GMAIL_REFRESH_TOKEN
          echo "$GMAIL_FROM_EMAIL"    | npx wrangler secret put GMAIL_FROM_EMAIL

          echo "✅ Done. Gmail secrets updated."
