name: Deploy authichain-edge-router
# Payment/checkout Worker may contain real-money and entitlement changes.
# Never deploy automatically on merge. Dispatch only after the exact main
# commit passed the already-established seven-context CircleCI release policy.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact approved 40-character main commit to deploy"
        type: string
        required: true
permissions:
  contents: read
  statuses: read
  actions: read
# Queue behind an in-flight publish. PM-328 forbids cancelling a
# push-to-main deploy that is already uploading.
concurrency:
  group: deploy-authichain-edge-router-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    # Protected-branches-only environment. The automated release policy
    # checks its actual policy, protected main and seven CircleCI contexts.
    # Production Cloudflare token/account must come from the same protected
    # environment secret pair as authichain-com. Never consume the broad
    # repository CLOUDFLARE_* secrets for a payment Worker deployment.
    environment:
      name: production-cloudflare
    # Publish runner only: authichain-wsl. CI stays on authichain-ops (laptop).
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 40
    env:
      # WSL has no IPv6. Node 22 Happy Eyeballs races AAAA (ENETUNREACH) with
      # Cloudflare anycast A records and aborts in ~1.6s. ipv4first alone still
      # tries AAAA. Proven on runner node v22.23.4 with this combo.
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      # Sparse-checkout settings persist in the shared self-hosted work dir
      # (agentz-orchestration.yml and gov-engine.yml check out two files), so a
      # job that inherits them sees a partial tree while HEAD still names the
      # right commit. Run 41898073168 died with "Cannot find module
      # .../scripts/ci/live-worker-version.mjs" for a file that was in the
      # commit. Same guard launch-gates.yml, ci.yml and main.yml use, plus
      # checks that this job runs and bundles exactly what the commit holds.
      - name: Restore full tree after sparse checkout
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          git sparse-checkout disable
          git reset --hard HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git ls-files -v | awk '$1 == "S" { print }')"
          test -f scripts/ci/live-worker-version.mjs
          test -f scripts/ci/upload-worker-version.mjs
          test -f scripts/ci/promote-worker-version.mjs
          test -f worker-app/wrangler.toml
      - uses: pnpm/action-setup@v6
        if: runner.environment != 'self-hosted'
        with:
          version: "10.28.2"
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: ${{ runner.environment != 'self-hosted' && 'pnpm' || '' }}
          cache-dependency-path: pnpm-lock.yaml
      # Must run after setup-node. The runner's pnpm is a corepack shim with a
      # "#!/usr/bin/env node" shebang, and the runner process has no node on
      # PATH when the listener was started by hand instead of the systemd unit
      # (run 42162800026: "/usr/bin/env: 'node': No such file or directory",
      # exit 127, after the WSL restart on 2026-11-05). setup-node puts the
      # cached node 22 on PATH, the same node every later step already uses.
      - name: Use runner pnpm (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          command -v node
          command -v pnpm
          pnpm --version
      - name: Verify exact SHA and seven-context automated release policy
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          node --test scripts/ci/autonomous-release-gate.test.mjs
          node scripts/ci/autonomous-release-gate.mjs
      - name: Install node-gyp (native builds)
        run: npm i -g node-gyp@11
      - name: Install
        env:
          npm_config_build_from_source: "false"
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0
      - name: Preflight uplink probe (fail fast on a stalled runner)
        if: runner.environment == 'self-hosted'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          # A floor, not a target. Measured on this runner on 2026-11-04: about
          # 120-140 KB/s sustained to Cloudflare, so the 8.8 MiB bundle needs
          # roughly 75 s. The stalls this gate exists for ran at 7-11 KB/s.
          # 80 KB/s keeps a 7x margin over those stalls and still finishes the
          # upload in about 2 minutes. A connection reset at ~96 s was seen once
          # (run 41264005567); upload-worker-version.mjs retries it.
          MIN_UPLINK_BYTES_PER_SEC: "80000"
        run: |
          set -euo pipefail
          # The 8.8 MiB versions POST has stalled at 7-11 KB/s for 9 runs. Probe
          # api.cloudflare.com with a 1 MiB payload first so a bad uplink fails in
          # ~15s with an actionable message instead of eating the job timeout.
          head -c 1048576 /dev/zero > /tmp/probe.bin
          out=$(curl -s --ipv4 --http1.1 -o /dev/null -m 25 \
            -w '%{speed_upload} %{http_code}' \
            -X POST --data-binary @/tmp/probe.bin \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            https://api.cloudflare.com/client/v4/user/tokens/verify || true)
          speed=${out%% *}; code=${out##* }
          echo "uplink: ${speed:-0} bytes/s (http ${code:-none})"
          if [ "${speed:-0}" -lt "${MIN_UPLINK_BYTES_PER_SEC}" ]; then
            echo "::error::Uplink to api.cloudflare.com measured ${speed:-0} bytes/s, under the ${MIN_UPLINK_BYTES_PER_SEC} bytes/s floor. The 8.8 MiB bundle would stall; failing now instead of holding the runner for 20-35 minutes. Check the runner's network or run this job elsewhere."
            exit 1
          fi

      - name: Record live version (rollback target)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Fails closed: when the live version cannot be named, nothing deploys.
          prev=$(node scripts/ci/live-worker-version.mjs authichain-edge-router)
          echo "live authichain-edge-router version before this deploy: ${prev}"
          echo "PREV_VERSION_ID=${prev}" >> "$GITHUB_ENV"

      - name: Publish authichain-edge-router
        working-directory: worker-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Versions API wants uncompressed JS in the multipart. HTTP gzip
          # returned NextPart EOF (41298894966); part gzip eval'd as JS
          # (41297825503). HTTP/2 then stalled with PROTOCOL_ERROR and 0 bytes
          # (41303592477, 41341161323), so the transport is now --http1.1 with a
          # stall guard. Dry-run locally, then curl --ipv4 of the
          # raw 8.8 MiB body with keep_bindings secret_text. Do not wrangler
          # deploy. Do not secret-put.
          rm -rf /tmp/er-bundle
          mkdir -p /tmp/er-bundle
          npx --yes wrangler@4.149.0 versions upload --minify --keep-vars --dry-run --outdir /tmp/er-bundle --config wrangler.toml \
            2>&1 | tee /tmp/er-versions-upload.log
          vid=$(node ../scripts/ci/upload-worker-version.mjs authichain-edge-router /tmp/er-bundle)
          echo "uploaded authichain-edge-router version $vid"
          # Record the checkout SHA and promoted version for later source/runtime audit.
          # This is provenance metadata, not proof of successful paid fulfillment.
          promotion=$(node ../scripts/ci/promote-worker-version.mjs authichain-edge-router "$vid")
          printf '%s\n' "$promotion"
          # Only set once the promotion call has succeeded; the rollback step keys off it.
          echo "PROMOTED_VERSION_ID=${vid}" >> "$GITHUB_ENV"
          {
            echo '### authichain-edge-router deployment provenance'
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- GitHub run: ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
            echo "- Worker version: ${vid}"
            echo "- Promotion: ${promotion}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke JWKS current + retired kids
        run: |
          set -euo pipefail
          CURRENT='jWTo5QsZfTVi2oQqsfq9E-aSB2XZ0vrXmfE3h0amEDM'
          RETIRED='T3AL7c4wZVoXk1IXvpaaHGUmoZHZ3k1mTommJu9wToQ'
          # One pass of the original checks, chained with && so every check counts
          # (a failing command inside a function called from `if` would not abort it).
          smoke() {
            jwks=$(curl -sS --max-time 20 -H 'Cache-Control: no-cache' \
              https://authichain.com/protocol/jwks.json) &&
              grep -qF "$CURRENT" <<<"$jwks" &&
              grep -qF "$RETIRED" <<<"$jwks" &&
              issuer=$(curl -sS --max-time 20 -H 'Cache-Control: no-cache' \
                https://authichain.com/protocol/issuer.json) &&
              grep -qF "$CURRENT" <<<"$issuer" &&
              grep -qF '"signing":true' <<<"$issuer"
          }
          # A fresh promotion can take a few seconds to reach every edge; retry
          # before concluding the new version is bad and rolling it back.
          for attempt in 1 2 3 4 5; do
            if smoke; then
              echo "smoke passed on attempt ${attempt}"
              exit 0
            fi
            echo "smoke attempt ${attempt} failed; retrying in 6s"
            sleep 6
          done
          echo "::error::JWKS/issuer smoke failed after 5 attempts"
          exit 1

      - name: Smoke public pages
        run: |
          set -euo pipefail
          # The JWKS smoke proves the signing keys survived; this proves the
          # sites still serve. Every page must pass in the same attempt, so one
          # healthy edge cannot mask another failing page.
          pages() {
            for url in \
              https://authichain.com/ \
              https://authichain.com/pricing \
              https://qron.space/ \
              https://strainchain.io/ \
              https://govchain.us/opportunities; do
              code=$(curl -sS -o /dev/null --max-time 20 -w '%{http_code}' "$url") || return 1
              [ "$code" = "200" ] || { echo "  ${url} -> ${code}"; return 1; }
            done
            health=$(curl -sS --max-time 20 https://authichain.com/api/health) || return 1
            grep -qF '"status":"ok"' <<<"$health"
          }
          for attempt in 1 2 3 4 5; do
            if pages; then
              echo "public pages healthy on attempt ${attempt}"
              exit 0
            fi
            echo "public page smoke attempt ${attempt} failed; retrying in 6s"
            sleep 6
          done
          echo "::error::public page smoke failed after 5 attempts"
          exit 1

      - name: Roll back to previous version (smoke failed after promotion)
        if: failure() && env.PROMOTED_VERSION_ID != '' && env.PREV_VERSION_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "::warning::Smoke failed after promotion; restoring ${PREV_VERSION_ID} (rejecting ${PROMOTED_VERSION_ID})"
          node scripts/ci/promote-worker-version.mjs authichain-edge-router "${PREV_VERSION_ID}"
          {
            echo '### authichain-edge-router ROLLED BACK'
            echo "- Restored version: ${PREV_VERSION_ID}"
            echo "- Rejected version: ${PROMOTED_VERSION_ID}"
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- GitHub run: ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
          } >> "$GITHUB_STEP_SUMMARY"
