name: Verify production Cloudflare credential (read-only)

# Runs once when this workflow lands on protected main, or by manual dispatch.
# It never uploads, promotes, deploys, alters tokens, or exposes their values.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-production-cloudflare-credential.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-production-cloudflare-credential
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 10
    environment:
      name: production-cloudflare
    steps:
      - name: Verify environment token and Worker account read access (no writes)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          command -v node
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { appendFileSync } from 'node:fs';

          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const requiredAccount = '4c1869b90f13f86940aa3747839bf420';
          if (!token || !account || account !== requiredAccount) {
            throw new Error('Environment token/account missing or unexpected account; no release authorized');
          }

          // Read-only calls; never log the bearer token or response bodies.
          async function read(path) {
            const response = await fetch('https://api.cloudflare.com/client/v4' + path, {
              method: 'GET',
              headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' },
              signal: AbortSignal.timeout(15000),
            });
            const data = await response.json().catch(() => null);
            return { status: response.status, ok: response.ok && data?.success === true, result: data?.result };
          }

          const verificationPaths = [
            '/accounts/' + account + '/tokens/verify',
            '/user/tokens/verify',
          ];
          let verified;
          let kind;
          for (const path of verificationPaths) {
            const check = await read(path);
            if (check.ok && check.result?.status === 'active' && /^[0-9a-f]{32}$/i.test(check.result?.id ?? '')) {
              verified = check.result;
              kind = path.startsWith('/user/') ? 'user' : 'account';
              break;
            }
          }
          if (!verified) throw new Error('Stored Cloudflare token could not be verified as active');

          const worker = await read('/accounts/' + account + '/workers/scripts/authichain-verify-worker/deployments');
          if (!worker.ok || worker.status !== 200) {
            throw new Error('Stored Cloudflare token lacks verified read access to target Worker in expected account');
          }

          // Only an irreversible token-ID digest is emitted. Correlate this
          // against Cloudflare token-policy metadata using independent read access.
          const fingerprint = createHash('sha256').update(verified.id).digest('hex');
          const result = {
            token_id_sha256: fingerprint,
            token_kind: kind,
            token_status: 'active',
            target_account_matches: true,
            target_worker_read_access: true,
            worker_write_scope: 'not_proven_by_read_only_test',
            production_deployment: 'not_attempted',
          };
          console.log('PRODUCTION_CLOUDFLARE_TOKEN_PREFLIGHT_PASS', JSON.stringify(result));
          if (process.env.GITHUB_STEP_SUMMARY) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '### Production Cloudflare token preflight (read-only)\n' +
              '- Token verified active; target Worker inventory read succeeded\n' +
              '- Token ID SHA-256: `' + fingerprint + '`\n' +
              '- Workers edit scope must be confirmed independently from token policy metadata\n' +
              '- No release or mutation performed\n');
          }
          NODE
