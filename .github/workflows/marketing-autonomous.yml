name: Autonomous Marketing Pipeline

on:
  schedule:
    - cron: "0 14 * * 1" # every Monday at 14:00 UTC (LinkedIn/Reddit peak)
    - cron: "0 16 * * 3" # every Wednesday at 16:00 UTC (Twitter peak)
    - cron: "0 9 * * 5" # every Friday at 09:00 UTC (SEO sitemap refresh)
  workflow_dispatch:
    inputs:
      strategy:
        description: "Which strategy to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - seo_only
          - linkedin_only
          - reddit_only
          - content_drafts
      dry_run:
        # STAGED ACTIVATION: defaults to true so scheduled runs and default
        # manual runs print the LinkedIn/Reddit posts they *would* publish
        # without posting live. To publish live for one run, dispatch manually
        # with this unchecked. To remove the guard permanently after reviewing
        # staged output, flip this default and the two `|| 'true'` fallbacks
        # below back to 'false'.
        description: "Dry run (no live posts)"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: read

concurrency:
  group: marketing-pipeline
  cancel-in-progress: false

jobs:
  seo-refresh:
    name: SEO — Sitemap refresh + IndexNow ping
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && (inputs.strategy == 'all' || inputs.strategy == 'seo_only') ||
      github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Ping IndexNow for all domains
        run: |
          KEY="authichain2026indexnow"
          for DOMAIN in authichain.com qron.space strainchain.io govchain.us; do
            echo "Pinging IndexNow for $DOMAIN..."
            curl -s -o /dev/null -w "%{http_code}" \
              "https://api.indexnow.org/indexnow?url=https://${DOMAIN}/sitemap.xml&key=${KEY}" \
              -H "Content-Type: application/x-www-form-urlencoded" || true
          done

      - name: Submit sitemaps to Google Search Console
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            echo "GSC_SERVICE_ACCOUNT_JSON not set — skipping GSC ping"
            exit 0
          fi
          pip install --quiet google-auth requests 2>/dev/null
          python3 - <<'EOF'
          import json, os
          from google.oauth2 import service_account
          import google.auth.transport.requests
          import requests

          creds_json = os.environ["GSC_SERVICE_ACCOUNT_JSON"]
          creds = service_account.Credentials.from_service_account_info(
              json.loads(creds_json),
              scopes=["https://www.googleapis.com/auth/webmasters"]
          )
          auth_req = google.auth.transport.requests.Request()
          creds.refresh(auth_req)
          token = creds.token

          sitemaps = [
              ("https://authichain.com", "/sitemap.xml"),
              ("https://qron.space", "/sitemap.xml"),
              ("https://strainchain.io", "/sitemap.xml"),
              ("https://govchain.us", "/sitemap.xml"),
          ]
          for site, path in sitemaps:
              url = f"https://www.googleapis.com/webmasters/v3/sites/{requests.utils.quote(site + '/', safe='')}/sitemaps/{requests.utils.quote(site + path, safe='')}"
              r = requests.put(url, headers={"Authorization": f"Bearer {token}"})
              print(f"{site}{path}: {r.status_code}")
          EOF

  linkedin-post:
    name: LinkedIn — retired in favour of validated bundles
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.strategy == 'linkedin_only'
    steps:
      # The rotating posts that used to live here were hardcoded and unbacked:
      # a "$4.5 trillion" market size with no source, "100% scannable under
      # real-world conditions" as a guarantee, "verification = 2 seconds" with
      # nothing benchmarked, and "in active conversations with 3 Michigan
      # agencies" as a claim about business relationships. They posted to
      # LinkedIn every Monday.
      #
      # LinkedIn now publishes from content/social/, where every bundle must
      # pass scripts/validate-social-bundle.mjs before it can go out. See
      # content-publish.yml.
      - name: Explain where LinkedIn posting moved
        run: |
          echo "LinkedIn posting is handled by content-publish.yml."
          echo "It publishes validated bundles from content/social/ rather than hardcoded copy."
          exit 0

  content-drafts:
    name: Content — Generate weekly drafts
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && (inputs.strategy == 'all' || inputs.strategy == 'content_drafts')
    steps:
      - uses: actions/checkout@v4

      - name: Validate content files exist
        run: |
          echo "Content files:"
          ls -la content/launch/ 2>/dev/null || echo "No content/launch/ directory"
          echo ""
          echo "Sitemaps:"
          ls -la public/sitemap*.xml 2>/dev/null || echo "No sitemaps"

      - name: Show this week's scheduled posts
        run: |
          WEEK=$(date +%W)
          DAY=$(date +%u)
          echo "Week $WEEK, Day $DAY"
          echo ""
          echo "== Reddit posts ready to copy-paste =="
          cat content/launch/qron_reddit_v3.md
          echo ""
          echo "== LinkedIn posts =="
          cat content/launch/authichain_linkedin.md
          echo ""
          echo "== Twitter threads =="
          cat content/launch/govchain_twitter.md

  reddit-draft:
    name: Reddit — retired in favour of validated bundles
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.strategy == 'reddit_only'
    steps:
      # The hardcoded r/QRcode submission that used to live here claimed
      # error-correction "L4" (QR levels are L/M/Q/H — there is no L4) and
      # carried no affiliation disclosure, which is exactly the astroturfing
      # that gets an account banned from the subreddits worth posting in.
      #
      # Reddit now publishes from content/social/, where the validator refuses
      # any bundle whose body omits the disclosure. See content-publish.yml.
      - name: Explain where Reddit posting moved
        run: |
          echo "Reddit posting is handled by content-publish.yml."
          echo "Every bundle must carry an affiliation disclosure to pass validation."
          exit 0
