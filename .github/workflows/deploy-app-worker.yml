name: Deploy App Worker (OpenNext on Cloudflare)

# Builds the root Next.js app with @opennextjs/cloudflare and deploys it as
# the `authichain-app` worker — the replacement for the Vercel deployment of
# app.authichain.com. Manual-only until the free-tier staging gate passes
# (see the Vercel-elimination plan); then enable the push trigger.

on:
  workflow_dispatch: {}
  # Enable after the staging gate passes:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'src/**'
  #     - 'server/**'
  #     - 'shared/**'
  #     - 'public/**'
  #     - 'package.json'
  #     - 'next.config.js'
  #     - 'open-next.config.ts'
  #     - 'wrangler.app.jsonc'
  #     - '.github/workflows/deploy-app-worker.yml'

concurrency:
  group: deploy-app-worker
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy authichain-app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip if Cloudflare credentials not configured
        id: check
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "CLOUDFLARE_API_TOKEN not set — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip == 'false'

      - name: Setup pnpm
        if: steps.check.outputs.skip == 'false'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: '10.28.2'

      - name: Setup Node 22
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: pnpm install --no-frozen-lockfile

      - name: Build (OpenNext for Cloudflare)
        if: steps.check.outputs.skip == 'false'
        env:
          APP_ORIGIN: 'https://app.authichain.com'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        run: pnpm build:cf

      - name: Deploy authichain-app
        if: steps.check.outputs.skip == 'false'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            run: npx wrangler deploy --minify --config wrangler.app.jsonc
