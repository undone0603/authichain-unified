name: Auto-merge Dependabot PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  check_suite:
    types: [completed]

jobs:
  automerge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: write
    steps:
      - name: Auto-merge Dependabot PRs
        uses: actions/github-script@v6
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let pr_number = null;

            if (context.payload.pull_request) {
              pr_number = context.payload.pull_request.number;
            } else if (context.payload.check_suite) {
              const sha = context.payload.check_suite.head_sha;
              const list = await github.rest.repos.listPullRequestsAssociatedWithCommit({owner, repo, commit_sha: sha});
              if (list.data.length > 0) pr_number = list.data[0].number;
            }

            if (!pr_number) {
              core.info('No associated PR found for event, exiting.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({owner, repo, pull_number: pr_number});
            const author = pr.user && pr.user.login;
            if (!author || !author.startsWith('dependabot')) {
              core.info(`PR #${pr_number} author is ${author}; not a dependabot PR.`);
              return;
            }

            // Refresh PR to get mergeable state
            const refreshed = await github.rest.pulls.get({owner, repo, pull_number: pr_number});
            if (refreshed.data.mergeable_state !== 'clean') {
              core.info(`PR #${pr_number} mergeable_state=${refreshed.data.mergeable_state}; skipping.`);
              return;
            }

            const ref = refreshed.data.head.sha;
            // Check combined status
            const status = await github.rest.repos.getCombinedStatusForRef({owner, repo, ref});
            if (status.data.state !== 'success') {
              core.info(`Combined status for ${ref} is ${status.data.state}; skipping.`);
              return;
            }

            // Check check runs
            const checks = await github.rest.checks.listForRef({owner, repo, ref});
            const failing = checks.data.check_runs.find(c => c.conclusion !== 'success' && c.conclusion !== 'neutral' && c.conclusion !== null);
            if (failing) {
              core.info(`Found failing check run: ${failing.name} (${failing.conclusion}); skipping.`);
              return;
            }

            // Merge the PR (squash to keep history tidy)
            await github.rest.pulls.merge({owner, repo, pull_number: pr_number, merge_method: 'squash'});
            core.info(`Merged PR #${pr_number} (Dependabot).`);

