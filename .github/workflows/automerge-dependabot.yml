name: Auto-merge Dependabot PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  check_suite:
    types: [completed]

jobs:
  automerge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: write
    steps:
      - name: Resolve dependabot PR eligibility
        id: resolve
        uses: actions/github-script@v6
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let pr_number = null;

            if (context.payload.pull_request) {
              pr_number = context.payload.pull_request.number;
            } else if (context.payload.check_suite) {
              const sha = context.payload.check_suite.head_sha;
              const list = await github.rest.repos.listPullRequestsAssociatedWithCommit({owner, repo, commit_sha: sha});
              if (list.data.length > 0) pr_number = list.data[0].number;
            }

            if (!pr_number) {
              core.info('No associated PR found for event, exiting.');
              core.setOutput('eligible', 'false');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({owner, repo, pull_number: pr_number});
            const author = pr.user && pr.user.login;
            if (!author || !author.startsWith('dependabot')) {
              core.info(`PR #${pr_number} author is ${author}; not a dependabot PR.`);
              core.setOutput('eligible', 'false');
              return;
            }

            // Refresh PR to get mergeable state
            const refreshed = await github.rest.pulls.get({owner, repo, pull_number: pr_number});
            if (refreshed.data.mergeable_state !== 'clean') {
              core.info(`PR #${pr_number} mergeable_state=${refreshed.data.mergeable_state}; skipping.`);
              core.setOutput('eligible', 'false');
              return;
            }

            const ref = refreshed.data.head.sha;
            // Check combined status
            const status = await github.rest.repos.getCombinedStatusForRef({owner, repo, ref});
            if (status.data.state !== 'success') {
              core.info(`Combined status for ${ref} is ${status.data.state}; skipping.`);
              core.setOutput('eligible', 'false');
              return;
            }

            // Check check runs
            const checks = await github.rest.checks.listForRef({owner, repo, ref});
            const failing = checks.data.check_runs.find(c => c.conclusion !== 'success' && c.conclusion !== 'neutral' && c.conclusion !== null);
            if (failing) {
              core.info(`Found failing check run: ${failing.name} (${failing.conclusion}); skipping.`);
              core.setOutput('eligible', 'false');
              return;
            }

            core.setOutput('eligible', 'true');
            core.setOutput('pr_number', String(pr_number));

      # Textual 3-way merges of pnpm-lock.yaml (a large generated file) can
      # silently produce duplicated mapping keys without registering as a git
      # conflict — this happened repeatedly on this repo. It's tempting to
      # "fix" that here by checking out the merge preview and running a real
      # install before merging — but that means checking out PR-controlled
      # content inside a privileged pull_request_target trigger, a "pwn
      # request" shape CodeQL correctly flags regardless of mitigations
      # (--ignore-scripts, persist-credentials: false — tried both, still
      # flagged, and rightly so: the checkout itself is the risk surface).
      #
      # It also turns out to be unnecessary: ci.yml and main.yml already
      # trigger on plain `pull_request`, and GitHub's default checkout for
      # that event *is* the merge-preview commit (refs/pull/<n>/merge) —
      # reported back as a check run against the PR's head SHA. So the
      # checks.listForRef() call above already inspects a check that
      # validates the actual merged tree, with zero privileged-checkout risk.
      # (This only holds now that ci.yml/main.yml correctly run
      # `pnpm install --frozen-lockfile` — see the pnpm-setup fix landed
      # alongside this comment.)
      - name: Merge PR
        if: steps.resolve.outputs.eligible == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr_number = Number('${{ steps.resolve.outputs.pr_number }}');
            await github.rest.pulls.merge({ owner, repo, pull_number: pr_number, merge_method: 'squash' });
            core.info(`Merged PR #${pr_number} (Dependabot).`);
