name: Deploy qron-ai-api (worker/)

# The root worker/ directory is the qron-ai-api Worker (worker/wrangler.toml).
# Nothing else deploys it: deploy-workers.yml covers workers/*, and its
# Cloudflare Workers Builds git connection is off. Manual dispatch only, so a
# push to main never ships it by surprise.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-qron-ai-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "10.28.2"
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install (frozen, worker/ is its own workspace)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Dry run
        run: pnpm exec wrangler deploy --dry-run
      - name: Deploy qron-ai-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
