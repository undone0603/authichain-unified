# Copy the lead-intake secrets from GitHub Actions secrets onto the live apex
# Worker. /api/book, /api/lead-capture, /api/leads/capture and /api/crm/sync
# run on authichain-edge-router (worker-app/lead-routes.ts) since Vercel was
# retired; without these they save leads to Supabase but skip HubSpot and the
# demo-request email.
#
# Values never pass through workflow_dispatch inputs (they would appear in run
# metadata). Set them as GitHub Actions secrets first, then run this job.
# Empty secrets are skipped, so re-running never wipes a value bound earlier.
name: Bind lead-intake secrets

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Bind lead-intake secrets on authichain-edge-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          HUBSPOT_OWNER_ID: ${{ secrets.HUBSPOT_OWNER_ID }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SALES_NOTIFY_EMAIL: ${{ secrets.SALES_NOTIFY_EMAIL }}
          OUTREACH_FROM_EMAIL: ${{ secrets.OUTREACH_FROM_EMAIL }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          MAKE_LEAD_WEBHOOK_URL: ${{ secrets.MAKE_LEAD_WEBHOOK_URL }}
          N8N_LEAD_WEBHOOK_URL: ${{ secrets.N8N_LEAD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          for required in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!required:-}" ]; then
              echo "::error::GitHub secret $required is empty"
              exit 1
            fi
          done
          if [ -z "${HUBSPOT_ACCESS_TOKEN:-}${HUBSPOT_TOKEN:-}" ]; then
            echo "::error::Neither HUBSPOT_ACCESS_TOKEN nor HUBSPOT_TOKEN is set in GitHub Actions secrets"
            exit 1
          fi

          WORKER_NAME="authichain-edge-router"
          put_secret() {
            local key="$1"
            local value="${!key:-}"
            if [ -z "$value" ]; then
              echo "::notice::$key GitHub secret empty — not bound on $WORKER_NAME"
              return 0
            fi
            printf '%s' "$value" | wrangler secret put "$key" --name "$WORKER_NAME"
            echo "bound $key on $WORKER_NAME (value not logged)"
          }
          for key in HUBSPOT_ACCESS_TOKEN HUBSPOT_TOKEN HUBSPOT_OWNER_ID \
                     INTERNAL_API_SECRET RESEND_API_KEY SALES_NOTIFY_EMAIL \
                     OUTREACH_FROM_EMAIL APOLLO_API_KEY MAKE_LEAD_WEBHOOK_URL \
                     N8N_LEAD_WEBHOOK_URL; do
            put_secret "$key"
          done
