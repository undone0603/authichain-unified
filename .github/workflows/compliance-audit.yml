name: Compliance Audit

on:
  push:
    branches:
      - main
  pull_request:
    # GB-26 fix 3: skip PRs that touch ONLY these paths. Kept narrow on
    # purpose: docs/** is NOT ignored because product code renders and
    # validates it (workers/authichain-com docs pages, identity validators,
    # src/lib/authentic-economy.ts). Pushes to main are never filtered.
    paths-ignore:
      - "*.md"
      - "**/CHANGELOG.md"
      - "docs/archive/**"
  workflow_dispatch:

permissions:
  contents: read

# GB-26 fix 4: a newer commit on the same PR cancels the older run. Pushes to
# main, schedules and dispatches get one group per commit and are never
# cancelled (PM-328).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compliance-audit:
    name: Run EU DPP Compliance Audit
    # Fork PRs stay on ubuntu-24.04; same-repo PRs keep WSL.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","ARM64","authichain-wsl"]') || 'ubuntu-24.04' }} # pragma: allowlist secret
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        timeout-minutes: 15
        run: |
          pip install --upgrade pip
          pip install -r requirements-agentz.txt

      - name: Run Compliance Audit (dry-run)
        # CI validates the audit plan only. Live Supabase metadata writes require
        # an owner-approved execution path and are not part of push/PR automation.
        run: python -m agentz.workflows.runner --handler authichain_compliance_audit --mode dry-run
