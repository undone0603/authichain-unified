name: Compliance Audit

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  compliance-audit:
    name: Run EU DPP Compliance Audit
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements-agentz.txt
      
      - name: Run Compliance Audit
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Point to your local LM Studio instance
          LOCAL_MODEL_URL: http://192.168.254.10:1234
        run: |
          # Execute the handler, which will now look for the model at your local IP
          python -m agentz.workflows.runner --handler authichain_compliance_audit
