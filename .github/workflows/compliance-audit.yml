name: Compliance Audit

on:
  push:
    branches:
      - main
  pull_request:
    # GB-26 fix 3: skip PRs that touch ONLY these paths. Kept narrow on
    # purpose: docs/** is NOT ignored because product code renders and
    # validates it (workers/authichain-com docs pages, identity validators,
    # src/lib/authentic-economy.ts). Pushes to main are never filtered.
    paths-ignore:
      - "*.md"
      - "**/CHANGELOG.md"
      - "docs/archive/**"
  workflow_dispatch:

permissions:
  contents: read

# GB-26 fix 4: a newer commit on the same PR cancels the older run. Pushes to
# main, schedules and dispatches get one group per commit and are never
# cancelled (PM-328).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compliance-audit:
    name: Run EU DPP Compliance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This job requires SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repository
    # secrets to talk to the live product ledger. Those secrets are not
    # configured for every PR (e.g. forks). The `secrets` context is not
    # available in a job-level `if`, so the availability check runs as the
    # first step and the audit step is guarded with an env-based condition.
    env:
      # CFA-215: false on pull_request so PR code never receives these secrets.
      HAS_SUPABASE_SECRETS: ${{ github.event_name != 'pull_request' && secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-agentz.txt

      - name: Check secrets availability
        run: |
          if [ "${HAS_SUPABASE_SECRETS}" = "true" ]; then
            echo "Supabase secrets available - running audit."
          else
            echo "Supabase secrets unavailable - skipping audit."
          fi

      - name: Run Compliance Audit
        if: env.HAS_SUPABASE_SECRETS == 'true'
        env:
          SUPABASE_URL: ${{ github.event_name != 'pull_request' && secrets.SUPABASE_URL || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ github.event_name != 'pull_request' && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
        run: python -m agentz.workflows.runner --handler authichain_compliance_audit
