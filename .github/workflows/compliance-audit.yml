name: Compliance Audit

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compliance-audit:
    name: Run EU DPP Compliance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This job requires SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repository
    # secrets to talk to the live product ledger. Those secrets are not
    # configured for every PR (e.g. forks), so skip the job entirely rather
    # than failing CI when they're unavailable.
    if: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-agentz.txt

      - name: Run Compliance Audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m agentz.workflows.runner --handler authichain_compliance_audit
