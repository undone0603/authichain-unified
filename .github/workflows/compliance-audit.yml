name: Compliance Audit

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compliance-audit:
    name: Run EU DPP Compliance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required secrets
        id: secrets_check
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "::notice::SUPABASE_URL not set — skipping compliance audit. Configure repo secrets to enable."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.secrets_check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.secrets_check.outputs.skip != 'true'
        run: |
          pip install --upgrade pip
          pip install -r requirements-agentz.txt

      - name: Run Compliance Audit
        if: steps.secrets_check.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m agentz.workflows.runner --handler authichain_compliance_audit

      - name: Audit skipped
        if: steps.secrets_check.outputs.skip == 'true'
        run: echo "Compliance audit skipped — configure SUPABASE_URL in GitHub repo secrets."
