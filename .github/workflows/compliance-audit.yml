name: Compliance Audit

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compliance-audit:
    name: Run EU DPP Compliance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-agentz.txt

      - name: Run Compliance Audit (Groq-only)
        env:
          LLM_PROVIDER: groq
          LLM_MODEL: llama-3.3-70b-versatile
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ""
          GEMINI_API_KEY: ""
          OPENROUTER_API_KEY: ""
          CEREBRAS_API_KEY: ""
          DEEPSEEK_API_KEY: ""
          LMSTUDIO_API_KEY: ""
          OLLAMA_API_KEY: ""
          AGENTZ_DISABLE_HEALER: "true"
        run: python -m agentz.workflows.runner --handler authichain_compliance_audit
