name: Production Cloudflare Deployment Gate

on:
  workflow_call:
    inputs:
      deployment_name:
        description: "Logical production deployment being authorized"
        required: true
        type: string
    secrets:
      GITHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks full-history scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_CONFIG: .gitleaks.toml

  impact-classification:
    name: Deployment-impact classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Classify requested deployment
        env:
          DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
        run: |
          set -euo pipefail
          echo "deployment=${DEPLOYMENT_NAME}"
          echo "sha=${GITHUB_SHA}"
          echo "ref=${GITHUB_REF}"
          echo "Production deployment requires workflow_dispatch and the protected production-cloudflare environment."
          git diff --name-status HEAD^ HEAD || true

  authorization:
    name: Gate complete — deploy job requires approval
    needs: [secret-scan, impact-classification]
    runs-on: ubuntu-latest
    steps:
      - name: Authorization checkpoint
        run: |
          echo "Pre-deployment gate passed for: ${{ inputs.deployment_name }}"
          echo "The caller deploy job is the single protected production authorization point."
