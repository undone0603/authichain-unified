name: GovChain – Ingest SAM.gov

on:
  workflow_call:
    inputs:
      dry_run:
        required: false
        type: string
        default: "true"
    secrets:
      SAM_API_KEY:
        required: false
      SAM_GOV_API_KEY:
        required: false
      SUPABASE_URL:
        required: false
      SUPABASE_SERVICE_ROLE_KEY:
        required: false

jobs:
  ingest-opportunities:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { version: "10.28.2" }
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      - name: Ingest SAM.gov opportunities into vector store
        run: pnpm exec tsx scripts/ingest-sam.ts
        env:
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY || secrets.SAM_API_KEY }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY || secrets.SAM_GOV_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'true' }}
