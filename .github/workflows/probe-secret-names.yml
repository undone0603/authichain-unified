name: Probe secret names (names only)

# Branch-only ops workflow. Prints NAME: present|empty only. Never prints values,
# never uploads anything. Not in .github/autonomy.json (never merged).

on:
  push:
    branches:
      - ops/sync-app-secrets
    paths:
      - .github/workflows/probe-secret-names.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-envs:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.e.outputs.envs }}
    steps:
      - id: e
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          json=$(gh api "repos/${GITHUB_REPOSITORY}/environments" --jq '[.environments[].name]' 2>/dev/null || echo '[]')
          [ -z "$json" ] && json='[]'
          echo "Environments: $json"
          echo "envs=$(echo "$json" | jq -c .)" >> "$GITHUB_OUTPUT"

  probe-repo:
    runs-on: ubuntu-latest
    env: &cands
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
      HEYGEN_KEY: ${{ secrets.HEYGEN_KEY }}
      HEYGEN_TOKEN: ${{ secrets.HEYGEN_TOKEN }}
      HUBSPOT_SERVICE_KEY: ${{ secrets.HUBSPOT_SERVICE_KEY }}
      HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
      HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
      HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
      HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
      GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_FROM_EMAIL: ${{ secrets.GMAIL_FROM_EMAIL }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
      MAKE_WEBHOOK: ${{ secrets.MAKE_WEBHOOK }}
      MAKE_LEAD_WEBHOOK_URL: ${{ secrets.MAKE_LEAD_WEBHOOK_URL }}
      INTEGROMAT_WEBHOOK_URL: ${{ secrets.INTEGROMAT_WEBHOOK_URL }}
      N8N_LEAD_WEBHOOK_URL: ${{ secrets.N8N_LEAD_WEBHOOK_URL }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
      FAL_AI_KEY: ${{ secrets.FAL_AI_KEY }}
      FAL_AI_API_KEY: ${{ secrets.FAL_AI_API_KEY }}
      FALAI_API_KEY: ${{ secrets.FALAI_API_KEY }}
    steps:
      - name: Probe (repo scope)
        run: &probe |
          for n in HEYGEN_API_KEY HEYGEN_KEY HEYGEN_TOKEN HUBSPOT_SERVICE_KEY HUBSPOT_ACCESS_TOKEN HUBSPOT_TOKEN HUBSPOT_PRIVATE_APP_TOKEN HUBSPOT_API_KEY GMAIL_APP_PASSWORD GMAIL_PASS GMAIL_PASSWORD GMAIL_USER GMAIL_FROM_EMAIL GMAIL_CLIENT_ID GMAIL_CLIENT_SECRET GMAIL_REFRESH_TOKEN SMTP_PASS SMTP_PASSWORD MAKE_WEBHOOK_URL MAKE_WEBHOOK MAKE_LEAD_WEBHOOK_URL INTEGROMAT_WEBHOOK_URL N8N_LEAD_WEBHOOK_URL FAL_KEY FAL_API_KEY FAL_AI_KEY FAL_AI_API_KEY FALAI_API_KEY; do
            if [ -n "${!n:-}" ]; then echo "PROBE $n: present"; else echo "PROBE $n: empty"; fi
          done

  probe-envs:
    needs: list-envs
    if: needs.list-envs.outputs.envs != '[]' && needs.list-envs.outputs.envs != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        env_name: ${{ fromJSON(needs.list-envs.outputs.envs) }}
    environment:
      name: ${{ matrix.env_name }}
      deployment: false
    env: *cands
    steps:
      - name: Probe (environment scope)
        run: *probe

  probe-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: List secret NAMES on each Worker (names only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          npm i -g wrangler@4 >/dev/null 2>&1
          workers=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" | jq -r '.result[].id')
          for w in $workers; do
            names=$(wrangler secret list --name "$w" --format json 2>/dev/null | jq -r '.[].name' 2>/dev/null | grep -Ei 'HEYGEN|HUBSPOT|GMAIL|SMTP|MAKE_|INTEGROMAT|WEBHOOK_URL|^FAL' | tr '\n' ' ')
            echo "CF $w: ${names:-(none matching)}"
          done
