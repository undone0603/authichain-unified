name: Probe secret names (names only)

# Branch-only ops workflow. Prints NAME: present|empty only. Never prints values,
# never uploads anything. Not in .github/autonomy.json (never merged).

on:
  push:
    branches:
      - ops/sync-app-secrets
    paths:
      - .github/workflows/probe-secret-names.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-envs:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.e.outputs.envs }}
    steps:
      - id: e
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          json=$(gh api "repos/${GITHUB_REPOSITORY}/environments" --jq '[.environments[].name]' 2>/dev/null || echo '[]')
          [ -z "$json" ] && json='[]'
          echo "Environments: $json"
          echo "envs=$(echo "$json" | jq -c .)" >> "$GITHUB_OUTPUT"

  probe-envs:
    needs: list-envs
    if: needs.list-envs.outputs.envs != '[]' && needs.list-envs.outputs.envs != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        env_name: ${{ fromJSON(needs.list-envs.outputs.envs) }}
    environment:
      name: ${{ matrix.env_name }}
      deployment: false
    env:
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
      HEYGEN_KEY: ${{ secrets.HEYGEN_KEY }}
      HEYGEN_TOKEN: ${{ secrets.HEYGEN_TOKEN }}
      HUBSPOT_SERVICE_KEY: ${{ secrets.HUBSPOT_SERVICE_KEY }}
      HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
      HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
      GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
      MAKE_WEBHOOK: ${{ secrets.MAKE_WEBHOOK }}
      MAKE_LEAD_WEBHOOK_URL: ${{ secrets.MAKE_LEAD_WEBHOOK_URL }}
      INTEGROMAT_WEBHOOK_URL: ${{ secrets.INTEGROMAT_WEBHOOK_URL }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
      FAL_AI_KEY: ${{ secrets.FAL_AI_KEY }}
      FAL_AI_API_KEY: ${{ secrets.FAL_AI_API_KEY }}
      FALAI_API_KEY: ${{ secrets.FALAI_API_KEY }}
    steps:
      - name: Probe (environment scope) - fails only if a candidate is present
        run: |
          hits=""
          for n in HEYGEN_API_KEY HEYGEN_KEY HEYGEN_TOKEN HUBSPOT_SERVICE_KEY HUBSPOT_PRIVATE_APP_TOKEN HUBSPOT_API_KEY GMAIL_APP_PASSWORD GMAIL_PASS GMAIL_PASSWORD SMTP_PASS SMTP_PASSWORD MAKE_WEBHOOK_URL MAKE_WEBHOOK MAKE_LEAD_WEBHOOK_URL INTEGROMAT_WEBHOOK_URL FAL_KEY FAL_API_KEY FAL_AI_KEY FAL_AI_API_KEY FALAI_API_KEY; do
            if [ -n "${!n:-}" ]; then hits="$hits $n"; fi
          done
          if [ -n "$hits" ]; then echo "ENVHIT ${{ matrix.env_name }}:$hits"; exit 1; fi
          echo "ENV ${{ matrix.env_name }}: no candidates present"

  probe-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: List secret NAMES on each Worker (names only)
        shell: bash {0}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm i -g wrangler@4 >/dev/null 2>&1
          for w in collective-cloud verifier-web first-dollar-desk storepilot authichain-agentz authichain-qfs-adapter esktop passport-demo gs1-resolver authichain-agentz-webhook glowchain-io partchain-io threadchain-io harvestchain-io rxchain-io chipchain-io fanchain-io provenchain-io authichain-edge-router authichain-openclaw luxechain-io qron-stripe-webhook dpp-fulfillment authichain-app authichain-revenue-worker stripe-webhook authichain-outreach-engine outreach-queue authichain-unified stripe-webhook-worker authichain-consensus-engine blockchain analytics authichain-infra auth ai-classification authichain-bridge qron-edge watchchain-io-vertical authichain-qron-provenance authichain-gateway authichain-telegram authichain-license-issuer authichain-chain-data authichain-autopilot bitcoin-auth authichain-verify-worker qron-ai-api authichain-api-gateway authichain-com authichain-api authichain authichain-scan-validate govchain-us strainchain-io qron-space qron-outreach qron-automation qron-portfolio authichain-dashboard qron-image-gen gmail-relay-z qron-self-heal qron-daily-ops resend-relay authichain-automation; do
            out=$(wrangler secret list --name "$w" --format json 2>/dev/null)
            rc=$?
            if [ $rc -ne 0 ]; then echo "CF $w: ERROR listing (rc=$rc)"; continue; fi
            total=$(echo "$out" | jq 'length' 2>/dev/null)
            names=$(echo "$out" | jq -r '.[].name' 2>/dev/null | grep -Ei 'HEYGEN|HUBSPOT|GMAIL|SMTP|MAKE_|INTEGROMAT|WEBHOOK_URL|^FAL' | tr '\n' ' ')
            echo "CF $w (total=$total): ${names:-(none matching)}"
          done
          exit 0
