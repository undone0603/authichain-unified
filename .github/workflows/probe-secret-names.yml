name: Probe secret names (names only)

# Branch-only ops workflow. Prints names only. Never prints values,
# never uploads anything. Not in .github/autonomy.json (never merged).

on:
  push:
    branches:
      - ops/sync-app-secrets
    paths:
      - .github/workflows/probe-secret-names.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-envs:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.e.outputs.envs }}
    steps:
      - id: e
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          json=$(gh api "repos/${GITHUB_REPOSITORY}/environments" --jq '[.environments[].name]')
          echo "envs=$(echo "$json" | jq -c .)" >> "$GITHUB_OUTPUT"

  probe-envs:
    needs: list-envs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        env_name: ${{ fromJSON(needs.list-envs.outputs.envs) }}
    environment:
      name: ${{ matrix.env_name }}
      deployment: false
    env:
      S_HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
      S_FAL_KEY: ${{ secrets.FAL_KEY }}
      S_FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
      S_MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
      S_MAKE_LEAD_WEBHOOK_URL: ${{ secrets.MAKE_LEAD_WEBHOOK_URL }}
      S_GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      S_HUBSPOT_SERVICE_KEY: ${{ secrets.HUBSPOT_SERVICE_KEY }}
      V_HEYGEN_API_KEY: ${{ vars.HEYGEN_API_KEY }}
      V_FAL_KEY: ${{ vars.FAL_KEY }}
      V_FAL_API_KEY: ${{ vars.FAL_API_KEY }}
      V_MAKE_WEBHOOK_URL: ${{ vars.MAKE_WEBHOOK_URL }}
      V_MAKE_LEAD_WEBHOOK_URL: ${{ vars.MAKE_LEAD_WEBHOOK_URL }}
      V_GMAIL_APP_PASSWORD: ${{ vars.GMAIL_APP_PASSWORD }}
      V_HUBSPOT_SERVICE_KEY: ${{ vars.HUBSPOT_SERVICE_KEY }}
    steps:
      - name: Probe (fails only if a target name is present)
        run: |
          hits=""
          for n in HEYGEN_API_KEY FAL_KEY FAL_API_KEY MAKE_WEBHOOK_URL MAKE_LEAD_WEBHOOK_URL GMAIL_APP_PASSWORD HUBSPOT_SERVICE_KEY; do
            s="S_$n"; v="V_$n"
            [ -n "${!s:-}" ] && hits="$hits secret:$n"
            [ -n "${!v:-}" ] && hits="$hits var:$n"
          done
          if [ -n "$hits" ]; then echo "ENVHIT ${{ matrix.env_name }}:$hits"; exit 1; fi
          echo "ENV ${{ matrix.env_name }}: none present"
