name: Probe secret names (names only)

# Branch-only ops workflow. Prints NAME: present|empty only. Never prints values,
# never uploads anything. Not in .github/autonomy.json (never merged).

on:
  push:
    branches:
      - ops/sync-app-secrets
    paths:
      - .github/workflows/probe-secret-names.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-envs:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/environments" --jq '.environments[].name' | sed 's/^/ENVNAME: /' || echo "ENVNAME: (could not list)"

  probe-repo:
    runs-on: ubuntu-latest
    env:
      S_HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
      S_FAL_KEY: ${{ secrets.FAL_KEY }}
      S_FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
      S_MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
      S_MAKE_LEAD_WEBHOOK_URL: ${{ secrets.MAKE_LEAD_WEBHOOK_URL }}
      S_GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      S_HUBSPOT_SERVICE_KEY: ${{ secrets.HUBSPOT_SERVICE_KEY }}
      S_HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
      S_HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
      S_APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
      V_HEYGEN_API_KEY: ${{ vars.HEYGEN_API_KEY }}
      V_FAL_KEY: ${{ vars.FAL_KEY }}
      V_FAL_API_KEY: ${{ vars.FAL_API_KEY }}
      V_MAKE_WEBHOOK_URL: ${{ vars.MAKE_WEBHOOK_URL }}
      V_MAKE_LEAD_WEBHOOK_URL: ${{ vars.MAKE_LEAD_WEBHOOK_URL }}
      V_GMAIL_APP_PASSWORD: ${{ vars.GMAIL_APP_PASSWORD }}
      V_HUBSPOT_SERVICE_KEY: ${{ vars.HUBSPOT_SERVICE_KEY }}
      V_HUBSPOT_ACCESS_TOKEN: ${{ vars.HUBSPOT_ACCESS_TOKEN }}
      V_HUBSPOT_TOKEN: ${{ vars.HUBSPOT_TOKEN }}
      V_APOLLO_API_KEY: ${{ vars.APOLLO_API_KEY }}
    steps:
      - name: Probe repo scope
        run: |
          for n in HEYGEN_API_KEY FAL_KEY FAL_API_KEY MAKE_WEBHOOK_URL MAKE_LEAD_WEBHOOK_URL GMAIL_APP_PASSWORD HUBSPOT_SERVICE_KEY HUBSPOT_ACCESS_TOKEN HUBSPOT_TOKEN APOLLO_API_KEY; do
            s="S_$n"; v="V_$n"
            [ -n "${!s:-}" ] && sp=present || sp=empty
            [ -n "${!v:-}" ] && vp=present || vp=empty
            echo "REPO $n: secret=$sp var=$vp"
          done

  probe-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: Production
      deployment: false
    env:
      S_HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
      S_FAL_KEY: ${{ secrets.FAL_KEY }}
      S_FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
      S_MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
      S_MAKE_LEAD_WEBHOOK_URL: ${{ secrets.MAKE_LEAD_WEBHOOK_URL }}
      S_GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      S_HUBSPOT_SERVICE_KEY: ${{ secrets.HUBSPOT_SERVICE_KEY }}
      S_HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
      S_HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
      S_APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
      V_HEYGEN_API_KEY: ${{ vars.HEYGEN_API_KEY }}
      V_FAL_KEY: ${{ vars.FAL_KEY }}
      V_FAL_API_KEY: ${{ vars.FAL_API_KEY }}
      V_MAKE_WEBHOOK_URL: ${{ vars.MAKE_WEBHOOK_URL }}
      V_MAKE_LEAD_WEBHOOK_URL: ${{ vars.MAKE_LEAD_WEBHOOK_URL }}
      V_GMAIL_APP_PASSWORD: ${{ vars.GMAIL_APP_PASSWORD }}
      V_HUBSPOT_SERVICE_KEY: ${{ vars.HUBSPOT_SERVICE_KEY }}
      V_HUBSPOT_ACCESS_TOKEN: ${{ vars.HUBSPOT_ACCESS_TOKEN }}
      V_HUBSPOT_TOKEN: ${{ vars.HUBSPOT_TOKEN }}
      V_APOLLO_API_KEY: ${{ vars.APOLLO_API_KEY }}
    steps:
      - name: Probe Production environment scope (includes inherited repo scope)
        run: |
          for n in HEYGEN_API_KEY FAL_KEY FAL_API_KEY MAKE_WEBHOOK_URL MAKE_LEAD_WEBHOOK_URL GMAIL_APP_PASSWORD HUBSPOT_SERVICE_KEY HUBSPOT_ACCESS_TOKEN HUBSPOT_TOKEN APOLLO_API_KEY; do
            s="S_$n"; v="V_$n"
            [ -n "${!s:-}" ] && sp=present || sp=empty
            [ -n "${!v:-}" ] && vp=present || vp=empty
            echo "PROD $n: secret=$sp var=$vp"
          done

  count-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Count authichain-app secret names
        shell: bash {0}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          out=$(npx --yes wrangler@4 secret list --name authichain-app --format json 2>/dev/null); rc=$?
          echo "rc=$rc total_secrets=$(echo "$out" | jq 'length')"
          for n in HEYGEN_API_KEY FAL_KEY MAKE_WEBHOOK_URL GMAIL_APP_PASSWORD HUBSPOT_SERVICE_KEY APOLLO_API_KEY APP_ORIGIN; do
            if echo "$out" | jq -e --arg n "$n" 'map(.name)|index($n)' >/dev/null; then echo "APP has $n"; else echo "APP lacks $n"; fi
          done
