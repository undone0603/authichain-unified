# Typecheck ratchet for the programs CI Main never typechecked: the root
# (scripts/, server/, src/), the standalone Workers and the edge router.
# Fails on any syntax error and on any increase over
# .github/typecheck-baseline.json. See scripts/typecheck-ratchet.mjs.
name: Typecheck ratchet

on:
  pull_request:
    # GB-26 fix 3: skip PRs that touch ONLY these paths. Kept narrow on
    # purpose: docs/** is NOT ignored because product code renders and
    # validates it (workers/authichain-com docs pages, identity validators,
    # src/lib/authentic-economy.ts). Pushes to main are never filtered.
    paths-ignore:
      - "*.md"
      - "**/CHANGELOG.md"
      - "docs/archive/**"
  push:
    branches: [main]

concurrency:
  # PM ruling Oct 24: CI-only per-workflow group, cancel stale runs so a
  # push to main cannot pile CI up ahead of a deploy on the single
  # self-hosted runner. Never a deploy group name.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  ratchet:
    name: Typecheck ratchet
    # Zac, Oct 23 9:30 AM ET: use wsl-zac-arm64. Public repo: never run fork PRs on it.
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","ARM64","authichain-wsl"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Restore full tree after sparse checkout
        if: runner.environment == 'self-hosted'
        run: |
          git sparse-checkout disable
          git reset --hard HEAD
          test -f package.json
      # Self-hosted WSL cannot use pnpm/action-setup for 10.28.2. The
      # download ETIMEDOUT and the signature check then refuses to run.
      - name: Use the runner Node and pnpm
        if: runner.environment == 'self-hosted'
        run: bash scripts/ci/use-runner-pnpm.sh

      - name: Install pnpm
        if: runner.environment != 'self-hosted'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "10.28.2"

      - name: Setup Node.js
        if: runner.environment != 'self-hosted'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tsconfig.worker.json can need ~5 GB of heap and, on a busy runner, minutes.
      - name: Ratchet
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: node scripts/typecheck-ratchet.mjs

      # Persistent self-hosted runner: drop deps and build outputs so state
      # never leaks into the next run. Workspace-only; never outside it.
      - name: Clean workspace (self-hosted)
        if: always()
        run: |
          set -eu
          ws="${GITHUB_WORKSPACE:?}"
          case "$ws" in /|"") echo "::error::bad GITHUB_WORKSPACE"; exit 1;; esac
          cd "$ws"
          find . -mindepth 1 -type d \( -name node_modules -o -name .venv -o -name .next -o -name .open-next -o -name .turbo -o -name dist -o -name test-results \) -prune -exec rm -rf -- {} +
