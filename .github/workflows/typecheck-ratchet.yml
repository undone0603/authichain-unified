# Typecheck ratchet for the programs CI Main never typechecked: the root
# (scripts/, server/, src/), the standalone Workers and the edge router.
# Fails on any syntax error and on any increase over
# .github/typecheck-baseline.json. See scripts/typecheck-ratchet.mjs.
name: Typecheck ratchet

on:
  pull_request:
    # GB-26 fix 3: skip PRs that touch ONLY these paths. Kept narrow on
    # purpose: docs/** is NOT ignored because product code renders and
    # validates it (workers/authichain-com docs pages, identity validators,
    # src/lib/authentic-economy.ts). Pushes to main are never filtered.
    paths-ignore:
      - "*.md"
      - "**/CHANGELOG.md"
      - "docs/archive/**"
  push:
    branches: [main]

concurrency:
  group: typecheck-ratchet-${{ github.ref }}
  # Only PR runs are superseded; a push to main must never cancel a running
  # deploy/check mid-way (PM-328). Newer main runs queue behind it instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ratchet:
    name: Typecheck ratchet
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'self-hosted' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "10.28.2"
          # action-setup deletes dest on every job. A shared ~/setup-pnpm
          # races when both self-hosted runners install pnpm together.
          dest: ${{ runner.environment == 'self-hosted' && format('/home/zac/setup-pnpm-{0}', runner.name) || '~/setup-pnpm' }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tsconfig.worker.json can need ~5 GB of heap and, on a busy runner, minutes.
      - name: Ratchet
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: node scripts/typecheck-ratchet.mjs
