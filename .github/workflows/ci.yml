name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
        python-version: [3.12]

    steps:
      - uses: actions/checkout@v4

      # pnpm must be installed BEFORE setup-node so that `cache: pnpm` can find it.
      # No `version:` here — action-setup reads packageManager (pnpm@10.28.2) from package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Run JavaScript tests
        run: pnpm test

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-agentz.txt

      # Integration tests in tests/ self-skip without live credentials.
      - name: Run Python tests
        run: python -m pytest tests
