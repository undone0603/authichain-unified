name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Install, typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.28.2"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Validate secrets format
        run: node scripts/check-secrets-format.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint:ci

      - name: Run tests
        run: pnpm test

      - name: Production build
        run: pnpm build
