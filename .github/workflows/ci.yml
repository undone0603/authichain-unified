name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Run typecheck
        run: pnpm check
      - name: Run tests
        run: pnpm test --silent

