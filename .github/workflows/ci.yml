name: CI

# Full install/typecheck/lint/test/build lives in CI Main ("Main quality gate").
# This job keeps the extras that workflow does not run: drizzle source-of-truth
# and AgentZ pytest. Restricting push to main avoids a duplicate run on every
# PR branch (push + pull_request used to fire two copies of this workflow).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # GB-26 fix 3: skip PRs that touch ONLY these paths. Kept narrow on
    # purpose: docs/** is NOT ignored because product code renders and
    # validates it (workers/authichain-com docs pages, identity validators,
    # src/lib/authentic-economy.ts). Pushes to main are never filtered.
    paths-ignore:
      - "*.md"
      - "**/CHANGELOG.md"
      - "docs/archive/**"

concurrency:
  # PM ruling Oct 24: CI-only per-workflow group, cancel stale runs so a
  # push to main cannot pile CI up ahead of a deploy on the single
  # self-hosted runner. Never a deploy group name.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Self-hosted ARM64 runner cannot run this tooling yet (PM ruling Oct 24).
# Flip to 'false' once the runner is verified; the skip step warns visibly.
env:
  SKIP_PY312_ON_SELF_HOSTED: "true"

# Least privilege (self-hosted CI move). Jobs that need more set it per job.
permissions:
  contents: read
jobs:
  extras:
    name: Schema and AgentZ checks
    # Same-repo jobs use the authichain-ops ARM64 runners. Fork PRs stay on
    # ubuntu-24.04 so untrusted code never lands on the self-hosted machine.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","ARM64","authichain-ops"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "10.28.2"
          # action-setup deletes dest on every job. A shared ~/setup-pnpm
          # races when both self-hosted runners install pnpm together.
          dest: ${{ runner.environment == 'self-hosted' && format('/home/zac/setup-pnpm-{0}', runner.name) || '~/setup-pnpm' }}

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Supabase explicit GRANTs for new public tables (Oct 30)
        run: node scripts/ci/check-supabase-grants.mjs --run

      - name: Validate secrets format (skipped on pull_request)
        # CFA-215: secrets never reach pull_request runs; PR code is untrusted.
        if: github.event_name != 'pull_request'
        run: node scripts/check-secrets-format.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Check migration source of truth
        run: node scripts/check-drizzle-migrations.mjs

      - name: Vercel deploy guard
        run: node scripts/guard-vercel-deploy.mjs --run

      - name: Supabase remote baseline (read-only)
        run: node scripts/verify-supabase-baseline.mjs --run

      - name: Thin commercial surfaces
        run: node scripts/guard-thin-surfaces.mjs --run

      - name: Validate historical and accountability identities
        run: pnpm run test:historical-identities && pnpm run test:accountability-identities

      - name: Validate living identity rights boundaries
        run: pnpm run test:living-identities

      - name: "Skipped on self-hosted: AgentZ pytest (Python 3.12)"
        if: env.SKIP_PY312_ON_SELF_HOSTED == 'true'
        run: echo "::warning title=Skipped on self-hosted::AgentZ pytest (Python 3.12) not run - Python 3.12 is unverified on the ARM64 runner. Not a pass."

      - name: Set up Python (AgentZ)
        if: env.SKIP_PY312_ON_SELF_HOSTED != 'true' && (hashFiles('requirements-agentz.txt') != '')
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      # GB-26 fix 2: cache the whole venv (pip install was ~35 s on top of
      # the pip download cache). Keyed on Python version + requirements.
      - name: Cache AgentZ venv
        id: venv-cache
        if: env.SKIP_PY312_ON_SELF_HOSTED != 'true' && (hashFiles('requirements-agentz.txt') != '')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .venv
          key: agentz-venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements-agentz.txt') }}

      - name: Install AgentZ Python dependencies
        if: env.SKIP_PY312_ON_SELF_HOSTED != 'true' && (hashFiles('requirements-agentz.txt') != '' && steps.venv-cache.outputs.cache-hit != 'true')
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -r requirements-agentz.txt

      - name: Run AgentZ tests
        if: env.SKIP_PY312_ON_SELF_HOSTED != 'true' && (hashFiles('requirements-agentz.txt') != '')
        run: |
          source .venv/bin/activate
          # Scoped to agentz/tests -- the only real pytest suite; the test_*.py
          # files under ops/scripts/ are scripts and collect zero tests.
          # Failures here fail the job -- the JUnit step below is for
          # reporting, not gating.
          python -m pytest agentz/tests --junitxml=test-results/pytest.xml

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6
        if: always()
        with:
          report_paths: "**/test-results/*.xml"

      # Persistent self-hosted runner: drop deps and build outputs so state
      # never leaks into the next run. Workspace-only; never outside it.
      - name: Clean workspace (self-hosted)
        if: always()
        run: |
          set -eu
          ws="${GITHUB_WORKSPACE:?}"
          case "$ws" in /|"") echo "::error::bad GITHUB_WORKSPACE"; exit 1;; esac
          cd "$ws"
          find . -mindepth 1 -type d \( -name node_modules -o -name .venv -o -name .next -o -name .open-next -o -name .turbo -o -name dist -o -name test-results \) -prune -exec rm -rf -- {} +
