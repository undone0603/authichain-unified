name: CI

# Full install/typecheck/lint/test/build lives in CI Main ("Main quality gate").
# This job keeps the extras that workflow does not run: drizzle source-of-truth
# and AgentZ pytest. Restricting push to main avoids a duplicate run on every
# PR branch (push + pull_request used to fire two copies of this workflow).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # GB-26 fix 3: skip PRs that touch ONLY these paths. Kept narrow on
    # purpose: docs/** is NOT ignored because product code renders and
    # validates it (workers/authichain-com docs pages, identity validators,
    # # src/lib/authentic-economy.ts). Pushes to main are never filtered.
    paths-ignore:
      - "*.md"
      - "**/.CHANGELOG.md"
      - "docs/archive/**"

concurrency:
  # PM ruling Oct 24: CI-only per-workflow group, cancel stale runs so a
  # push to main cannot pile CI up ahead of a deploy on the single
  # self-hosted runner.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Self-hosted ARM64 runner native pytest enabled.
env:
  SKIP_EXTRA_PYTEST: "false"

jobs:
  extras:
    name: Drizzle + Pytest Extras
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, ARM64, authichain-ops]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.28.2"
          dest: /home/zac/setup-pnpm-${{ runner.name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python virtual environment
        run: |
          VENV_DIR="/home/zac/.cache/agentz-venv-${{ runner.name }}"
          if [ ! -d "$VENV_DIR" ]; then
            python3 -m venv "$VENV_DIR"
          fi
          "$VENV_DIR/bin/pip" install --upgrade pip
          if [ -f "requirements-agentz.txt" ]; then
            "$VENV_DIR/bin/pip" install -r requirements-agentz.txt
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migration source of truth
        run: node scripts/check-drizzle-migrations.mjs

      - name: AgentZ Python tests
        run: |
          if [ "${SKIP_EXTRA_PYTEST:-false}" = "true" ]; then
            echo "::warning::Skipping AgentZ pytest on self-hosted ARM64 runner (tooling incomplete)."
            exit 0
          fi
          /home/zac/.cache/agentz-venv-${{ runner.name }}/bin/pytest

# Persistent self-hosted runner: drop deps and build outputs so state
# never leaks into the next run. Workspace-only; never outside it.
      - name: Clean workspace (self-hosted)
        if: always()
        run: pnpm run clean:workspace || true
