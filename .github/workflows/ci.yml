name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Install, typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.28.2"

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Validate secrets format
        run: node scripts/check-secrets-format.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint:ci

      - name: Install Playwright browsers
        run: pnpm --filter agent-browser exec playwright install --with-deps chromium

      - name: Set up Python (AgentZ)
        if: hashFiles('requirements-agentz.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install AgentZ Python dependencies
        if: hashFiles('requirements-agentz.txt') != ''
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -r requirements-agentz.txt

      - name: Run tests
        run: |
          pnpm -w test
          if [ -f "requirements-agentz.txt" ] && [ -f ".venv/bin/activate" ]; then
            source .venv/bin/activate
            # Non-blocking (|| true): reported via the JUnit step below, not gated.
            # Scoped to agentz/tests -- the only real pytest suite; the test_*.py
            # files under ops/scripts/ are scripts and collect zero tests.
            pytest agentz/tests --junitxml=test-results/pytest.xml || true
          fi

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: always() # always run even if tests fail
        with:
          report_paths: "**/test-results/*.xml"

      - name: Production build
        run: pnpm build
