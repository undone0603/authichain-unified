name: CI

# Full install/typecheck/lint/test/build lives in CI Main ("Main quality gate").
# This job keeps the extras that workflow does not run: drizzle source-of-truth
# and AgentZ pytest. Restricting push to main avoids a duplicate run on every
# PR branch (push + pull_request used to fire two copies of this workflow).
# CircleCI carries the mandatory automatic checks; use manual diagnostics
# when investigating failures, without doubling the self-hosted WSL load.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # PM ruling Oct 24: CI-only per-workflow group, cancel stale runs so a
  # push to main cannot pile CI up ahead of a deploy on the single
  # self-hosted runner.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Self-hosted ARM64 runner native pytest enabled.
env:
  SKIP_EXTRA_PYTEST: "false"

jobs:
  select-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
    steps:
      - name: Select online self-hosted runner or fallback to ubuntu-24.04
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo 'runs_on="ubuntu-24.04"' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          online_wsl=$(gh api "repos/${{ github.repository }}/actions/runners" \
            --jq '[.runners[] | select(.status=="online" and (.labels | map(.name) | index("authichain-wsl")))] | length' 2>/dev/null || echo 0)
          if [ "${online_wsl:-0}" -ge 1 ]; then
            echo 'runs_on=["self-hosted","Linux","ARM64","authichain-wsl"]' >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No online authichain-wsl runner found; falling back to ubuntu-24.04"
            echo 'runs_on="ubuntu-24.04"' >> "$GITHUB_OUTPUT"
          fi

  extras:
    needs: select-runner
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
    name: Drizzle + Pytest Extras
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore full tree after sparse checkout
        if: runner.environment == 'self-hosted'
        run: |
          git sparse-checkout disable
          git reset --hard HEAD
          test -f package.json

      # Self-hosted WSL cannot use pnpm/action-setup for 10.28.2. The
      # download ETIMEDOUT and the signature check then refuses to run.
      # GitHub-hosted runners still use the pin.
      - name: Use the runner Node and pnpm
        if: runner.environment == 'self-hosted'
        run: bash scripts/ci/use-runner-pnpm.sh

      - name: Install pnpm
        timeout-minutes: 15
        if: runner.environment != 'self-hosted'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "10.28.2"

      - name: Setup Node
        if: runner.environment != 'self-hosted'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Python virtual environment
        timeout-minutes: 15
        run: |
          VENV_DIR="${RUNNER_TEMP}/agentz-venv"
          if [ ! -d "$VENV_DIR" ]; then
            python3 -m venv "$VENV_DIR"
          fi
          # Use venv's bundled pip; avoid a redundant network upgrade on every CI run.
          if [ -f "requirements-agentz.txt" ]; then
            "$VENV_DIR/bin/pip" install -r requirements-agentz.txt
          fi

      - name: Install dependencies
        timeout-minutes: 15
        run: pnpm install --frozen-lockfile

      - name: Check migration source of truth
        run: node scripts/check-drizzle-migrations.mjs

      - name: AgentZ Python tests
        run: |
          if [ "${SKIP_EXTRA_PYTEST:-false}" = "true" ]; then
            echo "::warning::Skipping AgentZ pytest on self-hosted ARM64 runner (tooling incomplete)."
            exit 0
          fi
          PYTHONPATH="${GITHUB_WORKSPACE}" "${RUNNER_TEMP}/agentz-venv/bin/pytest" agentz/tests

      # Persistent self-hosted runner: drop deps and build outputs so state
      # never leaks into the next run. Workspace-only; never outside it.
      - name: Clean workspace (self-hosted)
        if: always()
        run: |
          set -eu
          ws="${GITHUB_WORKSPACE:?}"
          case "$ws" in /|"") echo "::error::bad GITHUB_WORKSPACE"; exit 1;; esac
          cd "$ws"
          find . -mindepth 1 -type d \( -name node_modules -o -name .venv -o -name .next -o -name .open-next -o -name .turbo -o -name dist -o -name build \) -prune -exec rm -rf -- {} +
