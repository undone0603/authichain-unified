name: Protocol conformance

on:
  pull_request:
    branches: [main]
    paths:
      - "protocol/**"
      - ".github/workflows/protocol-conformance.yml"
  push:
    branches: [main]
    paths:
      - "protocol/**"
      - ".github/workflows/protocol-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    name: Protocol checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Structural asset-passport tests
        working-directory: protocol
        run: npm run test:asset-passports

      - name: Verification conformance
        working-directory: protocol
        run: node conformance/run.mjs --strict -- node verifier.mjs
