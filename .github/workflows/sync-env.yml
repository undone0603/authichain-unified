# Direction: push GitHub Secrets → Vercel
name: Sync Env to Vercel
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install --global vercel
      - name: Sync Envs to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Add your specific secret mapping here, e.g.:
          # API_KEY: ${{ secrets.API_KEY }}
        run: |
          # Push specific secret to Vercel
          # Replace 'MY_SECRET_NAME' with the actual secret key name
          echo "$API_KEY" | vercel env add API_KEY production \
            --token=$VERCEL_TOKEN \
            --scope=$VERCEL_ORG_ID \
            --yes
