# Direction: push GitHub Secrets -> Vercel
name: Sync Env to Vercel
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-env.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install --global vercel
      - name: Sync Envs to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::warning::API_KEY secret is empty - skipping sync"
            exit 0
          fi
          # Remove existing env var if it exists, then re-add with current value
          vercel env rm API_KEY production \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" \
            --yes 2>/dev/null || true
          echo "$API_KEY" | vercel env add API_KEY production \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" \
            --yes
          echo "API_KEY synced to Vercel production environment"
