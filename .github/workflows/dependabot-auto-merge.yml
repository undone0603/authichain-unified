name: Dependabot Auto Merge

# Auto-squash-merges patch-level Dependabot PRs (the action's default
# `target` is `patch` — minor/major bumps still require human review,
# which matches how we triaged the recent batch). Picked up from the
# abandoned codex/fix-authichain.com-issues-and-match-theme branch.

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: true

on:
  pull_request_target:
    paths:
      - '**/package*.json'
      - '**/pnpm-lock.yaml'

jobs:
  auto-merge:
    name: Auto-merge patch-level Dependabot PRs
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - uses: ahmadnassri/action-dependabot-auto-merge@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
