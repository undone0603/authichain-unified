name: Regenerate dependency lockfile

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  regenerate:
    if: startsWith(github.head_ref, 'deps/regenerate-lockfile-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dependency branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.9.0'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Regenerate root lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already matches manifests."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): regenerate pnpm lockfile"
          git push origin "HEAD:${{ github.head_ref }}"
