name: Deploy Vercel Apps

# NOTE: This workflow is a template for future Vercel app deployments.
# Worker deployments are handled by deploy-workers.yml.
# This workflow is manually triggered until Vercel app directories exist.
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App directory to deploy (e.g. apps/authichain-com)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  deployments: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: '10.28.2'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: ${{ inputs.app }}

      - name: Deploy Vercel App
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ${{ inputs.app }}
          vercel-args: '--prod'
