name: Deploy Vercel App

# Manual-only: Vercel's own Git integration already builds the live project on
# every push, so the push trigger here double-deployed and burned the
# free-tier 100-deployments/day quota. Kept for emergency manual deploys
# during the Vercel wind-down (see the Vercel-elimination plan).
on:
  workflow_dispatch:

concurrency:
  group: deploy-vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NODE_ENV: production
      # Uncomment these if Next.js still fails to find your Supabase variables during the build:
      # NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      # NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10" # Fixes the workspace package field error

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm" # Now correctly finds pnpm because it was setup first

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel Environment Variables
        run: npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build Vercel Project
        run: npx vercel build --prod --yes --token "$VERCEL_TOKEN"

      - name: Deploy Prebuilt to Vercel
        run: npx vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
