name: Deploy Vercel App

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  deployments: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - workers/authichain-dashboard
          - workers/qron-automation
          - workers/qron-image-gen
          - workers/qron-outreach
          - workers/qron-space
          - workers/resend-relay
          - workers/strainchain-io
          # Vercel Apps
          - apps/authichain-com
          - apps/authichain-dashboard
          - apps/strainchain-io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: '10.28.2'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Detect project type
        id: detect
        run: |
          if [[ "${{ matrix.project }}" == workers/* ]]; then
            echo "type=worker" >> $GITHUB_OUTPUT
          else
            echo "type=vercel" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Cloudflare Worker
        if: steps.detect.outputs.type == 'worker'
        run: pnpm exec wrangler deploy --minify --config wrangler.toml
        working-directory: ${{ matrix.project }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
        
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
