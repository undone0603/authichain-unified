name: Deploy Vercel App

# Manual-only: Vercel's own Git integration already builds the live project on
# every push, so the push trigger here double-deployed and burned the
# free-tier 100-deployments/day quota. Kept for emergency manual deploys
# during the Vercel wind-down (see the Vercel-elimination plan).
on:
  workflow_dispatch:

concurrency:
  group: deploy-vercel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        id: check
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not set — skipping deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.check.outputs.skip != 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: "10.28.2"

      - name: Setup Node
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Pull Vercel Environment Variables
        if: steps.check.outputs.skip != 'true'
        run: npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build Vercel Project
        if: steps.check.outputs.skip != 'true'
        run: npx vercel build --prod --yes --token "$VERCEL_TOKEN"

      - name: Deploy Prebuilt to Vercel
        if: steps.check.outputs.skip != 'true'
        run: npx vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"

      - name: Deploy skipped notice
        if: steps.check.outputs.skip == 'true'
        run: echo "::notice::Vercel deploy skipped — set VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID in repo secrets."
