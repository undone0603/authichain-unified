name: Monorepo Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  deployments: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project:
          # Cloudflare Workers
          - workers/authichain-api
          - workers/authichain-api-gateway
          - workers/authichain-automation
          - workers/authichain-com
          - workers/authichain-dashboard
          - workers/qron-automation
          - workers/qron-image-gen
          - workers/qron-outreach
          - workers/qron-space
          - workers/resend-relay
          - workers/strainchain-io

          # Vercel Apps
          - apps/authichain-com
          - apps/authichain-dashboard
          - apps/strainchain-io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Activate PNPM 9
        run: corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Detect project type
        id: detect
        run: |
          if [[ "${{ matrix.project }}" == workers/* ]]; then
            echo "type=worker" >> $GITHUB_OUTPUT
          else
            echo "type=vercel" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Cloudflare Worker
        if: steps.detect.outputs.type == 'worker'
        run: pnpm exec wrangler deploy --minify
        working-directory: ${{ matrix.project }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ""

      - name: Deploy Vercel App
        if: steps.detect.outputs.type == 'vercel'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ${{ matrix.project }}
