name: Deploy Vercel App

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vercel.json"
      - ".github/workflows/deploy-vercel.yml"
  workflow_dispatch:

concurrency:
  group: deploy-vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # FIX: Setup pnpm MUST come before setup-node to enable caching properly
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10" # Bumping this to 10 or 11 matches your root configuration format

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # FIX: Pull environment variables, removed redundant manual build, and added --yes
      - name: Deploy to Vercel
        run: |
          npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx vercel build --prod --yes --token "$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
