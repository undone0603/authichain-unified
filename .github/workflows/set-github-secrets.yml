name: Set GitHub Dev Team Secrets

on:
  workflow_dispatch:
    inputs:
      GITHUB_TOKEN_PAT:
        description: "GitHub PAT with repo + actions + pull_requests scopes"
        required: true
      GITHUB_OWNER:
        description: "GitHub repo owner (default: undone0603)"
        required: false
        default: "undone0603"
      GITHUB_REPO:
        description: "GitHub repo name (default: authichain-unified)"
        required: false
        default: "authichain-unified"
      REQUIRE_DEV_APPROVAL:
        description: "Require human approval before merging PRs (true/false)"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push dev team secrets to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Inputs via env vars — never interpolate ${{ inputs.* }} directly
          # into run: blocks; that allows shell metacharacter injection.
          INPUT_TOKEN_PAT: ${{ github.event.inputs.GITHUB_TOKEN_PAT }}
          INPUT_OWNER: ${{ github.event.inputs.GITHUB_OWNER }}
          INPUT_REPO: ${{ github.event.inputs.GITHUB_REPO }}
          INPUT_DEV_APPROVAL: ${{ github.event.inputs.REQUIRE_DEV_APPROVAL }}
        run: |
          set -e
          echo "$INPUT_TOKEN_PAT"    | npx wrangler secret put GITHUB_TOKEN
          echo "$INPUT_OWNER"        | npx wrangler secret put GITHUB_OWNER
          echo "$INPUT_REPO"         | npx wrangler secret put GITHUB_REPO
          echo "$INPUT_DEV_APPROVAL" | npx wrangler secret put REQUIRE_DEV_APPROVAL
          echo "Dev team secrets pushed successfully."
