name: Set GitHub Dev Team Secrets

on:
  workflow_dispatch:
    inputs:
      GITHUB_TOKEN_PAT:
        description: "GitHub PAT with repo + actions + pull_requests scopes"
        required: true
      GITHUB_OWNER:
        description: "GitHub repo owner (default: undone0603)"
        required: false
        default: "undone0603"
      GITHUB_REPO:
        description: "GitHub repo name (default: authichain-unified)"
        required: false
        default: "authichain-unified"
      REQUIRE_DEV_APPROVAL:
        description: "Require human approval before merging PRs (true/false)"
        required: false
        default: "true"

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Push dev team secrets to Cloudflare Worker
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: authichain-unified
        run: |
          set -e
          push_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "⏭  Skipping $name (not provided)"
              return
            fi
            http_status=$(curl -s -o /tmp/cf_resp.json -w "%{http_code}" \
              -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/secrets" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"${name}\",\"text\":\"${value}\",\"type\":\"secret_text\"}")
            if [ "$http_status" != "200" ] && [ "$http_status" != "201" ]; then
              echo "ERROR setting $name: HTTP $http_status"
              cat /tmp/cf_resp.json
              exit 1
            fi
            echo "✓ $name set on $WORKER_NAME"
          }

          push_secret "GITHUB_TOKEN"          "${{ github.event.inputs.GITHUB_TOKEN_PAT }}"
          push_secret "GITHUB_OWNER"          "${{ github.event.inputs.GITHUB_OWNER }}"
          push_secret "GITHUB_REPO"           "${{ github.event.inputs.GITHUB_REPO }}"
          push_secret "REQUIRE_DEV_APPROVAL"  "${{ github.event.inputs.REQUIRE_DEV_APPROVAL }}"
          echo "Dev team secrets pushed successfully."
