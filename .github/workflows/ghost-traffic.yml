name: Ghost Traffic Engine

on:
  schedule:
    - cron: "0 13 * * *" # Fires every day at 9:00 AM EST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log probe plan, no HTTP)"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: read

jobs:
  run-strike:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Manual runs (workflow_dispatch) are always allowed. Scheduled light
    # probes run only once GHOST_TRAFFIC_ENABLED is "true" — same kill-switch
    # as autonomous-business-cycle.yml. Probes are safe GET/empty-JSON POST.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.GHOST_TRAFFIC_ENABLED == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-agentz.txt

      - name: Resolve probe mode
        id: mode
        run: |
          set -euo pipefail
          # Schedule is the daily light-probe run (safe GET/POST, no paid APIs).
          # Dispatch defaults dry-run; live probes only when dry_run=false.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=auto" >> "$GITHUB_OUTPUT"
            echo "Scheduled run → live light probes"
            exit 0
          fi
          if [ "${{ inputs.dry_run }}" = "false" ]; then
            echo "mode=auto" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch → live light probes"
            exit 0
          fi
          echo "mode=dry-run" >> "$GITHUB_OUTPUT"
          echo "Manual dispatch → dry-run (no HTTP)"

      - name: Run Ghost Traffic Engine
        env:
          # Light probes only — no LLM / Stripe / Cloudflare paid APIs.
          AGENTZ_DISABLE_HEALER: "true"
        run: python -m agentz.workflows.runner --handler ghost_traffic_engine --mode ${{ steps.mode.outputs.mode }}
