name: Ghost Traffic Engine

on:
  schedule:
    - cron: '0 13 * * *'   # Fires every day at 9:00 AM EST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (select + preview the post, no live publish)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

jobs:
  run-strike:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-agentz.txt

      - name: Run Ghost Traffic Engine
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}

          # Cloudflare Worker credentials
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

          # Supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          # Stripe
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

          # Groq-only LLM mode
          LLM_PROVIDER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ""
          GEMINI_API_KEY: ""
          OPENROUTER_API_KEY: ""
          CEREBRAS_API_KEY: ""
          DEEPSEEK_API_KEY: ""
          LMSTUDIO_API_KEY: ""
          OLLAMA_API_KEY: ""
          AGENTZ_DISABLE_HEALER: "true"

        run: python -m agentz.workflows.runner --handler ghost_traffic_engine
