name: Ghost Traffic Engine

on:
  schedule:
    - cron: '0 13 * * *' # Fires every day at 9:00 AM EST
  workflow_dispatch: # Allows you to click "Run" manually to test it
    inputs:
      dry_run:
        description: 'Dry run (select + preview the post, no live publish)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  run-strike:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Execute Autonomous Strike
        run: python artifacts/linkedin_strike.py
        env:
          # Official LinkedIn API via OAuth 2.0 (same proven mechanism as
          # marketing-autonomous.yml). Mint/refresh with
          # scripts/linkedin-oauth-setup.mjs. Missing creds => graceful skip.
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN:   ${{ secrets.LINKEDIN_PERSON_URN }}
          DRY_RUN:               ${{ inputs.dry_run || 'false' }}
