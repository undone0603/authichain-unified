name: AuthiChain on-chain ledger reconstruction

# Scans the AuthiChain NFT contract from its deploy block to chain head and
# writes artifacts/onchain/*.json. Read-only: it makes no transaction and holds
# no key, so a long run costs nothing but runner minutes.
#
# Run 4 (35396610355) was cancelled at 20.8 min against a 20-minute cap, mid
# scan — `pnpm install --frozen-lockfile` passed, so the budget was the only
# problem. At the 8,000-block default the range needs ~900 sequential getLogs
# calls against the public RPC, which does not fit.
#
# The default RPC was https://polygon-rpc.com until it was shown never to connect
# from a GitHub runner at all — two 60-minute runs were spent in ethers'
# once-a-second "failed to detect network" retry loop, reading zero blocks. The
# default is now publicnode, which answers. A POLYGON_RPC_URL repo *secret*
# takes precedence when set: secrets are masked in logs, whereas this input is
# printed in clear text, so a keyed archive URL must go in the secret and never
# in the input.
#
# That scan is now opt-in. mode=state (the default) reads current contract
# state instead — AuthiChainNFT is ERC721Enumerable, so totalSupply +
# tokenByIndex reach every token without a single getLogs call, and no free
# endpoint's log-retention or range policy applies. It completes in seconds.
#
# mode=logs keeps the event replay for when an endpoint that serves historical
# logs is available; chunk_size applies only to that path, and exists as an
# input because public RPCs cap getLogs ranges inconsistently — dRPC rejects
# 9,001 blocks while quoting a 10,000 limit. The 60-minute budget below is
# likewise only meaningful for mode=logs.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "state = read current contract state (default, free, seconds). logs = replay events, needs an endpoint that serves historical logs."
        required: false
        default: "state"
        type: choice
        options:
          - state
          - logs
      chunk_size:
        description: "Blocks per getLogs call. Only used when mode=logs. Lower it if the RPC rejects the range."
        required: false
        default: "9000"
        type: string
      rpc_url:
        description: "Polygon RPC. Public endpoints only — this value is printed in the logs, so never pass a URL with an API key in it."
        required: false
        default: "https://polygon-bor-rpc.publicnode.com"
        type: string

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reconstruct production AuthiChain NFT ledger
        run: pnpm ledger:authichain-nft
        env:
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL || inputs.rpc_url || 'https://polygon-bor-rpc.publicnode.com' }}
          AUTHICHAIN_LEDGER_MODE: ${{ inputs.mode || 'state' }}
          AUTHICHAIN_LEDGER_CHUNK: ${{ inputs.chunk_size || '9000' }}
      - uses: actions/upload-artifact@v4
        with:
          name: authichain-nft-ledger
          path: artifacts/onchain/
          if-no-files-found: error
