# Merge autopilot: merges trusted PRs into main once they are green and clean,
# and merges main into branches that fall behind so CI re-runs first.
# Logic and rules: scripts/autonomy/merge-autopilot.mjs
# Switch: `merge_autopilot.enabled` (and this file's line) in .github/autonomy.json
# Charter: docs/OPERATING_CHARTER.md, "Merge autopilot"
#
# Security: every trigger runs the default-branch copy of this workflow and the
# script. Nothing checks out or executes PR code; the job only reads PR state
# through the API. Forks and untrusted authors are skipped by the script.
name: Merge autopilot

on:
  # The control job now uses the existing ops runner. Check completions wake
  # the default-branch sweep; it never checks out or executes the PR branch.
  workflow_run:
    workflows:
      [
        "CI Main",
        "CI",
        "Lint",
        "CodeQL",
        "Typecheck ratchet",
        "Security Scan",
        "Contract Tests (Hardhat)",
        "Worker builds",
      ]
    types: [completed]
  # A merge to main makes every other PR behind; sweep to update them.
  push:
    branches: [main]
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log decisions without merging or updating"
        type: boolean
        default: false

# One sweep at a time. A newer trigger replaces a queued one, and every sweep
# looks at all open PRs, so nothing is lost.
# cancel-in-progress must stay true: a ghost queued run (no job, API 409 on
# cancel) otherwise pins this group and stalls every later sweep.
concurrency:
  group: merge-autopilot
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read

jobs:
  sweep:
    name: Merge autopilot
    if: >-
      github.repository == 'undone0603/authichain-unified' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, Linux, ARM64, authichain-ops]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Sweep open PRs
        env:
          GITHUB_TOKEN: ${{ secrets.MERGE_AUTOPILOT_TOKEN || secrets.GITHUB_TOKEN }}
          AUTOPILOT_TOKEN_KIND: ${{ secrets.MERGE_AUTOPILOT_TOKEN != '' && 'pat' || 'default' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        # The script prints the summary to stdout; only this shell step writes
        # the job summary file.
        run: |
          set -o pipefail
          node scripts/autonomy/merge-autopilot.mjs | tee -a "$GITHUB_STEP_SUMMARY"
