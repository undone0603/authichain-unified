name: Deploy authichain-app
# Gated, manual-only deploy of the authichain-app Worker (OpenNext build of the
# root Next.js app; config: wrangler.app.jsonc). Modeled on
# deploy-first-dollar-desk.yml (#2044). Start it by hand after a merge.
# Rollback: dispatch on main with rollback_version=9aedb978 (runs only
# `pnpm exec wrangler rollback 9aedb978 --name authichain-app --message "CI rollback via deploy-authichain-app" --yes`, then the same post-checks).
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Full 40-char commit SHA on main to deploy (e.g. the merge commit). Leave empty only when rollback_version is set."
        required: false
        type: string
        default: ""
      rollback_version:
        description: "Optional. Worker version ID (UUID or hex prefix, e.g. 9aedb978) to roll back to. When set, build and deploy are skipped."
        required: false
        type: string
        default: ""
permissions:
  contents: read
  statuses: read
  actions: read
concurrency:
  group: deploy-authichain-app
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production-cloudflare
    # Publish runner only: authichain-wsl, same as deploy-authichain-com.yml.
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Preflight - memory (build peaks ~5.1 GiB RSS)
        run: |
          set -euo pipefail
          free -m
          total_kb="$(awk '/^(MemTotal|SwapTotal):/ {s+=$2} END {print s+0}' /proc/meminfo)"
          total_mib=$((total_kb / 1024))
          echo "MemTotal+SwapTotal: ${total_mib} MiB (minimum 6144 MiB)"
          if [ "$total_mib" -lt 6144 ]; then
            echo "::error::runner has ${total_mib} MiB RAM+swap; the OpenNext build needs at least 6144 MiB (peaks ~5.1 GiB RSS). Add swap or use a bigger runner."; exit 1
          fi
      - name: Gate - ref must be main; validate inputs
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
          RUN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$RUN_REF" != "refs/heads/main" ]; then
            echo "::error::must be dispatched from refs/heads/main (got $RUN_REF)"; exit 1
          fi
          if [ -n "$ROLLBACK_VERSION" ]; then
            if ! printf '%s' "$ROLLBACK_VERSION" | grep -Eq '^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[0-9a-f]{8,32})$'; then
              echo "::error::rollback_version must be a lowercase UUID or an 8-32 char hex prefix"; exit 1
            fi
            echo "mode: rollback to $ROLLBACK_VERSION (build and deploy skipped)"
          else
            if ! printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::expected_sha must be a full 40-char lowercase hex SHA"; exit 1
            fi
            echo "mode: deploy $EXPECTED_SHA"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.rollback_version == '' && inputs.expected_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Gate - HEAD equals the exact main dispatch SHA
        if: ${{ inputs.rollback_version == '' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git sparse-checkout disable
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "checkout SHA: $HEAD_SHA"
          if [ "$HEAD_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::HEAD $HEAD_SHA != expected $EXPECTED_SHA"; exit 1
          fi
          test "$EXPECTED_SHA" = "$DISPATCH_SHA"
          # setup-node has not run yet. The self-hosted runner has no node on PATH here.
          NAME="$(sed -n 's/^[[:space:]]*"name":[[:space:]]*"\([^"]*\)".*/\1/p' wrangler.app.jsonc | head -n 1)"
          if [ "$NAME" != "authichain-app" ]; then
            echo "::error::wrangler.app.jsonc name is '$NAME', expected authichain-app"; exit 1
          fi
          echo "wrangler.app.jsonc name: $NAME"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "10.28.2"
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Verify protected release eligibility before build
        if: ${{ inputs.rollback_version == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          node --test scripts/ci/autonomous-release-gate.test.mjs
          node scripts/ci/autonomous-release-gate.mjs
      - name: Install node-gyp (native builds)
        run: npm i -g node-gyp@11.5.0
      - name: Install
        env:
          npm_config_build_from_source: "false"
        run: pnpm install --frozen-lockfile
      - name: Rollback authichain-app
        if: ${{ inputs.rollback_version != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
        run: |
          set -euo pipefail
          pnpm exec wrangler rollback "$ROLLBACK_VERSION" --name authichain-app --message "CI rollback via deploy-authichain-app" --yes
          pnpm exec wrangler deployments list --name authichain-app
      - name: Build (OpenNext)
        if: ${{ inputs.rollback_version == '' }}
        env:
          # Matches Workers Builds (playwright-core stubbed). Public-by-design
          # build values from existing repo secrets; never echoed.
          WORKERS_CI: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          for n in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!n:-}" ]; then echo "::error::secret $n is empty"; exit 1; fi
          done
          bash scripts/with-build-lock.sh pnpm exec opennextjs-cloudflare build --config wrangler.app.jsonc
      - name: Set up Supabase CLI
        if: ${{ inputs.rollback_version == '' }}
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: "3.1.0"
      - name: Apply and verify the DPP outbox migration
        if: ${{ inputs.rollback_version == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          SUPABASE_DB_URL: ${{ secrets.AUTHICHAIN_PRODUCTION_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          node scripts/ci/autonomous-release-gate.mjs
          : "${SUPABASE_DB_URL:?missing protected production database credential}"
          # Accept only the production project's direct or pooler connection.
          node --input-type=module <<'JS'
          const url = new URL(process.env.SUPABASE_DB_URL);
          const ref = "nhdnkzhtadfkkluiulhs";
          const direct = url.hostname === `db.${ref}.supabase.co`;
          const pooler = url.hostname.endsWith(".pooler.supabase.com")
            && decodeURIComponent(url.username) === `postgres.${ref}`
            && url.port === "5432";
          if (!["postgres:", "postgresql:"].includes(url.protocol)
              || url.pathname !== "/postgres" || (!direct && !pooler)) {
            throw new Error("Expected the AuthiChain production database");
          }
          JS
          migration=20261112213000_dpp_activation_email_outbox.sql
          test -f "supabase/migrations/$migration"
          # Restrict this workflow to one migration. The CLI validates the full
          # checked-out history against the production ledger before writing.
          if ! plan="$(supabase db push --remote="$SUPABASE_DB_URL" --dry-run 2>&1)"; then
            echo "::error::Could not validate the production migration plan"
            exit 1
          fi
          pending="$(printf '%s\n' "$plan" | sed -n 's/^[[:space:]]*[-*][[:space:]]*\([0-9][^[:space:]]*\.sql\)[[:space:]]*$/\1/p')"
          if [ "$pending" = "$migration" ]; then
            if ! supabase db push --remote="$SUPABASE_DB_URL" --yes >/dev/null 2>&1; then
              echo "::error::DPP outbox migration failed"
              exit 1
            fi
          elif [ -n "$pending" ] || ! printf '%s\n' "$plan" | grep -Fqi 'Remote database is up to date'; then
            echo "::error::Unexpected production migration plan"
            exit 1
          fi
          # Verify the objects and their effective API-role privileges.
          sql="$(cat <<'SQL'
          select
            exists (select 1 from supabase_migrations.schema_migrations where version = '20261112213000')
            and coalesce((select relrowsecurity from pg_class where oid = to_regclass('public.dpp_activation_email_delivery')), false)
            and not exists (
              select 1
              from (values ('anon'), ('authenticated')) as api(role_name)
              where has_table_privilege(api.role_name, 'public.dpp_activation_email_delivery', 'SELECT, INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER')
            )
            and (
              select count(*) = 2 and bool_and(
                has_function_privilege('service_role', oid, 'EXECUTE')
                and not has_function_privilege('anon', oid, 'EXECUTE')
                and not has_function_privilege('authenticated', oid, 'EXECUTE')
              )
              from pg_proc
              where oid in (
                to_regprocedure('public.claim_dpp_activation_email(text,text,text)'),
                to_regprocedure('public.finish_dpp_activation_email(text,text,text)')
              )
            ) as verified
          SQL
          )"
          if ! result="$(supabase db query --remote="$SUPABASE_DB_URL" --read-only --output json "$sql" 2>/dev/null)"; then
            echo "::error::Could not verify the DPP outbox migration"
            exit 1
          fi
          printf '%s\n' "$result" | node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const result = JSON.parse(readFileSync(0, "utf8"));
            const rows = Array.isArray(result) ? result : result.rows;
            if (rows?.length !== 1 || rows[0].verified !== true) process.exit(1);
          '
      - name: Recheck protected release eligibility before publish
        if: ${{ inputs.rollback_version == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: node scripts/ci/autonomous-release-gate.mjs
      - name: Publish authichain-app
        if: ${{ inputs.rollback_version == '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        # --keep-vars keeps dashboard vars/secrets attached. No secret put, no --var.
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --keep-vars --config wrangler.app.jsonc
          pnpm exec wrangler deployments list --name authichain-app
      - name: Live GET checks (qron.space)
        run: |
          set -euo pipefail
          for u in https://qron.space/ https://qron.space/generate; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$u")"
            echo "$u -> $code"
            if [ "$code" != "200" ]; then echo "::error::$u returned $code"; exit 1; fi
          done
      - name: Live GET check (authichain.com/checkout/starter)
        run: |
          set -euo pipefail
          u="https://authichain.com/checkout/starter"
          # No -L. 200 is the email confirm form. 30x is a direct redirect.
          # Print only the status and Location host+path, never the query string.
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          out="$(curl -sS -o "$body" -w '%{http_code} %{redirect_url}' --max-time 30 "$u")"
          code="${out%% *}"
          loc="${out#* }"
          loc="${loc%%[?#]*}"
          echo "$u -> $code (Location: ${loc:-none})"
          case "$code" in
            30[0-9])
              if [ -z "$loc" ]; then echo "::error::$u returned $code with no Location"; exit 1; fi
              ;;
            200)
              if ! grep -q "Confirm Starter Pack" "$body"; then
                echo "::error::$u returned 200 without the confirm form"; exit 1
              fi
              ;;
            *) echo "::error::$u returned $code, expected 200 or a 30x redirect"; exit 1 ;;
          esac
