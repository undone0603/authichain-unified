name: Deploy authichain-app
# Gated, manual-only deploy of the authichain-app Worker (OpenNext build of the
# root Next.js app; config: wrangler.app.jsonc). Modeled on
# deploy-first-dollar-desk.yml (#2044). Start it by hand after a merge.
# Rollback: dispatch on main with rollback_version=9aedb978 (runs only
# `pnpm exec wrangler rollback 9aedb978 --name authichain-app --message "CI rollback via deploy-authichain-app" --yes`, then the same post-checks).
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Full 40-char commit SHA on main to deploy (e.g. the merge commit). Leave empty only when rollback_version is set."
        required: false
        type: string
        default: ""
      rollback_version:
        description: "Optional. Worker version ID (UUID or hex prefix, e.g. 9aedb978) to roll back to. When set, build and deploy are skipped."
        required: false
        type: string
        default: ""
      supabase_project_ref:
        description: "Required expected production Supabase project ID for forward release"
        type: string
        required: false
        default: ""
permissions:
  contents: read
  statuses: read
  actions: read
  deployments: read
  checks: read
concurrency:
  group: deploy-authichain-app
  cancel-in-progress: false
jobs:
  preflight:
    name: Validate exact-main CI and protected release environments
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 8
    steps:
      - name: Validate dispatch mode and exact SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
          EXPECTED_SUPABASE_REF: ${{ inputs.supabase_project_ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          if [ -n "$ROLLBACK_VERSION" ]; then
            test -z "$EXPECTED_SHA"
            test -z "$EXPECTED_SUPABASE_REF"
            [[ "$ROLLBACK_VERSION" =~ ^([a-f0-9]{8}-([a-f0-9]{4}-){3}[a-f0-9]{12}|[a-f0-9]{8,32})$ ]]
            exit 0
          fi
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$EXPECTED_SHA" = "$DISPATCH_SHA"
          [[ "$EXPECTED_SUPABASE_REF" =~ ^[a-z0-9]{20}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ inputs.rollback_version == '' }}
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Verify fully restored exact-head source
        if: ${{ inputs.rollback_version == '' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          git sparse-checkout disable
          git reset --hard HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f scripts/ci/autonomous-release-gate.mjs
          test -f scripts/ci/verify-dpp-release-env.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: ${{ inputs.rollback_version == '' }}
        with:
          node-version: "22"
      - name: Enforce existing release policy and production-supabase environment
        if: ${{ inputs.rollback_version == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -s "$HOME/.nvm/nvm.sh" ]; then
            . "$HOME/.nvm/nvm.sh"
            nvm use 22 >/dev/null
          fi
          node --test scripts/ci/autonomous-release-gate.test.mjs scripts/ci/verify-dpp-release-env.test.mjs scripts/ci/protected-dpp-release.test.mjs
          node scripts/ci/autonomous-release-gate.mjs
          node scripts/ci/verify-dpp-release-env.mjs
      - name: Require successful exact-head GitHub Main quality gate
        if: ${{ inputs.rollback_version == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.expected_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const sha=process.env.TARGET_SHA;
          const url="https://api.github.com/repos/"+process.env.REPOSITORY+"/commits/"+sha+"/check-runs?per_page=100";
          const resp=await fetch(url,{headers:{Authorization:"Bearer "+process.env.GH_TOKEN,
            Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}});
          if(!resp.ok){console.error("::error::Cannot read exact-main GitHub quality check");process.exit(1)}
          const data=await resp.json();
          const passed=(data.check_runs||[]).some(run=>run.name==="Main quality gate"&&run.head_sha===sha&&
            run.status==="completed"&&run.conclusion==="success");
          if(!passed){console.error("::error::Exact-main GitHub quality gate is missing or not successful");process.exit(1)}
          NODE
      - name: Verify protected rollback environment exists
        if: ${{ inputs.rollback_version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -s "$HOME/.nvm/nvm.sh" ]; then
            . "$HOME/.nvm/nvm.sh"
            nvm use 22 >/dev/null
          fi
          node -e 'const https=require("https"),url="https://api.github.com/repos/"+process.env.REPOSITORY+"/environments/production-cloudflare";const req=https.get(url,{headers:{"Authorization":"Bearer "+process.env.GH_TOKEN,"Accept":"application/vnd.github+json","User-Agent":"dpp-release-gate"}},r=>{let s="";r.on("data",d=>s+=d);r.on("end",()=>{try{const x=JSON.parse(s);if(r.statusCode!==200||x.name!=="production-cloudflare"||x.deployment_branch_policy?.protected_branches!==true||x.deployment_branch_policy?.custom_branch_policies!==false)process.exitCode=1}catch{process.exitCode=1}})});req.on("error",()=>{process.exitCode=1})'

  db_preflight:
    name: Read-only production DPP migration attestation
    needs: preflight
    if: ${{ inputs.rollback_version == '' }}
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 8
    environment:
      name: production-supabase
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
          fetch-depth: 1
          clean: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Require applied schema before allowing Worker publish
        env:
          AUTHICHAIN_PRODUCTION_SUPABASE_DB_URL: ${{ secrets.AUTHICHAIN_PRODUCTION_SUPABASE_DB_URL }}
          AUTHICHAIN_PRODUCTION_SUPABASE_PROJECT_REF: ${{ secrets.AUTHICHAIN_PRODUCTION_SUPABASE_PROJECT_REF }}
          EXPECTED_SUPABASE_REF: ${{ inputs.supabase_project_ref }}
        run: |
          set -euo pipefail
          git sparse-checkout disable
          git reset --hard HEAD
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          bash scripts/ci/verify-dpp-outbox-production.sh
  deploy:
    needs: [preflight, db_preflight]
    if: ${{ always() && needs.preflight.result == 'success' && ((inputs.rollback_version == '' && needs.db_preflight.result == 'success') || (inputs.rollback_version != '' && needs.db_preflight.result == 'skipped')) }}
    environment:
      name: production-cloudflare
    # Publish runner only: authichain-wsl, same as deploy-authichain-com.yml.
    runs-on: [self-hosted, Linux, ARM64, authichain-wsl]
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Preflight - memory (build peaks ~5.1 GiB RSS)
        run: |
          set -euo pipefail
          free -m
          total_kb="$(awk '/^(MemTotal|SwapTotal):/ {s+=$2} END {print s+0}' /proc/meminfo)"
          total_mib=$((total_kb / 1024))
          echo "MemTotal+SwapTotal: ${total_mib} MiB (minimum 6144 MiB)"
          if [ "$total_mib" -lt 6144 ]; then
            echo "::error::runner has ${total_mib} MiB RAM+swap; the OpenNext build needs at least 6144 MiB (peaks ~5.1 GiB RSS). Add swap or use a bigger runner."; exit 1
          fi
      - name: Gate - ref must be main; validate inputs
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
          RUN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$RUN_REF" != "refs/heads/main" ]; then
            echo "::error::must be dispatched from refs/heads/main (got $RUN_REF)"; exit 1
          fi
          if [ -n "$ROLLBACK_VERSION" ]; then
            if ! printf '%s' "$ROLLBACK_VERSION" | grep -Eq '^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[0-9a-f]{8,32})$'; then
              echo "::error::rollback_version must be a lowercase UUID or an 8-32 char hex prefix"; exit 1
            fi
            echo "mode: rollback to $ROLLBACK_VERSION (build and deploy skipped)"
          else
            if ! printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::expected_sha must be a full 40-char lowercase hex SHA"; exit 1
            fi
            echo "mode: deploy $EXPECTED_SHA"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.rollback_version == '' && inputs.expected_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Gate - HEAD equals expected SHA and is an ancestor of main
        if: ${{ inputs.rollback_version == '' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "checkout SHA: $HEAD_SHA"
          if [ "$HEAD_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::HEAD $HEAD_SHA != expected $EXPECTED_SHA"; exit 1
          fi
          git fetch --no-tags origin main
          if [ "$(git rev-parse origin/main)" != "$EXPECTED_SHA" ]; then
            echo "::error::current main does not equal exact release SHA"; exit 1
          fi
          # setup-node has not run yet. The self-hosted runner has no node on PATH here.
          NAME="$(sed -n 's/^[[:space:]]*"name":[[:space:]]*"\([^"]*\)".*/\1/p' wrangler.app.jsonc | head -n 1)"
          if [ "$NAME" != "authichain-app" ]; then
            echo "::error::wrangler.app.jsonc name is '$NAME', expected authichain-app"; exit 1
          fi
          echo "wrangler.app.jsonc name: $NAME"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "10.28.2"
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Install node-gyp (native builds)
        run: npm i -g node-gyp@11.5.0
      - name: Install
        env:
          npm_config_build_from_source: "false"
        run: pnpm install --frozen-lockfile
      - name: Rollback authichain-app
        if: ${{ inputs.rollback_version != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
        run: |
          set -euo pipefail
          pnpm exec wrangler rollback "$ROLLBACK_VERSION" --name authichain-app --message "CI rollback via deploy-authichain-app" --yes
          pnpm exec wrangler deployments list --name authichain-app
      - name: Build (OpenNext)
        if: ${{ inputs.rollback_version == '' }}
        env:
          # Matches Workers Builds (playwright-core stubbed). Public-by-design
          # build values from existing repo secrets; never echoed.
          WORKERS_CI: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          for n in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!n:-}" ]; then echo "::error::secret $n is empty"; exit 1; fi
          done
          bash scripts/with-build-lock.sh pnpm exec opennextjs-cloudflare build --config wrangler.app.jsonc
      - name: Recheck exact-current-main protected release policy before publish
        if: ${{ inputs.rollback_version == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/ci/autonomous-release-gate.mjs
      - name: Verify application Supabase endpoint matches attested database
        if: ${{ inputs.rollback_version == '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPECTED_SUPABASE_REF: ${{ inputs.supabase_project_ref }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            const u = new URL(process.env.NEXT_PUBLIC_SUPABASE_URL);
            if(u.protocol !== "https:" || u.hostname !== process.env.EXPECTED_SUPABASE_REF + ".supabase.co"){
              console.error("::error::App Supabase URL differs from protected DB migration target");
              process.exit(1);
            }
          '
      - name: Publish authichain-app
        if: ${{ inputs.rollback_version == '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.AUTHICHAIN_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        # --keep-vars keeps dashboard vars/secrets attached. No secret put, no --var.
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --keep-vars --config wrangler.app.jsonc
          pnpm exec wrangler deployments list --name authichain-app
      - name: Live GET checks (qron.space)
        run: |
          set -euo pipefail
          for u in https://qron.space/ https://qron.space/generate; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$u")"
            echo "$u -> $code"
            if [ "$code" != "200" ]; then echo "::error::$u returned $code"; exit 1; fi
          done
      - name: Live GET check (authichain.com/checkout/starter)
        run: |
          set -euo pipefail
          u="https://authichain.com/checkout/starter"
          # No -L. 200 is the email confirm form. 30x is a direct redirect.
          # Print only the status and Location host+path, never the query string.
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          out="$(curl -sS -o "$body" -w '%{http_code} %{redirect_url}' --max-time 30 "$u")"
          code="${out%% *}"
          loc="${out#* }"
          loc="${loc%%[?#]*}"
          echo "$u -> $code (Location: ${loc:-none})"
          case "$code" in
            30[0-9])
              if [ -z "$loc" ]; then echo "::error::$u returned $code with no Location"; exit 1; fi
              ;;
            200)
              if ! grep -q "Confirm Starter Pack" "$body"; then
                echo "::error::$u returned 200 without the confirm form"; exit 1
              fi
              ;;
            *) echo "::error::$u returned $code, expected 200 or a 30x redirect"; exit 1 ;;
          esac
