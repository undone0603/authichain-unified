name: Worker builds

# Compiles workers/* and does not publish. The compile command lives in
# scripts/ci/build-workers.mjs. Keep it there: this file must stay a CI
# workflow, not a deploy, so a stale run can be cancelled.

on:
  pull_request:
    paths:
      - "workers/**"
      - "scripts/ci/build-workers.mjs"
      - "scripts/ci/build-workers.test.mjs"
      - ".github/workflows/build-workers.yml"
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "scripts/ci/build-workers.mjs"
      - "scripts/ci/build-workers.test.mjs"
      - ".github/workflows/build-workers.yml"
  workflow_dispatch:
    inputs:
      worker:
        description: "One workers directory. Blank compiles every non-archived worker."
        required: false
        type: string

concurrency:
  # PM ruling Oct 24: CI-only per-workflow group, cancel stale runs so a
  # push to main cannot pile CI up ahead of a deploy on the single
  # self-hosted runner. Never a deploy group name.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dry-run:
    name: Worker dry-run build
    # Same-repo jobs use the authichain-ops ARM64 runners. Fork PRs stay on
    # ubuntu-24.04 so untrusted code never lands on the self-hosted machine.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","ARM64","authichain-ci-isolated"]') || 'ubuntu-24.04' }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin ${{ github.base_ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "10.28.2"
          # action-setup deletes dest on every job. A shared ~/setup-pnpm
          # races when both self-hosted runners install pnpm together.
          dest: ${{ runner.environment == 'self-hosted' && format('~/setup-pnpm-{0}', runner.name) || '~/setup-pnpm' }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: ${{ runner.environment != 'self-hosted' && 'pnpm' || '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Compile changed workers
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DIFF_BEFORE: ${{ github.event.before }}
          DISPATCH_WORKER: ${{ github.event.inputs.worker }}
        run: node scripts/ci/build-workers.mjs

      - name: Fork pull request has no Cloudflare token
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Fork pull requests cannot compile workers (no Cloudflare token)."
          exit 1

      # Persistent self-hosted runner: drop deps and build outputs so state
      # never leaks into the next run. Workspace-only; never outside it.
      - name: Clean workspace (self-hosted)
        if: always()
        run: |
          set -eu
          ws="${GITHUB_WORKSPACE:?}"
          case "$ws" in /|"") echo "::error::bad GITHUB_WORKSPACE"; exit 1;; esac
          cd "$ws"
          find . -mindepth 1 -type d \( -name node_modules -o -name .venv -o -name .next -o -name .open-next -o -name .turbo -o -name dist -o -name test-results \) -prune -exec rm -rf -- {} +
