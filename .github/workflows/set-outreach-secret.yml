name: Set qron-outreach AUTH_TOKEN + resend-relay key

on:
  workflow_dispatch:
    inputs:
      auth_token:
        description: "AUTH_TOKEN value to set on qron-outreach worker"
        required: true
      resend_api_key:
        description: "RESEND_API_KEY to set on resend-relay worker"
        required: false

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Wrangler
        run: npm install -g wrangler
      - name: Set AUTH_TOKEN on qron-outreach
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ github.event.inputs.auth_token }}" | wrangler secret put AUTH_TOKEN --name qron-outreach
      - name: Set RESEND_API_KEY on resend-relay
        if: ${{ github.event.inputs.resend_api_key != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ github.event.inputs.resend_api_key }}" | wrangler secret put RESEND_API_KEY --name resend-relay
