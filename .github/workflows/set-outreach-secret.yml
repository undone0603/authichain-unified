name: Set qron-outreach AUTH_TOKEN

on:
  workflow_dispatch:
    inputs:
      auth_token:
        description: "AUTH_TOKEN value to set on qron-outreach worker"
        required: true

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Wrangler
        run: npm install -g wrangler
      - name: Set AUTH_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ github.event.inputs.auth_token }}" | wrangler secret put AUTH_TOKEN --name qron-outreach
