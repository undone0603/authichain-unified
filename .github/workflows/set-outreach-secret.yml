name: Set qron-outreach AUTH_TOKEN + resend-relay key

on:
  workflow_dispatch: {}

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Wrangler
        run: npm install -g wrangler
      - name: Set AUTH_TOKEN on qron-outreach
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        run: |
          set -euo pipefail
          for required in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID AUTH_TOKEN; do
            if [ -z "${!required:-}" ]; then
              echo "::error::GitHub secret $required is empty"
              exit 1
            fi
          done
          printf '%s' "$AUTH_TOKEN" | wrangler secret put AUTH_TOKEN --name qron-outreach
          echo "bound AUTH_TOKEN on qron-outreach (value not logged)"
      - name: Set RESEND_API_KEY on qron-outreach
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "::notice::RESEND_API_KEY GitHub secret empty — not bound on qron-outreach"
            exit 0
          fi
          printf '%s' "$RESEND_API_KEY" | wrangler secret put RESEND_API_KEY --name qron-outreach
          echo "bound RESEND_API_KEY on qron-outreach (value not logged)"
      - name: Set RESEND_API_KEY on resend-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "::notice::RESEND_API_KEY GitHub secret empty — not bound on resend-relay"
            exit 0
          fi
          printf '%s' "$RESEND_API_KEY" | wrangler secret put RESEND_API_KEY --name resend-relay
          echo "bound RESEND_API_KEY on resend-relay (value not logged)"
