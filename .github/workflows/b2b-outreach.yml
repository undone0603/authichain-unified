# .github/workflows/b2b-outreach.yml
#
# Dry-run (default):
#   gh workflow run b2b-outreach.yml -f segment=qron -f dry_run=true
# Tiny live batch (OWNER_LIVE_SEND=true, MAX_LIVE_SENDS=2, QRON only):
#   gh workflow run b2b-outreach.yml -f segment=qron -f dry_run=false
# Live channel partners (OWNER_LIVE_SEND=true, MAX_LIVE_SENDS=2).
# Sets ALLOW_PARTNER_SENDS=true only for this dispatch + resolved live:
#   gh workflow run b2b-outreach.yml -f segment=partners -f dry_run=false
# partners / high_leverage are never folded into all / govchain / strainchain / qron.
# high_leverage stays dry-run only.
name: B2B Cold Outreach

on:
  schedule:
    # Weekdays 10:00 ET (14:00 UTC). Scheduled runs are governed by
    # .github/autonomy.json -> cold_outreach (switch, daily cap, segments,
    # deliverability breaker). Live send also needs vars.OWNER_LIVE_SEND=true.
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      segment:
        description: "Which segment to target (govchain | strainchain | qron | partners | high_leverage | all). partners/high_leverage are not folded into all. high_leverage is dry-run only."
        required: false
        default: "all"
        type: choice
        options:
          - all
          - govchain
          - strainchain
          - qron
          - partners
          - high_leverage
      dry_run:
        # STAGED: default true. Live send also requires vars.OWNER_LIVE_SEND=true
        # (one-click flip — see PUBLIC_LOOP_FREEZE.md). Unset / false = no spam.
        description: "Dry run (save to Supabase, skip email send)"
        required: false
        default: "true"
        type: boolean
      flush_queued:
        description: "Only flush already-queued leads (no new prospecting)"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: b2b-outreach
  cancel-in-progress: false

permissions:
  contents: read
  # approval queue: a tripped breaker latches outreach off until the owner approves resuming
  issues: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.28.2"

jobs:
  outreach:
    name: B2B Cold Outreach — ${{ github.event_name == 'schedule' && 'qron' || inputs.segment || 'all' }}
    # Enabling this workflow is not live send. Resolve-mode stays dry-run
    # unless vars.OWNER_LIVE_SEND=true (and dispatch also unchecks dry_run).
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      - name: Read autonomy manifest
        id: autonomy
        run: |
          set -euo pipefail
          node -e '
            const m = require("./.github/autonomy.json").cold_outreach;
            const segs = m.segments.filter((s) => !["partners", "high_leverage", "all"].includes(s));
            const day = new Date().getUTCDay();
            const seg = segs.length ? segs[day % segs.length] : "qron";
            const out = [
              `enabled=${m.enabled === true}`,
              `cap=${m.max_new_prospects_per_day}`,
              `segment=${seg}`,
            ].join("\n");
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, out + "\n");
            console.log(out);
          '

      - name: Deliverability breaker
        id: breaker
        if: github.event_name == 'schedule'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_API_KEY2: ${{ secrets.RESEND_API_KEY2 }}
          OUTREACH_SENDERS: ${{ vars.OUTREACH_SENDERS }}
        run: node scripts/autonomy/deliverability-breaker.mjs

      - name: Breaker latch (owner approval to resume)
        id: latch
        if: github.event_name == 'schedule' && steps.autonomy.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TRIPPED: ${{ steps.breaker.outputs.tripped }}
          BREAKER_REASON: ${{ steps.breaker.outputs.reason }}
        run: |
          set +e
          if [ "$TRIPPED" = "true" ]; then
            node scripts/autonomy/approvals.mjs latch --prefix cold-outreach-resume --trip \
              --title "Resume cold outreach after the deliverability breaker tripped" \
              --body "The breaker stopped scheduled cold outreach: ${BREAKER_REASON}. Nothing sends until you approve. Before approving, check the sender list quality and bounces in Resend."
          else
            node scripts/autonomy/approvals.mjs latch --prefix cold-outreach-resume
          fi
          code=$?
          if [ "$code" -eq 0 ]; then echo "held=false" >> "$GITHUB_OUTPUT"; else echo "held=true" >> "$GITHUB_OUTPUT"; fi
          echo "latch exit=$code"
          exit 0

      # A live send needs an opt-out that gets recorded. With
      # OUTREACH_UNSUBSCRIBE_SECRET this asks the edge router to verify a token
      # made with the same secret, so a secret bound here but not on the Worker
      # (or a mismatch) keeps the run dry instead of mailing dead links.
      # Applies to scheduled and manual runs alike. Always exits 0.
      - name: Opt-out check
        id: optout
        env:
          OUTREACH_UNSUBSCRIBE_SECRET: ${{ secrets.OUTREACH_UNSUBSCRIBE_SECRET }}
          UNSUBSCRIBE_ORIGIN: ${{ vars.UNSUBSCRIBE_ORIGIN }}
          UNSUBSCRIBE_URL: ${{ secrets.UNSUBSCRIBE_URL }}
          OUTREACH_ALLOW_MAILTO_OPTOUT: ${{ vars.OUTREACH_ALLOW_MAILTO_OPTOUT }}
        run: pnpm exec tsx scripts/outreach-optout-check.ts

      - name: Resolve dry-run / live mode
        id: mode
        env:
          BREAKER_REASON: ${{ steps.breaker.outputs.reason }}
          OPTOUT_REASON: ${{ steps.optout.outputs.reason }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Scheduled live send needs all three: manifest switch, owner
            # variable, and a clear breaker. Anything else is a dry-run.
            if [ "${{ steps.autonomy.outputs.enabled }}" = "true" ] \
              && [ "${{ vars.OWNER_LIVE_SEND }}" = "true" ] \
              && [ "${{ steps.breaker.outputs.tripped }}" = "false" ] \
              && [ "${{ steps.latch.outputs.held }}" = "false" ] \
              && [ "${{ steps.optout.outputs.ready }}" = "true" ]; then
              echo "dry_run=false" >> "$GITHUB_OUTPUT"
              echo "cap=${{ steps.autonomy.outputs.cap }}" >> "$GITHUB_OUTPUT"
              echo "Scheduled run → LIVE (manifest on, OWNER_LIVE_SEND=true, breaker clear), cap ${{ steps.autonomy.outputs.cap }}"
            else
              echo "dry_run=true" >> "$GITHUB_OUTPUT"
              echo "cap=0" >> "$GITHUB_OUTPUT"
              echo "Scheduled run → dry-run (manifest=${{ steps.autonomy.outputs.enabled }}, OWNER_LIVE_SEND=${{ vars.OWNER_LIVE_SEND }}, breaker tripped=${{ steps.breaker.outputs.tripped }}, latch held=${{ steps.latch.outputs.held }}, opt-out ready=${{ steps.optout.outputs.ready }})"
              if [ "${{ steps.optout.outputs.ready }}" != "true" ] && [ "${{ steps.autonomy.outputs.enabled }}" = "true" ]; then
                echo "::warning::Cold outreach held in dry run: no recordable opt-out (${OPTOUT_REASON})"
              fi
              if [ "${{ steps.breaker.outputs.tripped }}" = "true" ] && [ "${{ steps.autonomy.outputs.enabled }}" = "true" ]; then
                echo "::warning::Cold outreach paused by deliverability breaker: ${BREAKER_REASON}"
              fi
            fi
            exit 0
          fi
          echo "cap=2" >> "$GITHUB_OUTPUT"
          dry="${{ inputs.dry_run }}"
          if [ "$dry" = "false" ]; then
            if [ "${{ vars.OWNER_LIVE_SEND }}" != "true" ]; then
              echo "::warning::live requested but vars.OWNER_LIVE_SEND is not true — forcing dry-run"
              echo "dry_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "${{ steps.optout.outputs.ready }}" != "true" ]; then
              echo "::warning::live requested but no recordable opt-out (${OPTOUT_REASON}) — forcing dry-run"
              echo "dry_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "Manual live send (OWNER_LIVE_SEND=true)"
            exit 0
          fi
          echo "dry_run=true" >> "$GITHUB_OUTPUT"
          echo "Resolved dry_run=true"

      - name: Resolve segment
        id: segment
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Rotates through cold_outreach.segments by weekday (never all/partners/high_leverage).
            echo "segment=${{ steps.autonomy.outputs.segment }}" >> "$GITHUB_OUTPUT"
            echo "Scheduled run → segment=${{ steps.autonomy.outputs.segment }}"
            exit 0
          fi
          echo "segment=${{ inputs.segment || 'all' }}" >> "$GITHUB_OUTPUT"

      - name: Run B2B cold outreach
        if: ${{ inputs.flush_queued != true }}
        run: pnpm exec tsx scripts/b2b-cold-outreach.ts --segment=${{ steps.segment.outputs.segment }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_API_KEY2: ${{ secrets.RESEND_API_KEY2 }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          OUTREACH_FROM_EMAIL: ${{ secrets.OUTREACH_FROM_EMAIL || 'hello@authichain.com' }}
          OUTREACH_FROM_GOVCHAIN: ${{ secrets.OUTREACH_FROM_GOVCHAIN }}
          OUTREACH_FROM_STRAINCHAIN: ${{ secrets.OUTREACH_FROM_STRAINCHAIN }}
          OUTREACH_FROM_QRON: ${{ secrets.OUTREACH_FROM_QRON }}
          SALES_NOTIFY_EMAIL: ${{ secrets.SALES_NOTIFY_EMAIL || 'hello@authichain.com' }}
          CALENDLY_LINK: ${{ secrets.CALENDLY_LINK || 'https://app.authichain.com/book' }}
          AUTHICHAIN_BOOK_URL: ${{ secrets.AUTHICHAIN_BOOK_URL || 'https://app.authichain.com/book' }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          FLUSH_QUEUED_ONLY: ${{ inputs.flush_queued || 'false' }}
          # Scheduled: cold_outreach.max_new_prospects_per_day from the manifest.
          # Manual dispatch: tiny batch of 2. Never a list dump.
          MAX_LIVE_SENDS: ${{ steps.mode.outputs.cap != '0' && steps.mode.outputs.cap || '2' }}
          # Fail-closed: scripts/lib/channel-partners.ts refuses live partner
          # sends unless this is exactly "true". Set only for workflow_dispatch
          # segment=partners after OWNER_LIVE_SEND resolves dry_run=false.
          # Schedule, all, qron, high_leverage, and dry-run stay unset/false.
          ALLOW_PARTNER_SENDS: ${{ github.event_name == 'workflow_dispatch' && inputs.segment == 'partners' && steps.mode.outputs.dry_run == 'false' && 'true' || 'false' }}
          GUARDRAIL_API_URL: ${{ vars.GUARDRAIL_API_URL || 'https://app.authichain.com' }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          MAILING_ADDRESS: ${{ secrets.MAILING_ADDRESS || '109 N 4th St, Roscommon, MI 48653-9090 USA' }}
          # No default: authichain.com/unsubscribe does not exist. Unset means
          # guardedSend uses a mailto: opt-out to the reply-to inbox.
          UNSUBSCRIBE_URL: ${{ secrets.UNSUBSCRIBE_URL }}
          OUTREACH_UNSUBSCRIBE_SECRET: ${{ secrets.OUTREACH_UNSUBSCRIBE_SECRET }}
          UNSUBSCRIBE_ORIGIN: ${{ vars.UNSUBSCRIBE_ORIGIN }}
          OUTREACH_ALLOW_MAILTO_OPTOUT: ${{ vars.OUTREACH_ALLOW_MAILTO_OPTOUT }}
          RESEND_REPLY_TO: ${{ secrets.RESEND_REPLY_TO || 'hello@authichain.com' }}

      - name: Flush queued leads (if RESEND_API_KEY available)
        if: ${{ inputs.flush_queued == true && steps.mode.outputs.dry_run == 'false' }}
        run: pnpm exec tsx scripts/b2b-cold-outreach.ts --segment=${{ steps.segment.outputs.segment }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_API_KEY2: ${{ secrets.RESEND_API_KEY2 }}
          OUTREACH_FROM_EMAIL: ${{ secrets.OUTREACH_FROM_EMAIL || 'hello@authichain.com' }}
          OUTREACH_FROM_GOVCHAIN: ${{ secrets.OUTREACH_FROM_GOVCHAIN }}
          OUTREACH_FROM_STRAINCHAIN: ${{ secrets.OUTREACH_FROM_STRAINCHAIN }}
          OUTREACH_FROM_QRON: ${{ secrets.OUTREACH_FROM_QRON }}
          CALENDLY_LINK: ${{ secrets.CALENDLY_LINK || 'https://app.authichain.com/book' }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          FLUSH_QUEUED_ONLY: "true"
          MAX_LIVE_SENDS: "2"
          GUARDRAIL_API_URL: ${{ vars.GUARDRAIL_API_URL || 'https://app.authichain.com' }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          MAILING_ADDRESS: ${{ secrets.MAILING_ADDRESS || '109 N 4th St, Roscommon, MI 48653-9090 USA' }}
          # No default: authichain.com/unsubscribe does not exist. Unset means
          # guardedSend uses a mailto: opt-out to the reply-to inbox.
          UNSUBSCRIBE_URL: ${{ secrets.UNSUBSCRIBE_URL }}
          OUTREACH_UNSUBSCRIBE_SECRET: ${{ secrets.OUTREACH_UNSUBSCRIBE_SECRET }}
          UNSUBSCRIBE_ORIGIN: ${{ vars.UNSUBSCRIBE_ORIGIN }}
          OUTREACH_ALLOW_MAILTO_OPTOUT: ${{ vars.OUTREACH_ALLOW_MAILTO_OPTOUT }}
          RESEND_REPLY_TO: ${{ secrets.RESEND_REPLY_TO || 'hello@authichain.com' }}
