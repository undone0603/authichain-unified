# .github/workflows/b2b-outreach.yml
name: B2B Cold Outreach

on:
  schedule:
    # Every Monday at 9 AM EST (14:00 UTC) — weekly cadence
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      segment:
        description: "Which segment to target (govchain | strainchain | qron | all)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - govchain
          - strainchain
          - qron
      dry_run:
        # STAGED ACTIVATION: defaults to true so scheduled runs and default
        # manual runs write/queue without sending. Live send requires both
        # unchecking this input AND vars.B2B_OUTREACH_ENABLED=true.
        # See docs/operations/PUBLIC_LOOP_FREEZE.md (Day 3 flip).
        description: "Dry run (save to Supabase, skip email send)"
        required: false
        default: "true"
        type: boolean
      flush_queued:
        description: "Only flush already-queued leads (no new prospecting)"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: b2b-outreach
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.28.2"

jobs:
  outreach:
    name: B2B Cold Outreach — ${{ inputs.segment || 'all' }}
    # Workflow-enabled runs always execute. Live send is a separate gate in
    # "Resolve dry-run / live mode" (vars.B2B_OUTREACH_ENABLED=true AND
    # dry_run=false). Scheduled runs stay dry-run until that var is set, so
    # enabling this workflow produces staged evidence instead of a silent skip.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      - name: Resolve dry-run / live mode
        id: mode
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ vars.B2B_OUTREACH_ENABLED }}" = "true" ]; then
              echo "dry_run=false" >> "$GITHUB_OUTPUT"
              echo "Scheduled run → LIVE (B2B_OUTREACH_ENABLED=true)"
            else
              echo "dry_run=true" >> "$GITHUB_OUTPUT"
              echo "Scheduled run → forced dry-run (set B2B_OUTREACH_ENABLED=true after dry-run review)"
            fi
            exit 0
          fi
          dry="${{ inputs.dry_run }}"
          if [ "$dry" = "false" ]; then
            if [ "${{ vars.B2B_OUTREACH_ENABLED }}" != "true" ]; then
              echo "::warning::live requested but vars.B2B_OUTREACH_ENABLED is not true — forcing dry-run"
              echo "dry_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "Manual live send (B2B_OUTREACH_ENABLED=true)"
            exit 0
          fi
          echo "dry_run=true" >> "$GITHUB_OUTPUT"
          echo "Resolved dry_run=true"

      - name: Run B2B cold outreach
        run: pnpm exec tsx scripts/b2b-cold-outreach.ts --segment=${{ inputs.segment || 'all' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_API_KEY2: ${{ secrets.RESEND_API_KEY2 }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          OUTREACH_FROM_EMAIL: ${{ secrets.OUTREACH_FROM_EMAIL || 'hello@authichain.com' }}
          OUTREACH_FROM_GOVCHAIN: ${{ secrets.OUTREACH_FROM_GOVCHAIN }}
          OUTREACH_FROM_STRAINCHAIN: ${{ secrets.OUTREACH_FROM_STRAINCHAIN }}
          OUTREACH_FROM_QRON: ${{ secrets.OUTREACH_FROM_QRON }}
          SALES_NOTIFY_EMAIL: ${{ secrets.SALES_NOTIFY_EMAIL || 'hello@authichain.com' }}
          CALENDLY_LINK: ${{ secrets.CALENDLY_LINK || 'https://app.authichain.com/book' }}
          AUTHICHAIN_BOOK_URL: ${{ secrets.AUTHICHAIN_BOOK_URL || 'https://app.authichain.com/book' }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          FLUSH_QUEUED_ONLY: ${{ inputs.flush_queued || 'false' }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          MAILING_ADDRESS: ${{ secrets.MAILING_ADDRESS || '109 N 4th St, Roscommon, MI 48653-9090 USA' }}
          UNSUBSCRIBE_URL: ${{ secrets.UNSUBSCRIBE_URL || 'https://authichain.com/unsubscribe' }}
          RESEND_REPLY_TO: ${{ secrets.RESEND_REPLY_TO || 'hello@authichain.com' }}

      - name: Flush queued leads (if RESEND_API_KEY available)
        if: ${{ inputs.flush_queued == 'true' && steps.mode.outputs.dry_run == 'false' }}
        run: pnpm exec tsx -e "import { flushQueuedLeads } from './scripts/b2b-cold-outreach.ts'; flushQueuedLeads().then(n => console.log('Flushed', n, 'leads'));"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_API_KEY2: ${{ secrets.RESEND_API_KEY2 }}
          OUTREACH_FROM_EMAIL: ${{ secrets.OUTREACH_FROM_EMAIL || 'hello@authichain.com' }}
          OUTREACH_FROM_GOVCHAIN: ${{ secrets.OUTREACH_FROM_GOVCHAIN }}
          OUTREACH_FROM_STRAINCHAIN: ${{ secrets.OUTREACH_FROM_STRAINCHAIN }}
          OUTREACH_FROM_QRON: ${{ secrets.OUTREACH_FROM_QRON }}
          CALENDLY_LINK: ${{ secrets.CALENDLY_LINK || 'https://app.authichain.com/book' }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          MAILING_ADDRESS: ${{ secrets.MAILING_ADDRESS || '109 N 4th St, Roscommon, MI 48653-9090 USA' }}
          UNSUBSCRIBE_URL: ${{ secrets.UNSUBSCRIBE_URL || 'https://authichain.com/unsubscribe' }}
          RESEND_REPLY_TO: ${{ secrets.RESEND_REPLY_TO || 'hello@authichain.com' }}
