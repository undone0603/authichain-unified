name: Pipeline Tick (direct runner)

# Runs the AgentZ pipeline tick by invoking runPipelineTick() directly on the
# runner, instead of calling https://authichain.com/api/cron/pipeline with a
# bearer token as autonomous-business-cycle.yml does.
#
# The HTTP hop bought nothing and cost three failure modes. The first live
# activation attempt (run 32337392873) died on a bare 401 because CRON_SECRET
# in this repository does not match CRON_SECRET in the deployed environment —
# a mismatch nothing can detect until someone dispatches the job, and which
# only a dashboard action can fix. Calling the function directly removes that
# dependency, removes the dependency on a Vercel deployment being live and
# inside its daily deploy cap, and turns an opaque 401 into a real stack trace.
#
# This is the same shape as browser-vision-tasks.yml, which reaches the
# database successfully on every run, IPv4 pin included.
#
# ── Activation ───────────────────────────────────────────────────────────────
# This workflow is SAFE TO SCHEDULE AS-IS. runPipelineTick() returns
# {enabled: false, skipped: true} unless AUTONOMOUS_PIPELINE_ENABLED === "true"
# in the process environment (server/_core/env.ts:33), so until the repository
# variable below is set every run is a no-op that says so in the log.
#
# To activate: set the repository variable PIPELINE_TICK_ENABLED to "true". To
# stop: unset it. No code change, no deploy, effective on the next run. That is
# deliberately the whole switch — a variable a human sets, not a default this
# workflow assumes.
#
# ── Why the variable is not called AUTONOMOUS_PIPELINE_ENABLED ────────────────
# Because something else already is. set-pipeline-enabled.yml writes an
# environment variable of that exact name into the Vercel production runtime,
# where it gates the /api/cron/pipeline HTTP endpoint. Two switches, one name,
# two different stores, independent values, and nothing that reports a
# disagreement between them.
#
# They also do not do the same thing. THIS workflow is the only thing that runs
# the pipeline on a schedule. Nothing calls /api/cron/pipeline on a schedule at
# all: vercel.json declares no crons, and autonomous-business-cycle.yml gates
# its only job on `github.event_name == 'workflow_dispatch' && inputs.live`, so
# its thirteen cron entries start a run that skips the job every time. Setting
# the Vercel-side variable therefore activates nothing recurring — which is a
# surprising thing for a workflow named "Configure Autonomous Pipeline" to do,
# and the reason this one reads a distinctly named variable instead.
#
# The old name is still honoured so an already-set variable does not silently
# stop working, and the run says which name it read.
#
# Note what activation turns on: lead discovery, research browsing, and
# outbound email drafting. Email still passes server/outreach/send-guard.ts,
# which sends only to addresses Apollo itself reports as `verified` and never
# to role inboxes.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what a live tick would do, without sending email"
        required: false
        default: false
        type: boolean

concurrency:
  group: pipeline-tick
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: Run pipeline tick
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Skip if DATABASE_URL not configured
        id: db-check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL repo secret not set — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report activation state
        if: steps.db-check.outputs.skip != 'true'
        env:
          CURRENT: ${{ vars.PIPELINE_TICK_ENABLED }}
          LEGACY: ${{ vars.AUTONOMOUS_PIPELINE_ENABLED }}
        run: |
          # Say plainly which of the two outcomes this run is going to be, so a
          # green check never reads as "the pipeline ran" when it did not, and
          # name the variable that decided it — the whole point of the rename is
          # that a reader can tell which switch is in play.
          if [ "$CURRENT" = "true" ]; then
            echo "::notice::PIPELINE_TICK_ENABLED=true — this run will execute the pipeline."
          elif [ "$LEGACY" = "true" ]; then
            echo "::warning::Running from the legacy repository variable AUTONOMOUS_PIPELINE_ENABLED. That name is also used for a different switch in the Vercel runtime; rename this one to PIPELINE_TICK_ENABLED."
          elif [ -n "$CURRENT" ] || [ -n "$LEGACY" ]; then
            echo "::notice::Pipeline switch is set but not to \"true\" — this run is a no-op."
          else
            echo "::notice::PIPELINE_TICK_ENABLED is unset — this run is a no-op. Set the repository variable to \"true\" to activate."
          fi

      # The runner has no IPv6 route, and the Supabase pooler resolves to both.
      # Same pin as browser-vision-tasks.yml.
      - name: Force IPv4 for Supabase pooler
        if: steps.db-check.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          host=$(printf '%s' "$DATABASE_URL" | sed -E 's#^[a-zA-Z]+://[^@]*@##; s#[:/].*$##')
          if [ -z "$host" ]; then
            echo "Could not parse a host out of DATABASE_URL; skipping IPv4 pin."
            exit 0
          fi
          ipv4=$(getent ahostsv4 "$host" 2>/dev/null | awk '{print $1; exit}' || true)
          if [ -z "$ipv4" ]; then
            ipv4=$(dig +short A "$host" 2>/dev/null | tail -1 || true)
          fi
          if [ -n "$ipv4" ]; then
            echo "Pinning $host -> $ipv4 in /etc/hosts (forces IPv4)."
            echo "$ipv4 $host" | sudo tee -a /etc/hosts >/dev/null
          else
            echo "::error::No IPv4 (A) record found for host '$host'."
            echo "::error::Use a dual-stack Supabase Session Pooler connection string (port 6543)."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.db-check.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.db-check.outputs.skip != 'true'
        with:
          node-version: "22"

      # pnpm comes from corepack, which ships with Node, rather than from
      # pnpm/action-setup. CodeQL flags that action as an unpinned third-party
      # dependency (`@v4` is a mutable tag that can be repointed at any commit),
      # and pinning it would mean hardcoding a SHA. Corepack removes the
      # third-party dependency altogether instead of pinning it.
      #
      # The version is stated explicitly because package.json has no
      # `packageManager` field; it matches the 10.28.2 the other workflows use,
      # so the lockfile is read by the same resolver everywhere.
      #
      # Trade-off: this drops `cache: pnpm` from setup-node, which needs pnpm on
      # PATH before it runs. Installs are slower by roughly the download time.
      # For a once-daily job that is not worth reintroducing the dependency for.
      - name: Enable pnpm via corepack
        if: steps.db-check.outputs.skip != 'true'
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm --version

      - name: Install dependencies
        if: steps.db-check.outputs.skip != 'true'
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      - name: Run pipeline tick
        if: steps.db-check.outputs.skip != 'true'
        env:
          # server/_core/env.ts reads AUTONOMOUS_PIPELINE_ENABLED from the
          # process environment, so that is the name it arrives under here. The
          # repository variable that supplies it is PIPELINE_TICK_ENABLED, kept
          # distinct from the same-named Vercel runtime variable that gates the
          # HTTP endpoint. The legacy name is a fallback so an already-set
          # variable keeps working; an empty `vars.*` is falsy to `||`.
          #
          # Absent or anything other than "true" makes the tick a no-op.
          AUTONOMOUS_PIPELINE_ENABLED: ${{ vars.PIPELINE_TICK_ENABLED || vars.AUTONOMOUS_PIPELINE_ENABLED }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # The content agent needs this, and this workflow was not passing it:
          # the first dry run failed all three due DRAFT_LAUNCH_EMAIL tasks with
          # "ANTHROPIC_API_KEY is not configured". gov-proposals.yml and
          # gov-score.yml already pass the same secret.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Absent means apolloSearchLeads() returns [] and no leads are found —
          # the tick still runs its other stages rather than failing.
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          NODE_OPTIONS: --dns-result-order=ipv4first
          # Through env rather than spliced into the run line: an input
          # interpolated directly into a shell command is a command-injection
          # sink, and boolean-today is string-tomorrow.
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # A dry run bypasses the activation switch on purpose — the whole
          # point is to see what a live tick would do while it is still off.
          # sendEmail() records instead of dispatching, so nothing is mailed.
          # Everything else runs for real, database writes included.
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::Dry run — email is recorded, not sent. Database writes still happen."
            pnpm tsx server/jobs/pipeline-tick.ts --dry-run
          else
            pnpm tsx server/jobs/pipeline-tick.ts
          fi
