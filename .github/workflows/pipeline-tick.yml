name: Pipeline Tick (direct runner)

# Runs the AgentZ pipeline tick by invoking runPipelineTick() directly on the
# runner. The normal schedule remains daily; a push with [pipeline-proof] is
# an explicit one-shot production proof trigger.
#
# Main autonomous launch is active by default. PIPELINE_TICK_ENABLED remains
# the emergency stop switch: set it to "false" to halt the live tick; an unset
# variable is treated as "true" for the main branch.
#
# Actual outbound delivery remains fail-closed behind
# server/outreach/send-guard.ts: only trusted provenance sources, non-role
# inboxes, MX, Resend credentials, and a physical mailing address can reach
# the network.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what a live tick would do, without sending email"
        required: false
        default: false
        type: boolean

concurrency:
  group: pipeline-tick
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: Run pipeline tick
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[pipeline-proof]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Skip if DATABASE_URL not configured
        id: db-check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL repo secret not set — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report activation state
        if: steps.db-check.outputs.skip != 'true'
        env:
          CURRENT: ${{ vars.PIPELINE_TICK_ENABLED }}
        run: |
          if [ "$CURRENT" = "false" ]; then
            echo "::warning::PIPELINE_TICK_ENABLED=false — this run will be a no-op."
          elif [ -z "$CURRENT" ] || [ "$CURRENT" = "true" ]; then
            echo "::notice::Autonomous launch active — PIPELINE_TICK_ENABLED=${CURRENT:-true}."
          else
            echo "::error::PIPELINE_TICK_ENABLED must be true, false, or unset."
            exit 1
          fi

      - name: Force IPv4 for Supabase pooler
        if: steps.db-check.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          host=$(printf '%s' "$DATABASE_URL" | sed -E 's#^[a-zA-Z]+://[^@]*@##; s#[:/].*$##')
          if [ -z "$host" ]; then
            echo "Could not parse a host out of DATABASE_URL; skipping IPv4 pin."
            exit 0
          fi
          ipv4=$(getent ahostsv4 "$host" 2>/dev/null | awk '{print $1; exit}' || true)
          if [ -z "$ipv4" ]; then
            ipv4=$(dig +short A "$host" 2>/dev/null | tail -1 || true)
          fi
          if [ -n "$ipv4" ]; then
            echo "Pinning $host -> $ipv4 in /etc/hosts (forces IPv4)."
            echo "$ipv4 $host" | sudo tee -a /etc/hosts >/dev/null
          else
            echo "::error::No IPv4 (A) record found for host '$host'."
            echo "::error::Use a dual-stack Supabase Session Pooler connection string (port 6543)."
            exit 1
          fi

      - uses: actions/checkout@v7
        if: steps.db-check.outputs.skip != 'true'

      - uses: actions/setup-node@v7
        if: steps.db-check.outputs.skip != 'true'
        with:
          node-version: "22"

      - name: Enable pnpm via corepack
        if: steps.db-check.outputs.skip != 'true'
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm --version

      - name: Install dependencies
        if: steps.db-check.outputs.skip != 'true'
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      # A [pipeline-proof] push is the explicit one-shot launch verification path.
      # This commit intentionally carries the marker so the proof workflow runs once.
      - name: Run pipeline tick
        if: steps.db-check.outputs.skip != 'true'
        env:
          AUTONOMOUS_PIPELINE_ENABLED: ${{ vars.PIPELINE_TICK_ENABLED != 'false' && 'true' || 'false' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          NODE_OPTIONS: --dns-result-order=ipv4first
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::Dry run — email is recorded, not sent. Database writes still happen."
            pnpm tsx server/jobs/pipeline-tick.ts --dry-run
          else
            pnpm tsx server/jobs/pipeline-tick.ts
          fi

      - name: Produce launch proof
        if: steps.db-check.outputs.skip != 'true' && github.event_name == 'push' && contains(github.event.head_commit.message, '[pipeline-proof]')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTHICHAIN_ATTESTATION_KEY_ID: ${{ secrets.AUTHICHAIN_ATTESTATION_KEY_ID }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: pnpm tsx scripts/launch-proof.ts

      - name: Upload launch proof artifacts
        if: always() && steps.db-check.outputs.skip != 'true' && github.event_name == 'push' && contains(github.event.head_commit.message, '[pipeline-proof]')
        uses: actions/upload-artifact@v4
        with:
          name: authichain-launch-proof
          path: artifacts/production-launch-proof.json
          if-no-files-found: warn

      - name: Upload QRON launch artifact
        if: always() && steps.db-check.outputs.skip != 'true' && github.event_name == 'push' && contains(github.event.head_commit.message, '[pipeline-proof]')
        uses: actions/upload-artifact@v4
        with:
          name: authichain-launch-proof-qron
          path: artifacts/launch-proof-qron.png
          if-no-files-found: warn
