name: Autonomous Business Cycle (Vercel Cron backup)

# Redundant trigger for the same paths vercel.json declares as Vercel Cron
# jobs, authenticated with CRON_SECRET. If Vercel's cron is silently dead,
# this is what keeps the business running: lead-nurture drip, dunning,
# retention, affiliate/founder payouts, GovChain sync, competitive
# monitoring, subscription health. Until CRON_SECRET is set as a repo
# secret, the job below skips gracefully.
#
# Also the ONLY external trigger for 10 registered jobs (certificate-expiry,
# lead-nurturing, database-cleanup, weekly-analytics-digest, hubspot-crm-sync,
# fraud-detection-sweep, vertical-cloner, strainchain-metrc-sync,
# newsjacking-monitor, staking-rewards) that vercel.json never lists —
# node-cron's in-process schedule never persists in a serverless Vercel
# function, so without this loop they'd never run at all. Each is
# min-interval-gated in scheduled-jobs.ts so calling them on every firing here
# is safe; they no-op until actually due.

on:
  schedule:
    - cron: '0 0 * * *'   # pipeline
    - cron: '0 3 * * *'   # subscription-health-check
    - cron: '0 5 * * *'   # customer-health-score
    - cron: '0 6 * * *'   # automation/cron
    - cron: '0 6 * * 1'   # competitive-monitor (Mondays)
    - cron: '0 7 * * *'   # govchain
    - cron: '0 8 * * *'   # dunning-escalation
    - cron: '0 9 * * *'   # retention
    - cron: '0 9 1 * *'   # founder-payout (1st of month)
    - cron: '0 10 * * *'  # trial-reminder
    - cron: '0 11 * * *'  # live-systems-check
    - cron: '0 12 * * *'  # token-metrics
    - cron: '0 13 * * *'  # ecosystem-health
    # The 13 entries above leave an ~11h gap (13:00-00:00 UTC) with zero
    # firings. The sub-daily jobs added below (vertical-cloner, fraud-sweep,
    # strainchain-metrc-sync, hubspot-crm-sync, newsjacking-monitor) rely on
    # this workflow firing regularly through that window to get anywhere
    # close to their intended cadence, so fill it in without adding a
    # separate high-frequency workflow (cost/complexity trade-off).
    - cron: '0 16 * * *'
    - cron: '0 19 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch: {}

concurrency:
  group: autonomous-business-cycle
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_URL: ${{ vars.APP_URL || 'https://authichain.com' }}

jobs:
  run-due-cron-paths:
    name: Call all cron paths (backup trigger)
    runs-on: ubuntu-latest
    steps:
      - name: Skip if CRON_SECRET not configured yet
        id: check
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "CRON_SECRET repo secret not set — skipping (see workflow header for setup steps)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Call every cron path (safe no-ops if not due / already run by Vercel)
        if: steps.check.outputs.skip == 'false'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          paths=(
            "/api/cron/pipeline"
            "/api/automation/cron"
            "/api/cron/jobs?job=subscription-health-check"
            "/api/cron/jobs?job=customer-health-score"
            "/api/cron/govchain"
            "/api/cron/jobs?job=dunning-escalation"
            "/api/cron/retention"
            "/api/trial-reminder"
            "/api/cron/jobs?job=founder-payout"
            "/api/cron/competitive-monitor"
            "/api/cron/jobs?job=live-systems-check"
            "/api/cron/jobs?job=token-metrics"
            "/api/cron/jobs?job=ecosystem-health"
            # These 10 were registered in server/scheduled-jobs.ts but had no
            # external trigger anywhere (not in vercel.json, not in this
            # workflow) — node-cron's in-process schedule set up by
            # initializeScheduler() never fires in a serverless Vercel
            # function, so they never ran in production. Each is now
            # min-interval-gated server-side (see scheduled-jobs.ts), so it's
            # safe to call them here on every run of this daily backup loop —
            # they'll no-op until they're actually due.
            "/api/cron/jobs?job=certificate-expiry-check"
            "/api/cron/jobs?job=lead-nurturing"
            "/api/cron/jobs?job=database-cleanup"
            "/api/cron/jobs?job=weekly-analytics-digest"
            "/api/cron/jobs?job=hubspot-crm-sync"
            "/api/cron/jobs?job=fraud-detection-sweep"
            "/api/cron/jobs?job=vertical-cloner"
            "/api/cron/jobs?job=strainchain-metrc-sync"
            "/api/cron/jobs?job=newsjacking-monitor"
            "/api/cron/jobs?job=staking-rewards"
          )
          fail=0
          for p in "${paths[@]}"; do
            url="${APP_URL}${p}"
            code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -X GET "$url" -H "Authorization: Bearer ${CRON_SECRET}")
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "OK  [$code] $p"
            elif [ "$code" -eq 401 ] || [ "$code" -eq 403 ]; then
              # 401/403 means CRON_SECRET in GH secrets doesn't match Vercel's env —
              # Vercel's own cron is still running; log and skip rather than fail CI.
              echo "WARN [$code] $p — CRON_SECRET mismatch; resync secret with Vercel env to fix"
              cat /tmp/resp.txt
            else
              echo "WARN [$code] $p"
              cat /tmp/resp.txt
            fi
          done
          exit $fail
