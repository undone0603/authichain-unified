name: Autonomous Business Cycle (Vercel Cron backup)

permissions:
  contents: read

env:
  APP_URL: ${{ vars.APP_URL || 'https://authichain.com' }}

jobs:
  run-due-cron-paths:
    name: Call all cron paths (backup trigger)
    runs-on: ubuntu-latest
    steps:
      - name: Skip if CRON_SECRET not configured yet
        id: check
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "CRON_SECRET repo secret not set — skipping (see workflow header for setup steps)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Call every cron path (safe no-ops if not due / already run by Vercel)
        if: steps.check.outputs.skip == 'false'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          paths=(
            "/api/cron/pipeline"
            "/api/automation/cron"
            "/api/cron/jobs?job=subscription-health-check"
            "/api/cron/jobs?job=customer-health-check"
            "/api/cron/govchain"
            "/api/cron/jobs?job=dunning-escalation"
            "/api/cron/retention"
            "/api/trial-reminder"
            "/api/cron/jobs?job=founder-payout"
            "/api/cron/competitive-monitor"
          )
          fail=0
          for p in "${paths[@]}"; do
            url="${APP_URL}${p}"
            code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -X GET "$url" -H "Authorization: Bearer ${CRON_SECRET}")
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "OK  [$code] $p"
            elif [ "$code" -eq 401 ] || [ "$code" -eq 403 ]; then
              echo "AUTH [$code] $p"
              cat /tmp/resp.txt
              fail=1
            else
              echo "WARN [$code] $p"
              cat /tmp/resp.txt
            fi
          done
          exit $fail
