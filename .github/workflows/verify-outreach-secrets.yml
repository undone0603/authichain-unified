# .github/workflows/verify-outreach-secrets.yml
# Diagnostic: reports which outreach secrets exist in the Actions secret store
# and whether each authenticates against its provider. Prints ONLY presence,
# length, prefix-shape, and HTTP status — never the values themselves.
name: Verify Outreach Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify outreach secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check presence and shape
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          HUBSPOT_TOKEN:  ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          report() {
            local name="$1" val="$2" prefix="$3"
            if [ -z "$val" ]; then
              echo "❌ $name: NOT SET in Actions repository secrets"
            else
              local shape="unexpected prefix"
              case "$val" in "$prefix"*) shape="expected prefix ($prefix...)";; esac
              # Trailing whitespace/newlines from copy-paste break auth headers
              local ws="clean"
              [ "$val" != "$(printf %s "$val" | tr -d '[:space:]')" ] && ws="CONTAINS WHITESPACE/NEWLINE"
              echo "✅ $name: set, length ${#val}, $shape, $ws"
            fi
          }
          report RESEND_API_KEY "$RESEND_API_KEY" "re_"
          report APOLLO_API_KEY "$APOLLO_API_KEY" ""
          report HUBSPOT_TOKEN  "$HUBSPOT_TOKEN"  "pat-"

      - name: Live-validate keys against providers
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          HUBSPOT_TOKEN:  ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            # /domains is a management endpoint. A *sending-only* key is valid for
            # outreach but returns 400/401 restricted_api_key here, so status alone
            # gives a false negative. Print the error `name` (never the key or any
            # secret) to tell "restricted but usable" apart from "genuinely bad".
            body=$(curl -s -w '\n%{http_code}' https://api.resend.com/domains \
              -H "Authorization: Bearer $RESEND_API_KEY")
            code=$(printf '%s' "$body" | tail -1)
            name=$(printf '%s' "$body" | sed '$d' | grep -o '"name":"[^"]*"' | head -1 | cut -d'"' -f4)
            echo "Resend /domains -> HTTP $code${name:+ (error: $name)}"
            case "$code:$name" in
              200:*)                  echo "  ✅ full-access key — can send and manage domains" ;;
              *:restricted_api_key)   echo "  ✅ sending-only key — VALID for outreach (cannot list domains, which is fine)" ;;
              401:*)                  echo "  ❌ key is invalid or revoked" ;;
              *)                      echo "  ⚠️  unexpected — inspect the error name above" ;;
            esac
          fi
          if [ -n "$APOLLO_API_KEY" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://api.apollo.io/v1/auth/health" \
              -H "Content-Type: application/json" \
              -H "X-Api-Key: $APOLLO_API_KEY")
            echo "Apollo /auth/health -> HTTP $code (200 = valid key)"
          fi
          if [ -n "$HUBSPOT_TOKEN" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              https://api.hubapi.com/account-info/v3/details \
              -H "Authorization: Bearer $HUBSPOT_TOKEN")
            echo "HubSpot /account-info -> HTTP $code (200 = valid token)"
          fi
          echo "Done. No secret values were printed."
