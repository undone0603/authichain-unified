# .github/workflows/verify-outreach-secrets.yml
# Diagnostic: reports which outreach secrets exist in the Actions secret store
# and whether each authenticates against its provider. Prints ONLY presence,
# length, prefix-shape, and HTTP status — never the values themselves.
name: Verify Outreach Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify outreach secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check presence and shape
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          HUBSPOT_TOKEN:  ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          report() {
            local name="$1" val="$2" prefix="$3"
            if [ -z "$val" ]; then
              echo "❌ $name: NOT SET in Actions repository secrets"
            else
              local shape="unexpected prefix"
              case "$val" in "$prefix"*) shape="expected prefix ($prefix...)";; esac
              # Trailing whitespace/newlines from copy-paste break auth headers
              local ws="clean"
              [ "$val" != "$(printf %s "$val" | tr -d '[:space:]')" ] && ws="CONTAINS WHITESPACE/NEWLINE"
              echo "✅ $name: set, length ${#val}, $shape, $ws"
            fi
          }
          report RESEND_API_KEY "$RESEND_API_KEY" "re_"
          report APOLLO_API_KEY "$APOLLO_API_KEY" ""
          report HUBSPOT_TOKEN  "$HUBSPOT_TOKEN"  "pat-"

      - name: Live-validate keys against providers
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          HUBSPOT_TOKEN:  ${{ secrets.HUBSPOT_TOKEN }}
          OUTREACH_FROM_EMAIL: ${{ secrets.OUTREACH_FROM_EMAIL || 'hello@authichain.com' }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            # Probe the capability we actually need — sending — instead of the
            # /domains management endpoint, whose status is ambiguous across
            # full-access vs sending-only keys. Recipient is Resend's own test
            # sink (delivered@resend.dev): it accepts mail and reaches no real
            # person, so this is safe to run repeatedly. The error message is
            # printed verbatim; Resend error text contains no secret material.
            FROM_ADDR="${OUTREACH_FROM_EMAIL:-hello@authichain.com}"
            body=$(curl -s -w '\n%{http_code}' -X POST https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"from\":\"$FROM_ADDR\",\"to\":[\"delivered@resend.dev\"],\"subject\":\"AuthiChain outreach preflight\",\"text\":\"Preflight check - no action needed.\"}")
            code=$(printf '%s' "$body" | tail -1)
            payload=$(printf '%s' "$body" | sed '$d')
            msg=$(printf '%s' "$payload" | grep -o '"message":"[^"]*"' | head -1 | cut -d'"' -f4)
            echo "Resend POST /emails (from: $FROM_ADDR) -> HTTP $code"
            case "$code" in
              200|202) echo "  ✅ SEND WORKS — key valid and $FROM_ADDR is authorized to send" ;;
              401)     echo "  ❌ key invalid/revoked — $msg" ;;
              403)     echo "  ❌ domain not verified for $FROM_ADDR — $msg" ;;
              422)     echo "  ❌ rejected — $msg" ;;
              *)       echo "  ❌ HTTP $code — $msg" ;;
            esac
          fi
          if [ -n "$APOLLO_API_KEY" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://api.apollo.io/v1/auth/health" \
              -H "Content-Type: application/json" \
              -H "X-Api-Key: $APOLLO_API_KEY")
            echo "Apollo /auth/health -> HTTP $code (200 = valid key)"
          fi
          if [ -n "$HUBSPOT_TOKEN" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              https://api.hubapi.com/account-info/v3/details \
              -H "Authorization: Bearer $HUBSPOT_TOKEN")
            echo "HubSpot /account-info -> HTTP $code (200 = valid token)"
          fi
          echo "Done. No secret values were printed."
