name: Schema Drift Check

# Compares src/db/schema.ts against the live database.
# Read-only: it queries information_schema and writes nothing.

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      strict:
        description: 'Also fail on database columns the schema does not declare'
        required: false
        default: 'false'
        type: boolean
  pull_request:
    paths:
      - 'src/db/schema.ts'
      - 'supabase/migrations/**'

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.28.2'

jobs:
  drift:
    name: Compare schema to database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # `npm install --no-save pg@8` used to stand here, and it could never
      # succeed: this repo has no package-lock.json, so npm resolved the whole
      # package.json tree from scratch and died on an ERESOLVE peer conflict
      # (@simplewebauthn/browser vs @auth/core) before the drift check ran. The
      # job failed during install every time, so the comparison this workflow
      # exists to perform has not actually happened.
      #
      # pg is already a dependency (^8.22.0), so the normal install is all that
      # was ever needed.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check for drift
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL repo secret not set — skipping."
            echo "Set it to have this check run against the live database."
            exit 0
          fi
          ARGS=""
          if [ "${{ inputs.strict }}" = "true" ]; then ARGS="--strict"; fi
          node scripts/check-schema-drift.mjs $ARGS | tee "$GITHUB_STEP_SUMMARY"
