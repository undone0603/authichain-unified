name: Schema Drift Check

# Compares src/db/schema.ts against the live database.
# Read-only: it queries information_schema and writes nothing.

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      strict:
        description: 'Also fail on database columns the schema does not declare'
        required: false
        default: 'false'
        type: boolean
  pull_request:
    paths:
      - 'src/db/schema.ts'
      - 'supabase/migrations/**'

permissions:
  contents: read

jobs:
  drift:
    name: Compare schema to database
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Check for drift
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL repo secret not set — skipping."
            echo "Set it to have this check run against the live database."
            exit 0
          fi
          ARGS=""
          if [ "${{ inputs.strict }}" = "true" ]; then ARGS="--strict"; fi
          node scripts/check-schema-drift.mjs $ARGS | tee "$GITHUB_STEP_SUMMARY"
