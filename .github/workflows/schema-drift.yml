name: Schema Drift Check

# Compares src/db/schema.ts against the live database.
#
# This exists because the disagreement between them was found the expensive
# way: on 2026-08-15, 750 of 982 scheduled job runs were failing — 76% — and
# had been for months. Nothing surfaced it, because Drizzle's second argument
# is the *physical* column name, so `integer('userId')` against a `user_id`
# column type-checks perfectly and fails only against a real database. Neither
# `pnpm check` nor the test suite can see it.
#
# Read-only: it queries information_schema and writes nothing.

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      strict:
        description: 'Also fail on database columns the schema does not declare'
        required: false
        default: 'false'
        type: boolean
  pull_request:
    paths:
      - 'src/db/schema.ts'
      - 'supabase/migrations/**'

permissions:
  contents: read

jobs:
  drift:
    name: Compare schema to database
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Install pg
        run: npm install --no-save pg@8

      - name: Check for drift
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # check-schema-drift.mjs reports drift through its exit code, and it is
          # piped into tee. Without pipefail the step takes tee's status — always
          # 0 — so drift would report green. Keep this line.
          set -o pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL repo secret not set — skipping."
            echo "Set it to have this check run against the live database."
            exit 0
          fi
          ARGS=""
          if [ "${{ inputs.strict }}" = "true" ]; then ARGS="--strict"; fi
          node scripts/check-schema-drift.mjs $ARGS | tee "$GITHUB_STEP_SUMMARY"
