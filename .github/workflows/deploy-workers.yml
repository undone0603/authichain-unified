name: Deploy Workers (workers/*)

# Deploys the 12 standalone workers under `workers/<name>/` that are
# DEPLOYED on Cloudflare per the Phase 0 inventory
# (docs/superpowers/plans/worker-status-2026-04-27.md).
#
# This is separate from `deploy-cloudflare.yml` which deploys the root
# worker (`worker/index.ts`) plus the static frontend.
#
# CLOUDFLARE_API_TOKEN must have these scopes:
#   - Account · Workers Scripts: Edit
# Same token used by deploy-cloudflare.yml is fine.

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:
    inputs:
      worker:
        description: 'Specific worker dir to deploy (e.g. authichain-api). Leave blank for all.'
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy ${{ matrix.worker }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker:
          - authichain-api
          - authichain-api-gateway
          - authichain-automation
          - authichain-com
          - authichain-dashboard
          - govchain-us
          - qron-automation
          - qron-image-gen
          - qron-outreach
          - qron-space
          - resend-relay
          - strainchain-io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
              run: pnpm install --no-frozen-lockfile
        working-directory: workers/${{ matrix.worker }}

      - name: Deploy ${{ matrix.worker }}
        if: inputs.worker == '' || inputs.worker == matrix.worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/${{ matrix.worker }}
