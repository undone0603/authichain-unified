name: Deploy Workers (workers/*)
on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - ".github/workflows/deploy-workers.yml"
  workflow_dispatch:
    inputs:
      worker:
        description: "Specific worker dir to deploy (e.g. authichain-api). Leave blank for all."
        required: false
        type: string
permissions:
  contents: read
  id-token: write
  deployments: write
jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_CONFIG: .gitleaks.toml

  deploy:
    runs-on: ubuntu-latest
    needs: secret-scan
    strategy:
      fail-fast: false
      matrix:
        worker:
          - authichain-api
          - authichain-api-gateway
          - authichain-automation
          - authichain-com
          - authichain-dashboard
          - qron-automation
          - qron-image-gen
          - qron-outreach
          - qron-space
          - resend-relay
          - strainchain-io
          - govchain-us
          - bitcoin-auth
          - outreach-queue
          - ai-classification
          - analytics
          - auth
          - authichain-autopilot
          - authichain-chain-data
          - authichain-gateway
          - authichain-license-issuer
          - authichain-qron-provenance
          - authichain-scan-validate
          - authichain-telegram
          - authichain-verify-worker
          - stripe-webhook
          - authichain-openclaw
          - authichain-agentz
          - authichain-infra
          - authichain-outreach-engine
          - blockchain
          - chipchain-io
          - dpp-fulfillment
          - fanchain-io
          - glowchain-io
          - gs1-resolver
          - harvestchain-io
          - luxechain-io
          - partchain-io
          - provenchain-io
          - rxchain-io
          - threadchain-io
          - watchchain-io
          - passport-demo
          - qfs-adapter
          - authichain-bridge
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "10.28.2"
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0
      - name: Set up Docker (Cloudflare Containers)
        if: |
          matrix.worker == 'authichain-agentz' &&
          env.CLOUDFLARE_ACCOUNT_ID != '' &&
          (github.event.inputs.worker == '' || github.event.inputs.worker == matrix.worker)
        uses: docker/setup-buildx-action@v3

      - name: Deploy Worker
        if: |
          env.CLOUDFLARE_ACCOUNT_ID != '' && env.COMPATIBILITY_DATE != '' &&
          (github.event.inputs.worker == '' || github.event.inputs.worker == matrix.worker)
        run: npx wrangler deploy --minify --config wrangler.toml
        working-directory: workers/${{ matrix.worker }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMPATIBILITY_DATE: "2026-06-29"

      - name: Bind Stripe secret on authichain-com
        if: |
          matrix.worker == 'authichain-com' &&
          env.CLOUDFLARE_ACCOUNT_ID != '' &&
          (github.event.inputs.worker == '' || github.event.inputs.worker == 'authichain-com')
        working-directory: workers/authichain-com
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${STRIPE_SECRET_KEY:-}" ]; then
            echo "::error::GitHub secret STRIPE_SECRET_KEY is empty — checkout will 500"
            exit 1
          fi
          printf '%s' "$STRIPE_SECRET_KEY" | npx wrangler secret put STRIPE_SECRET_KEY --name authichain-com
          if [ -n "${STRIPE_PRICE_ID:-}" ]; then
            printf '%s' "$STRIPE_PRICE_ID" | npx wrangler secret put STRIPE_PRICE_ID --name authichain-com
          fi
          echo "bound STRIPE_SECRET_KEY on authichain-com from GitHub secrets"
