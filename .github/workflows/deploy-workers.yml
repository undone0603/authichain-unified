name: Deploy Workers (workers/*)
on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:
    inputs:
      worker:
        description: 'Specific worker dir to deploy (e.g. authichain-api). Leave blank for all.'
        required: false
        type: string
permissions:
  contents: read
  id-token: write
  deployments: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  deploy:
    name: Deploy ${{ matrix.worker }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker:
          # authichain cluster
          - authichain-api
          - authichain-api-gateway
          - authichain-automation
          - authichain-autopilot
          - authichain-bridge
          - authichain-chain-data
          - authichain-com
          - authichain-dashboard
          - authichain-gateway
          - authichain-license-issuer
          - authichain-qron-provenance
          - authichain-scan-validate
          - authichain-telegram
          - authichain-verify-worker
          # qron cluster
          - qron-automation
          - qron-image-gen
          - qron-outreach
          - qron-space
        # govchain
        - govchain-us
        # shared infra
        - bitcoin-auth
        - outreach-queue
        - resend-relay
        - strainchain-io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: '10.28.2'
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: workers/${{ matrix.worker }}
      - name: Deploy ${{ matrix.worker }}
        if: inputs.worker == '' || inputs.worker == matrix.worker
        run: npx wrangler deploy --minify
        working-directory: workers/${{ matrix.worker }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
