name: Deploy Workers (workers/*)
on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - ".github/workflows/deploy-workers.yml"
  workflow_dispatch:
    inputs:
      worker:
        description: "Specific worker dir to deploy (e.g. authichain-api). Leave blank for all."
        required: false
        type: string
permissions:
  contents: read
  id-token: write
  deployments: write
jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_CONFIG: .gitleaks.toml

  deploy:
    name: Deploy ${{ matrix.worker }}
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        worker:
          - authichain-api
          - authichain-api-gateway
          - authichain-automation
          - authichain-com
          - authichain-dashboard
          - qron-automation
          - qron-image-gen
          - qron-outreach
          - qron-space
          - resend-relay
          - strainchain-io
          - govchain-us
          - bitcoin-auth
          - outreach-queue
          - ai-classification
          - analytics
          - auth
          - authichain-autopilot
          - authichain-chain-data
          - authichain-gateway
          - authichain-license-issuer
          - authichain-qron-provenance
          - authichain-scan-validate
          - authichain-telegram
          - authichain-verify-worker
          - stripe-webhook
          - authichain-openclaw
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "10.28.2"
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0
      - name: Deploy Worker
        if: env.CLOUDFLARE_ACCOUNT_ID != '' && env.COMPATIBILITY_DATE != ''
        run: npx wrangler deploy --minify --config wrangler.toml
        working-directory: workers/${{ matrix.worker }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMPATIBILITY_DATE: "2026-06-29"
