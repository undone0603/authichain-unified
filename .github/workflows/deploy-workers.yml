name: Deploy Workers (workers/*)
on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - ".github/workflows/deploy-workers.yml"
  workflow_dispatch:
    inputs:
      worker:
        description: "Specific worker dir to deploy (e.g. authichain-api). Leave blank for all."
        required: false
        type: string
permissions:
  contents: read
  id-token: write
  deployments: write
jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_CONFIG: .gitleaks.toml

  deploy:
    needs: secret-scan
    uses: ./.github/workflows/reusable-deploy.yml
    strategy:
      fail-fast: false
      matrix:
        worker:
          - authichain-api
          - authichain-api-gateway
          - authichain-automation
          - authichain-com
          - authichain-dashboard
          - qron-automation
          - qron-image-gen
          - qron-outreach
          - qron-space
          - resend-relay
          - strainchain-io
          - govchain-us
          - bitcoin-auth
          - outreach-queue
          - ai-classification
          - analytics
          - auth
          - authichain-autopilot
          - authichain-chain-data
          - authichain-gateway
          - authichain-license-issuer
          - authichain-qron-provenance
          - authichain-scan-validate
          - authichain-telegram
          - authichain-verify-worker
          - stripe-webhook
          - authichain-openclaw
    with:
      environment: production
      deploy-command: |
        npx wrangler deploy --minify --config wrangler.toml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
