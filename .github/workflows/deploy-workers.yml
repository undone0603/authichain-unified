name: Deploy Workers (workers/*)
on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - ".github/workflows/deploy-workers.yml"
  workflow_dispatch:
    inputs:
      worker:
        description: "Specific worker dir to deploy (e.g. authichain-api). Leave blank for all."
        required: false
        type: string
      deploy_agentz_containers:
        description: "Deploy authichain-agentz (Cloudflare Containers / Workers Paid). Default off — $0 path uses Tunnel and leaves Containers undeployed."
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
  deployments: write
jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Scan the tree being deployed
        run: |
          # Tree scan only. Removed keys in old commits were failing a
          # history scan and skipping every deploy.
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o gitleaks.tgz
          tar --no-same-owner -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose

  # GitHub evaluates jobs.<id>.if BEFORE strategy expands, so a job-level
  # `if: matrix.worker != 'authichain-agentz'` fails the entire workflow graph
  # (Unrecognized named-value: 'matrix', 0 jobs, "This workflow graph cannot
  # be shown."). Build the list here instead: $0 default omits agentz;
  # workflow_dispatch + deploy_agentz_containers=true appends it (Workers Paid).
  #
  # This job now also runs on a plain push (CLOUDFLARE_DEPLOY_ENABLED off,
  # not workflow_dispatch) to narrow `workers` down to whichever
  # AUTO_DEPLOY_ALLOWLIST worker(s) actually changed -- or to `[]` if none
  # did, or if the diff step below hits any error (a shallow-clone edge
  # case, a force-push, anything). An allow-listed worker earns its place by
  # having its own local test suite covering an external judge's checks
  # (gs1-resolver's is workers/gs1-resolver/src/conformance.test.ts,
  # mirroring GS1's hosted suite) -- not just CI type/lint, which every
  # worker already has. `deploy` below consumes whatever this outputs
  # unchanged: a full list (CLOUDFLARE_DEPLOY_ENABLED or workflow_dispatch),
  # a narrowed one-or-few-worker list (auto-deploy), or an empty one (a
  # plain push touching no allow-listed worker, or nothing to narrow) --
  # so no per-step gating anywhere below this job needs to change, and no
  # *other* worker's bind step can ever run on the auto-deploy path, because
  # no other worker is ever in that path's matrix.
  deploy-matrix:
    name: Build worker matrix
    runs-on: ubuntu-latest
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    timeout-minutes: 5
    outputs:
      workers: ${{ steps.build.outputs.workers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select workers ($0 default; AgentZ opt-in; auto-deploy narrows on a plain push)
        id: build
        env:
          DEPLOY_AGENTZ: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_agentz_containers == 'true' }}
          CLOUDFLARE_DEPLOY_ENABLED: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Keep this list aligned with workers/* that should auto-deploy on
          # main. Do not add authichain-agentz — Cloudflare Containers stay
          # opt-in so a push never enables Workers Paid.
          workers=$(jq -nc '[
            "authichain-api",
            "authichain-api-gateway",
            "authichain-automation",
            "authichain-com",
            "authichain-dashboard",
            "qron-automation",
            "qron-image-gen",
            "qron-outreach",
            "qron-space",
            "resend-relay",
            "strainchain-io",
            "govchain-us",
            "bitcoin-auth",
            "outreach-queue",
            "ai-classification",
            "analytics",
            "auth",
            "authichain-autopilot",
            "authichain-chain-data",
            "authichain-gateway",
            "authichain-license-issuer",
            "authichain-qron-provenance",
            "authichain-scan-validate",
            "authichain-telegram",
            "authichain-verify-worker",
            "stripe-webhook",
            "authichain-openclaw",
            "authichain-infra",
            "authichain-outreach-engine",
            "blockchain",
            "chipchain-io",
            "dpp-fulfillment",
            "fanchain-io",
            "glowchain-io",
            "gs1-resolver",
            "harvestchain-io",
            "luxechain-io",
            "partchain-io",
            "provenchain-io",
            "rxchain-io",
            "threadchain-io",
            "watchchain-io",
            "qfs-adapter",
            "authichain-bridge"
          ]')
          if [ "${DEPLOY_AGENTZ}" = "true" ]; then
            workers=$(jq -nc --argjson w "${workers}" '$w + ["authichain-agentz"]')
          fi

          if [ "${CLOUDFLARE_DEPLOY_ENABLED}" = "true" ] || [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "workers=${workers}" >> "${GITHUB_OUTPUT}"
            if [ "${DEPLOY_AGENTZ}" = "true" ]; then
              echo "deploy matrix (agentz opt-in): ${workers}"
            else
              echo "deploy matrix (\$0 default, agentz omitted): ${workers}"
            fi
            exit 0
          fi

          # Auto-deploy path: CLOUDFLARE_DEPLOY_ENABLED is off and this
          # isn't a workflow_dispatch, so only an explicitly allow-listed
          # worker (see the job comment above and
          # scripts/ci/select-autodeploy-workers.mjs, which owns the
          # allowlist and is unit-tested) may deploy, and only if it
          # actually changed in this push. That script never throws -- a
          # shallow clone missing PUSH_BEFORE, a force-push, anything falls
          # back to an empty matrix, "nothing auto-deploys this round",
          # never a job failure that could be confused with a real deploy
          # problem -- so no `|| true` / `2>/dev/null` fallback is needed
          # here.
          eligible=$(node scripts/ci/select-autodeploy-workers.mjs)
          echo "workers=${eligible}" >> "${GITHUB_OUTPUT}"
          echo "deploy matrix (auto-deploy, narrowed to changed allow-listed workers): ${eligible}"

  deploy:
    runs-on: ubuntu-latest
    needs: [secret-scan, deploy-matrix]
    # GitHub fails the whole workflow when `strategy.matrix` expands to an
    # empty array, even if the job is then shown as skipped. The selector
    # prints `[]` on a plain push that changed no allow-listed worker
    # (CLOUDFLARE_DEPLOY_ENABLED stays off). Skip this job before strategy
    # expansion in that case. A non-empty list still deploys.
    if: ${{ needs.deploy-matrix.outputs.workers != '[]' && needs.deploy-matrix.outputs.workers != '' }}
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.deploy-matrix.outputs.workers) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "10.28.2"
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      # Cloudflare Containers (wrangler.jsonc "containers") need a Docker
      # builder on the runner. Without Buildx, authichain-agentz fails mid-deploy
      # after the Worker script is created (script exists; image/build fails).
      - name: Detect Containers config
        id: containers
        working-directory: workers/${{ matrix.worker }}
        if: |
          github.event.inputs.worker == '' || github.event.inputs.worker == matrix.worker
        run: |
          set -euo pipefail
          NEEDS=false
          for f in wrangler.jsonc wrangler.json wrangler.toml; do
            if [ -f "$f" ] && grep -qE '"containers"|^\[\[containers\]\]' "$f"; then
              NEEDS=true
              break
            fi
          done
          echo "needs=$NEEDS" >> "$GITHUB_OUTPUT"
          echo "containers needed for ${{ matrix.worker }}:$NEEDS"

      - name: Set up Docker Buildx
        if: |
          steps.containers.outputs.needs == 'true' &&
          (github.event.inputs.worker == '' || github.event.inputs.worker == matrix.worker)
        uses: docker/setup-buildx-action@v4

      - name: Docker info (Containers workers)
        if: |
          steps.containers.outputs.needs == 'true' &&
          (github.event.inputs.worker == '' || github.event.inputs.worker == matrix.worker)
        run: |
          set -euo pipefail
          docker version
          docker buildx version
          docker buildx ls

      # Promote path. Cloudflare Workers Builds on PRs for qron-space and
      # govchain-us runs `npx wrangler versions upload`, which stores a new
      # version but leaves custom-domain traffic on the last `wrangler deploy`.
      # Email-capture pricing HTML reaches qron.space / govchain.us / strainchain.io
      # / authichain.com only after this step on main.
      - name: Deploy Worker
        if: |
          env.CLOUDFLARE_ACCOUNT_ID != '' && env.COMPATIBILITY_DATE != '' &&
          (github.event.inputs.worker == '' || github.event.inputs.worker == matrix.worker)
        run: |
          if [ -f wrangler.jsonc ]; then
            CONFIG=wrangler.jsonc
          elif [ -f wrangler.json ]; then
            CONFIG=wrangler.json
          else
            CONFIG=wrangler.toml
          fi
          npx wrangler deploy --minify --config "$CONFIG"
        working-directory: workers/${{ matrix.worker }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMPATIBILITY_DATE: "2026-06-29"

      - name: Bind agentz secrets
        if: |
          matrix.worker == 'authichain-agentz' &&
          env.CLOUDFLARE_ACCOUNT_ID != '' &&
          (github.event.inputs.worker == '' || github.event.inputs.worker == 'authichain-agentz')
        working-directory: workers/authichain-agentz
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in AGENT_SECRET SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::GitHub secret $name is empty — cannot bind on authichain-agentz"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          printf '%s' "$AGENT_SECRET" | npx wrangler secret put AGENT_SECRET --name authichain-agentz
          printf '%s' "$SUPABASE_URL" | npx wrangler secret put SUPABASE_URL --name authichain-agentz
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --name authichain-agentz
          echo "bound AGENT_SECRET, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY on authichain-agentz"

      # Command Center reads live data. Each secret is optional: a missing one
      # shows "not connected" on the page instead of failing the deploy.
      - name: Bind command-center secrets
        if: |
          matrix.worker == 'authichain-dashboard' &&
          env.CLOUDFLARE_ACCOUNT_ID != '' &&
          (github.event.inputs.worker == '' || github.event.inputs.worker == 'authichain-dashboard')
        working-directory: workers/authichain-dashboard
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_READ_KEY: ${{ secrets.STRIPE_READ_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          DASHBOARD_GITHUB_TOKEN: ${{ secrets.DASHBOARD_GITHUB_TOKEN }}
          FOUNDER_EMAILS: ${{ secrets.FOUNDER_EMAILS }}
        run: |
          set -euo pipefail
          bind() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then echo "skip $name (GitHub secret not set)"; return; fi
            printf '%s' "$value" | npx wrangler secret put "$name" --name authichain-dashboard >/dev/null
            echo "bound $name"
          }
          bind SUPABASE_URL "${SUPABASE_URL:-}"
          bind SUPABASE_SERVICE_ROLE_KEY "${SUPABASE_SERVICE_ROLE_KEY:-}"
          # Prefer a restricted read key; fall back to the existing key so the
          # money panel works with no extra setup (the page only issues GETs).
          bind STRIPE_READ_KEY "${STRIPE_READ_KEY:-${STRIPE_SECRET_KEY:-}}"
          bind GITHUB_TOKEN "${DASHBOARD_GITHUB_TOKEN:-}"
          # Founder list: the secret if set, else .github/autonomy.json.
          founders="${FOUNDER_EMAILS:-$(jq -r '.founder_emails // [] | join(",")' ../../.github/autonomy.json)}"
          bind FOUNDER_EMAILS "$founders"

      - name: Bind claw AGENTZ_* secrets
        if: |
          matrix.worker == 'authichain-openclaw' &&
          env.CLOUDFLARE_ACCOUNT_ID != '' &&
          (github.event.inputs.worker == '' || github.event.inputs.worker == 'authichain-openclaw')
        working-directory: workers/authichain-openclaw
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
        run: |
          set -euo pipefail
          # AGENTZ_API_URL is secret-only (not [vars]; a plaintext var makes put fail 10053).
          # Empty AGENT_SECRET: warn + skip AGENTZ_API_KEY ($0 path). Do not
          # continue-on-error this step — a real wrangler failure must still fail.
          bash ../../scripts/ci/bind-openclaw-agentz-secrets.sh

      - name: Bind Stripe secret on authichain-com
        if: |
          matrix.worker == 'authichain-com' &&
          env.CLOUDFLARE_ACCOUNT_ID != '' &&
          (github.event.inputs.worker == '' || github.event.inputs.worker == 'authichain-com')
        working-directory: workers/authichain-com
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${STRIPE_SECRET_KEY:-}" ]; then
            echo "::error::GitHub secret STRIPE_SECRET_KEY is empty — checkout will 500"
            exit 1
          fi
          printf '%s' "$STRIPE_SECRET_KEY" | npx wrangler secret put STRIPE_SECRET_KEY --name authichain-com
          if [ -n "${STRIPE_PRICE_ID:-}" ]; then
            printf '%s' "$STRIPE_PRICE_ID" | npx wrangler secret put STRIPE_PRICE_ID --name authichain-com
          fi
          echo "bound STRIPE_SECRET_KEY on authichain-com from GitHub secrets"

      # ISSUE_SECRET is never generated or rotated here -- only propagated
      # from a value the owner set by hand (gh secret set
      # GS1_RESOLVER_ISSUE_SECRET). docs/OPERATING_CHARTER.md: secrets
      # rotation always waits for the owner; this step performs no rotation,
      # only a mechanical bind of an existing value, same as the Stripe/X402
      # binds above. ISSUE_SECRET is currently set directly in the Cloudflare
      # dashboard (rotated 2026-09-30) -- POST /issue works today against
      # that value regardless of whether this step ever runs. Setting
      # GS1_RESOLVER_ISSUE_SECRET here will OVERWRITE that dashboard value on
      # the next deploy -- once set, rotate it with `gh secret set`, not in
      # the dashboard, or the two will drift.
      - name: Bind ISSUE_SECRET on gs1-resolver
        if: |
          matrix.worker == 'gs1-resolver' &&
          env.CLOUDFLARE_ACCOUNT_ID != '' &&
          (github.event.inputs.worker == '' || github.event.inputs.worker == 'gs1-resolver')
        working-directory: workers/gs1-resolver
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ISSUE_SECRET: ${{ secrets.GS1_RESOLVER_ISSUE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${ISSUE_SECRET:-}" ]; then
            echo "skip ISSUE_SECRET (GitHub secret GS1_RESOLVER_ISSUE_SECRET not set -- dashboard-set value stays in place)"
            exit 0
          fi
          printf '%s' "$ISSUE_SECRET" | npx wrangler secret put ISSUE_SECRET --name gs1-resolver
          echo "bound ISSUE_SECRET on gs1-resolver"

      # Same values as bind-x402-secrets.yml / deploy-authichain-com.yml.
      # Sisters 402 without this secret; /settle stays closed (dead listing).
      # Do not invent a facilitator URL. Do not print values.
      - name: Bind X402_PAY_TO + X402_FACILITATOR_URL + X402_USDC_ASSET
        if: |
          (matrix.worker == 'qron-space' ||
           matrix.worker == 'strainchain-io' ||
           matrix.worker == 'govchain-us') &&
          env.CLOUDFLARE_ACCOUNT_ID != '' &&
          (github.event.inputs.worker == '' || github.event.inputs.worker == matrix.worker)
        working-directory: workers/${{ matrix.worker }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          PAY_TO='0x5db511706FB6317cd23A7655F67450c5AC6e6AA2' # pragma: allowlist secret
          FACILITATOR='https://facilitator.payai.network'
          USDC_ASSET='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          NAME='${{ matrix.worker }}'
          printf '%s' "$PAY_TO" | npx wrangler secret put X402_PAY_TO --name "$NAME"
          printf '%s' "$FACILITATOR" | npx wrangler secret put X402_FACILITATOR_URL --name "$NAME"
          printf '%s' "$USDC_ASSET" | npx wrangler secret put X402_USDC_ASSET --name "$NAME"
          echo "bound X402_PAY_TO + X402_FACILITATOR_URL + X402_USDC_ASSET on ${NAME} (values not logged)"
