name: Deploy Workers (workers/*)
on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - ".github/workflows/deploy-workers.yml"
  workflow_dispatch:
    inputs:
      worker:
        description: "Specific worker dir to deploy (e.g. authichain-api). Leave blank for all."
        required: false
        type: string
permissions:
  contents: read
  id-token: write
  deployments: write
jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_CONFIG: .gitleaks.toml

  deploy:
    name: Deploy ${{ matrix.worker }}
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        worker:
          - authichain-api
          - authichain-api-gateway
          - authichain-automation
          - authichain-com
          - authichain-dashboard
          - qron-automation
          - qron-image-gen
          - qron-outreach
          - qron-space
          - resend-relay
          - strainchain-io
          - govchain-us
          - bitcoin-auth
          - outreach-queue
          - ai-classification
          - analytics
          - auth
          - authichain-autopilot
          - authichain-chain-data
          - authichain-gateway
          - authichain-license-issuer
          - authichain-qron-provenance
          - authichain-scan-validate
          - authichain-telegram
          - authichain-verify-worker
          - stripe-webhook
          - authichain-openclaw
          - authichain-bridge
          - authichain-infra
          - authichain-outreach-engine
          - blockchain
          - chipchain-io
          - dpp-fulfillment
          - fanchain-io
          - glowchain-io
          - gs1-resolver
          - harvestchain-io
          - luxechain-io
          - partchain-io
          - provenchain-io
          - rxchain-io
          - threadchain-io
          - watchchain-io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check deploy gate
        id: gate
        # Scaffolded workers that are not yet production-ready have a
        # .skip-deploy marker file. Presence of that file causes this matrix
        # leg to be a no-op — it passes CI (so we don't get red Xs for workers
        # that haven't been formally adopted yet) but does NOT push code to
        # Cloudflare. Remove the file from a worker's directory when you've
        # decided to DEPLOY-NOW and have set all required secrets.
        run: |
          if [ -f "workers/${{ matrix.worker }}/.skip-deploy" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️  workers/${{ matrix.worker }} has .skip-deploy — skipping deployment"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup pnpm
        if: steps.gate.outputs.skip == 'false'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "10.28.2"
      - name: Setup Node 22
        if: steps.gate.outputs.skip == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        if: steps.gate.outputs.skip == 'false'
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0
      - name: Deploy Worker
        if: steps.gate.outputs.skip == 'false' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.COMPATIBILITY_DATE != ''
        run: npx wrangler deploy --minify --config wrangler.toml
        working-directory: workers/${{ matrix.worker }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMPATIBILITY_DATE: "2026-06-29"
