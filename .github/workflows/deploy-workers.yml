name: Deploy Workers (workers/*)
on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:
    inputs:
      worker:
        description: 'Specific worker dir to deploy (e.g. authichain-api). Leave blank for all.'
        required: false
        type: string
permissions:
  contents: read
  id-token: write
  deployments: write
jobs:
  deploy:
    name: Deploy ${{ matrix.worker }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        worker:
          - authichain-api
          - authichain-api-gateway
          - authichain-automation
          - authichain-com
          - authichain-dashboard
          - qron-automation
          - qron-image-gen
          - qron-outreach
          - qron-space
          - resend-relay
          - strainchain-io
          - govchain-us
          - bitcoin-auth
          - outreach-queue
          - ai-classification
          - analytics
          - auth
          - authichain-autopilot
          - authichain-bridge
          - authichain-chain-data
          - authichain-license-issuer
          - authichain-qron-provenance
          - authichain-scan-validate
          - authichain-telegram
          - stripe-webhook
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: '10.28.2'
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy Worker
        if: env.CLOUDFLARE_ACCOUNT_ID != '' && env.COMPATIBILITY_DATE != ''
        run: npx wrangler deploy --minify --config wrangler.toml
        working-directory: workers/${{ matrix.worker }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMPATIBILITY_DATE: '2026-06-29'
