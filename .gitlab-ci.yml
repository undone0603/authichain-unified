# GitLab CI for authichain-unified (runs while GitHub Actions is billing-locked).
# Budget rule: GitLab Free = 400 shared-runner minutes/month, so the monorepo-wide
# suites (lint, workspace check, tests, build) are opt-in (manual, non-blocking).
# Automatic: scheduled launch checks (seconds each). See docs/operations/GITLAB_LAUNCH.md.
image: node:22-alpine

stages:
  - validate
  - test
  - build
  - verify

variables:
  PNPM_VERSION: "10.28.2"

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

before_script:
  - corepack enable
  - corepack prepare pnpm@${PNPM_VERSION} --activate
  - pnpm config set store-dir .pnpm-store
  - pnpm install --frozen-lockfile --prefer-offline

# Heavy monorepo suites: one click in the pipeline view, never block the pipeline.
.heavy:
  interruptible: true
  rules:
    # A weekly schedule sets RUN_HEAVY=true so the launch CI gate gets fresh
    # evidence without a human pressing play. Daily schedules leave it unset to
    # protect the free-minute budget.
    - if: '$RUN_HEAVY == "true" && $CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: manual
      allow_failure: true

lint:
  extends: .heavy
  stage: validate
  script:
    - pnpm run lint

workspace_check:
  extends: .heavy
  stage: validate
  script:
    - pnpm run check

tests:
  extends: .heavy
  stage: test
  needs: []
  script:
    - pnpm run test

production_build:
  extends: .heavy
  stage: build
  needs: []
  script:
    - pnpm run build

.launch_check:
  stage: verify
  image: node:22-alpine
  needs: []
  interruptible: false
  before_script: []
  cache: []
  variables:
    GIT_DEPTH: "1"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
      when: manual
      allow_failure: true

launch_gate:
  extends: .launch_check
  script:
    - node scripts/launch/honest-launch-gate.mjs

production_health:
  extends: .launch_check
  script:
    - AUTHICHAIN_ORIGIN=https://authichain.com node scripts/cloudflare-production-health.mjs --run

# Autonomous launch gates (tracking: work item #1987). Decides every gate from
# evidence with no human approval. FAIL CLOSED. Opens/closes one issue per
# failing gate when CI/CD variable GITLAB_API_TOKEN (masked, project access
# token, scope api) exists; otherwise it only writes the report artifact.
# Stop everything with kill_switch in config/launch-gates.json.
launch_gates:
  extends: .launch_check
  script:
    - node --test scripts/autonomy/launch-gates.test.mjs
    - node scripts/autonomy/launch-gates.mjs
  artifacts:
    when: always
    paths:
      - launch-gates-report.json
    expire_in: 14 days
