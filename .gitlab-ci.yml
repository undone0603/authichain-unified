image: node:22-alpine
stages:
  - setup
  - validate
  - test
  - build
  - verify
  - deploy
variables:
  PNPM_VERSION: 9.0.0
cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store
before_script:
  - corepack enable
  - corepack prepare pnpm@${PNPM_VERSION} --activate
  - pnpm config set store-dir .pnpm-store
  - pnpm install --frozen-lockfile --prefer-offline
install_dependencies:
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_PIPELINE_SOURCE != "merge_request_event"'
  stage: setup
  script:
    - echo "dependencies installed in before_script; pnpm store cache primed"
typecheck_and_lint:
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_PIPELINE_SOURCE != "merge_request_event"'
  stage: validate
  needs: ["install_dependencies"]
  script:
    - pnpm run lint
    - pnpm run typecheck
tests_shard_1:
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_PIPELINE_SOURCE != "merge_request_event"'
  stage: test
  needs: ["install_dependencies"]
  script:
    - pnpm run test --shard=1/2
tests_shard_2:
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_PIPELINE_SOURCE != "merge_request_event"'
  stage: test
  needs: ["install_dependencies"]
  script:
    - pnpm run test --shard=2/2
production_build:
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_PIPELINE_SOURCE != "merge_request_event"'
  stage: build
  needs: ["typecheck_and_lint", "tests_shard_1", "tests_shard_2"]
  script:
    - pnpm run build
  artifacts:
    paths:
      - .next/
      - dist/
    exclude:
      - .next/cache/**/*
    expire_in: 1 day
main_quality_gate:
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_PIPELINE_SOURCE != "merge_request_event"'
  stage: verify
  needs: ["production_build"]
  script:
    - echo "Running quality gate checks..."
    - pnpm run quality-gate

# Scheduled launch checks: read-only, no secrets, Node built-ins only.
# Ported from the GitHub honest-launch-gate and cloudflare-production-health
# workflows. They run on pipeline schedules; the heavy jobs above are skipped
# on schedule runs to protect the free-tier compute-minute budget. On other
# pipelines they appear as optional manual jobs (play button, never blocking).
.launch_check:
  stage: verify
  image: node:22-alpine
  needs: []
  interruptible: false
  before_script: []
  cache: []
  variables:
    GIT_DEPTH: "1"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
      when: manual
      allow_failure: true

launch_gate:
  extends: .launch_check
  script:
    - node scripts/launch/honest-launch-gate.mjs

production_health:
  extends: .launch_check
  script:
    - AUTHICHAIN_ORIGIN=https://authichain.com node scripts/cloudflare-production-health.mjs --run

# -----------------------------------------------------------------------------
# Cloudflare Workers deploy (GitLab-side launch).
# INERT until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist as masked,
# protected CI/CD variables. Ports only the code-deploy steps of the GitHub
# workflows deploy-cloudflare.yml and deploy-authichain-com.yml. The secret-
# binding steps (Stripe, x402 pay-to) are intentionally NOT ported: they stay
# owner-controlled. Runbook: docs/operations/GITLAB_LAUNCH.md
# -----------------------------------------------------------------------------
secret_scan:
  stage: validate
  image: node:22-alpine
  needs: []
  interruptible: false
  before_script: []
  cache: []
  variables:
    GIT_DEPTH: "1"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(push|web)$/ && $CLOUDFLARE_API_TOKEN && $CLOUDFLARE_ACCOUNT_ID'
  script:
    - apk add --no-cache curl tar
    - curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o gitleaks.tgz
    - tar --no-same-owner -xzf gitleaks.tgz gitleaks
    - ./gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose

.deploy_worker:
  stage: deploy
  image: node:22-alpine
  needs: ["secret_scan"]
  interruptible: false
  resource_group: cloudflare-deploy
  timeout: 20m

deploy_manufacturer_status:
  extends: .deploy_worker
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(push|web)$/ && $CLOUDFLARE_API_TOKEN && $CLOUDFLARE_ACCOUNT_ID'
  script:
    - cd workers/manufacturer-status
    - npx wrangler deploy --minify

deploy_authichain_com:
  extends: .deploy_worker
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web" && $CLOUDFLARE_API_TOKEN && $CLOUDFLARE_ACCOUNT_ID'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push" && $CLOUDFLARE_API_TOKEN && $CLOUDFLARE_ACCOUNT_ID'
      changes:
        - workers/authichain-com/**/*
        - src/lib/plans.ts
        - src/lib/checkout-gate.ts
        - content/microsites/**/*
        - scripts/sync-microsite-packs.mjs
  script:
    - node scripts/sync-microsite-packs.mjs
    - cd workers/authichain-com
    - npx wrangler deploy --minify --keep-vars --config wrangler.toml
