# GitLab CI for authichain-unified (runs while GitHub Actions is billing-locked).
#
# Budget rule: GitLab Free = 400 shared-runner minutes/month (the Ultimate trial
# ends 2026-11-20). Every job below is sized against that:
#   - Seconds each, no pnpm install: static_checks, secret_scan_gate.
#   - Automatic on merge requests (and non-default branches), and only when the
#     diff touches code paths: quality_gate (lint:ci + root Vitest suite +
#     node:test suites) and build_gate (next build).
#   - Opt-in, one click, never blocking: the monorepo-wide turbo suites
#     (lint, workspace_check, tests) and the launch checks.
# Kill switch: set the CI/CD variable GATE_OFF=1 and the automatic gates stop,
# with no commit. Weekly full run: add a pipeline schedule with GATE_SCHEDULE=full.
# Numbers and the reasoning: docs/operations/GITLAB_LAUNCH.md.
image: node:22-alpine

stages:
  - validate
  - test
  - build
  - verify
  - deploy

# One pipeline per push: the merge request pipeline when a merge request is
# open, the branch pipeline otherwise. Everything else (schedules, web, tags)
# behaves as before. A newer commit cancels an older pipeline's interruptible
# jobs, so a force-push does not keep spending minutes.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - when: always

variables:
  PNPM_VERSION: "10.28.2"
  # Same gitleaks version the GitHub workflow pins. The checksum is from the
  # release's own gitleaks_8.28.0_checksums.txt; bump both together.
  GITLEAKS_VERSION: "8.28.0"
  GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

before_script:
  - corepack enable
  - corepack prepare pnpm@${PNPM_VERSION} --activate
  - pnpm config set store-dir .pnpm-store
  - pnpm install --frozen-lockfile --prefer-offline

# Heavy monorepo suites: one click in the pipeline view, never block the pipeline.
.heavy:
  interruptible: true
  rules:
    # A weekly schedule sets RUN_HEAVY=true so the launch CI gate gets fresh
    # evidence without a human pressing play. Daily schedules leave it unset to
    # protect the free-minute budget.
    - if: '$RUN_HEAVY == "true" && $CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: manual
      allow_failure: true

# `pnpm run lint` never ends: the root `lint` script runs `_lint`, which runs
# `turbo lint --single-package`, and that task's command is the root `lint`
# script again. It forks until the runner kills it (an 8 GB box was out of memory
# after about 100 s), which is where "lint ran past 6 minutes" came from. lint:ci
# is what the GitHub workflow runs and takes about 50 s.
lint:
  extends: .heavy
  stage: validate
  script:
    - pnpm run lint:ci

workspace_check:
  extends: .heavy
  stage: validate
  script:
    - pnpm run check

tests:
  extends: .heavy
  stage: test
  needs: []
  script:
    - pnpm run test

production_build:
  extends: .heavy
  stage: build
  needs: []
  script:
    - pnpm run build

# -----------------------------------------------------------------------------
# Automatic quality gates (N-2). Run on merge requests and on non-default
# branches, never on default-branch pushes (a pull mirror does not trigger
# pipelines, and a post-merge run would spend minutes the weekly run covers).
#
# Paths that make a gate run. The Vitest scan list in vitest.config.ts is the
# source for the first block; .github/ is here because the autonomy tests read
# the workflow files and .github/autonomy.json.
# -----------------------------------------------------------------------------
.paths_quality: &paths_quality
  - api/**/*
  - apps/**/*
  - client/**/*
  - packages/**/*
  - protocol/**/*
  - scripts/**/*
  - server/**/*
  - shared/**/*
  - src/**/*
  - worker-app/**/*
  - workers/**/*
  - .github/**/*
  - package.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - vitest.config.ts
  - eslint.config.mjs
  - tsconfig*.json
  - .gitlab-ci.yml

# next build reads the app, the protocol code, shared libraries and workers
# (workers/_shared is imported by the app); docs-only and CI-only changes skip it.
.paths_build: &paths_build
  - src/**/*
  - protocol/**/*
  - workers/**/*
  - shared/**/*
  - public/**/*
  - content/**/*
  - next.config.js
  - package.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - tsconfig*.json
  - postcss.config.mjs
  - tailwind.config.ts

# Cheap gates: every merge request, non-default branch and manual run.
.rules_fast:
  rules:
    - if: '$GATE_OFF == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web" || ($CI_PIPELINE_SOURCE == "schedule" && $GATE_SCHEDULE == "full")'
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'

# Gates that install dependencies: only when the diff touches code paths.
.rules_quality:
  rules:
    - if: '$GATE_OFF == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *paths_quality
    - if: '$CI_PIPELINE_SOURCE == "web" || ($CI_PIPELINE_SOURCE == "schedule" && $GATE_SCHEDULE == "full")'
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      changes:
        paths: *paths_quality
        compare_to: 'refs/heads/main'

.rules_build:
  rules:
    - if: '$GATE_OFF == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *paths_build
    - if: '$CI_PIPELINE_SOURCE == "web" || ($CI_PIPELINE_SOURCE == "schedule" && $GATE_SCHEDULE == "full")'
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      changes:
        paths: *paths_build
        compare_to: 'refs/heads/main'

# node:22-bookworm, not alpine: the suites shell out to bash, git, curl and python.
# --ignore-scripts skips only what a CI runner has no use for (husky, the
# agent-browser native-binary download, the npm-version preinstall guard); the
# gates were measured with it. The global before_script above is left alone so
# the manual jobs behave as they did.
.pnpm_gate:
  image: node:22-bookworm
  needs: []
  interruptible: true
  variables:
    CI: "true"
    HUSKY: "0"
    NODE_OPTIONS: "--max-old-space-size=4096"
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

# Structural checks that need nothing but node and git (no install): the same
# three scripts .github/workflows/lint.yml runs. All pass on main today.
static_checks:
  extends: .rules_fast
  stage: validate
  needs: []
  interruptible: true
  before_script:
    - apk add --no-cache git
  cache: []
  variables:
    GIT_DEPTH: "1"
  script:
    - node scripts/check-workflow-cannot-fail.mjs
    - node scripts/ci/check-deploy-invariants.mjs
    - node scripts/check-wrangler-durable-objects.mjs

# Warning, not a failure: this check is red on main today. Two node:test files
# have no CI runner at all (workers/_shared/estate-qron-resolve.test.ts and
# workers/authichain-com/src/x402-health-route.test.ts). The check reads
# .github/workflows and package `test` scripts, so the fix belongs there (add the
# files to the lint.yml node:test step or to their workspace `test` script), not
# in this file. Delete allow_failure when that lands.
node_test_runner_coverage:
  extends: .rules_fast
  stage: validate
  needs: []
  interruptible: true
  allow_failure: true
  before_script:
    - apk add --no-cache git
  cache: []
  variables:
    GIT_DEPTH: "1"
  script:
    - node scripts/ci/check-node-test-runners.mjs

# gitleaks over the working tree, same invocation and config as secret_scan
# below, but with no Cloudflare variables needed and the download verified
# against the release checksum. Blocking: main scans clean (checked 2026-10-22).
secret_scan_gate:
  extends: .rules_fast
  stage: validate
  needs: []
  interruptible: true
  before_script:
    - apk add --no-cache curl tar
  cache: []
  variables:
    GIT_DEPTH: "1"
  script:
    - curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
    - echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
    - tar --no-same-owner -xzf gitleaks.tgz gitleaks
    - ./gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose

# The test, lint and type-check gate: what the GitHub lint.yml runs, minus
# Hardhat, plus `pnpm run check` (tsc --noEmit for worker/, the only workspace
# with a check script today; a few seconds). It runs every step and reports them
# all, because the install is the expensive part.
#
# Exit 77 = warning (allow_failure.exit_codes): scripts/__tests__/autonomy.test.ts
# fails on main because deploy-manufacturer-status.yml is not classified in
# .github/autonomy.json. Which lane it belongs in is the owner's call (that file
# is the autonomy switchboard), so the gate does not paper over it and does not
# go red for it either. Once the file is classified, this branch never fires;
# delete KNOWN_RED_TEST and the last step then.
quality_gate:
  extends:
    - .pnpm_gate
    - .rules_quality
  stage: test
  timeout: 25m
  variables:
    KNOWN_RED_TEST: scripts/__tests__/autonomy.test.ts
  allow_failure:
    exit_codes: 77
  script:
    - mkdir -p reports
    - |
      rc=0
      pnpm run lint:ci || rc=1
      pnpm run check || rc=1
      pnpm exec vitest run --exclude "$KNOWN_RED_TEST" --reporter=default --reporter=junit --outputFile.junit=reports/vitest-junit.xml || rc=1
      node --experimental-strip-types --test scripts/autonomy/*.test.mjs scripts/ci/*.test.mjs protocol/qfs/envelope.test.mjs scripts/lib/b2b-send-policy.test.ts worker-app/cron-dispatch.test.ts workers/authichain-verify-worker/src/protocol-verify.test.mjs workers/authichain-verify-worker/src/published-record.test.mjs || rc=1
      pnpm exec tsx --test protocol/qfs/envelope.test.mjs scripts/lib/b2b-send-policy.test.ts worker-app/cron-dispatch.test.ts workers/authichain-verify-worker/src/agent-d1-concurrency.node-test.mjs || rc=1
      if [ "$rc" -ne 0 ]; then exit 1; fi
      if ! pnpm exec vitest run "$KNOWN_RED_TEST" --reporter=default --reporter=junit --outputFile.junit=reports/vitest-known-red-junit.xml; then
        echo "WARNING: $KNOWN_RED_TEST is failing on main (known; see docs/execution/CI_STATUS.md). Reported as a warning, not a failure."
        exit 77
      fi
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - reports/vitest-junit.xml
        - reports/vitest-known-red-junit.xml

# next build. next.config.js sets typescript.ignoreBuildErrors, so this proves
# the app compiles and bundles, not that it type-checks. Calls next build
# directly rather than scripts/build-with-retry.sh: that wrapper retries three
# times, which triples the minutes a deterministic failure costs; one GitLab
# retry covers the next/font/google 404 flake it exists for.
build_gate:
  extends:
    - .pnpm_gate
    - .rules_build
  stage: build
  timeout: 25m
  retry:
    max: 1
    when: script_failure
  script:
    - pnpm exec next build --webpack

# -----------------------------------------------------------------------------
# Launch checks (read-only, seconds each).
# -----------------------------------------------------------------------------
.launch_check:
  stage: verify
  image: node:22-alpine
  needs: []
  interruptible: false
  before_script: []
  cache: []
  variables:
    GIT_DEPTH: "1"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
      when: manual
      allow_failure: true

# Autonomous launch gates (tracking: work item #1987). Decides every gate from
# evidence with no human approval. FAIL CLOSED. Opens/closes one issue per
# failing gate when CI/CD variable GITLAB_API_TOKEN (masked, project access
# token, scope api) exists; otherwise it only writes the report artifact.
# Stop everything with kill_switch in config/launch-gates.json.
launch_gates:
  extends: .launch_check
  resource_group: launch-gates
  script:
    # Gates first, so the report and gate issues exist even if a unit test fails.
    - node scripts/autonomy/launch-gates.mjs
    - node --test scripts/autonomy/launch-gates.test.mjs scripts/autonomy/protocol-gates.test.mjs scripts/autonomy/estate-gate.test.mjs
  artifacts:
    when: always
    paths:
      - launch-gates-report.json
    expire_in: 14 days

launch_gate:
  extends: .launch_check
  script:
    - node scripts/launch/honest-launch-gate.mjs

production_health:
  extends: .launch_check
  script:
    - AUTHICHAIN_ORIGIN=https://authichain.com node scripts/cloudflare-production-health.mjs --run

dogfood_record:
  extends: .launch_check
  script:
    - node scripts/generate-dogfood.mjs
  artifacts:
    paths:
      - docs/execution/AUTHICHAIN_DOGFOOD_RECORD.json

# -----------------------------------------------------------------------------
# Cloudflare Workers deploy (GitLab-side launch).
# INERT until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist as masked,
# protected CI/CD variables. Ports only the code-deploy steps of the GitHub
# workflows deploy-cloudflare.yml and deploy-authichain-com.yml. The secret-
# binding steps (Stripe, x402 pay-to) are intentionally NOT ported: they stay
# owner-controlled. Runbook: docs/operations/GITLAB_LAUNCH.md
# -----------------------------------------------------------------------------
secret_scan:
  stage: validate
  image: node:22-alpine
  needs: []
  interruptible: false
  before_script: []
  cache: []
  variables:
    GIT_DEPTH: "1"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(push|web)$/ && $CLOUDFLARE_API_TOKEN && $CLOUDFLARE_ACCOUNT_ID'
  script:
    - apk add --no-cache curl tar
    - curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o gitleaks.tgz
    - tar --no-same-owner -xzf gitleaks.tgz gitleaks
    - ./gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose

.deploy_worker:
  stage: deploy
  image: node:22-alpine
  needs: ["secret_scan"]
  interruptible: false
  resource_group: cloudflare-deploy
  timeout: 20m

deploy_manufacturer_status:
  extends: .deploy_worker
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(push|web)$/ && $CLOUDFLARE_API_TOKEN && $CLOUDFLARE_ACCOUNT_ID'
  script:
    - cd workers/manufacturer-status
    - npx wrangler deploy --minify

deploy_authichain_com:
  extends: .deploy_worker
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web" && $CLOUDFLARE_API_TOKEN && $CLOUDFLARE_ACCOUNT_ID'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push" && $CLOUDFLARE_API_TOKEN && $CLOUDFLARE_ACCOUNT_ID'
      changes:
        - workers/authichain-com/**/*
        - src/lib/plans.ts
        - src/lib/checkout-gate.ts
        - content/microsites/**/*
        - scripts/sync-microsite-packs.mjs
  script:
    - node scripts/sync-microsite-packs.mjs
    - cd workers/authichain-com
    - npx wrangler deploy --minify --keep-vars --config wrangler.toml
