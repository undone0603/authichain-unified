image: node:20-alpine
stages:
  - setup
  - validate
  - test
  - build
  - verify
variables:
  PNPM_VERSION: 9.0.0
cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store
before_script:
  - corepack enable
  - corepack prepare pnpm@${PNPM_VERSION} --activate
  - pnpm config set store-dir .pnpm-store
install_dependencies:
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $RUN_LAUNCH_CHECKS != "true"'
  stage: setup
  script:
    - pnpm install --frozen-lockfile
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour
typecheck_and_lint:
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $RUN_LAUNCH_CHECKS != "true"'
  stage: validate
  needs: ["install_dependencies"]
  script:
    - pnpm run lint
    - pnpm run typecheck
tests_shard_1:
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $RUN_LAUNCH_CHECKS != "true"'
  stage: test
  needs: ["install_dependencies"]
  script:
    - pnpm run test --shard=1/2
tests_shard_2:
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $RUN_LAUNCH_CHECKS != "true"'
  stage: test
  needs: ["install_dependencies"]
  script:
    - pnpm run test --shard=2/2
production_build:
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $RUN_LAUNCH_CHECKS != "true"'
  stage: build
  needs: ["typecheck_and_lint", "tests_shard_1", "tests_shard_2"]
  script:
    - pnpm run build
  artifacts:
    paths:
      - .next/
      - dist/
    expire_in: 1 day
main_quality_gate:
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $RUN_LAUNCH_CHECKS != "true"'
  stage: verify
  needs: ["production_build"]
  script:
    - echo "Running quality gate checks..."
    - pnpm run quality-gate

# ---------------------------------------------------------------------------
# Scheduled launch checks. Read-only, no secrets, Node built-ins only.
# Ported from the GitHub honest-launch-gate and cloudflare-production-health
# workflows. Pipeline schedules select a job with the SCHEDULE_JOB variable.
# The heavy build/test jobs above are skipped on schedule runs to protect the
# free-tier compute-minute budget.
# ---------------------------------------------------------------------------
.launch_check:
  stage: verify
  image: node:22-alpine
  needs: []
  interruptible: false
  before_script: []
  cache: []
  variables:
    GIT_DEPTH: "1"

launch_gate:
  extends: .launch_check
  script:
    - node scripts/launch/honest-launch-gate.mjs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_JOB == "launch_gate"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_LAUNCH_CHECKS == "true"'

production_health:
  extends: .launch_check
  script:
    - AUTHICHAIN_ORIGIN=https://authichain.com node scripts/cloudflare-production-health.mjs --run
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_JOB == "production_health"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_LAUNCH_CHECKS == "true"'
