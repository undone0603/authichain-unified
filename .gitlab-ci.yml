# GitLab CI for authichain-unified (runs while GitHub Actions is billing-locked).
# Budget rule: GitLab Free = 400 shared-runner minutes/month, so the monorepo-wide
# suites (lint, workspace check, tests, build) are opt-in (manual, non-blocking).
# Automatic: scheduled launch checks (seconds each). See docs/operations/GITLAB_LAUNCH.md.
image: node:22-alpine

stages:
  - validate
  - test
  - build
  - verify
  - deploy

variables:
  PNPM_VERSION: "10.28.2"

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

before_script:
  - corepack enable
  - corepack prepare pnpm@${PNPM_VERSION} --activate
  - pnpm config set store-dir .pnpm-store
  - pnpm install --frozen-lockfile --prefer-offline

# Heavy monorepo suites: one click in the pipeline view, never block the pipeline.
.heavy:
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: manual
      allow_failure: true

lint:
  extends: .heavy
  stage: validate
  script:
    - pnpm run lint

workspace_check:
  extends: .heavy
  stage: validate
  script:
    - pnpm run check

tests:
  extends: .heavy
  stage: test
  needs: []
  script:
    - pnpm run test

production_build:
  extends: .heavy
  stage: build
  needs: []
  script:
    - pnpm run build

.launch_check:
  stage: verify
  image: node:22-alpine
  needs: []
  interruptible: false
  before_script: []
  cache: []
  variables:
    GIT_DEPTH: "1"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
      when: manual
      allow_failure: true

launch_gate:
  extends: .launch_check
  script:
    - node scripts/launch/honest-launch-gate.mjs

production_health:
  extends: .launch_check
  script:
    - AUTHICHAIN_ORIGIN=https://authichain.com node scripts/cloudflare-production-health.mjs --run

# -----------------------------------------------------------------------------
# Cloudflare Workers deploy (GitLab-side launch).
# INERT until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist as masked,
# protected CI/CD variables. Ports only the code-deploy steps of the GitHub
# workflows deploy-cloudflare.yml and deploy-authichain-com.yml. The secret-
# binding steps (Stripe, x402 pay-to) are intentionally NOT ported: they stay
# owner-controlled. Runbook: docs/operations/GITLAB_LAUNCH.md
# -----------------------------------------------------------------------------
secret_scan:
  stage: validate
  image: node:22-alpine
  needs: []
  interruptible: false
  before_script: []
  cache: []
  variables:
    GIT_DEPTH: "1"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(push|web)$/ && $CLOUDFLARE_API_TOKEN && $CLOUDFLARE_ACCOUNT_ID'
  script:
    - apk add --no-cache curl tar
    - curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o gitleaks.tgz
    - tar --no-same-owner -xzf gitleaks.tgz gitleaks
    - ./gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose

.deploy_worker:
  stage: deploy
  image: node:22-alpine
  needs: ["secret_scan"]
  interruptible: false
  resource_group: cloudflare-deploy
  timeout: 20m

deploy_manufacturer_status:
  extends: .deploy_worker
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(push|web)$/ && $CLOUDFLARE_API_TOKEN && $CLOUDFLARE_ACCOUNT_ID'
  script:
    - cd workers/manufacturer-status
    - npx wrangler deploy --minify

deploy_authichain_com:
  extends: .deploy_worker
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web" && $CLOUDFLARE_API_TOKEN && $CLOUDFLARE_ACCOUNT_ID'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push" && $CLOUDFLARE_API_TOKEN && $CLOUDFLARE_ACCOUNT_ID'
      changes:
        - workers/authichain-com/**/*
        - src/lib/plans.ts
        - src/lib/checkout-gate.ts
        - content/microsites/**/*
        - scripts/sync-microsite-packs.mjs
  script:
    - node scripts/sync-microsite-packs.mjs
    - cd workers/authichain-com
    - npx wrangler deploy --minify --keep-vars --config wrangler.toml
