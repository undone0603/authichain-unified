name = "authichain-unified"
main = "src/index.ts"
compatibility_date = "2026-04-01"
workers_dev = true

[vars]
JWT_SECRET = "your-secret-here"   # move to Cloudflare dashboard for production

[[kv_namespaces]]
binding = "CACHE"
id = "your-kv-id"   # optional – only if you add caching later

# Environment variables (Supabase + RapidAPI) – set via wrangler secret put
# SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, RAPIDAPI_KEY
