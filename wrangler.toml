name = "authichain-unified"
main = ".open-next/worker.js"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
APP_ENV = "production"

# KV namespaces (available as bindings in CF Workers)
[[kv_namespaces]]
binding = "SESSIONS"
id = "7c8e9466e57843199f6f768615e42a5c"

[[kv_namespaces]]
binding = "MICROSITES_KV"
id = "a992900da1db4b998af1cdf4eccf550a"

# D1 database
[[d1_databases]]
binding = "DB"
database_name = "authichain-db"
database_id = "ebd8081b-ac13-485a-8b0e-a6cd9c0f7be5"
