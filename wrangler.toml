name = 'authichain'
main = "worker/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Static assets built by Vite → dist/public
[assets]
directory = "dist/public"
binding = "ASSETS"

# Environment variables (injected via Cloudflare dashboard)
[vars]
APP_ENV = "production"

# KV namespaces
[[kv_namespaces]]
binding = "SESSIONS"
id = "7c8e9466e57843199f6f768615e42a5c"

# KV for microsite HTML/CSS/JS (referenced in worker/index.ts as MICROSITES_KV)
# Create with: wrangler kv:namespace create MICROSITES_KV
[[kv_namespaces]]
binding = "MICROSITES_KV"
id = "a992900da1db4b998af1cdf4eccf550a"

# D1 database
[[d1_databases]]
binding = "DB"
database_name = "authichain-db"
database_id = "ebd8081b-ac13-485a-8b0e-a6cd9c0f7be5"

# R2 bucket for subdomain microsites (kept as fallback / future use)
[[r2_buckets]]
binding = "MICROSITES_BUCKET"
bucket_name = "authichain-microsites"

# No cron. worker/index.ts exports a Hono app (fetch only) with no scheduled()
# handler, so the hourly "0 * * * *" trigger failed every run with "Handler does
# not export a scheduled() function". The intent was never wired up: #954 added
# this block with the note "Free Cloudflare cron -> laptop job runner via
# Tunnel + Access" in the same PR that added worker/outreach-loop.ts (an
# autonomous Gmail outreach loop that index.ts does not import). Neither target
# is clear enough, or safe enough, to switch on as a config default.
# `crons = []` (not deleting the block) is what makes `wrangler deploy` remove
# the live trigger; deleting the block would leave it in place. It also frees
# one of the Free plan's five account-wide cron slots.
# Live trigger already removed via API 2026-10-02 08:38 ET (AE-20261002-CFD-11).
# Rollback: crons = ["0 * * * *"] (live schedule recorded 2026-09-29).
[triggers]
crons = []
