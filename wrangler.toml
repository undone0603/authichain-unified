name = "authichain-unified"
main = "worker/index.ts"
tsconfig = "tsconfig.worker.json"
compatibility_date = "2026-03-11"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/public"
not_found_handling = "single-page-application"

[triggers]
crons = ["*/5 * * * *"]

# Set these via: wrangler secret put <NAME>
# DATABASE_URL, JWT_SECRET, VITE_APP_ID, OAUTH_SERVER_URL
# BUILT_IN_FORGE_API_URL, BUILT_IN_FORGE_API_KEY
# HUBSPOT_SERVICE_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
# AUTONOMOUS_PIPELINE_ENABLED=true
