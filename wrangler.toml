name = "authichain-unified"
main = ".open-next/worker.js"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "authichain.com", custom_domain = true },
  { pattern = "www.authichain.com", custom_domain = true }
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
APP_ENV = "production"
# DATABASE_URL is required for production (to be set via wrangler secret)

# KV namespaces (available as bindings in CF Workers)
[[kv_namespaces]]
binding = "SESSIONS"
id = "7c8e9466e57843199f6f768615e42a5c"

[[kv_namespaces]]
binding = "MICROSITES_KV"
id = "a992900da1db4b998af1cdf4eccf550a"
