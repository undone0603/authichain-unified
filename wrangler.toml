name = 'authichain'
main = "worker/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Static assets built by Vite → dist/public
[assets]
directory = "dist/public"
binding = "ASSETS"

# Environment variables (injected via Cloudflare dashboard)
[vars]
APP_ENV = "production"

# KV namespaces
[[kv_namespaces]]
binding = "SESSIONS"
id = "7c8e9466e57843199f6f768615e42a5c"

# KV for microsite HTML/CSS/JS (referenced in worker/index.ts as MICROSITES_KV).
# The microsite router no-ops until this namespace exists (guarded by
# `c.env.MICROSITES_KV`). Create it and replace the id before deploying:
#   npx wrangler kv namespace create MICROSITES_KV
[[kv_namespaces]]
binding = "MICROSITES_KV"
id = "REPLACE_WITH_YOUR_MICROSITES_KV_ID"

# D1 database
[[d1_databases]]
binding = "DB"
database_name = "authichain-db"
database_id = "ebd8081b-ac13-485a-8b0e-a6cd9c0f7be5"

# R2 bucket for subdomain microsites (kept as fallback / future use)
[[r2_buckets]]
binding = "MICROSITES_BUCKET"
bucket_name = "authichain-microsites"

# Hyperdrive binding for Postgres connection pooling
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "97d767ff69584161a0672cd942e9364a"

[observability]
enabled = true
