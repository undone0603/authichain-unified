name = "authichain-unified"
main = "worker/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Static assets built by Vite → dist/public
[assets]
directory = "dist/public"
binding = "ASSETS"

# Environment variables (injected via Cloudflare dashboard)
[vars]
APP_ENV = "production"

# KV namespaces
[[kv_namespaces]]
binding = "SESSIONS"
id = "your-kv-id-here"

# D1 database
[[d1_databases]]
binding = "DB"
database_name = "authichain-db"
database_id = "your-d1-id-here"

# R2 bucket for QRON images
[[r2_buckets]]
binding = "QRON_IMAGES"
bucket_name = "qron-images"

# Cron triggers (monetization engine)
[[triggers]]
crons = ["0 * * * *"] # hourly
