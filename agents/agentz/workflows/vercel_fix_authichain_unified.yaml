id: vercel_fix_authichain_unified
name: Fix Vercel Framework Preset for authichain-unified-v2
criticality: HIGH
type: auto
description: Change authichain-unified-v2 framework preset from Vite to Other and trigger redeploy.
est_minutes: 3

steps:
  - action: open
    target: vercel_project
    project_id: prj_mIb6SSMtMy8KsXg9gNta0T3tDJg1

  - action: navigate
    target: framework_preset

  - action: set_value
    field: framework_preset
    value: Other

  - action: click
    target: save_button

  - action: trigger_deploy
    branch: main
