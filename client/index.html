<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>AuthiChain – Blockchain Product Authentication Platform</title>
    <meta name="description" content="Protect your brand with AI-powered blockchain authentication. NFT certificates, supply chain tracking, and anti-counterfeiting verification." />
    <meta name="keywords" content="blockchain authentication, anti-counterfeiting, product verification, NFT certificates, supply chain tracking, brand protection" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Client-side fallback brand detection. Overridden by server injection
      // (see server/_core/brand-middleware.ts brandInjectionScript) when
      // the HTML comes from Express; this runs only when a pure static
      // host serves index.html without injection.
      if (!window.__BRAND__) {
        var h = (location.hostname || '').toLowerCase();
        var b = 'authichain';
        if (h.includes('qron')) b = 'qron';
        else if (h.includes('strainchain')) b = 'strainchain';
        else if (h.includes('govchain')) b = 'govchain';
        window.__BRAND__ = b;
        document.documentElement.setAttribute('data-brand', b);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
